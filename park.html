<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고브럽 놀이공원 — goblub</title>
  <meta name="description" content="놀이기구를 눌러서 운세·심리테스트·미니게임으로 — 고브럽 놀이공원" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden;
      font-family: 'Jua', 'Malgun Gothic', sans-serif; background: #7fc45a; }

    /* 뒤 채움 — 지도를 꽉 채워 흐리게 깔아 여백이 비어 보이지 않게 */
    .pk-back {
      position: fixed; inset: -30px; z-index: 0;
      background: url("design/img/park-map.webp") center center / cover no-repeat;
      filter: blur(26px) saturate(.85) brightness(.82);
    }
    /* 지도 — 어느 화면비에서도 잘리지 않게 전체를 담는다 */
    .pk-map {
      position: fixed; inset: 0; z-index: 1;
      background: url("design/img/park-map.webp") center center / contain no-repeat;
    }
    /* 위아래 살짝 어둡게 — 로고와 안내가 묻히지 않게 */
    .pk-vig {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: linear-gradient(180deg, rgba(20,50,25,.22) 0%, transparent 22%,
                  transparent 68%, rgba(20,50,25,.30) 100%);
    }

    /* 상단 로고 알약 (홈과 동일 규격) */
    .pk-head {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 30;
      padding: 10px 26px; border-radius: 999px; background: rgba(10, 16, 22, .38);
      box-shadow: 0 10px 26px rgba(0, 20, 30, .35), inset 0 1px 0 rgba(255, 255, 255, .14);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      font-size: 1.7rem; letter-spacing: 2px; display: flex; gap: 1px;
      text-decoration: none; line-height: 1;
    }
    .pk-head span { text-shadow: 0 1px 2px rgba(90, 100, 170, .25); }

    /* 기구 위 클릭 영역 */
    .pk-hot {
      position: fixed; z-index: 12; border-radius: 50%; cursor: pointer;
      background: transparent; border: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    /* 살짝 빛나는 테두리 — 여기 누르라는 표시 */
    .pk-glow {
      position: fixed; z-index: 10; border-radius: 50%; pointer-events: none;
      animation: pkGlow 2.6s ease-in-out infinite;
    }
    @keyframes pkGlow {
      0%, 100% { box-shadow: 0 0 16px 4px rgba(255, 240, 170, .18); }
      50% { box-shadow: 0 0 34px 12px rgba(255, 232, 140, .40); }
    }
    .pk-hot:hover ~ .pk-glow, .pk-glow.on { animation-duration: 1.1s; }

    /* 팻말 — 마우스를 올리면 뜬다 (위가 좁으면 아래로 뒤집힌다) */
    .pk-sign {
      position: fixed; z-index: 20; pointer-events: none;
      display: flex; flex-direction: column; align-items: center;
      transform: translate(-50%, -100%) scale(.86); transform-origin: 50% 100%;
      opacity: 0; transition: opacity .18s ease, transform .18s cubic-bezier(.3,1.4,.6,1);
      text-align: center; white-space: nowrap;
    }
    .pk-sign.on { opacity: 1; transform: translate(-50%, -100%) scale(1); }
    .pk-sign.below { flex-direction: column-reverse; transform-origin: 50% 0;
      transform: translate(-50%, 0) scale(.86); }
    .pk-sign.below.on { transform: translate(-50%, 0) scale(1); }
    .pk-sign .bd {
      display: inline-block; padding: 9px 18px 10px; border-radius: 12px;
      background: linear-gradient(180deg, #f7e3bd, #e6cb9a);
      border: 3px solid #8a5a34; color: #4a2d16;
      box-shadow: 0 8px 18px rgba(40, 25, 10, .35), inset 0 2px 0 rgba(255,255,255,.7);
    }
    .pk-sign .tt { font-size: 1.22rem; line-height: 1.1; display: block; }
    .pk-sign .ds { font-size: .8rem; color: #7a5230; display: block; margin-top: 3px; }
    /* 팻말 기둥 */
    .pk-sign .leg {
      display: block; width: 7px; height: 16px; margin: -1px auto 0;
      background: linear-gradient(180deg, #8a5a34, #6f4526); border-radius: 0 0 3px 3px;
    }

    /* 입구의 고브럽 안내 */
    .pk-guide { position: fixed; z-index: 22; pointer-events: none; }
    .pk-guide img { display: block; width: 100%; height: auto; -webkit-user-drag: none;
      filter: drop-shadow(0 8px 10px rgba(20, 50, 25, .35)); }
    .pk-bubble {
      position: fixed; z-index: 23; pointer-events: none;
      transform: translate(-50%, -100%);
      background: #fff8e6; color: #4a3a22; border: 3px solid rgba(120, 85, 45, .45);
      border-radius: 16px; padding: 9px 16px; font-size: .95rem; white-space: nowrap;
      box-shadow: 0 8px 18px rgba(40, 25, 10, .28);
      opacity: 0; transition: opacity .4s ease;
    }
    .pk-bubble.on { opacity: 1; }
    .pk-bubble::after {
      content: ""; position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%);
      border: 8px solid transparent; border-top-color: #fff8e6;
    }

    /* 기구에 탄 꼬마 고브럽들 */
    .pk-rider {
      position: fixed; left: 0; top: 0; z-index: 8; pointer-events: none; will-change: transform;
      filter: drop-shadow(0 2px 3px rgba(20, 50, 25, .45));
    }
    .pk-rider img { display: block; width: 100%; height: auto; -webkit-user-drag: none; }

    /* 모바일: 지도가 좁아 누르기 어려우니 아래에 목록을 깔아준다 */
    .pk-list { display: none; }
    @media (max-width: 700px) {
      .pk-map { background-position: center center; }
      .pk-list {
        display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
        padding: 14px 12px calc(14px + env(safe-area-inset-bottom));
        background: linear-gradient(180deg, rgba(18, 44, 22, 0), rgba(18, 44, 22, .82) 34%);
      }
      .pk-list .row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
      .pk-list a {
        flex: 0 0 auto; display: flex; align-items: center; gap: 7px;
        padding: 10px 14px; border-radius: 14px; text-decoration: none;
        background: linear-gradient(180deg, #f7e3bd, #e6cb9a);
        border: 3px solid #8a5a34; color: #4a2d16; font-size: .95rem;
      }
      .pk-sign { display: none; }
    }
  </style>
</head>
<body>
  <div class="pk-back"></div>
  <div class="pk-map"></div>
  <div class="pk-vig"></div>

  <a class="pk-head" href="index.html" title="달나라 홈으로">
    <span style="color:#ff6b6b">g</span><span style="color:#ffd166">o</span><span style="color:#6bcB77">b</span><span style="color:#4d96ff">l</span><span style="color:#c77dff">u</span><span style="color:#ff9770">b</span>
  </a>

  <!-- 모바일용 바로가기 -->
  <nav class="pk-list">
    <div class="row" id="pk-rows"></div>
  </nav>

  <script src="js/common.js?v=6" data-root="."></script>
  <script>
  (function () {
    // 지도 원본(1376×768) 기준 좌표 — 실측값
    var MAP = { w: 1376, h: 768 };
    var RIDES = [
      { key: "fortune", x: 340,  y: 150, r: 118, icon: "🎡", name: "운세",           desc: "사주 · 궁합 · 타로 · 전생", href: "play/fortune-hub.html" },
      { key: "tests",   x: 1055, y: 175, r: 130, icon: "🎢", name: "대환장 테스트",   desc: "내 유형 다 털리는 심리테스트", href: "play/tests.html" },
      { key: "mini",    x: 680,  y: 330, r: 100, icon: "🎠", name: "미니 놀이터",     desc: "룰렛 · 질문카드 · 작명 · 마음배달", href: "play/mini.html" },
      { key: "mini2",   x: 1075, y: 490, r: 108, icon: "🚗", name: "미니 놀이터 2",   desc: "팡팡 · 반응속도 · 로또 · 밸런스", href: "play/mini2.html" },
      { key: "apps",    x: 292,  y: 488, r: 82, icon: "🎁", name: "앱 다운로드",     desc: "직접 만든 앱들을 모아둔 곳", soon: "📱 앱은 아직 준비 중이에요!" }
    ];

    // 배경과 완전히 같은 박스를 실측해 좌표 기준으로 삼는다(스크롤바 편차 제거)
    var vp = document.createElement("div");
    vp.style.cssText = "position:fixed;inset:0;pointer-events:none;visibility:hidden";
    document.body.appendChild(vp);

    var rows = document.getElementById("pk-rows");
    var items = [];

    RIDES.forEach(function (r) {
      var glow = document.createElement("div"); glow.className = "pk-glow";
      var hot = document.createElement(r.href ? "a" : "button");
      hot.className = "pk-hot";
      hot.setAttribute("aria-label", r.name);
      if (r.href) hot.href = r.href;
      else hot.setAttribute("data-soon", r.soon);

      var sign = document.createElement("div"); sign.className = "pk-sign";
      sign.innerHTML = '<span class="bd"><span class="tt">' + r.icon + " " + r.name +
        '</span><span class="ds">' + r.desc + '</span></span><span class="leg"></span>';

      document.body.appendChild(glow);
      document.body.appendChild(hot);
      document.body.appendChild(sign);

      function on() { sign.classList.add("on"); glow.classList.add("on"); }
      function off() { sign.classList.remove("on"); glow.classList.remove("on"); }
      hot.addEventListener("mouseenter", on);
      hot.addEventListener("mouseleave", off);
      hot.addEventListener("focus", on);
      hot.addEventListener("blur", off);

      items.push({ r: r, hot: hot, glow: glow, sign: sign });

      // 모바일 바로가기
      var a = document.createElement("a");
      a.textContent = r.icon + " " + r.name;
      if (r.href) a.href = r.href;
      else { a.href = "#"; a.setAttribute("data-soon", r.soon); }
      rows.appendChild(a);
    });

    function place() {
      var b = vp.getBoundingClientRect();
      var W = b.width, H = b.height;
      var s = Math.min(W / MAP.w, H / MAP.h);          // background-size: contain
      var ox = b.left + (W - MAP.w * s) / 2;
      var oy = b.top + (H - MAP.h * s) / 2;            // background-position: center center
      function px(x, y) { return [ox + x * s, oy + y * s]; }

      items.forEach(function (it) {
        var p = px(it.r.x, it.r.y), d = it.r.r * 2 * s;
        it.hot.style.width = d + "px"; it.hot.style.height = d + "px";
        it.hot.style.left = (p[0] - d / 2) + "px"; it.hot.style.top = (p[1] - d / 2) + "px";
        it.glow.style.width = d + "px"; it.glow.style.height = d + "px";
        it.glow.style.left = (p[0] - d / 2) + "px"; it.glow.style.top = (p[1] - d / 2) + "px";
        // 팻말: 위쪽 공간이 모자라면 기구 아래로 뒤집어 단다
        var sh = it.sign.offsetHeight || 74;
        var above = p[1] - d / 2 - 8;
        var below = above - sh < 56;                    // 상단 로고와 겹치지 않게 여유
        it.sign.classList.toggle("below", below);
        it.sign.style.top = (below ? (p[1] + d / 2 + 8) : above) + "px";
        // 좌우로도 화면 밖으로 나가지 않게
        var sw = it.sign.offsetWidth || 150;
        it.sign.style.left = Math.max(b.left + sw / 2 + 8,
                             Math.min(b.left + W - sw / 2 - 8, p[0])) + "px";
      });

      window.PK_VIEW = { ox: ox, oy: oy, s: s };
      if (window.PK_RIDERS) window.PK_RIDERS.layout();
    }
    place();
    window.addEventListener("resize", place);
    setInterval(place, 1000);   // 늦은 레이아웃 변화 자가 보정
    window.PK_PLACE = place;
  })();
  </script>

  <script>
  /* ===== 기구에 탄 꼬마 고브럽들 ===== */
  (function () {
    var IMG = "design/img/home/gb-front.webp";
    // 회색 고브럽을 색색으로 — sepia로 색을 입힌 뒤 색상만 돌린다
    var TINTS = [12, 45, 95, 150, 195, 250, 300, 335];
    function tint(deg) { return "sepia(1) saturate(3.2) hue-rotate(" + deg + "deg) brightness(1.02)"; }

    var riders = [];
    function make(kind, i, size) {
      var d = document.createElement("div");
      d.className = "pk-rider";
      d.innerHTML = '<img src="' + IMG + '" alt="" />';
      d.firstChild.style.filter = tint(TINTS[(i * 3 + kind.length) % TINTS.length]);
      document.body.appendChild(d);
      return { el: d, size: size, i: i };
    }

    // 지도 원본 좌표 기준 배치
    var WHEEL   = { cx: 308,  cy: 145, rx: 100, ry: 120, n: 8,  period: 30, size: 34 };
    var CARO    = { cx: 680,  cy: 368, rx: 80,  ry: 19,  n: 5,  period: 11, size: 32 };
    var BUMPER  = { cx: 1090, cy: 545, rx: 72,  ry: 26,  n: 4,               size: 32 };
    // 롤러코스터 선로를 따라 찍은 점들
    var TRACK = [[900,275],[960,265],[1020,255],[1075,248],[1130,243],[1180,232],
                 [1215,203],[1222,170],[1205,145],[1170,132],[1130,136],[1090,150]];
    var COASTER = { n: 3, period: 8, size: 30, gap: 0.05 };

    var W = [], C = [], B = [], T = [];
    for (var i = 0; i < WHEEL.n; i++)   W.push(make("wheel", i, WHEEL.size));
    for (i = 0; i < CARO.n; i++)        C.push(make("caro", i, CARO.size));
    for (i = 0; i < BUMPER.n; i++)      B.push(make("bump", i, BUMPER.size));
    for (i = 0; i < COASTER.n; i++)     T.push(make("coast", i, COASTER.size));

    function trackAt(u) {                      // 0~1 → 선로 위 좌표
      u = Math.max(0, Math.min(0.9999, u));
      var f = u * (TRACK.length - 1), k = Math.floor(f), t = f - k;
      var a = TRACK[k], b = TRACK[Math.min(TRACK.length - 1, k + 1)];
      return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
    }

    function set(r, mx, my, extra) {
      var v = window.PK_VIEW; if (!v) return;
      var sz = r.size * v.s;
      r.el.style.width = sz + "px";
      r.el.style.transform = "translate(" + (v.ox + mx * v.s - sz / 2) + "px," +
        (v.oy + my * v.s - sz * 0.62) + "px)" + (extra || "");
    }

    var t0 = Date.now();
    function tick() {
      var v = window.PK_VIEW;
      if (v) {
        var t = (Date.now() - t0) / 1000;

        // 관람차 — 천천히 한 바퀴
        for (var i = 0; i < W.length; i++) {
          var a = (t / WHEEL.period + i / W.length) * Math.PI * 2;
          set(W[i], WHEEL.cx + Math.cos(a) * WHEEL.rx, WHEEL.cy + Math.sin(a) * WHEEL.ry);
        }
        // 회전목마 — 돌면서 위아래로
        for (i = 0; i < C.length; i++) {
          var b = (t / CARO.period + i / C.length) * Math.PI * 2;
          var bob = Math.sin(b * 3) * 5;
          set(C[i], CARO.cx + Math.cos(b) * CARO.rx, CARO.cy + Math.sin(b) * CARO.ry + bob);
        }
        // 범퍼카 — 제멋대로 부딪히며 돌아다님
        for (i = 0; i < B.length; i++) {
          var p = t * (0.55 + i * 0.13) + i * 1.7;
          var x = BUMPER.cx + Math.sin(p) * BUMPER.rx * (0.55 + 0.4 * Math.cos(p * 0.7 + i));
          var y = BUMPER.cy + Math.cos(p * 1.3 + i) * BUMPER.ry;
          set(B[i], x, y, " rotate(" + (Math.sin(p * 2) * 9) + "deg)");
        }
        // 롤러코스터 — 선로를 타고 달린다
        for (i = 0; i < T.length; i++) {
          var u = (t / COASTER.period - i * COASTER.gap) % 1;
          if (u < 0) u += 1;
          var q = trackAt(u);
          var fade = Math.min(1, u / 0.06, (1 - u) / 0.06);
          T[i].el.style.opacity = Math.max(0, fade);
          set(T[i], q[0], q[1]);
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    window.PK_RIDERS = { layout: function () {} };
  })();
  </script>
</body>
</html>
