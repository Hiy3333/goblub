<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>goblub — 와서 놀다 가세요</title>
  <meta name="description" content="사주, 심리테스트, 미니게임, 마음 배달까지 — 와서 놀다 가는 곳 고브럽" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=cl1" />
  <style>
    /* ===== 홈: 달나라 고브럽 ===== */
    html { background: #14224a; }
    html, body { height: 100%; }
    body.home-moon {
      margin: 0; overflow: hidden;
      background: url("design/img/moon-5b.webp") center bottom / cover no-repeat #14224a !important;
      font-family: "Jua", "Malgun Gothic", sans-serif;
    }
    /* 하늘만 진한 남색으로(아래 지면쪽으로 갈수록 사라짐) */
    .gm-tint {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(180deg, rgba(12, 22, 66, .62) 0%, rgba(12, 22, 66, .42) 42%, rgba(12, 22, 66, 0) 72%);
      mix-blend-mode: multiply;
    }
    /* 전경 오브젝트(로켓): 고브럽이 뒤로 지나가면 가려짐. 누르면 발사! */
    .gm-obj {
      position: absolute; left: 0; top: 0; z-index: 12; pointer-events: auto; cursor: pointer;
      filter: drop-shadow(-6px 10px 10px rgba(0, 22, 32, .28));
      transition: filter .18s;
    }
    .gm-obj:hover { /* 클릭 가능 표시: 흰 윤곽 발광 */
      filter: drop-shadow(-6px 10px 10px rgba(0, 22, 32, .28)) drop-shadow(0 0 7px rgba(255, 255, 255, .85));
    }
    /* 토성 클릭 핫스팟(호버 시 테두리 링) */
    .gm-sathot { position: absolute; left: 0; top: 0; z-index: 4; border-radius: 50%; cursor: pointer; }
    /* 토성 테두리(고리 포함 타원)가 스스로 빛난다 — 클릭 가능 표시 */
    .gm-satring {
      position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; border-radius: 50%;
      animation: gm-satring 2.6s ease-in-out infinite;
    }
    @keyframes gm-satring {
      0%, 100% { box-shadow: 0 0 9px 1px rgba(255, 209, 166, .5), 0 0 20px 5px rgba(255, 209, 166, .2); }
      50% { box-shadow: 0 0 20px 5px rgba(255, 209, 166, .9), 0 0 46px 16px rgba(255, 209, 166, .38); }
    }
    .gm-satring.hot { animation-duration: 1.1s; }
    .gm-satring.burst { animation: gm-satburst 1.2s ease-out; }
    @keyframes gm-satburst {
      0% { box-shadow: 0 0 12px 3px rgba(255, 209, 166, .7); }
      30% { box-shadow: 0 0 40px 14px rgba(255, 231, 188, 1), 0 0 80px 30px rgba(255, 209, 166, .55); }
      100% { box-shadow: 0 0 12px 3px rgba(255, 209, 166, .5); }
    }
    /* 로켓 분사 불꽃 */
    .gm-flame { position: absolute; left: 0; top: 0; z-index: 11; pointer-events: none; display: none; }
    .gm-flame b {
      display: block; width: 100%; height: 100%; transform-origin: 50% 0; filter: blur(1px);
      background: radial-gradient(ellipse 50% 62% at 50% 22%, #fff6c9 0%, #ffb84d 42%, rgba(255, 110, 40, .85) 68%, rgba(255, 90, 30, 0) 100%);
      border-radius: 50% 50% 62% 62%;
      animation: gm-flick .12s ease-in-out infinite alternate;
    }
    .gm-flame.sputter b { animation: gm-sputter .32s steps(2) infinite; }
    @keyframes gm-flick { from { opacity: .95; transform: scaleY(1); } to { opacity: .72; transform: scaleY(.8); } }
    @keyframes gm-sputter { 0% { opacity: .85; transform: scaleY(.85); } 50% { opacity: .12; transform: scaleY(.35); } 100% { opacity: .6; transform: scaleY(.6); } }
    /* 우주선 내부(유리 뒤 배경) — 유리 안쪽 전체가 균일한 선실색 */
    .gm-cabin {
      position: absolute; left: 0; top: 0; z-index: 11; pointer-events: none;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 34%, #9fb4b8, #63787e 76%);
    }
    /* 유리 반사 — 로켓 위(z13)에 얹어 창 전체에 균일하게 */
    .gm-glass {
      position: absolute; left: 0; top: 0; z-index: 13; pointer-events: none;
      border-radius: 50%;
      background: linear-gradient(133deg, rgba(240, 252, 255, .42) 0%, rgba(225, 245, 250, .16) 26%, rgba(200, 230, 240, 0) 46%, rgba(12, 28, 36, .22) 100%);
      box-shadow: inset 0 0 14px rgba(10, 24, 30, .5), inset 0 3px 5px rgba(8, 20, 26, .35);
    }
    /* 창문 빼꼼(고브럽 눈) — 로켓 유리(반투명) 뒤에서 비쳐 보인다 */
    .gm-peek {
      position: absolute; left: 0; top: 0; z-index: 11; pointer-events: none;
      border-radius: 50%; overflow: hidden;
      opacity: 0; transition: opacity .28s;
    }
    .gm-peek img { position: absolute; display: block; max-width: none; filter: none;
      animation: gm-look 3.4s cubic-bezier(.34, 1.45, .6, 1) infinite; }
    /* 창문 안에서 귀엽게 두리번: 갸웃 기울이고 콩콩 튀면서 좌우를 본다 */
    @keyframes gm-look {
      0%, 10% { margin-left: 0; transform: translateY(0) rotate(0deg); }
      16% { margin-left: -10px; transform: translateY(-3px) rotate(-7deg); }
      20%, 34% { margin-left: -9px; transform: translateY(0) rotate(-6deg); }
      40% { margin-left: 9px; transform: translateY(-3px) rotate(7deg); }
      44%, 58% { margin-left: 9px; transform: translateY(0) rotate(6deg); }
      64% { margin-left: 0; transform: translateY(-4px) rotate(0deg); }
      68%, 100% { margin-left: 0; transform: translateY(0) rotate(0deg); }
    }
    /* 이따금 눈 깜빡 — 펠트색 눈꺼풀이 스르륵 */
    .gm-peek::after {
      content: ""; position: absolute; left: -12%; top: -110%; width: 124%; height: 106%;
      border-radius: 0 0 50% 50%; background: linear-gradient(180deg, #8f9196, #a9abb0);
      animation: gm-blink 3.4s infinite;
    }
    @keyframes gm-blink {
      0%, 70%, 78%, 100% { transform: translateY(0); }
      73%, 75% { transform: translateY(100%); }
    }
    .gm-goblub { transition: opacity .18s; }
    /* 토성 광원 기준 고브럽 그림자 */
    .gm-shad {
      position: absolute; left: 0; top: 0; z-index: 9; pointer-events: none;
      border-radius: 50%; filter: blur(3px);
      background: radial-gradient(ellipse at center, rgba(4, 10, 20, .68) 0%, rgba(4, 10, 20, .4) 45%, rgba(4, 10, 20, 0) 72%);
      will-change: transform, width, opacity;
    }
    body.home-moon a { color: #ffe9b8; text-decoration: none; }
    body.home-moon a:hover { color: #ffffff; }

    /* 헤더: 떠 있는 다크 알약 */
    body.home-moon .site-header {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 30; display: flex; align-items: center; gap: 22px; width: auto; max-width: none;
      margin: 0; padding: 9px 12px 9px 22px;
      background: rgba(10, 16, 22, .38); border-radius: 999px; /* 중립 반투명 — 어느 하늘에서든 배경색이 배어남 */
      box-shadow: 0 10px 26px rgba(0, 20, 30, .35), inset 0 1px 0 rgba(255,255,255,.14);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    body.home-moon .logo { font-size: 1.7rem; letter-spacing: 2px; display: flex; }
    body.home-moon .site-nav { display: flex; gap: 8px; }
    body.home-moon .site-nav a {
      color: #d9f1ef; font-size: .92rem; margin: 0; padding: 6px 14px;
      border-radius: 999px; background: rgba(255,255,255,.1);
      transition: background .12s, color .12s;
    }
    body.home-moon .site-nav a:hover { background: rgba(255,255,255,.24); color: #fff; }
    body.home-moon .site-nav a { white-space: nowrap; }
    /* 데스크톱: 로고만 정중앙(메뉴는 토성 클릭으로), 모바일은 기존 내비 유지 */
    @media (min-width: 701px) {
      body.home-moon .site-header { padding: 10px 26px; }
      body.home-moon .site-nav { display: none; }
    }
    /* 토성 메뉴: 클릭하면 오른쪽에서 카드처럼 챠라락 */
    .gm-satmenu {
      position: absolute; left: 0; top: 0; z-index: 25; display: none;
      flex-direction: column; gap: 10px; align-items: flex-end;
    }
    .gm-satmenu.on { display: flex; }
    .gm-satmenu a {
      display: flex; align-items: center; gap: 10px;
      background: linear-gradient(180deg, #f9f0d4, #efe3bd);
      padding: 11px 20px; border-radius: 14px; border: 3px solid rgba(29, 90, 107, .25);
      box-shadow: 0 10px 22px rgba(0, 22, 32, .45); font-size: 1.08rem; white-space: nowrap;
      opacity: 0; transform: translateX(60px) rotate(6deg);
    }
    .gm-satmenu a, body.home-moon .gm-satmenu a { color: #235a6b; }
    body.home-moon .gm-satmenu a:hover { color: #235a6b; border-color: rgba(29, 90, 107, .55); }
    .gm-satmenu.on a { animation: gm-mdeal .4s cubic-bezier(.3, 1.35, .6, 1) forwards; }
    .gm-satmenu.on a:nth-child(2) { animation-delay: .1s; }
    .gm-satmenu.on a:nth-child(3) { animation-delay: .2s; }
    @keyframes gm-mdeal { to { opacity: 1; transform: translateX(0) rotate(0); } }
    @media (max-width: 700px) {
      body.home-moon .site-header { gap: 10px; padding: 7px 10px 7px 16px; }
      body.home-moon .logo { font-size: 1.25rem; }
      body.home-moon .site-nav { gap: 5px; }
      body.home-moon .site-nav a { font-size: .8rem; padding: 5px 10px; }
    }

    /* 워드마크 */
    .gm-word {
      position: absolute; top: 17vh; left: 50%; transform: translateX(-50%);
      z-index: 5; text-align: center; pointer-events: none; transition: opacity .5s;
    }
    .gm-word h1 {
      margin: 0; font-size: clamp(3.4rem, 8vw, 5.6rem); font-weight: 400; color: #f7ecc8;
      letter-spacing: .04em; line-height: 1.05;
      text-shadow: 0 4px 0 rgba(16, 62, 76, .8), 0 14px 30px rgba(0, 25, 35, .5);
    }
    .gm-word p {
      margin: 14px 0 0; font-size: clamp(1rem, 2.4vw, 1.35rem); color: #cfe9e6;
      text-shadow: 0 2px 8px rgba(0, 25, 35, .6);
    }

    .gm-star { position: absolute; z-index: 3; color: #fff3c4; cursor: pointer;
      text-shadow: 0 0 10px rgba(255, 240, 190, .9), 0 0 4px #ffffff; /* 누를 수 있는 별만 상시 발광 */
      animation: gm-tw 2.8s ease-in-out infinite; transition: text-shadow .15s, opacity .2s; }
    .gm-star:hover { text-shadow: 0 0 20px #fff7d8, 0 0 8px #ffffff, 0 0 3px #ffffff; }
    @keyframes gm-tw { 0%,100% { opacity: .4; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }
    /* 별똥별 */
    .gm-meteor {
      position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none;
      width: 130px; height: 2px; border-radius: 2px; opacity: 0;
      background: linear-gradient(90deg, rgba(255, 250, 220, .95), rgba(255, 250, 220, 0));
      box-shadow: 0 0 6px rgba(255, 250, 220, .5);
    }

    /* 고브럽 */
    .gm-goblub { position: absolute; left: 0; top: 0; z-index: 10; width: 170px; cursor: pointer; will-change: transform; }
    /* 첫 프레임에서 위치 잡기 전까지 숨김(로드 직후 왼쪽 위에 깜빡 보이는 것 방지) */
    .gm-goblub, .gm-obj, .gm-shad, .gm-cabin, .gm-glass, .gm-satring { visibility: hidden; }
    .gm-goblub .bodywrap { position: relative; width: 100%; will-change: transform; }
    .gm-goblub img { width: 100%; height: auto; display: block; user-select: none; -webkit-user-drag: none;
      filter: drop-shadow(0 8px 9px rgba(0, 22, 32, .22)); transition: filter .18s; }
    /* 클릭 가능 표시: 우주선·토성처럼 호버 시 흰 윤곽 발광 */
    .gm-goblub:hover img {
      filter: drop-shadow(0 8px 9px rgba(0, 22, 32, .22)) drop-shadow(0 0 8px rgba(255, 255, 255, .85));
    }
    /* 입 소용돌이 회전(옆모습으로 걸을 때만) — 소용돌이 중심(0.7253,0.541), 이빨 밖 반경 15.2%만 클립 */
    .gm-mouth { position: absolute; left: 57.33%; top: 39.22%; width: 30.4%; height: 29.75%;
      border-radius: 50%; overflow: hidden; pointer-events: none;
      -webkit-mask-image: radial-gradient(circle, #000 58%, transparent 96%);
      mask-image: radial-gradient(circle, #000 58%, transparent 96%); }
    .gm-mouth svg { display: block; width: 100%; height: 100%; filter: blur(.5px);
      animation: gm-spin 2.6s linear infinite; }
    @keyframes gm-spin { to { transform: rotate(360deg); } }
    .gm-goblub.front .gm-mouth { display: none; }
    /* 꼬리 구슬 빛(클릭한 동안만) */
    .gm-orb { position: absolute; left: -14%; top: 36.5%; width: 46%; aspect-ratio: 1;
      border-radius: 50%; pointer-events: none; display: none; mix-blend-mode: screen;
      background: radial-gradient(circle, rgba(215, 248, 255, 1) 0%, rgba(150, 220, 255, .7) 34%, rgba(130, 210, 255, 0) 68%);
      animation: gm-orbp 1.3s ease-in-out infinite; }
    .gm-goblub.front .gm-orb { left: -15%; top: 35.4%; }
    .gm-goblub.orbon .gm-orb { display: block; }
    @keyframes gm-orbp { 0%, 100% { opacity: .6; transform: scale(.88); } 50% { opacity: 1; transform: scale(1.18); } }
    .gm-hint {
      position: absolute; left: 50%; top: -60px; transform: translateX(-50%);
      background: #f7ecc8; color: #35506a; font-size: 1.18rem; padding: 9px 19px;
      border-radius: 999px; white-space: nowrap;
      box-shadow: 0 8px 18px rgba(0, 22, 32, .35); animation: gm-hint 2s ease-in-out infinite;
    }
    @keyframes gm-hint { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -8px); } }

    /* 카드 */
    .gm-cards { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
    .gm-card {
      position: absolute; left: 0; top: 0; opacity: 0; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      width: 250px; height: 190px; border-radius: 18px; padding: 12px; box-sizing: border-box;
      background: linear-gradient(180deg, #f9f0d4, #efe3bd);
      color: #235a6b; text-align: center; border: 3px solid rgba(29, 90, 107, .25);
      box-shadow: 0 16px 32px rgba(0, 22, 32, .48), inset 0 2px 0 rgba(255,255,255,.8);
      will-change: transform; transform-origin: center;
    }
    body.home-moon .gm-card, body.home-moon .gm-card:hover { color: #235a6b; }
    .gm-card:hover { border-color: rgba(29, 90, 107, .55);
      box-shadow: 0 22px 42px rgba(0, 22, 32, .58), inset 0 2px 0 rgba(255,255,255,.8); }
    .gm-card .ic {
      display: flex; align-items: center; justify-content: center;
      width: 76px; height: 76px; border-radius: 50%;
      box-shadow: inset 0 -4px 8px rgba(29, 90, 107, .14), inset 0 2px 3px rgba(255,255,255,.7);
      font-size: 2.3rem; line-height: 1;
    }
    .gm-card .tt { font-size: 1.56rem; line-height: 1.15; }
    .gm-card .ds { font-size: .98rem; line-height: 1.35; color: #58818c; padding: 0 8px; word-break: keep-all; }
    @media (max-width: 700px) {
      .gm-card { gap: 7px; padding: 10px; }
      .gm-card .ic { width: 52px; height: 52px; font-size: 1.6rem; }
      .gm-card .tt { font-size: 1.12rem; }
      .gm-card .ds { font-size: .72rem; }
    }

    .gm-footer { position: absolute; bottom: 10px; right: 16px; z-index: 13;
      color: rgba(230, 240, 235, .55); font-size: .75rem; pointer-events: none; }
    body.home-moon .site-footer { display: none; }
    /* 홈에서는 떠다니는 버디 숨김(걸어다니는 고브럽과 중복) */
    body.home-moon .gbd-wrap, body.home-moon .gbd-min { display: none !important; }
  </style>
</head>

  <div id="site-footer"></div>
  <script src="js/common.js?v=5" data-root="."></script>
  <script>
  (function () {
    var WALK_IMG = "design/img/home/gb-walk.webp";
    var FRONT_IMG = "design/img/home/gb-front.webp";
    var MOUTH_FX = 0.593, MOUTH_FY = 0.539; // 정면 이미지 입 중심
    var WALK_SPEED = 200, RUN_SPEED = 1250, SPIT_POWER = 1600, CHAR_W = 170;
    // 옆모습(600×613)과 정면(600×560)의 몸높이를 맞추기 위한 폭 — 정면은 186px일 때 동일 신장
    var WALK_W = 170, FRONT_W = 186;
    var HINTS = [
      "나를 눌러봐~",
      "심심하지? 콕 눌러봐!",
      "여기야 여기~ 클릭!",
      "놀 거 잔뜩 물고 있어!",
      "누르면 좋은 일 생김",
      "입 벌리면 놀라지 마!"
    ];

    var el = document.getElementById("gm-goblub");
    var bod = document.getElementById("gm-body");
    var img = document.getElementById("gm-img");
    var hint = document.getElementById("gm-hint");
    var word = document.getElementById("gm-word");
    var cont = document.getElementById("gm-cards");
    var shad = document.getElementById("gm-shad");
    var obj = document.getElementById("gm-obj");
    var objshad = document.getElementById("gm-objshad");
    var peek = document.getElementById("gm-peek");

    // 우주선 탑승 시퀀스: in(들어감)→peek(창문 빼꼼)→out(나옴)
    var ship = null, lastShipAt = Date.now() - 6000;
    var flame = document.getElementById("gm-flame");
    var cabin = document.getElementById("gm-cabin");
    var glass = document.getElementById("gm-glass");
    var rocketFx = null; // 발사 시퀀스: up(불 뿜으며 상승)→sputter(연료 부족 픽픽)→fall(추락)→land(쿵)
    obj.addEventListener("click", function () {
      if (rocketFx || ship) return;
      rocketFx = { phase: "up", t0: Date.now(), max: Math.min(window.innerHeight * 0.38, 330) };
      flame.className = "gm-flame";
      flame.style.display = "block";
    });

    var x = window.innerWidth * 0.3, dir = 1;
    var mode = "idle"; // idle | run | spit | cards
    var squashT = 0, mouthCloseAt = 0;

    // 걸음새: 서기 ↔ 아장아장 ↔ 우다다다 를 무작위로 오간다
    var gait = "walk", gaitUntil = 0;
    function pickGait(now) {
      var r = Math.random();
      if (gait === "stand") gait = r < 0.55 ? "walk" : "dash";
      else if (r < 0.28) gait = "stand";
      else gait = gait === "walk" ? "dash" : "walk";
      var dur = gait === "stand" ? 500 + Math.random() * 1000
              : gait === "dash" ? 600 + Math.random() * 900
              : 900 + Math.random() * 1600;
      gaitUntil = now + dur;
      if (gait !== "stand" && Math.random() < 0.22) dir = -dir;
    }
    var cards = [];
    var last = Date.now();

    function groundY() { return window.innerHeight * 0.94 - 75; } // 2cm쯤 위로
    function centerX() { return (window.innerWidth - el.offsetWidth) / 2; }
    function isMobile() { return window.innerWidth < 700; } // 모바일: 중앙 고정, 걷기 없음

    // moon-5.webp(1376×768) 속 토성 중심(1151,150) — cover 배치를 화면 좌표로 환산
    var SAT = { w: 1376, h: 768, x: 1151, y: 190, r: 78 }; // 전 페이지 공통 규격(원반 반경 42)
    var vpBox = document.createElement("div");   // 배경(fixed inset:0)과 같은 박스 — 스크롤바 편차 제거
    vpBox.style.cssText = "position:fixed;inset:0;pointer-events:none;visibility:hidden";
    document.body.appendChild(vpBox);
    function saturnPos() {
      var b = vpBox.getBoundingClientRect();
      var W = b.width, H = b.height;
      var s = Math.max(W / SAT.w, H / SAT.h);
      return { x: b.left + (W - SAT.w * s) / 2 + SAT.x * s, y: b.top + H - SAT.h * s + SAT.y * s, r: SAT.r * s };
    }
    function setMouth(open) {
      var want = open ? FRONT_IMG : WALK_IMG;
      var w = open ? FRONT_W : WALK_W;
      if (img.src.indexOf(want.split("/").pop()) === -1) {
        x -= (w - el.offsetWidth) / 2; // 폭이 변해도 좌우 중심 유지
        img.src = want;
      }
      el.style.width = w + "px";
      el.classList.toggle("front", !!open); // 정면일 땐 입 회전 숨김·구슬 위치 보정
    }

    function rnd(i) { var s = Math.sin((i + 1) * 127.1) * 43758.5453; return s - Math.floor(s); }
    // 핀터레스트 캐스케이드: 비스듬히 기울어진 카드가 겹치며 흘러내리는 배치
    function targets() {
      var W = window.innerWidth, H = window.innerHeight;
      var n = cont.children.length, out = [];
      if (isMobile()) {
        // 이전 버전: 한 줄 2개 그리드
        var cols = 2, rows = Math.ceil(n / cols), gap = 18;
        var mTop = Math.max(96, H * 0.13), mBot = H * 0.06, mSide = Math.max(20, W * 0.05);
        var cw = Math.min(280, (W - mSide * 2 - gap) / cols);
        var ch = Math.min(210, (H - mTop - mBot - gap * (rows - 1)) / rows);
        for (var i = 0; i < n; i++) {
          var r = Math.floor(i / cols);
          var inRow = (r === rows - 1) ? n - cols * (rows - 1) : cols;
          var c0 = i - r * cols;
          var rowW = inRow * cw + (inRow - 1) * gap;
          out.push({ x: (W - rowW) / 2 + c0 * (cw + gap), y: mTop + r * (ch + gap), w: cw, h: ch, rot: 0 });
        }
      } else {
        // 고양이 타로처럼: 세로형 카드가 아크 위에서 왼쪽→오른쪽 부채꼴로 촤라락
        // 카드끼리 아주 약간(8%)만 겹치도록 — 크기는 적당히 작게
        var OV = 0.92;                                   // 이웃 카드 중심 간격 = 카드폭 × OV
        var cw2 = Math.min(240, W * 0.17, (W - 40) / (OV * (n - 1) + 1));
        var ch2 = Math.round(cw2 * 1.34);
        var span = cw2 * OV * (n - 1);                   // 부채 전체 폭(양끝 카드 중심 간)
        var cy = H * 0.40, curve = H * 0.16;   // 가운데가 높고 양끝이 내려오는 호
        for (var j = 0; j < n; j++) {
          var t = j / (n - 1) - 0.5;
          out.push({
            x: W / 2 + t * span - cw2 / 2,
            y: cy + t * t * 4 * curve - ch2 / 2,
            w: cw2, h: ch2,
            rot: t * 54 // 부채살 기울기: 왼쪽 -27° ~ 오른쪽 +27°
          });
        }
      }
      return out;
    }

    function beginSpit(now) {
      mode = "spit";
      cancelTrip(now); scheduleNextTrip(now);   // 넘어짐 잔여 상태 정리 + 타이머 재예약
      setMouth(true);
      squashT = 0.3;
      mouthCloseAt = now + 1100;
      word.style.opacity = "0";
      setTimeout(function () { if (word.style.opacity === "0") word.style.visibility = "hidden"; }, 520);
      var h = el.offsetHeight || el.offsetWidth * 560 / 600; // 로드 직후 폴백(정면 비율)
      var mouthX = x + el.offsetWidth * MOUTH_FX;
      var mouthY = groundY() - h + h * MOUTH_FY;
      var kids = Array.prototype.slice.call(cont.children);
      var tg = targets();
      cards = kids.map(function (k, i) {
        k.style.pointerEvents = "none";
        k.style.opacity = "0";
        k.style.transition = "none";
        k.style.width = tg[i].w + "px";
        k.style.height = tg[i].h + "px";
        k.style.zIndex = String(5 + i); // 나중 카드가 위로 겹치게
        k._fin = null;
        if (!k._hb) {
          k._hb = true;
          k.addEventListener("mouseenter", function () {
            if (!this._fin) return;
            this.style.zIndex = "99";
            this.style.transform = "translate(" + this._fin.x + "px," + (this._fin.y - 14) + "px) rotate(0deg) scale(1.06)";
          });
          k.addEventListener("mouseleave", function () {
            if (!this._fin) return;
            this.style.zIndex = this._fin.z;
            this.style.transform = "translate(" + this._fin.x + "px," + this._fin.y + "px) rotate(" + this._fin.rot + "deg)";
          });
        }
        var t0 = Date.now() + 80 + i * 70; // 왼쪽부터 한 장씩 챠라라락
        var tcx = tg[i].x + tg[i].w / 2, tcy = tg[i].y + tg[i].h / 2;
        return {
          el: k, x: mouthX - tg[i].w / 2, y: mouthY - tg[i].h / 2,
          // 제 슬롯을 향해 위로 크게 포물선을 그리며 세차게 날아감(딜링 느낌)
          vx: (tcx - mouthX) * 3.3, vy: (tcy - mouthY) * 3.3 - 620,
          rot: (Math.random() - 0.5) * 30, vr: (Math.random() - 0.5) * 560,
          rotF: tg[i].rot, z: 5 + i,
          tx: tg[i].x, ty: tg[i].y, t0: t0, t1: t0 + 300,
          fx: 0, fy: 0, frot: 0, done: false
        };
      });
      cards.forEach(function (p) { p.fx = p.x; p.fy = p.y; });
    }

    // ===== 넘어짐: 물고 있던 카테고리를 바닥에 쏟았다가 주섬주섬 챙긴다 =====
    var trip = null, nextTripAt = Date.now() + 4000; // 첫 넘어짐은 4초 뒤 확정, 이후엔 랜덤 텀
    function scheduleNextTrip(now) { nextTripAt = now + 15000 + Math.random() * 12000; }
    // 넘어져 있는 도중에 클릭 등으로 빠져나갈 때 — 쏟아둔 카드를 치우고 타이머도 다시 잡는다
    function cancelTrip(now) {
      if (!trip) return;
      trip.items.forEach(function (p) {
        p.el.style.opacity = "0"; p.el.style.pointerEvents = "none"; p.el.style.transform = "";
      });
      trip = null;
      scheduleNextTrip(now);
    }
    function beginTrip(now) {
      mode = "trip";
      var W = window.innerWidth, h = el.offsetHeight;
      var mouthX = x + el.offsetWidth * MOUTH_FX, mouthY = groundY() - h + h * MOUTH_FY;
      var kids = Array.prototype.slice.call(cont.children);
      var cw = Math.min(150, W * 0.108), ch = Math.round(cw * 1.34);
      var items = kids.map(function (k, i) {
        k.style.width = cw + "px"; k.style.height = ch + "px";
        k.style.zIndex = String(5 + i);
        k.style.transition = "none"; k.style.opacity = "0"; k.style.pointerEvents = "none";
        k._fin = null;
        var spread = (i - (kids.length - 1) / 2) * (cw * 0.7) + (Math.random() - 0.5) * 26;
        var tx = Math.max(12, Math.min(W - cw - 12, x + el.offsetWidth / 2 - cw / 2 + spread + dir * 40));
        return {
          el: k, x: mouthX - cw / 2, y: mouthY - ch / 2,
          vx: (tx - (mouthX - cw / 2)) * 1.5, vy: -170 - Math.random() * 130,
          rot: (Math.random() - 0.5) * 30, vr: (Math.random() - 0.5) * 380,
          tx: tx, ty: groundY() - ch * 0.5,
          restRot: (Math.random() < 0.5 ? -1 : 1) * (74 + Math.random() * 26),
          t0: now + 40 + i * 45, landed: false, gone: false, gt0: 0
        };
      });
      trip = { phase: "fall", until: now + 420, items: items, cw: cw, ch: ch,
               mouthX: mouthX, mouthY: mouthY, dir: dir, slid: 0 };
    }
    function updateTrip(now, dt) {
      var t = trip;
      if (!t) { mode = "idle"; return 0; }
      for (var i = 0; i < t.items.length; i++) {
        var p = t.items[i];
        if (p.gone || now < p.t0) continue;
        p.el.style.opacity = "1";
        if (t.phase === "gather" && now >= p.gt0) {          // 입으로 도로 챙기기
          var u = Math.min(1, (now - p.gt0) / 300), e = 1 - Math.pow(1 - u, 2);
          p.el.style.transform = "translate(" + (p.x + (t.mouthX - t.cw / 2 - p.x) * e) + "px," +
            (p.y + (t.mouthY - t.ch / 2 - p.y) * e) + "px) rotate(" + (p.restRot * (1 - e)) + "deg) scale(" + (1 - 0.75 * e) + ")";
          p.el.style.opacity = String(1 - e);
          if (u >= 1) { p.gone = true; p.el.style.opacity = "0"; }
          continue;
        }
        if (!p.landed) {                                      // 포물선으로 쏟아짐
          p.vy += 1500 * dt;
          p.x += p.vx * dt; p.y += p.vy * dt;
          p.vx *= Math.pow(0.35, dt); p.rot += p.vr * dt;
          if (p.y >= p.ty) { p.y = p.ty; p.x = p.tx; p.landed = true; }
        } else {                                              // 바닥에 눕는 각도로 정착
          p.rot += (p.restRot - p.rot) * Math.min(1, dt * 9);
        }
        p.el.style.transform = "translate(" + p.x + "px," + p.y + "px) rotate(" + p.rot + "deg) scale(.92)";
      }
      var rot = 0;
      if (t.phase === "fall") {
        var fu = 1 - Math.max(0, (t.until - now) / 420);
        rot = 88 * (1 - Math.pow(1 - fu, 3));         // 앞으로 완전히 엎어진다
        var want = 34 * fu;                            // 걷던 방향으로 미끄러지며
        x += (want - t.slid) * t.dir; t.slid = want;
        if (now >= t.until && t.items.every(function (p) { return p.landed; })) {
          t.phase = "rest"; t.until = now + 1100;
          t.items.forEach(function (p) { p.el.style.pointerEvents = "auto"; }); // 누운 카드도 눌러서 갈 수 있다
        }
      } else if (t.phase === "rest") {
        rot = 88;
        if (now >= t.until) {
          t.phase = "gather";
          t.items.forEach(function (p, i2) { p.gt0 = now + i2 * 90; p.el.style.pointerEvents = "none"; });
          t.until = now + t.items.length * 90 + 400;
        }
      } else if (t.phase === "gather") {
        rot = 70;   // 숙인 채로 주섬주섬
        if (now >= t.until) { t.phase = "up"; t.until = now + 380; }
      } else {
        rot = 70 * Math.max(0, (t.until - now) / 380);
        if (now >= t.until) {
          trip = null; mode = "idle";
          gait = "walk"; gaitUntil = now + 900;
          scheduleNextTrip(now);
          return 0;
        }
      }
      return rot;
    }

    function tick(now, dt) {
      var W = window.innerWidth;
      var minX = 20, maxX = W - CHAR_W - 20;

      if (mode === "run") {
        var cx = centerX();
        dir = cx > x ? 1 : -1;
        if (Math.abs(cx - x) <= RUN_SPEED * dt + 14) { x = cx; beginSpit(now); }
        else x += dir * RUN_SPEED * dt;
      } else if (mode === "idle") {
        if (isMobile()) {
          x = centerX(); gait = "stand"; dir = 1;
          setMouth(true); // 모바일은 늘 정면
        } else {
          setMouth(false);
          if (ship) {
            if (now > ship.until) {
              if (ship.phase === "in") { peek.style.opacity = "1"; ship = { phase: "peek", until: now + 2600 }; }
              else if (ship.phase === "peek") { peek.style.opacity = "0"; ship = { phase: "out", until: now + 350 }; }
              else { // 다시 나와서 걸어다니기
                el.style.opacity = "1"; el.style.pointerEvents = "";
                ship = null; lastShipAt = now;
                dir = -1; gait = "walk"; gaitUntil = now + 1100;
              }
            }
          } else {
            if (now > gaitUntil) pickGait(now);
            var sp = gait === "dash" ? 400 : gait === "walk" ? WALK_SPEED : 0;
            x += dir * sp * dt;
            if (x > maxX) { x = maxX; dir = -1; gait = "walk"; gaitUntil = now + 600; }
            if (x < minX) { x = minX; dir = 1; gait = "walk"; gaitUntil = now + 600; }
            // 우주선 문 앞을 지나면 (12초에 한 번) 들어갔다 나온다
            var doorX = Math.min(W * 0.78, W - 190 - 24) + 95;
            if (sp > 0 && !rocketFx && now - lastShipAt > 12000 && Math.abs(x + el.offsetWidth / 2 - doorX) < 16) {
              x = doorX - el.offsetWidth / 2;
              el.style.opacity = "0"; el.style.pointerEvents = "none";
              ship = { phase: "in", until: now + 500 };
            }
            // 가끔 발이 걸려 넘어지며 입에 물고 있던 카테고리를 바닥에 쏟는다
            if (sp > 0 && !cards.length && now > nextTripAt) beginTrip(now);
          }
        }
      }
      if (mode === "spit" && now > mouthCloseAt) mode = "cards";
      var tripRot = mode === "trip" ? updateTrip(now, dt) : 0;

      var g = mode === "run" ? "run" : (mode === "idle" ? gait : "stand");
      var moving = g === "run" || g === "walk" || g === "dash";
      var wf = g === "run" ? 15 : g === "dash" ? 13 : 7;
      var ph = now / 1000 * wf;
      var rock = g === "run" ? Math.sin(ph) * 6
               : g === "dash" ? Math.sin(ph) * 7
               : g === "walk" ? Math.sin(ph) * 4
               : Math.sin(now / 1000 * 1.4) * 1.2;
      var lean = g === "run" ? 8 : g === "dash" ? 6 : 0; // 달릴 땐 앞으로 기울기
      var hop = (g === "run" || g === "dash") ? Math.abs(Math.sin(ph)) * 3 : 0;
      var step = moving ? Math.sin(ph * 2) * 0.012 : 0;
      var y = groundY() - el.offsetHeight - hop;
      var sx = 1, sy = 1;
      if (squashT > 0) {
        squashT -= dt;
        var k = Math.sin((1 - squashT / 0.3) * Math.PI) * 0.2;
        sx = 1 + k; sy = 1 - k;
      }
      el.style.transform = "translate(" + x + "px, " + y + "px)";

      // 토성 고리를 도는 반짝임 + 광원 기준 그림자
      var sat = saturnPos();
      var hd = sat.r * 2.3; // 토성 호버 핫스팟
      sathot.style.width = hd + "px"; sathot.style.height = hd + "px";
      sathot.style.transform = "translate(" + (sat.x - hd / 2) + "px," + (sat.y - hd / 2) + "px)";
      // 행성 테두리 발광(본체 반경 70)
      var ss2 = sat.r / 78, rw = 42 * 2 * ss2, rh = 42 * 2 * ss2;
      satring.style.width = rw + "px"; satring.style.height = rh + "px";
      satring.style.transform = "translate(" + (sat.x - rw / 2) + "px," + (sat.y - rh / 2) + "px)";
      // 토성 메뉴는 토성 바로 아래 오른쪽 정렬
      satmenu.style.transform = "translate(" + Math.min(sat.x + sat.r * 0.4, W - 190) + "px," + (sat.y + hd / 2 + 14) + "px)";
      var ccx = x + el.offsetWidth / 2;
      var dN = (ccx - sat.x) / W; // 토성 기준 좌우 거리(-: 토성이 오른쪽)
      var sw2 = CHAR_W * (0.74 + Math.min(0.5, Math.abs(dN)) * 0.6) * (1 - hop / 40);
      var sh2 = sw2 * 0.17;
      shad.style.width = sw2 + "px"; shad.style.height = sh2 + "px";
      shad.style.opacity = String(0.94 - Math.min(0.3, Math.abs(dN) * 0.45) - hop / 30);
      var dC = Math.max(-0.6, Math.min(0.6, dN)); // 화면 밖 광원일 때 과하게 밀리지 않게
      shad.style.transform = "translate(" + (ccx + dC * 110 - sw2 / 2) + "px," + (groundY() - sh2 / 2 - 3) + "px)";

      // 전경 로켓(고브럽 2배 크기 — 타고 온 우주선): 발밑 라인에 심어두기
      var ow = isMobile() ? 100 : 190, oh = ow * 1.882;
      var ox = isMobile() ? Math.min(W * 0.72, W - ow - 6) : Math.min(W * 0.78, W - ow - 24);
      var oy = groundY() + 16 - oh;

      // 발사 시퀀스 진행
      var rdy = 0, rjx = 0, rrot = -3, rsc = "", rsx = 1, rsy = 1;
      if (rocketFx) {
        var ft = now - rocketFx.t0;
        if (rocketFx.phase === "up") {
          var fp = Math.min(1, ft / 1100);
          rdy = rocketFx.max * (1 - Math.pow(1 - fp, 2));
          rjx = Math.sin(now / 18) * 1.6; // 분사 진동
          if (fp >= 1) { rocketFx = { phase: "sputter", t0: now, max: rocketFx.max }; flame.className = "gm-flame sputter"; }
        } else if (rocketFx.phase === "sputter") {
          var fp2 = Math.min(1, ft / 1000);
          rdy = rocketFx.max - 30 * fp2 + Math.sin(ft / 40) * 5; // 픽픽거리며 주춤
          rrot = -3 + Math.sin(ft / 90) * 3;
          if (fp2 >= 1) { rocketFx = { phase: "fall", t0: now, v: 0, dy: rdy }; flame.style.display = "none"; }
        } else if (rocketFx.phase === "fall") {
          rocketFx.v += 2600 * dt;
          rocketFx.dy -= rocketFx.v * dt;
          rdy = Math.max(0, rocketFx.dy);
          rrot = -3 + Math.sin(now / 70) * 4; // 비틀비틀 추락
          if (rocketFx.dy <= 0) { rocketFx = { phase: "land", t0: now }; }
        } else { // 착지 쿵 스쿼시
          var fp3 = Math.min(1, ft / 260);
          var fk = Math.sin(fp3 * Math.PI) * 0.06;
          rsx = 1 + fk; rsy = 1 - fk;
          rsc = " scale(" + rsx + "," + rsy + ")";
          if (fp3 >= 1) { rocketFx = null; lastShipAt = now; } // 착륙 직후엔 잠시 탑승 안 함
        }
      }
      obj.style.width = ow + "px";
      obj.style.transformOrigin = "50% 100%";
      obj.style.transform = "translate(" + (ox + rjx) + "px," + (oy - rdy) + "px) rotate(" + rrot + "deg)" + rsc;
      // 불꽃은 노즐 바로 아래를 따라간다
      if (flame.style.display !== "none") {
        var fw = ow * 0.36, fh = ow * 0.52;
        flame.style.width = fw + "px"; flame.style.height = fh + "px";
        flame.style.transform = "translate(" + (ox + rjx + ow / 2 - fw / 2) + "px," + (oy - rdy + oh - 10) + "px)";
      }

      // 우주선 그림자(토성 광원 기준)
      var rcx = ox + ow / 2;
      var rdN = Math.max(-0.6, Math.min(0.6, (rcx - sat.x) / W));
      var rsw = ow * 1.18 * Math.max(0.6, 1 - rdy / 900), rsh = rsw * 0.16;
      objshad.style.width = rsw + "px"; objshad.style.height = rsh + "px";
      objshad.style.opacity = String(Math.max(0.15, 0.62 - rdy / 650)); // 떠오르면 그림자가 옅어짐
      objshad.style.transform = "translate(" + (rcx + rdN * 90 - rsw / 2) + "px," + (groundY() + 12 - rsh / 2) + "px)";

      // 창문 빼꼼 원형 클립 위치(창 중심 0.65, 0.44 / 유리 지름 0.24×몸폭)
      // 유리 구멍 실측: 중심 0.6458/0.4464, 지름 26.56%
      // 로켓은 transform-origin 50% 100%에서 rrot만큼 기울어 있으므로 창 중심도 같은 회전을 적용해야 맞는다
      var rr = rrot * Math.PI / 180, cosr = Math.cos(rr), sinr = Math.sin(rr);
      var pivx = ox + rjx + ow / 2, pivy = oy - rdy + oh;      // 회전 원점(로켓 하단 중앙)
      // 원점 기준 창 중심 — CSS transform 순서(translate→rotate→scale)에 맞춰 스케일 먼저 반영
      var ddx = ow * (0.6458 - 0.5) * rsx, ddy = oh * (0.4464 - 1) * rsy;
      var gcx = pivx + ddx * cosr - ddy * sinr;
      var gcy = pivy + ddx * sinr + ddy * cosr;
      var pd = ow * 0.30;                                       // 선실은 구멍보다 넉넉히
      cabin.style.width = pd + "px"; cabin.style.height = pd + "px";
      cabin.style.transform = "translate(" + (gcx - pd / 2) + "px," + (gcy - pd / 2) + "px)";
      var gd = ow * 0.2656;                                     // 유리 반사는 구멍에 딱 맞게
      glass.style.width = gd + "px"; glass.style.height = gd + "px";
      glass.style.transform = "translate(" + (gcx - gd / 2) + "px," + (gcy - gd / 2) + "px)";
      peek.style.width = pd + "px"; peek.style.height = pd + "px";
      peek.style.transform = "translate(" + (gcx - pd / 2) + "px," + (gcy - pd / 2) + "px)";
      // 정면 이미지의 눈알 중심(0.565, 0.155)이 창 정중앙에 오도록
      var pimg = peek.firstElementChild;
      pimg.style.width = (pd * 4.47) + "px";
      pimg.style.left = (-2.026 * pd) + "px";
      pimg.style.top = (-0.147 * pd) + "px";

      if (ship) shad.style.opacity = "0"; // 안에 들어가 있을 땐 고브럽 그림자도 숨김

      var face = (mode === "spit" || mode === "cards") ? 1 : dir;
      bod.style.transformOrigin = "50% 100%";
      bod.style.transform = "rotate(" + (rock + lean + tripRot) + "deg) scaleX(" + (face * (sx + step)) + ") scaleY(" + (sy - step) + ")";

      for (var i = 0; i < cards.length; i++) {
        var p = cards[i];
        if (p.done || now < p.t0) continue;
        var kEl = p.el;
        kEl.style.opacity = "1";
        if (now < p.t1) {
          p.vx *= Math.pow(0.02, dt); p.vy *= Math.pow(0.02, dt);
          p.x += p.vx * dt; p.y += p.vy * dt;
          p.rot += p.vr * dt;
          var sc = 0.3 + 0.25 * (1 - (p.t1 - now) / (p.t1 - p.t0));
          kEl.style.transform = "translate(" + p.x + "px, " + p.y + "px) rotate(" + p.rot + "deg) scale(" + sc + ")";
          p.fx = p.x; p.fy = p.y; p.frot = p.rot;
        } else {
          var u = Math.min(1, (now - p.t1) / 440);
          var e = 1 + 2.6 * Math.pow(u - 1, 3) + 1.6 * Math.pow(u - 1, 2);   // 크기 오버슈트
          var eb = 1 + 3.2 * Math.pow(u - 1, 3) + 2.2 * Math.pow(u - 1, 2);  // 회전 오버슈트(휙-탁)
          var eo = 1 - Math.pow(1 - u, 3);
          var xx = p.fx + (p.tx - p.fx) * eo, yy = p.fy + (p.ty - p.fy) * eo;
          var sc2 = Math.max(0.2, 0.5 + 0.5 * e);
          var rot2 = p.frot + (p.rotF - p.frot) * eb; // 최종 기울기를 지나쳤다 되돌아오며 착지
          kEl.style.transform = "translate(" + xx + "px, " + yy + "px) rotate(" + rot2 + "deg) scale(" + sc2 + ")";
          if (u >= 1) {
            kEl.style.transform = "translate(" + p.tx + "px, " + p.ty + "px) rotate(" + p.rotF + "deg)";
            kEl.style.transition = "transform .18s, box-shadow .15s";
            kEl.style.pointerEvents = "auto";
            kEl._fin = { x: p.tx, y: p.ty, rot: p.rotF, z: String(p.z) };
            p.done = true;
          }
        }
      }
    }

    var hintIdx = 0;
    setInterval(function () {
      if (!hint || hint.style.display === "none") return;
      hintIdx = (hintIdx + 1) % HINTS.length;
      hint.style.transition = "none";
      hint.style.opacity = "0";
      hint.textContent = HINTS[hintIdx];
      setTimeout(function () {
        hint.style.transition = "opacity .25s";
        hint.style.opacity = "1";
      }, 60);
    }, 2600);

    function closeCards() {
      for (var i = 0; i < cards.length; i++) { cards[i].el.style.opacity = "0"; cards[i].el.style.pointerEvents = "none"; }
      cards = [];
      word.style.visibility = "visible"; word.style.opacity = "1";
      mode = "idle"; gaitUntil = 0;
      scheduleNextTrip(Date.now());   // 닫자마자 곧바로 넘어지지 않게
      setMouth(isMobile());
      el.classList.remove("orbon"); // 산책으로 돌아가면 구슬 빛 끔
      if (hint) hint.style.display = ""; // 돌아오면 멘트 다시
    }

    // 카드가 떠 있을 때 빈 배경을 눌러도 닫힘(카드·고브럽 클릭은 제외)
    document.addEventListener("click", function (ev) {
      if (mode !== "cards") return;
      if (el.contains(ev.target)) return;
      var t = ev.target;
      while (t && t !== document.body) {
        if (t.classList && t.classList.contains("gm-card")) return;
        t = t.parentNode;
      }
      closeCards();
    });

    el.addEventListener("click", function () {
      if (mode === "run" || mode === "spit") return;
      if (mode === "cards") { closeCards(); return; }
      if (mode === "trip") cancelTrip(Date.now());   // 넘어져 있던 중이면 쏟은 카드부터 치우고 일어난다
      el.classList.add("orbon"); // 클릭한 동안(달리기·카드)만 꼬리 구슬이 빛남
      if (hint) hint.style.display = "none";
      if (isMobile()) { beginSpit(Date.now()); } // 모바일은 그 자리에서 바로
      else mode = "run";
    });

    // 별똥별: 3~4초에 한 번쯤 하늘을 가로질러 떨어진다 (좌표를 주면 그 자리에서 출발)
    function spawnMeteor(fromX, fromY) {
      if (!document.body.animate) return;
      var m = document.createElement("div");
      m.className = "gm-meteor";
      var W = window.innerWidth, H = window.innerHeight;
      var sx = fromX != null ? fromX : W * (0.15 + Math.random() * 0.75);
      var sy = fromY != null ? fromY : H * (0.04 + Math.random() * 0.3);
      var ang = 145 + Math.random() * 20; // 왼쪽 아래로
      var rad = ang * Math.PI / 180;
      var dist = 180 + Math.random() * 220;
      document.body.appendChild(m);
      var a = m.animate([
        { transform: "translate(" + sx + "px," + sy + "px) rotate(" + ang + "deg)", opacity: 0 },
        { opacity: .95, offset: 0.22 },
        { transform: "translate(" + (sx + Math.cos(rad) * dist) + "px," + (sy + Math.sin(rad) * dist) + "px) rotate(" + ang + "deg)", opacity: 0 }
      ], { duration: 750 + Math.random() * 500, easing: "ease-out" });
      a.onfinish = function () { m.remove(); };
    }
    setInterval(function () { if (!document.hidden && Math.random() < 0.8) spawnMeteor(); }, 3400);

    // 별을 누르면 그 별이 별똥별처럼 떨어지고, 잠시 뒤 제자리에 다시 뜬다
    Array.prototype.forEach.call(document.querySelectorAll(".gm-star"), function (s) {
      s.addEventListener("click", function () {
        if (s.style.opacity === "0") return;
        var r = s.getBoundingClientRect();
        spawnMeteor(r.left + r.width / 2, r.top + r.height / 2);
        s.style.opacity = "0"; s.style.pointerEvents = "none";
        setTimeout(function () { s.style.opacity = ""; s.style.pointerEvents = ""; }, 5000);
      });
    });

    // 토성 핫스팟: 호버 링 + 클릭하면 반짝이며 메뉴 카드가 챠라락
    var sathot = document.getElementById("gm-sathot");
    var satring = document.getElementById("gm-satring");
    sathot.addEventListener("mouseenter", function () { satring.classList.add("hot"); });
    sathot.addEventListener("mouseleave", function () { satring.classList.remove("hot"); });
    var satmenu = document.getElementById("gm-satmenu");
    (function () { // 로그인 상태면 마이페이지로 표기(common.js와 동일 규칙)
      var loggedIn = false;
      try { var u = JSON.parse(localStorage.getItem("goblub_user")); loggedIn = !!(u && u.sub); } catch (e) {}
      if (loggedIn) document.getElementById("gm-satlogin").innerHTML = "<span>👤</span>마이페이지";
    })();
    sathot.addEventListener("click", function () {
      satring.classList.remove("burst");
      void satring.offsetWidth; // 애니메이션 재시작
      satring.classList.add("burst");
      if (satmenu.classList.contains("on")) satmenu.classList.remove("on");
      else {
        satmenu.classList.remove("on");
        void satmenu.offsetWidth;
        satmenu.classList.add("on");
      }
    });
    document.addEventListener("click", function (ev) {
      if (!satmenu.classList.contains("on")) return;
      if (sathot.contains(ev.target) || satmenu.contains(ev.target)) return;
      satmenu.classList.remove("on");
    });

    // 시작 상태: 모든 상태 선언이 끝난 뒤에 결정해야 한다
    // 페이지를 떠날 때 걷던 위치를 남긴다(행성 간 이동 시 이어 걷기)
    window.addEventListener("pagehide", function () {
      try { sessionStorage.setItem("goblub_walk", JSON.stringify({ x: x, dir: dir, t: Date.now() })); } catch (e) {}
    });
    var savedWalk = null;
    try { var sw0 = JSON.parse(sessionStorage.getItem("goblub_walk")); if (sw0 && Date.now() - sw0.t < 60000) savedWalk = sw0; } catch (e) {}
    var cameBack = false;
    try { cameBack = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) {}
    if (!isMobile()) {
      if (savedWalk) {
        // 다른 행성에서 돌아옴: 배경만 바뀐 듯 같은 위치에서 그대로 걷는다
        x = Math.max(20, Math.min(window.innerWidth - CHAR_W - 20, savedWalk.x));
        dir = savedWalk.dir === -1 ? -1 : 1;
        gait = "walk"; gaitUntil = Date.now() + 1200;
      } else if (cameBack) {
        // 사이트 내 다른 페이지(고브럽 없는 페이지)에서 돌아옴: 중앙에서 카드 뱉기
        x = (window.innerWidth - CHAR_W) / 2;
        if (hint) hint.style.display = "none";
        beginSpit(Date.now());
      } else {
        // 첫 진입: 우주선 문 앞으로 걸어가 탑승하는 것부터 시작
        var doorX0 = Math.min(window.innerWidth * 0.78, window.innerWidth - 190 - 24) + 95;
        x = doorX0 - CHAR_W / 2 - 150;
        dir = 1; gait = "walk"; gaitUntil = Date.now() + 3000;
        lastShipAt = Date.now() - 20000;
      }
    }

    var booted = false;
    function loop() {
      var now = Date.now();
      window.requestAnimationFrame(loop);
      var dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      try {
        tick(now, dt);
        if (!booted) { // 첫 프레임에서 위치가 잡힌 뒤에 보이기
          booted = true;
          el.style.visibility = "visible";
          obj.style.visibility = "visible";
          shad.style.visibility = "visible";
          objshad.style.visibility = "visible";
          satring.style.visibility = "visible";
          cabin.style.visibility = "visible";
          glass.style.visibility = "visible";
        }
      } catch (e) {}
    }
    window.requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
