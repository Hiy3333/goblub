<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>goblub — 와서 놀다 가세요</title>
  <meta name="description" content="사주, 심리테스트, 미니게임, 마음 배달까지 — 와서 놀다 가는 곳 고브럽" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=cl1" />
  <style>
    /* ===== 홈: 달나라 고브럽 ===== */
    html { background: #14224a; }
    html, body { height: 100%; }
    body.home-moon {
      margin: 0; overflow: hidden;
      background: url("design/img/moon-5.webp") center bottom / cover no-repeat #14224a !important;
      font-family: "Jua", "Malgun Gothic", sans-serif;
    }
    /* 하늘만 진한 남색으로(아래 지면쪽으로 갈수록 사라짐) */
    .gm-tint {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(180deg, rgba(8, 14, 56, .82) 0%, rgba(8, 14, 56, .56) 45%, rgba(8, 14, 56, 0) 74%);
      mix-blend-mode: multiply;
    }
    /* 토성 글로우 */
    .gm-glow {
      position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none;
      border-radius: 50%; mix-blend-mode: screen;
      background: radial-gradient(circle, rgba(255, 228, 170, .55) 0%, rgba(255, 210, 135, .2) 42%, rgba(255, 200, 120, 0) 66%);
    }
    /* 펠트 질감 3D 땅(하단 오버레이, 위쪽은 배경으로 자연스럽게 페이드) */
    .gm-ground {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 8; pointer-events: none;
      width: 100%; height: 40vh; object-fit: cover; object-position: center bottom;
      -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 36%);
      mask-image: linear-gradient(180deg, transparent 0, #000 36%);
    }
    /* 전경 오브젝트(로켓): 고브럽이 뒤로 지나가면 가려지고 눈만 빼꼼 */
    .gm-obj {
      position: absolute; left: 0; top: 0; z-index: 12; pointer-events: none;
      filter: drop-shadow(-6px 10px 10px rgba(0, 22, 32, .38));
    }
    /* 토성 광원 기준 고브럽 그림자 */
    .gm-shad {
      position: absolute; left: 0; top: 0; z-index: 9; pointer-events: none;
      border-radius: 50%; filter: blur(3px);
      background: radial-gradient(ellipse at center, rgba(4, 10, 20, .68) 0%, rgba(4, 10, 20, .4) 45%, rgba(4, 10, 20, 0) 72%);
      will-change: transform, width, opacity;
    }
    body.home-moon a { color: #ffe9b8; text-decoration: none; }
    body.home-moon a:hover { color: #ffffff; }

    /* 헤더: 떠 있는 다크 알약 */
    body.home-moon .site-header {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 30; display: flex; align-items: center; gap: 22px; width: auto; max-width: none;
      margin: 0; padding: 9px 12px 9px 22px;
      background: rgba(12, 52, 64, .62); border-radius: 999px;
      box-shadow: 0 10px 26px rgba(0, 20, 30, .35), inset 0 1px 0 rgba(255,255,255,.14);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    body.home-moon .logo { font-size: 1.7rem; letter-spacing: 2px; display: flex; }
    body.home-moon .site-nav { display: flex; gap: 8px; }
    body.home-moon .site-nav a {
      color: #d9f1ef; font-size: .92rem; margin: 0; padding: 6px 14px;
      border-radius: 999px; background: rgba(255,255,255,.1);
      transition: background .12s, color .12s;
    }
    body.home-moon .site-nav a:hover { background: rgba(255,255,255,.24); color: #fff; }
    body.home-moon .site-nav a { white-space: nowrap; }
    @media (max-width: 700px) {
      body.home-moon .site-header { gap: 10px; padding: 7px 10px 7px 16px; }
      body.home-moon .logo { font-size: 1.25rem; }
      body.home-moon .site-nav { gap: 5px; }
      body.home-moon .site-nav a { font-size: .8rem; padding: 5px 10px; }
    }

    /* 워드마크 */
    .gm-word {
      position: absolute; top: 17vh; left: 50%; transform: translateX(-50%);
      z-index: 5; text-align: center; pointer-events: none; transition: opacity .5s;
    }
    .gm-word h1 {
      margin: 0; font-size: clamp(3.4rem, 8vw, 5.6rem); font-weight: 400; color: #f7ecc8;
      letter-spacing: .04em; line-height: 1.05;
      text-shadow: 0 4px 0 rgba(16, 62, 76, .8), 0 14px 30px rgba(0, 25, 35, .5);
    }
    .gm-word p {
      margin: 14px 0 0; font-size: clamp(1rem, 2.4vw, 1.35rem); color: #cfe9e6;
      text-shadow: 0 2px 8px rgba(0, 25, 35, .6);
    }

    .gm-star { position: absolute; z-index: 3; color: #f7ecc8; pointer-events: none; animation: gm-tw 2.8s ease-in-out infinite; }
    @keyframes gm-tw { 0%,100% { opacity: .4; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }

    /* 고브럽 */
    .gm-goblub { position: absolute; left: 0; top: 0; z-index: 10; width: 170px; cursor: pointer; will-change: transform; }
    .gm-goblub img { width: 100%; height: auto; display: block; user-select: none; -webkit-user-drag: none;
      filter: drop-shadow(0 8px 9px rgba(0, 22, 32, .22)); }
    .gm-hint {
      position: absolute; left: 50%; top: -60px; transform: translateX(-50%);
      background: #f7ecc8; color: #35506a; font-size: 1.18rem; padding: 9px 19px;
      border-radius: 999px; white-space: nowrap;
      box-shadow: 0 8px 18px rgba(0, 22, 32, .35); animation: gm-hint 2s ease-in-out infinite;
    }
    @keyframes gm-hint { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -8px); } }

    /* 카드 */
    .gm-cards { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
    .gm-card {
      position: absolute; left: 0; top: 0; opacity: 0; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      width: 250px; height: 190px; border-radius: 18px; padding: 12px; box-sizing: border-box;
      background: linear-gradient(180deg, #f9f0d4, #efe3bd);
      color: #235a6b; text-align: center; border: 3px solid rgba(29, 90, 107, .25);
      box-shadow: 0 16px 32px rgba(0, 22, 32, .48), inset 0 2px 0 rgba(255,255,255,.8);
      will-change: transform; transform-origin: center;
    }
    body.home-moon .gm-card, body.home-moon .gm-card:hover { color: #235a6b; }
    .gm-card:hover { border-color: rgba(29, 90, 107, .55);
      box-shadow: 0 22px 42px rgba(0, 22, 32, .58), inset 0 2px 0 rgba(255,255,255,.8); }
    .gm-card .ic {
      display: flex; align-items: center; justify-content: center;
      width: 56px; height: 56px; border-radius: 50%;
      box-shadow: inset 0 -4px 8px rgba(29, 90, 107, .14), inset 0 2px 3px rgba(255,255,255,.7);
      font-size: 1.7rem; line-height: 1;
    }
    .gm-card .tt { font-size: 1.2rem; line-height: 1.1; }
    .gm-card .ds { font-size: .76rem; color: #58818c; }
    @media (max-width: 700px) {
      .gm-card { gap: 7px; padding: 10px; }
      .gm-card .ic { width: 52px; height: 52px; font-size: 1.6rem; }
      .gm-card .tt { font-size: 1.12rem; }
      .gm-card .ds { font-size: .72rem; }
    }

    .gm-footer { position: absolute; bottom: 10px; right: 16px; z-index: 13;
      color: rgba(230, 240, 235, .55); font-size: .75rem; pointer-events: none; }
    body.home-moon .site-footer { display: none; }
    /* 홈에서는 떠다니는 버디 숨김(걸어다니는 고브럽과 중복) */
    body.home-moon .gbd-wrap, body.home-moon .gbd-min { display: none !important; }
  </style>
</head>

  <div class="gm-goblub" id="gm-goblub">
    <div class="gm-hint" id="gm-hint">나를 눌러봐~</div>

  <script src="js/common.js?v=5" data-root="."></script>
  <script>
  (function () {
    var WALK_IMG = "design/img/home/gb-walk.webp";
    var FRONT_IMG = "design/img/home/gb-front.webp";
    var MOUTH_FX = 0.593, MOUTH_FY = 0.539; // 정면 이미지 입 중심
    var WALK_SPEED = 200, RUN_SPEED = 1250, SPIT_POWER = 1600, CHAR_W = 170;
    var HINTS = [
      "나를 눌러봐~",
      "심심하지? 콕 눌러봐!",
      "여기야 여기~ 클릭!",
      "놀 거 잔뜩 물고 있어!",
      "누르면 좋은 일 생김 ✦",
      "입 벌리면 놀라지 마!"
    ];

    var el = document.getElementById("gm-goblub");
    var img = document.getElementById("gm-img");
    var hint = document.getElementById("gm-hint");
    var word = document.getElementById("gm-word");
    var cont = document.getElementById("gm-cards");
    var glow = document.getElementById("gm-glow");
    var shad = document.getElementById("gm-shad");
    var obj = document.getElementById("gm-obj");

    var x = window.innerWidth * 0.3, dir = 1;
    var mode = "idle"; // idle | run | spit | cards
    var squashT = 0, mouthCloseAt = 0;

    // 걸음새: 서기 ↔ 아장아장 ↔ 우다다다 를 무작위로 오간다
    var gait = "walk", gaitUntil = 0;
    function pickGait(now) {
      var r = Math.random();
      if (gait === "stand") gait = r < 0.55 ? "walk" : "dash";
      else if (r < 0.28) gait = "stand";
      else gait = gait === "walk" ? "dash" : "walk";
      var dur = gait === "stand" ? 500 + Math.random() * 1000
              : gait === "dash" ? 600 + Math.random() * 900
              : 900 + Math.random() * 1600;
      gaitUntil = now + dur;
      if (gait !== "stand" && Math.random() < 0.22) dir = -dir;
    }
    var cards = [];
    var last = Date.now();

    function groundY() { return window.innerHeight * 0.94 - 75; } // 2cm쯤 위로
    function centerX() { return (window.innerWidth - CHAR_W) / 2; }
    function isMobile() { return window.innerWidth < 700; } // 모바일: 중앙 고정, 걷기 없음

    // moon-5.webp(1376×768) 속 토성 중심(1151,150) — cover 배치를 화면 좌표로 환산
    var SAT = { w: 1376, h: 768, x: 1151, y: 150, r: 78 };
    function saturnPos() {
      var W = window.innerWidth, H = window.innerHeight;
      var s = Math.max(W / SAT.w, H / SAT.h);
      return { x: (W - SAT.w * s) / 2 + SAT.x * s, y: H - SAT.h * s + SAT.y * s, r: SAT.r * s };
    }
    function setMouth(open) {
      var want = open ? FRONT_IMG : WALK_IMG;
      if (img.src.indexOf(want.split("/").pop()) === -1) img.src = want;
    }

    function rnd(i) { var s = Math.sin((i + 1) * 127.1) * 43758.5453; return s - Math.floor(s); }
    // 핀터레스트 캐스케이드: 비스듬히 기울어진 카드가 겹치며 흘러내리는 배치
    function targets() {
      var W = window.innerWidth, H = window.innerHeight;
      var n = cont.children.length, out = [];
      if (isMobile()) {
        // 이전 버전: 한 줄 2개 그리드
        var cols = 2, rows = Math.ceil(n / cols), gap = 18;
        var mTop = Math.max(96, H * 0.13), mBot = H * 0.06, mSide = Math.max(20, W * 0.05);
        var cw = Math.min(280, (W - mSide * 2 - gap) / cols);
        var ch = Math.min(210, (H - mTop - mBot - gap * (rows - 1)) / rows);
        for (var i = 0; i < n; i++) {
          var r = Math.floor(i / cols);
          var inRow = (r === rows - 1) ? n - cols * (rows - 1) : cols;
          var c0 = i - r * cols;
          var rowW = inRow * cw + (inRow - 1) * gap;
          out.push({ x: (W - rowW) / 2 + c0 * (cw + gap), y: mTop + r * (ch + gap), w: cw, h: ch, rot: 0 });
        }
      } else {
        // 고양이 타로처럼: 세로형 카드가 아크 위에서 왼쪽→오른쪽 부채꼴로 촤라락
        var cw2 = Math.min(185, W * 0.15), ch2 = Math.round(cw2 * 1.24);
        var span = Math.min(W * 0.80, 1100);   // 부채 전체 폭(양끝 카드 중심 간)
        var cy = H * 0.40, curve = H * 0.16;   // 가운데가 높고 양끝이 내려오는 호
        for (var j = 0; j < n; j++) {
          var t = j / (n - 1) - 0.5;
          out.push({
            x: W / 2 + t * span - cw2 / 2,
            y: cy + t * t * 4 * curve - ch2 / 2,
            w: cw2, h: ch2,
            rot: t * 54 // 부채살 기울기: 왼쪽 -27° ~ 오른쪽 +27°
          });
        }
      }
      return out;
    }

    function beginSpit(now) {
      mode = "spit";
      setMouth(true);
      squashT = 0.3;
      mouthCloseAt = now + 1100;
      word.style.opacity = "0";
      setTimeout(function () { if (word.style.opacity === "0") word.style.visibility = "hidden"; }, 520);
      var h = el.offsetHeight;
      var mouthX = x + CHAR_W * MOUTH_FX;
      var mouthY = groundY() - h + h * MOUTH_FY;
      var kids = Array.prototype.slice.call(cont.children);
      var tg = targets();
      cards = kids.map(function (k, i) {
        k.style.pointerEvents = "none";
        k.style.opacity = "0";
        k.style.transition = "none";
        k.style.width = tg[i].w + "px";
        k.style.height = tg[i].h + "px";
        k.style.zIndex = String(5 + i); // 나중 카드가 위로 겹치게
        k._fin = null;
        if (!k._hb) {
          k._hb = true;
          k.addEventListener("mouseenter", function () {
            if (!this._fin) return;
            this.style.zIndex = "99";
            this.style.transform = "translate(" + this._fin.x + "px," + (this._fin.y - 14) + "px) rotate(0deg) scale(1.06)";
          });
          k.addEventListener("mouseleave", function () {
            if (!this._fin) return;
            this.style.zIndex = this._fin.z;
            this.style.transform = "translate(" + this._fin.x + "px," + this._fin.y + "px) rotate(" + this._fin.rot + "deg)";
          });
        }
        var t0 = Date.now() + 80 + i * 70; // 왼쪽부터 한 장씩 챠라라락
        var tcx = tg[i].x + tg[i].w / 2, tcy = tg[i].y + tg[i].h / 2;
        return {
          el: k, x: mouthX - tg[i].w / 2, y: mouthY - tg[i].h / 2,
          // 제 슬롯을 향해 위로 크게 포물선을 그리며 세차게 날아감(딜링 느낌)
          vx: (tcx - mouthX) * 3.3, vy: (tcy - mouthY) * 3.3 - 620,
          rot: (Math.random() - 0.5) * 30, vr: (Math.random() - 0.5) * 560,
          rotF: tg[i].rot, z: 5 + i,
          tx: tg[i].x, ty: tg[i].y, t0: t0, t1: t0 + 300,
          fx: 0, fy: 0, frot: 0, done: false
        };
      });
      cards.forEach(function (p) { p.fx = p.x; p.fy = p.y; });
    }

    function tick(now, dt) {
      var W = window.innerWidth;
      var minX = 20, maxX = W - CHAR_W - 20;

      if (mode === "run") {
        var cx = centerX();
        dir = cx > x ? 1 : -1;
        if (Math.abs(cx - x) <= RUN_SPEED * dt + 14) { x = cx; beginSpit(now); }
        else x += dir * RUN_SPEED * dt;
      } else if (mode === "idle") {
        if (isMobile()) {
          x = centerX(); gait = "stand"; dir = 1;
          setMouth(true); // 모바일은 늘 정면
        } else {
          setMouth(false);
          if (now > gaitUntil) pickGait(now);
          var sp = gait === "dash" ? 400 : gait === "walk" ? WALK_SPEED : 0;
          x += dir * sp * dt;
          if (x > maxX) { x = maxX; dir = -1; gait = "walk"; gaitUntil = now + 600; }
          if (x < minX) { x = minX; dir = 1; gait = "walk"; gaitUntil = now + 600; }
        }
      }
      if (mode === "spit" && now > mouthCloseAt) mode = "cards";

      var g = mode === "run" ? "run" : (mode === "idle" ? gait : "stand");
      var moving = g === "run" || g === "walk" || g === "dash";
      var wf = g === "run" ? 15 : g === "dash" ? 13 : 7;
      var ph = now / 1000 * wf;
      var rock = g === "run" ? Math.sin(ph) * 6
               : g === "dash" ? Math.sin(ph) * 7
               : g === "walk" ? Math.sin(ph) * 4
               : Math.sin(now / 1000 * 1.4) * 1.2;
      var lean = g === "run" ? 8 : g === "dash" ? 6 : 0; // 달릴 땐 앞으로 기울기
      var hop = (g === "run" || g === "dash") ? Math.abs(Math.sin(ph)) * 3 : 0;
      var step = moving ? Math.sin(ph * 2) * 0.012 : 0;
      var y = groundY() - el.offsetHeight - hop;
      var sx = 1, sy = 1;
      if (squashT > 0) {
        squashT -= dt;
        var k = Math.sin((1 - squashT / 0.3) * Math.PI) * 0.2;
        sx = 1 + k; sy = 1 - k;
      }
      el.style.transform = "translate(" + x + "px, " + y + "px)";

      // 토성 글로우 + 광원 기준 그림자(방향·거리 따라 위치/크기 변화)
      var sat = saturnPos();
      var gs = sat.r * 2.9; // 토성 자체만 살짝 밝게
      glow.style.width = gs + "px"; glow.style.height = gs + "px";
      glow.style.transform = "translate(" + (sat.x - gs / 2) + "px," + (sat.y - gs / 2) + "px)";
      var ccx = x + CHAR_W / 2;
      var dN = (ccx - sat.x) / W; // 토성 기준 좌우 거리(-: 토성이 오른쪽)
      var sw2 = CHAR_W * (0.74 + Math.min(0.5, Math.abs(dN)) * 0.6) * (1 - hop / 40);
      var sh2 = sw2 * 0.17;
      shad.style.width = sw2 + "px"; shad.style.height = sh2 + "px";
      shad.style.opacity = String(0.94 - Math.min(0.3, Math.abs(dN) * 0.45) - hop / 30);
      var dC = Math.max(-0.6, Math.min(0.6, dN)); // 화면 밖 광원일 때 과하게 밀리지 않게
      shad.style.transform = "translate(" + (ccx + dC * 110 - sw2 / 2) + "px," + (groundY() - sh2 / 2 - 3) + "px)";

      // 전경 로켓(고브럽 2배 크기 — 타고 온 우주선): 발밑 라인에 심어두기
      var ow = isMobile() ? 110 : 245, oh = ow * 1.438;
      var ox = isMobile() ? Math.min(W * 0.72, W - ow - 6) : W * 0.70;
      obj.style.width = ow + "px";
      obj.style.transform = "translate(" + ox + "px," + (groundY() + 16 - oh) + "px) rotate(-3deg)";

      var face = (mode === "spit" || mode === "cards") ? 1 : dir;
      img.style.transformOrigin = "50% 100%";
      img.style.transform = "rotate(" + (rock + lean) + "deg) scaleX(" + (face * (sx + step)) + ") scaleY(" + (sy - step) + ")";

      for (var i = 0; i < cards.length; i++) {
        var p = cards[i];
        if (p.done || now < p.t0) continue;
        var kEl = p.el;
        kEl.style.opacity = "1";
        if (now < p.t1) {
          p.vx *= Math.pow(0.02, dt); p.vy *= Math.pow(0.02, dt);
          p.x += p.vx * dt; p.y += p.vy * dt;
          p.rot += p.vr * dt;
          var sc = 0.3 + 0.25 * (1 - (p.t1 - now) / (p.t1 - p.t0));
          kEl.style.transform = "translate(" + p.x + "px, " + p.y + "px) rotate(" + p.rot + "deg) scale(" + sc + ")";
          p.fx = p.x; p.fy = p.y; p.frot = p.rot;
        } else {
          var u = Math.min(1, (now - p.t1) / 440);
          var e = 1 + 2.6 * Math.pow(u - 1, 3) + 1.6 * Math.pow(u - 1, 2);   // 크기 오버슈트
          var eb = 1 + 3.2 * Math.pow(u - 1, 3) + 2.2 * Math.pow(u - 1, 2);  // 회전 오버슈트(휙-탁)
          var eo = 1 - Math.pow(1 - u, 3);
          var xx = p.fx + (p.tx - p.fx) * eo, yy = p.fy + (p.ty - p.fy) * eo;
          var sc2 = Math.max(0.2, 0.5 + 0.5 * e);
          var rot2 = p.frot + (p.rotF - p.frot) * eb; // 최종 기울기를 지나쳤다 되돌아오며 착지
          kEl.style.transform = "translate(" + xx + "px, " + yy + "px) rotate(" + rot2 + "deg) scale(" + sc2 + ")";
          if (u >= 1) {
            kEl.style.transform = "translate(" + p.tx + "px, " + p.ty + "px) rotate(" + p.rotF + "deg)";
            kEl.style.transition = "transform .18s, box-shadow .15s";
            kEl.style.pointerEvents = "auto";
            kEl._fin = { x: p.tx, y: p.ty, rot: p.rotF, z: String(p.z) };
            p.done = true;
          }
        }
      }
    }

    var hintIdx = 0;
    setInterval(function () {
      if (!hint || hint.style.display === "none") return;
      hintIdx = (hintIdx + 1) % HINTS.length;
      hint.style.transition = "none";
      hint.style.opacity = "0";
      hint.textContent = HINTS[hintIdx];
      setTimeout(function () {
        hint.style.transition = "opacity .25s";
        hint.style.opacity = "1";
      }, 60);
    }, 2600);

    el.addEventListener("click", function () {
      if (mode === "run" || mode === "spit") return;
      if (mode === "cards") {
        for (var i = 0; i < cards.length; i++) { cards[i].el.style.opacity = "0"; cards[i].el.style.pointerEvents = "none"; }
        cards = [];
        word.style.visibility = "visible"; word.style.opacity = "1";
        mode = "idle"; gaitUntil = 0;
        setMouth(isMobile());
        if (hint) hint.style.display = ""; // 돌아오면 멘트 다시
        return;
      }
      if (hint) hint.style.display = "none";
      if (isMobile()) { beginSpit(Date.now()); } // 모바일은 그 자리에서 바로
      else mode = "run";
    });

    function loop() {
      var now = Date.now();
      window.requestAnimationFrame(loop);
      var dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      try { tick(now, dt); } catch (e) {}
    }
    window.requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
