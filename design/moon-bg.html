<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>달 배경 시안 8종 (선택용)</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #10222b; color: #e8ecdf; font-family: 'Jua', sans-serif; padding: 30px 16px 70px; }
    .top { max-width: 1180px; margin: 0 auto 24px; text-align: center; }
    .top h1 { font-size: 1.5rem; color: #f2e2ac; }
    .top p { color: #9db4ba; font-size: .94rem; margin-top: 8px; line-height: 1.7; }
    .grid { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
    figure { background: #0c1a21; border: 1px solid #24404b; border-radius: 14px; overflow: hidden; }
    figure .bgwrap { position: relative; aspect-ratio: 16/9; background-size: cover;
      background-position: center; cursor: zoom-in; }
    /* 배경 위에 글이 얹힌 모습 미리보기 */
    figure .demo { position: absolute; left: 18px; top: 16px; text-shadow: 0 2px 10px rgba(10,30,40,.55); }
    figure .demo b { display: block; font-size: 1.15rem; color: #fdf7e3; }
    figure .demo span { font-size: .78rem; color: #e6ead2; opacity: .9; }
    figcaption { padding: 10px 14px 13px; font-size: .86rem; color: #9db4ba; }
    figcaption b { color: #f2e2ac; }
    #lb { position: fixed; inset: 0; background: rgba(5,12,16,.95); display: none; align-items: center;
      justify-content: center; z-index: 99; cursor: zoom-out; padding: 14px; }
    #lb.on { display: flex; } #lb img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="top">
    <h1>🌕 달 배경 시안 8종</h1>
    <p>레트로 그레인 · 청록 하늘 · 크림색 달 표면 — HTML 배경용 16:9.<br>
       각 칸의 왼쪽 위 글씨는 배경 위에 텍스트가 얹혔을 때의 가독성 미리보기입니다. 눌러서 크게 보세요.</p>
  </div>
  <div class="grid" id="grid"></div>
  <div id="lb"><img id="lbi" alt=""></div>
  <script>
    var NOTES = {
      1: "언덕 능선 + 크레이터 근경 — 원본 감성에 제일 가까움",
      2: "낮은 지평선, 하늘이 넓음 — 텍스트 얹기 좋음",
      3: "부드러운 능선 두 겹 — 차분한 톤",
      4: "크레이터 디테일 강조",
      5: "토성 + 별똥별 — 포인트 있는 하늘",
      6: "짙은 하늘 + 토성 원경",
      7: "미니멀 지평선 — 가장 여백이 큼",
      8: "별밭이 풍성한 버전"
    };
    var g = document.getElementById("grid");
    for (var i = 1; i <= 8; i++) {
      var f = document.createElement("figure");
      f.innerHTML = '<div class="bgwrap" data-src="img/moon-' + i + '.webp" style="background-image:url(img/moon-' + i + '.webp)">' +
        '<div class="demo"><b>goblub</b><span>배경 가독성 미리보기</span></div></div>' +
        '<figcaption><b>' + i + '번</b> · ' + NOTES[i] + '</figcaption>';
      g.appendChild(f);
    }
    var lb = document.getElementById("lb"), lbi = document.getElementById("lbi");
    document.querySelectorAll(".bgwrap").forEach(function (w) {
      w.addEventListener("click", function () { lbi.src = w.getAttribute("data-src"); lb.classList.add("on"); });
    });
    lb.addEventListener("click", function () { lb.classList.remove("on"); lbi.src = ""; });
  </script>
</body>
</html>
