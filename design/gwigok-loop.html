<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>귀곡 대기 루프 시안 3종 (선택용)</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0c0a10; color: #ddd4e6; font-family: 'Jua', sans-serif; padding: 30px 16px 70px; }
    .top { max-width: 1080px; margin: 0 auto 22px; text-align: center; }
    .top h1 { font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 1.4rem; color: #ffd9a0; }
    .top p { color: #9a8ba8; font-size: .93rem; margin-top: 8px; line-height: 1.7; }
    .grid { max-width: 1080px; margin: 0 auto; display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    figure { background: #16121e; border: 1px solid #2e2438; border-radius: 14px; overflow: hidden; }
    figure video { display: block; width: 100%; aspect-ratio: 9/16; object-fit: cover; background: #000; }
    figcaption { padding: 11px 13px 14px; font-size: .86rem; color: #b7aba0; line-height: 1.6; }
    figcaption b { color: #ffd9a8; font-family: 'Nanum Myeongjo', serif; font-size: .95rem; }
  </style>
</head>
<body>
  <div class="top">
    <h1>귀곡 대기 루프 시안 3종</h1>
    <p>이름·생년월일 적는 동안 맞은편에 앉아 있는 귀곡 —<br>끝부분을 시작부분에 겹쳐 잇는 방식으로 향·양초 연기까지 흐름이 끊기지 않는 무한 루프입니다. 반복 재생 중이니 연기 흐름을 직접 확인해 보세요.</p>
  </div>
  <div class="grid">
    <figure>
      <video src="img/gwigok-loop-a.mp4?v=3" autoplay muted loop playsinline></video>
      <figcaption><b>1 · 자연 테이크</b><br>보통 사람처럼 빠르게 감았다 뜨는 깜빡임 + 조용한 숨쉬기. 손은 명부 위에 그대로. 연기는 계속 흐름.</figcaption>
    </figure>
    <figure>
      <video src="img/gwigok-loop-b.mp4?v=3" autoplay muted loop playsinline></video>
      <figcaption><b>2 · 자연 테이크</b><br>같은 지시의 다른 테이크 — 깜빡임 타이밍과 숨의 리듬이 다름. 비교해서 더 자연스러운 쪽으로.</figcaption>
    </figure>
    <figure>
      <video src="img/gwigok-loop-c.mp4?v=3" autoplay muted loop playsinline></video>
      <figcaption><b>3 · 자연 테이크</b><br>세 번째 테이크. 셋 다 과장된 동작 없이 "그냥 앉아서 기다리는 사람"에 맞춘 버전.</figcaption>
    </figure>
  </div>
</body>
</html>
