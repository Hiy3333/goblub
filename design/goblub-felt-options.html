<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>펠트 고브럽 — 꼬리 왼쪽 + 구슬 중간 시안 4종</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #14101c; color: #ddd4e6; font-family: 'Jua', sans-serif; padding: 30px 16px 70px; }
    .top { max-width: 900px; margin: 0 auto 22px; text-align: center; }
    .top h1 { font-size: 1.4rem; color: #cbb7ff; }
    .top p { color: #9a8ba8; font-size: .93rem; margin-top: 8px; line-height: 1.7; }
    .grid { max-width: 900px; margin: 0 auto; display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    figure { background: #fff; border-radius: 16px; overflow: hidden; border: 1px solid #322842; }
    figure img { display: block; width: 100%; aspect-ratio: 1/1; object-fit: contain; cursor: zoom-in; }
    figcaption { padding: 10px 12px 12px; font-size: .9rem; color: #453a60; background: #f3effc; }
    figcaption b { color: #6a4fd8; font-size: 1.02rem; }
    #lb { position: fixed; inset: 0; background: rgba(8,5,14,.95); display: none; align-items: center;
      justify-content: center; z-index: 99; cursor: zoom-out; padding: 16px; }
    #lb.on { display: flex; } #lb img { max-width: 100%; max-height: 100%; border-radius: 10px; background:#fff; }
  </style>
</head>
<body>
  <div class="top">
    <h1>펠트 고브럽 — 꼬리 왼쪽 · 구슬은 꼬리 중간</h1>
    <p>번호로 골라주세요. 고르면 누끼 따서 이계 스토리에 바로 적용합니다.</p>
  </div>
  <div class="grid">
    <figure><img src="img/felt-opt-1.webp" alt="1"><figcaption><b>1번</b> · 완만한 곡선, 꼬리 끝이 아래로</figcaption></figure>
    <figure><img src="img/felt-opt-2.webp" alt="2"><figcaption><b>2번</b> · 낮은 S곡선, 구슬이 몸 옆에 딱 붙음</figcaption></figure>
    <figure><img src="img/felt-opt-3.webp" alt="3"><figcaption><b>3번</b> · 끝이 돌돌 말린 꼬리 + 양팔 늘어짐</figcaption></figure>
    <figure><img src="img/felt-opt-4.webp" alt="4"><figcaption><b>4번</b> · 끝이 돌돌 말린 꼬리, 높이 올라감</figcaption></figure>
  </div>
  <div id="lb"><img id="lbi" alt=""></div>
  <script>
    var lb=document.getElementById("lb"),lbi=document.getElementById("lbi");
    document.querySelectorAll(".grid img").forEach(function(im){
      im.addEventListener("click",function(){lbi.src=im.src;lb.classList.add("on");});
    });
    lb.addEventListener("click",function(){lb.classList.remove("on");lbi.src="";});
  </script>
</body>
</html>
