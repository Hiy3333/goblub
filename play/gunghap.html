<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리 별자리 — goblub</title>
<meta name="description" content="두 사람의 사주에서 별을 꺼내 하나로 이어, 세상에 없던 별자리를 만들어 드려요 — 점수 대신 별자리 하나" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
<style>
:root{
  --sky:#0b1626; --sky2:#132436; --ink:#e8f0fb; --ink-soft:#9fb2c9;
  --gold:#ffe6a8; --line:rgba(160,190,225,.22);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sky);color:var(--ink);
  font-family:'Jua','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(90,140,200,.20), transparent 60%),
    radial-gradient(90% 60% at 50% 110%, rgba(40,80,120,.28), transparent 60%)}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 16px 44px}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 6px}
.topbar a{color:var(--ink-soft);text-decoration:none;font-size:.92rem}
.topbar .t{font-size:1.05rem;letter-spacing:1px}
.topbar .sp{width:44px}

.screen{display:none}
.screen.on{display:block}

/* ── 들머리 ── */
.lead{text-align:center;padding:18px 6px 4px}
.lead h1{margin:0 0 8px;font-size:1.72rem;letter-spacing:1px;
  text-shadow:0 0 18px rgba(150,190,255,.35)}
.lead p{margin:0;color:var(--ink-soft);font-size:.94rem;line-height:1.75}

.order{margin-top:18px;background:rgba(18,34,52,.72);border:1px solid var(--line);
  border-radius:18px;padding:16px 15px 18px;
  box-shadow:0 14px 34px rgba(0,10,24,.45), inset 0 1px 0 rgba(255,255,255,.06)}
.order h2{margin:0 0 3px;font-size:1.08rem}
.order .sub{margin:0 0 14px;color:var(--ink-soft);font-size:.83rem}
.who{margin-bottom:12px}
.who h3{margin:0 0 7px;font-size:.94rem;color:var(--gold);font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:6px}
.row select,.row input{flex:1 1 auto;min-width:74px;padding:9px 8px;border-radius:10px;
  background:#0e1c2c;color:var(--ink);border:1px solid var(--line);
  font-family:inherit;font-size:.9rem}
.row input{max-width:74px}
.gobtn{width:100%;margin-top:6px;padding:14px;border:0;border-radius:14px;cursor:pointer;
  font-family:inherit;font-size:1.05rem;color:#16243a;
  background:linear-gradient(180deg,#ffeec2,#ffd98a);
  box-shadow:0 10px 24px rgba(255,215,140,.22)}
.gobtn:active{transform:translateY(1px)}
.errmsg{display:none;margin:10px 0 0;color:#ff9d8a;font-size:.86rem;text-align:center}
.fine{margin:12px 0 0;color:#6f8299;font-size:.76rem;text-align:center;line-height:1.7}

/* ── 하늘 ── */
.sky{position:relative;margin-top:10px;border-radius:20px;overflow:hidden;
  border:1px solid var(--line);background:#08111e;
  box-shadow:0 18px 40px rgba(0,8,20,.5)}
.sky canvas{display:block;width:100%;height:auto}
.skycap{position:absolute;left:0;right:0;bottom:12px;text-align:center;
  color:var(--ink-soft);font-size:.84rem;opacity:0;transition:opacity .5s}
.skycap.on{opacity:1}

/* ── 결과 ── */
.panel{opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease}
.panel.on{opacity:1;transform:none}
.title{text-align:center;margin:20px 0 4px}
.title .nm{font-size:1.62rem;letter-spacing:1px;
  text-shadow:0 0 22px rgba(160,200,255,.4)}
.title .sb{margin-top:6px;color:var(--gold);font-size:.95rem}
.magbar{display:flex;align-items:center;justify-content:center;gap:9px;margin:14px 0 2px}
.magbar b{font-size:1.12rem;color:var(--gold);font-weight:400}
.magbar span{color:var(--ink-soft);font-size:.86rem}
.obs{text-align:center;color:#8fa8c4;font-size:.85rem;margin:8px 0 0;line-height:1.7}

.card{margin-top:16px;background:rgba(18,34,52,.66);border:1px solid var(--line);
  border-radius:16px;padding:14px 15px}
.card h4{margin:0 0 6px;font-size:.9rem;color:var(--gold);font-weight:400}
.card p{margin:0;font-size:.93rem;line-height:1.85;color:#dbe6f5}
.card+.card{margin-top:10px}

.pairbox{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px}
.pill{background:rgba(18,34,52,.66);border:1px solid var(--line);border-radius:13px;
  padding:9px 13px;text-align:center;min-width:112px}
.pill b{display:block;font-size:.78rem;color:var(--ink-soft);font-weight:400}
.pill span{display:block;margin-top:3px;font-size:.95rem}
.pill i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;
  vertical-align:middle;box-shadow:0 0 8px currentColor;background:currentColor}

.detail{margin-top:10px}
.dl{display:flex;gap:10px;padding:11px 13px;background:rgba(18,34,52,.5);
  border:1px solid var(--line);border-radius:13px;margin-top:8px}
.dl .k{flex:0 0 62px;color:var(--gold);font-size:.85rem}
.dl .v{flex:1;font-size:.87rem;line-height:1.75;color:#cfdcec}

.namebox{margin-top:14px;background:rgba(40,32,60,.6);border:1px solid rgba(190,170,255,.28);
  border-radius:16px;padding:14px 15px;text-align:center}
.namebox p{margin:0 0 10px;font-size:.9rem;color:#d9cffb;line-height:1.75}
.namebox input{width:100%;padding:11px;border-radius:11px;background:#141127;color:var(--ink);
  border:1px solid rgba(190,170,255,.3);font-family:inherit;font-size:1rem;text-align:center}

.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btnrow button,.btnrow a{flex:1 1 46%;padding:12px;border:1px solid var(--line);
  border-radius:13px;background:rgba(18,34,52,.7);color:var(--ink);cursor:pointer;
  font-family:inherit;font-size:.93rem;text-align:center;text-decoration:none}
.btnrow .main{flex:1 1 100%;border:0;color:#16243a;
  background:linear-gradient(180deg,#ffeec2,#ffd98a)}
#st-status{margin:12px 0 0;text-align:center;color:var(--ink-soft);font-size:.86rem}
#st-text{display:none;margin-top:12px;background:rgba(18,34,52,.66);border:1px solid var(--line);
  border-radius:16px;padding:14px 15px;font-size:.92rem;line-height:1.9;
  color:#dbe6f5;white-space:pre-wrap}
#st-text .hd{display:block;margin:12px 0 4px;color:var(--gold)}
#st-text .hd:first-child{margin-top:0}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="fortune-hub.html">← 운세</a>
    <span class="t">✧ 우리 별자리</span>
    <span class="sp"></span>
  </div>

  <!-- ① 들머리 + 입력 -->
  <div class="screen on" id="scIntro">
    <div class="lead">
      <h1>우리 별자리</h1>
      <p>두 사람의 사주에서 별을 꺼내 하나로 잇습니다.<br />점수 대신, 세상에 없던 별자리 하나가 남습니다.</p>
    </div>

    <div class="order">
      <h2>✦ 관측 신청서</h2>
      <p class="sub">두 분의 생일을 적어 주시면 그 밤하늘을 그려 드려요</p>
      <div class="who">
        <h3>나</h3>
        <div class="row">
          <select id="a-year"></select><select id="a-month"></select><select id="a-day"></select>
          <select id="a-hour"><option value="">시 몰라요</option></select>
          <input type="number" id="a-min" min="0" max="59" value="0" aria-label="분" />
        </div>
      </div>
      <div class="who">
        <h3>그 사람</h3>
        <div class="row">
          <select id="b-year"></select><select id="b-month"></select><select id="b-day"></select>
          <select id="b-hour"><option value="">시 몰라요</option></select>
          <input type="number" id="b-min" min="0" max="59" value="0" aria-label="분" />
        </div>
      </div>
      <button class="gobtn" id="btn-go">✦ 오늘 밤 하늘 펴 보기</button>
      <p class="errmsg" id="err"></p>
      <p class="fine">두 분의 정보는 이 브라우저에서만 계산되고 저장되지 않아요.</p>
    </div>
  </div>

  <!-- ② 하늘 + 결과 -->
  <div class="screen" id="scSky">
    <div class="sky">
      <canvas id="cv" width="720" height="680"></canvas>
      <p class="skycap" id="skycap">별을 잇는 중…</p>
    </div>

    <div class="panel" id="panel">
      <div class="title">
        <div class="nm" id="r-name"></div>
        <div class="sb" id="r-sub"></div>
      </div>
      <div class="magbar"><b id="r-mag"></b><span id="r-magt"></span></div>
      <p class="obs" id="r-obs"></p>

      <div class="pairbox" id="r-pair"></div>

      <div class="card"><h4>이 배열이 말하는 것</h4><p id="r-desc"></p></div>
      <div class="card"><h4>흐려지기 쉬운 곳</h4><p id="r-care"></p></div>

      <div class="namebox" id="r-namebox" style="display:none">
        <p>이 배열은 어떤 성도(星圖)에도 없습니다.<br />이름은 두 분이 지어 주세요.</p>
        <input type="text" id="r-nameinput" maxlength="14" placeholder="○○○자리" />
      </div>

      <div class="detail" id="r-detail"></div>

      <div class="btnrow">
        <button class="main" id="btn-report">✦ 이 하늘을 더 오래 보기</button>
        <button id="btn-save">⬇ 별자리 저장</button>
        <button id="btn-retry">↺ 다른 사람과</button>
      </div>
      <p id="st-status" style="display:none"></p>
      <div id="st-text"></div>
      <div class="btnrow">
        <a href="letter.html">💌 이 마음 배달하기</a>
        <a href="fortune-hub.html">✧ 다른 운세 보기</a>
      </div>
    </div>
  </div>
</div>

<script src="../js/common.js?v=6" data-root=".."></script>
<script src="js/saju.js"></script>
<script src="js/gunghap.js?v=2"></script>
<script src="js/stars.js?v=1"></script>
<script src="js/dosa.js?v=2"></script>
<script src="js/feed.js?v=4"></script>
<script>
var $=function(id){return document.getElementById(id);};
var scIntro=$("scIntro"), scSky=$("scSky"), cv=$("cv"), ctx=cv.getContext("2d");
var data=null, last=null, star=null, anim=null;

/* ── 입력 ── */
function fillSelects(p){
  var y=$(p+"-year"), m=$(p+"-month"), d=$(p+"-day"), h=$(p+"-hour"), now=new Date().getFullYear();
  for(var i=now;i>=1930;i--) y.add(new Option(i+"년", i));
  for(var j=1;j<=12;j++) m.add(new Option(j+"월", j));
  for(var k=1;k<=31;k++) d.add(new Option(k+"일", k));
  for(var t=0;t<24;t++) h.add(new Option(("0"+t).slice(-2)+"시", t));
  y.value=1995; m.value=1; d.value=1;
}
fillSelects("a"); fillSelects("b");

function readBirth(p){
  var y=+$(p+"-year").value, m=+$(p+"-month").value, d=+$(p+"-day").value;
  var hv=$(p+"-hour").value, mi=+($(p+"-min").value||0);
  var dt=new Date(y,m-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d) return null;
  var b={y:y,m:m,d:d};
  if(hv!==""){ b.hour=+hv; b.min=Math.max(0,Math.min(59,mi)); }
  return b;
}
function showErr(msg){ var e=$("err"); e.textContent=msg; e.style.display="block"; }

fetch("data/saju-terms.json").then(function(r){ if(!r.ok) throw 0; return r.json(); })
  .then(function(d){ data=d; })
  .catch(function(){ showErr("성도를 못 펼쳤어요. 새로고침 해주세요."); });

$("btn-go").onclick=function(){
  $("err").style.display="none";
  if(!data){ showErr("성도를 못 펼쳤어요. 새로고침 해주세요."); return; }
  var ba=readBirth("a"), bb=readBirth("b");
  if(!ba||!bb){ showErr("없는 날짜가 있어요. 다시 확인해 주세요!"); return; }
  var rA=Saju.compute(data,ba,{trueSolar:true}), rB=Saju.compute(data,bb,{trueSolar:true});
  var s=Gunghap.score(rA,rB);
  last={rA:rA,rB:rB,ba:ba,bb:bb,s:s};
  star=Stars.pick(s,rA,rB);
  if(window.GoblubFeed) GoblubFeed.grant("gunghap");
  reveal();
};

/* ── 하늘 그리기 ────────────────────────────────────────────── */
var PAD=58, NAMEZONE=88;                      // 아래 NAMEZONE 은 이름이 앉는 자리
function px(n){ return PAD + n*(cv.width -PAD*2); }
function py(n){ return PAD + n*(cv.height-PAD-NAMEZONE); }

// 배경 잔별 — 별자리마다 늘 같은 자리에 뜨도록 씨앗 고정
function bgStars(seed){
  var s=seed*9301+49297, out=[];
  for(var i=0;i<130;i++){
    s=(s*9301+49297)%233280;
    var x=(s/233280)*cv.width;
    s=(s*9301+49297)%233280;
    var y=(s/233280)*cv.height;
    s=(s*9301+49297)%233280;
    out.push([x,y,(s/233280)*1.5+0.4]);
  }
  return out;
}
var BG=[];

function clamp(v){ return v<0?0:v>1?1:v; }

function drawSky(t, withPlate){
  var W=cv.width, H=cv.height;
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0a1524"); g.addColorStop(.55,"#0d1c2e"); g.addColorStop(1,"#08111c");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  var rg=ctx.createRadialGradient(W*.5,H*.42,10,W*.5,H*.42,W*.72);
  rg.addColorStop(0,"rgba(80,130,190,.16)"); rg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);

  var fade=clamp(t/700);
  ctx.save(); ctx.globalAlpha=fade*.75;
  BG.forEach(function(b){
    ctx.fillStyle="#cfe0f5"; ctx.beginPath(); ctx.arc(b[0],b[1],b[2],0,6.283); ctx.fill();
  });
  ctx.restore();

  if(!star) return;
  var pts=star.pts, links=star.links;
  function X(p){ return px(star.flip ? 1-p[0] : p[0]); }
  function Y(p){ return py(p[1]); }

  // 별 등장 타이밍 — A 먼저, B 나중
  var order=[];
  pts.forEach(function(p,i){ order.push({i:i,side:p[2]}); });
  order.sort(function(a,b){ return a.side-b.side || a.i-b.i; });
  var T0=600, STEP=130, DUR=420;
  var appear=[];
  order.forEach(function(o,k){ appear[o.i]=T0+k*STEP; });
  var lastStar=T0+order.length*STEP+DUR;

  // 선 — 별이 다 뜬 뒤 차례로 이어진다
  var L0=lastStar+120, LSTEP=110, LDUR=300;
  ctx.lineCap="round";
  links.forEach(function(l,k){
    var p=clamp((t-(L0+k*LSTEP))/LDUR);
    if(p<=0) return;
    var a=pts[l[0]], b=pts[l[1]];
    var x1=X(a), y1=Y(a), x2=X(b), y2=Y(b);
    ctx.strokeStyle="rgba(174,206,244,.46)"; ctx.lineWidth=1.6;
    ctx.shadowColor="rgba(150,195,255,.55)"; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.moveTo(x1,y1);
    ctx.lineTo(x1+(x2-x1)*p, y1+(y2-y1)*p); ctx.stroke();
    ctx.shadowBlur=0;
  });

  // 별
  pts.forEach(function(p,i){
    var pr=clamp((t-appear[i])/DUR);
    if(pr<=0) return;
    var x=X(p), y=Y(p), big=p[3];
    var col=p[2]===0?star.colorA:star.colorB;
    var r=(big?7.5:4.6)*(0.6+0.4*pr);
    var tw=1+0.06*Math.sin((t+i*700)/520);      // 잔잔한 반짝임
    ctx.save(); ctx.globalAlpha=pr;
    ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=(big?30:18)*tw;
    ctx.beginPath(); ctx.arc(x,y,r*tw,0,6.283); ctx.fill();
    ctx.shadowBlur=0;
    if(big){                                     // 큰 별엔 십자 광채
      ctx.strokeStyle=col; ctx.globalAlpha=pr*.5; ctx.lineWidth=1.1;
      ctx.beginPath();
      ctx.moveTo(x-r*3.2,y); ctx.lineTo(x+r*3.2,y);
      ctx.moveTo(x,y-r*3.2); ctx.lineTo(x,y+r*3.2); ctx.stroke();
    }
    ctx.restore();
  });

  // 이름
  var lastLink=L0+links.length*LSTEP+LDUR;
  var np=clamp((t-lastLink-100)/700);
  if(np>0 || withPlate){
    var a=withPlate?1:np;
    var nm=(star.naming && last && last.customName) ? last.customName : star.name;
    ctx.save(); ctx.globalAlpha=a; ctx.textAlign="center";
    ctx.fillStyle="#f3f7ff"; ctx.shadowColor="rgba(150,195,255,.7)"; ctx.shadowBlur=18;
    ctx.font="34px Jua, 'Malgun Gothic', sans-serif";
    ctx.fillText(nm, cv.width/2, cv.height-52);
    ctx.shadowBlur=0; ctx.fillStyle="#a8bdd6";
    ctx.font="17px Jua, 'Malgun Gothic', sans-serif";
    ctx.fillText(star.sub, cv.width/2, cv.height-24);
    ctx.restore();
  }
  return lastLink+900;
}

function reveal(){
  scIntro.classList.remove("on"); scSky.classList.add("on");
  window.scrollTo(0,0);
  BG=bgStars(star.idx+7);
  $("skycap").textContent="별을 잇는 중…";
  $("skycap").classList.add("on");
  $("panel").classList.remove("on");
  var t0=Date.now(), done=false;
  if(anim) cancelAnimationFrame(anim);
  (function loop(){
    var t=Date.now()-t0;
    var endAt=drawSky(t);
    if(!done && endAt && t>endAt){ done=true; fillPanel(); }
    anim=requestAnimationFrame(loop);
  })();
}

/* ── 결과 채우기 ── */
var OHN={목:"나무",화:"불",토:"흙",금:"쇠",수:"물"};
function fillPanel(){
  var s=last.s, T=Gunghap.TEXTS;
  $("r-name").textContent=star.name;
  $("r-sub").textContent=star.sub;
  $("r-mag").textContent=star.mag+"등성";
  $("r-magt").textContent="· "+star.magText;
  $("r-obs").textContent=star.obsText;
  $("r-desc").textContent=star.desc;
  $("r-care").textContent=star.care;

  var tA=Saju.pillarText(last.rA.pillars.day), tB=Saju.pillarText(last.rB.pillars.day);
  $("r-pair").innerHTML=
    '<div class="pill"><b>나의 별</b><span style="color:'+star.colorA+'"><i></i>'+
      tA.hanja+'</span><b style="margin-top:3px">'+OHN[star.ohA]+' 빛 · '+last.rA.zodiac+'띠</b></div>'+
    '<div class="pill"><b>그 사람의 별</b><span style="color:'+star.colorB+'"><i></i>'+
      tB.hanja+'</span><b style="margin-top:3px">'+OHN[star.ohB]+' 빛 · '+last.rB.zodiac+'띠</b></div>';

  $("r-detail").innerHTML=
    dl("두 빛", T.ilgan[s.ilgan.type])+
    dl("이어짐", T.ilji[s.ilji.type])+
    dl("채움", T.oheng[s.oheng.type])+
    dl("띠", T.tti[s.tti.type]);

  var nb=$("r-namebox");
  nb.style.display = star.naming ? "block" : "none";
  if(star.naming){
    var inp=$("r-nameinput");
    inp.value="";
    inp.oninput=function(){
      last.customName=inp.value.trim();
      $("r-name").textContent=last.customName || star.name;
    };
  }

  $("skycap").classList.remove("on");   // 캔버스 안에 이름이 뜨므로 안내문은 걷는다
  $("panel").classList.add("on");
}
function dl(k,v){ return '<div class="dl"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }

/* ── 저장 ── */
$("btn-save").onclick=function(){
  var plate=document.createElement("canvas");
  plate.width=cv.width; plate.height=cv.height+70;
  var p=plate.getContext("2d");
  drawSky(999999, true);
  p.fillStyle="#08111c"; p.fillRect(0,0,plate.width,plate.height);
  p.drawImage(cv,0,0);
  p.textAlign="center"; p.fillStyle="#7d93ad";
  p.font="19px Jua, 'Malgun Gothic', sans-serif";
  p.fillText(star.mag+"등성 · "+star.obsText, plate.width/2, cv.height+22);
  p.fillStyle="#5d738d";
  p.font="17px Jua, 'Malgun Gothic', sans-serif";
  p.fillText("goblub · 우리 별자리", plate.width/2, cv.height+50);
  var a=document.createElement("a");
  a.download="goblub-우리별자리.png";
  a.href=plate.toDataURL("image/png"); a.click();
};

$("btn-retry").onclick=function(){
  if(anim) cancelAnimationFrame(anim);
  scSky.classList.remove("on"); scIntro.classList.add("on");
  $("st-text").style.display="none"; $("st-status").style.display="none";
  $("btn-report").disabled=false;
  window.scrollTo(0,0);
};

/* ── 더 오래 보기 (AI 관측 기록) ── */
$("btn-report").onclick=function(){
  if(!last) return;
  var btn=this, txt=$("st-text"), st=$("st-status");
  btn.disabled=true; st.style.display="block"; st.textContent="✦ 별지기가 접안렌즈를 들여다보는 중…";
  txt.style.display="block"; txt.innerHTML="";
  var acc="";
  Dosa.fetchGunghap({
    a: Dosa.buildPayload(last.rA,last.ba,null,false),
    b: Dosa.buildPayload(last.rB,last.bb,null,false),
    score:{ total:last.s.total, grade:last.s.grade, ilgan:last.s.ilgan.type,
            ilji:last.s.ilji.type, oheng:last.s.oheng.type, tti:last.s.tti.type,
            constellation:star.name, sub:star.sub, mag:star.mag }
  },{
    onChunk:function(t){ acc+=t; txt.innerHTML=fmt(acc); },
    onDone:function(cached){ txt.innerHTML=fmt(acc);
      st.textContent=cached?"✦ (지난밤에 적어 둔 기록이에요)":"✦ 오늘 밤 관측, 여기까지입니다."; },
    onError:function(code,sec){
      txt.style.display="none";
      st.textContent = code==="not_configured" ? "관측소가 아직 문을 열지 않았어요. 곧 엽니다!" :
        code==="cooldown" ? "렌즈에 김이 서렸어요… "+sec+"초 뒤에 다시 불러 주세요." :
        "지금 관측 신청이 많아요. 잠시 후 다시 시도해 주세요.";
      btn.disabled=false;
    }
  });
};
function fmt(s){
  var out=s.replace(/</g,"&lt;");
  ["✦ 첫 관측","✦ 가장 밝은 지점","✦ 흐려지는 지점","✦ 다시 밝히는 법"].forEach(function(h){
    out=out.replace(h,'<span class="hd">'+h+'</span>');
  });
  return out;
}
</script>
