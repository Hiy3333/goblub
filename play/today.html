<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 사주 — goblub</title>
  <meta name="description" content="오늘의 간지와 기운, 그리고 내 사주로 보는 오늘의 총운·연애운·재물운·시험운" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=cl7" />
  <style>
    .profile-badge { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .profile-badge .who { font-size: 1.15rem; }
    .profile-badge .sub { color: var(--ink-soft); font-size: 0.9rem; }
    .luck-cta { margin-top: 12px; }
    .luck-cta a { display: inline-block; background: var(--cream); border: 1.5px solid var(--sky);
      border-radius: 999px; padding: 9px 18px; font-size: 0.95rem; color: var(--ink);
      box-shadow: 0 0 10px color-mix(in srgb, var(--sky) 30%, transparent); }
    .luck-cta a:hover { box-shadow: 0 0 18px var(--sky); }
    .luck-cta a.hot { border-color: var(--coral); box-shadow: 0 0 10px color-mix(in srgb, var(--coral) 35%, transparent); }
    .luck-cta a.hot:hover { box-shadow: 0 0 18px var(--coral); }
  </style>
</head>
<body class="clay">
  <div id="site-header"></div>
  <main>
    <section class="hero">
      <h1><span class="e">📅</span> 오늘의 사주</h1>
      <p id="date-label"></p>
    </section>

    <section class="panel">
      <h2>오늘의 간지</h2>
      <div class="pillar-grid" id="t-pillars" style="grid-template-columns:repeat(3,1fr)"></div>
      <p id="t-gan" style="line-height:1.7; margin-top:8px"></p>
      <p id="t-ji" style="line-height:1.7; margin-top:8px"></p>
    </section>

    <section class="panel">
      <h2>👍 오늘 하면 좋은 것</h2>
      <ul class="tag-list" id="t-good"></ul>
      <h2 style="margin-top:18px">⚠️ 오늘 조심할 것</h2>
      <ul class="tag-list" id="t-care"></ul>
    </section>

    <!-- 내 사주로 보는 오늘 운세 -->
    <section class="panel" id="input-panel">
      <h2>내 사주 프로필 (한 번만!)</h2>
      <p class="result-desc" style="margin-bottom:12px">생년월일을 넣으면 <b>오늘의 총운·연애·재물·시험운</b>까지 봐드려요.</p>
      <div class="field-row">
        <select id="in-year"></select>
        <select id="in-month"></select>
        <select id="in-day"></select>
        <select id="in-hour"><option value="">태어난 시 몰라요</option></select>
        <input type="number" id="in-min" min="0" max="59" value="0" aria-label="분" title="분(0~59)" style="width:62px" />
      </div>
      <div class="opt-row">
        <label><input type="radio" name="gender" value="" checked />성별 안 함</label>
        <label><input type="radio" name="gender" value="M" />남</label>
        <label><input type="radio" name="gender" value="F" />여</label>
        <span style="font-size:0.85rem">(성별은 대운·궁합 풀이에만 쓰여요)</span>
      </div>
      <button class="btn-primary" id="btn-go">프로필 저장하고 내 운세 보기</button>
      <p class="error-msg" id="err"></p>
      <p class="fine-print" style="text-align:left">프로필은 이 브라우저에만 저장돼요. 서버로 전송되지 않아요.</p>
    </section>

    <section class="panel" id="profile-panel" style="display:none">
      <div class="profile-badge">
        <div>
          <p class="who" id="p-who"></p>
          <p class="sub" id="p-sub"></p>
        </div>
        <button class="btn-ghost" id="btn-edit">수정</button>
      </div>
    </section>

    <div id="result-area" style="display:none">
      <section class="panel"><h2>🍀 오늘의 총운 <span class="stars" id="s-total"></span></h2><p class="result-desc" id="t-total"></p></section>
      <section class="panel"><h2>💘 오늘의 연애운 <span class="stars" id="s-love"></span></h2><p class="result-desc" id="t-love"></p><div class="luck-cta" id="cta-love"></div></section>
      <section class="panel"><h2>💰 오늘의 재물운 <span class="stars" id="s-money"></span></h2><p class="result-desc" id="t-money"></p><div class="luck-cta" id="cta-money"></div></section>
      <section class="panel"><h2>📚 오늘의 시험·집중운 <span class="stars" id="s-study"></span></h2><p class="result-desc" id="t-study"></p><div class="luck-cta" id="cta-study"></div></section>
      <section class="panel"><h2>📆 이번 달의 운세 <span class="stars" id="s-month"></span></h2><p class="result-desc" id="t-month"></p></section>
    </div>

    <p class="fine-print" id="t-err"></p>
  </main>
  <div id="site-footer"></div>
  <script src="../js/common.js?v=29" data-root=".."></script>
  <script src="js/saju.js"></script>
  <script src="js/fortune.js"></script>
  <script src="js/i18n-fortune.js?v=1"></script>
  <script src="js/profile.js"></script>
  <script src="js/feed.js?v=14"></script>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var tr = window.GoblubI18n ? GoblubI18n.t : function (s) { return s; };
      var GAN_RO = ["Gap","Eul","Byeong","Jeong","Mu","Gi","Gyeong","Sin","Im","Gye"];
      var JI_RO = ["Ja","Chuk","In","Myo","Jin","Sa","O","Mi","Sin","Yu","Sul","Hae"];
      var isKo = !window.GoblubI18n || GoblubI18n.lang === "ko";
      function gjText(p) { var t = Saju.pillarText(p); if (isKo) return t; return { hanja: t.hanja, hangul: GAN_RO[p[0]] + "-" + JI_RO[p[1]] }; }
      var data = null, now = new Date();
      $("date-label").textContent = tr("{Y}년 {M}월 {D}일, 오늘은 무슨 날?").replace("{Y}", now.getFullYear()).replace("{M}", now.getMonth() + 1).replace("{D}", now.getDate());

      var y = $("in-year"), m = $("in-month"), d = $("in-day"), h = $("in-hour");
      for (var i = 2100; i >= 1900; i--) y.add(new Option(tr("{N}년").replace("{N}", i), i));
      y.value = 1995;
      for (i = 1; i <= 12; i++) m.add(new Option(tr("{N}월").replace("{N}", i), i));
      for (i = 1; i <= 31; i++) d.add(new Option(tr("{N}일").replace("{N}", i), i));
      for (i = 0; i <= 23; i++) h.add(new Option(tr("{N}시").replace("{N}", i), i));

      function showErr(msg) { var e = $("err"); e.textContent = msg; e.style.display = "block"; }
      function stars(n) { return "★★★★★".slice(0, n) + "☆☆☆☆☆".slice(0, 5 - n); }
      function fillForm(p) {
        y.value = p.y; m.value = p.m; d.value = p.d;
        h.value = p.hour == null ? "" : p.hour;
        if (p.min) $("in-min").value = p.min;
        var g = document.querySelector('input[name="gender"][value="' + (p.gender || "") + '"]');
        if (g) g.checked = true;
      }

      // 오늘의 간지 — 프로필 없어도 항상 보인다
      function renderToday(dd) {
        var td = Fortune.todayGanji(dd, now);
        var roles = [[tr("오늘의 해"), td.pillars.year], [tr("이달"), td.pillars.month], [tr("오늘"), td.pillars.day]];
        var html = "";
        roles.forEach(function (pair) {
          var t = gjText(pair[1]);
          html += '<div class="pillar"><span class="role">' + pair[0] + '</span><span class="hanja">' + t.hanja +
            '</span><span class="hangul">' + t.hangul + "</span></div>";
        });
        $("t-pillars").innerHTML = html;
        var dt = Fortune.dayText(td);
        $("t-gan").textContent = "🌤️ " + tr(dt.gan);
        $("t-ji").textContent = tr(dt.ji);
        $("t-good").innerHTML = dt.dos.good.map(function (g) { return "<li>" + tr(g) + "</li>"; }).join("");
        $("t-care").innerHTML = dt.dos.care.map(function (c) { return "<li>" + tr(c) + "</li>"; }).join("");
      }

      // 내 사주로 보는 오늘 운세
      function showMine(birth) {
        var f = Fortune.get(data, birth, now);
        var meT = gjText(f.me.pillars.day);
        $("p-who").textContent = meT.hanja + " " + tr("{H}일주 · {Z}띠").replace("{H}", meT.hangul).replace("{Z}", tr(f.me.zodiac));
        $("p-sub").textContent = tr("{Y}년 {M}월 {D}일").replace("{Y}", birth.y).replace("{M}", birth.m).replace("{D}", birth.d) +
          (birth.hour != null ? " " + tr("{N}시").replace("{N}", birth.hour) : "") +
          (birth.gender === "M" ? tr(" · 남") : birth.gender === "F" ? tr(" · 여") : "") +
          " · " + tr(f.me.strength.label);
        $("s-total").textContent = stars(f.total.score); $("t-total").textContent = tr(f.total.text);
        $("s-love").textContent = stars(f.love.score); $("t-love").textContent = tr(f.love.text);
        $("s-money").textContent = stars(f.money.score); $("t-money").textContent = tr(f.money.text);
        $("s-study").textContent = stars(f.study.score); $("t-study").textContent = tr(f.study.text);
        $("s-month").textContent = stars(f.month.score); $("t-month").textContent = tr(f.month.text);

        function luckCta(id, score, hotLabel, mildLabel, url) {
          var hot = score >= 4;
          $(id).innerHTML = '<a href="' + url + '"' + (hot ? ' class="hot"' : "") + ">" +
            tr(hot ? hotLabel : mildLabel) + " →</a>";
        }
        luckCta("cta-money", f.money.score,
          "💰 재물운 만렙! 이 기세로 고브럽 로또 번호 뽑으러 가기",
          "🍀 재물운은 워밍업 중 — 로또 번호나 미리 찜해두기", "lotto.html");
        luckCta("cta-love", f.love.score,
          "💌 설렘 폭발! 마음 배달로 데이트 신청 보내기",
          "💌 오늘은 표현이 서툰 날 — 마음 배달로 슬쩍 진심 전하기", "letter.html");
        luckCta("cta-study", f.study.score,
          "🕳️ 집중력 만렙! 감정 몬스터 팡팡으로 컨디션 확인하러 가기",
          "🕳️ 집중이 흐트러진 날 — 팡팡 한 판으로 머리 환기하기", "whack.html");

        $("input-panel").style.display = "none";
        $("profile-panel").style.display = "block";
        $("result-area").style.display = "block";
        if (window.GoblubFeed) GoblubFeed.grant("fortune");
      }

      fetch("data/saju-terms.json")
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (dd) {
          data = dd;
          renderToday(dd);
          if (window.GoblubFeed) GoblubFeed.grant("today");
          var p = GoblubProfile.get();
          if (p) { fillForm(p); showMine(p); }
        })
        .catch(function () { $("t-err").textContent = tr("데이터를 불러오지 못했어요. 새로고침 해주세요."); });

      $("btn-go").onclick = function () {
        $("err").style.display = "none";
        if (!data) { showErr(tr("데이터를 불러오지 못했어요. 새로고침 해주세요.")); return; }
        var yy = +y.value, mm = +m.value, dd2 = +d.value;
        var date = new Date(yy, mm - 1, dd2);
        if (date.getFullYear() !== yy || date.getMonth() !== mm - 1 || date.getDate() !== dd2) {
          showErr(tr("없는 날짜예요. 다시 확인해주세요!")); return;
        }
        var gender = document.querySelector('input[name="gender"]:checked').value;
        var min = h.value === "" ? 0 : Math.min(59, Math.max(0, +($("in-min").value || 0)));
        var birth = { y: yy, m: mm, d: dd2, hour: h.value === "" ? null : +h.value, min: min, gender: gender };
        GoblubProfile.set(birth);
        showMine(birth);
      };

      $("btn-edit").onclick = function () {
        $("result-area").style.display = "none";
        $("profile-panel").style.display = "none";
        $("input-panel").style.display = "block";
      };
    })();
  </script>
</body>
</html>
