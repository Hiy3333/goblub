<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미니 놀이터 2 — goblub</title>
  <meta name="description" content="감정 몬스터 팡팡·반응속도·로또·밸런스 게임 — 손맛으로 노는 미니 게임 모음" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=cl1" />
  <style>
    /* 남색 밤+분홍 진주달+바다 배경 — 뷰포트 고정 레이어 */
    body.clay { background: #131c3e !important; }
    body.clay::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: url("../design/img/home-bg-27.webp") center bottom / cover no-repeat;
    }
    /* 카드 팔레트 — Daring Indigo → Plum Perfect (전 페이지 공통) */
    body.clay .card[class*="tint-"]:nth-child(5n+1) { background: linear-gradient(180deg, #4b5d8f, #374874) !important; }
    body.clay .card[class*="tint-"]:nth-child(5n+2) { background: linear-gradient(180deg, #5768ab, #445397) !important; }
    body.clay .card[class*="tint-"]:nth-child(5n+3) { background: linear-gradient(180deg, #6f7ec2, #5868ae) !important; }
    body.clay .card[class*="tint-"]:nth-child(5n+4) { background: linear-gradient(180deg, #b78bc3, #a475b1) !important; }
    body.clay .card[class*="tint-"]:nth-child(5n+5) { background: linear-gradient(180deg, #c7a1d5, #b48ac2) !important; }
    body.clay .card { border: 3px solid rgba(255, 255, 255, .22) !important; }
    body.clay .card h2 { color: #fff; }
    body.clay .card p { color: #e4dff4; }
    body.clay .card .icon { background: rgba(255, 255, 255, .92); border-radius: 50%; padding: 6px; }
    body.clay a.card:hover, body.clay .card[data-href]:hover { border-color: rgba(255, 255, 255, .5) !important; }
    body.clay .hero h1 {
      background: none; -webkit-background-clip: initial; background-clip: initial; color: #ffe9df;
      filter: none; text-shadow: 0 3px 0 rgba(14, 18, 46, .6), 0 10px 24px rgba(0, 0, 0, .55);
    }
    body.clay .hero p { color: #f0e7ef; text-shadow: 0 2px 8px rgba(8, 12, 36, .75); }
    body.clay .fine-print { color: #d8d3e8; text-shadow: 0 1px 6px rgba(8, 12, 36, .7); }
    /* 홈과 동일한 크롬: 히어로·푸터 제거, 데스크톱은 로고만 중앙, 행성 클릭 메뉴 */
    main .hero { display: none; }
    main .fine-print { display: none; }
    body.clay .site-footer { display: none !important; }
    @media (min-width: 701px) {
      body.clay .site-nav { display: none; }
      /* 홈 헤더와 완전 동일: 다크 틸 반투명 알약, 상단 16px 고정, 로고 1.7rem */
      body.clay .site-header {
        position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
        z-index: 30; width: auto; max-width: none; margin: 0; padding: 10px 26px;
        background: rgba(10, 16, 22, .38); border-radius: 999px; /* 홈과 동일한 중립 반투명 */
        box-shadow: 0 10px 26px rgba(0, 20, 30, .35), inset 0 1px 0 rgba(255, 255, 255, .14);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      }
      body.clay .logo { font-size: 1.7rem; letter-spacing: 2px; display: flex; }
      body.clay .logo span { text-shadow: 0 1px 2px rgba(90, 100, 170, .25); }
      main { padding-top: 90px; }
    }
    /* 행성 실루엣에서 만든 빛 — 행성 바로 바깥이 그 모양대로 빛난다 */
    :root { --plc: 255, 194, 214; }
    .pl-hot { position: fixed; z-index: 40; border-radius: 50%; cursor: pointer; }
    .pl-ring { position: fixed; z-index: 3; pointer-events: none;
      background: url("../design/img/glow-mini2.png") center / 100% 100% no-repeat;
      animation: plRing 2.6s ease-in-out infinite; }
    @keyframes plRing {
      0%, 100% { opacity: .5; transform: scale(.985); }
      50% { opacity: 1; transform: scale(1.04); }
    }
    .pl-hot:hover ~ .pl-ring, .pl-ring.hot { animation-duration: 1.1s; }
    .pl-menu { position: fixed; z-index: 41; display: none; flex-direction: column; gap: 10px; align-items: flex-end; }
    .pl-menu.on { display: flex; }
    .pl-menu a { display: flex; align-items: center; gap: 10px; background: linear-gradient(180deg, #f9f0d4, #efe3bd);
      color: #235a6b !important; padding: 11px 20px; border-radius: 14px; border: 3px solid rgba(29, 90, 107, .25);
      box-shadow: 0 10px 22px rgba(0, 22, 32, .45); font-size: 1.05rem; white-space: nowrap;
      opacity: 0; transform: translateX(60px) rotate(6deg); }
    .pl-menu.on a { animation: plDeal .4s cubic-bezier(.3, 1.35, .6, 1) forwards; }
    .pl-menu.on a:nth-child(2) { animation-delay: .1s; }
    .pl-menu.on a:nth-child(3) { animation-delay: .2s; }
    @keyframes plDeal { to { opacity: 1; transform: none; } }
    /* 데스크톱: 카드가 홈과 동일한 부채꼴로 촤라락 */
    @media (min-width: 701px) {
      body.fanmode main { max-width: none; padding: 0; }
      body.fanmode .card-grid { display: block; margin: 0; max-width: none; }
      body.fanmode .card-grid .card {
        position: fixed; left: 0; top: 0; margin: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
        text-align: center; border-radius: 18px; padding: 12px; box-sizing: border-box;
        will-change: transform; transform-origin: center; overflow: hidden;
      }
      body.fanmode .card .icon { font-size: 2.2rem; }
      body.fanmode .card h2 { font-size: 1.45rem; line-height: 1.18; margin: 0; max-width: 100%;
        word-break: keep-all; overflow-wrap: anywhere; }
      body.fanmode .card p { font-size: .9rem; line-height: 1.4; padding: 0 6px; margin: 0; max-width: 100%;
        word-break: keep-all; overflow-wrap: anywhere;
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
      /* 카드가 많은 페이지(미니 9장)는 글자를 조금 줄여 넘침 방지 */
      body.fanmode.dense .card .icon { font-size: 1.85rem; }
      body.fanmode.dense .card h2 { font-size: 1.24rem; }
      body.fanmode.dense .card p { font-size: .82rem; }
    }
    /* 카테고리 카드 뽕뽕 등장 */
    .card-grid .card { opacity: 0; }
    .card-grid .card.pop { animation: gbPop .5s cubic-bezier(.3, 1.6, .55, 1) forwards; }
    .card-grid .card.shown { opacity: 1; }
    @keyframes gbPop {
      0% { opacity: 0; transform: scale(.35); }
      65% { opacity: 1; transform: scale(1.08); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="clay">
  <div id="site-header"></div>
  <main>
    <section class="hero">
      <h1>🕹 미니 놀이터 2</h1>
      <p>손맛으로 노는 미니 게임 모음</p>
    </section>

    <section class="card-grid">
      <a class="card tint-sky" href="whack.html">
        <span class="icon">🕳️</span>
        <h2>감정 몬스터 팡팡</h2>
        <p>튀어나오는 몬스터를 팡팡! 극악 난이도 30초 점수전 🔥</p>
      </a>
      <a class="card tint-mint" href="reflex.html">
        <span class="icon">⚡</span>
        <h2>고브럽 반응속도</h2>
        <p>초록불에 0.001초라도 빨리 탭! 함정 조심 — 순발력 등급전</p>
      </a>
      <a class="card tint-coral" href="lotto.html">
        <span class="icon">🎱</span>
        <h2>고브럽 로또 번호 뱉기</h2>
        <p>고브럽이 행운 번호를 하나씩 뱉어줌 — 재미로 뽑는 랜덤!</p>
      </a>
      <a class="card tint-mint" href="balance.html">
        <span class="icon">⚖️</span>
        <h2>밸런스 게임</h2>
        <p>극한의 양자택일 12연속 — 너라면 어느 쪽?</p>
      </a>
    </section>

    <p class="fine-print" style="margin-top:24px">가볍게 즐겨주세요 🙂</p>
  </main>
  <div id="site-footer"></div>
  <script src="../js/common.js?v=6" data-root=".."></script>
  <script src="js/hub-fan.js?v=2" data-root=".."></script>
  <script>
    // 행성 클릭 메뉴(홈과 동일) — 데스크톱 전용
    (function () {
      if (window.innerWidth < 701) return;
      var hot = document.createElement("div"); hot.className = "pl-hot";
      var menu = document.createElement("div"); menu.className = "pl-menu";
      var loggedIn = false;
      try { var u = JSON.parse(localStorage.getItem("goblub_user")); loggedIn = !!(u && u.sub); } catch (e) {}
      menu.innerHTML = '<a href="../index.html"><span>🌙</span>홈으로</a>' +
        '<a href="#" data-soon="📱 앱은 아직 준비 중이에요!"><span>📱</span>앱 다운로드</a>' +
        '<a href="../mypage.html"><span>' + (loggedIn ? "👤" : "🔑") + '</span>' + (loggedIn ? "마이페이지" : "로그인") + '</a>';
      var ring = document.createElement("div"); ring.className = "pl-ring";
      document.body.appendChild(ring);
      document.body.appendChild(hot); document.body.appendChild(menu);
      hot.addEventListener("mouseenter", function () { ring.classList.add("hot"); });
      hot.addEventListener("mouseleave", function () { ring.classList.remove("hot"); });
      // 배경(::before, fixed inset:0)과 완전히 같은 박스를 실측해 좌표 기준으로 삼는다
      var vp = document.createElement("div");
      vp.style.cssText = "position:fixed;inset:0;pointer-events:none;visibility:hidden";
      document.body.appendChild(vp);
      var SAT = { w: 1376, h: 768, x: 1151, y: 190, r: 45, rx: 78, ry: 78 }; // 발광 박스(행성 중심 ±78) · 클릭 반경 45
      function place() {
        var vb = vp.getBoundingClientRect();
        var W = vb.width, H = vb.height;
        var s = Math.max(W / SAT.w, H / SAT.h);
        var x = vb.left + (W - SAT.w * s) / 2 + SAT.x * s, y = vb.top + H - SAT.h * s + SAT.y * s;
        var d = SAT.r * s * 2.3;
        hot.style.width = d + "px"; hot.style.height = d + "px";
        hot.style.left = (x - d / 2) + "px"; hot.style.top = (y - d / 2) + "px";
        var rw = SAT.rx * 2 * s, rh = SAT.ry * 2 * s;   // 행성 테두리에 딱 맞는 발광 링
        ring.style.width = rw + "px"; ring.style.height = rh + "px";
        ring.style.left = (x - rw / 2) + "px"; ring.style.top = (y - rh / 2) + "px";
        menu.style.left = Math.min(x + SAT.r * s * 0.4, W - 190) + "px";
        menu.style.top = (y + d / 2 + 14) + "px";
      }
      place(); window.addEventListener("resize", place);
      setInterval(place, 1000); // 스크롤바 등 늦은 레이아웃 변화 자가 보정
      if (/ringdebug/.test(location.search)) hot.style.boxShadow = "0 0 0 3px rgba(255,240,190,.9), 0 0 20px rgba(255,220,150,.6)";
      hot.addEventListener("click", function () {
        if (menu.classList.contains("on")) menu.classList.remove("on");
        else { menu.classList.remove("on"); void menu.offsetWidth; menu.classList.add("on"); }
      });
      document.addEventListener("click", function (ev) {
        if (!menu.classList.contains("on")) return;
        if (hot.contains(ev.target) || menu.contains(ev.target)) return;
        menu.classList.remove("on");
      });
    })();
  </script>
</body>
</html>
