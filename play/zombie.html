<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>좀비 아포칼립스 생존 유형 — goblub</title>
  <meta name="description" content="10가지 상황으로 보는 나의 좀비 아포칼립스 생존 유형 — 리더·전투·살림꾼·은둔·배신·첫날사망" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=cl7" />
  <style>
    .z-tag { text-align:center; color:#35c98a; font-size:1.02rem; margin:2px 0 10px; }
    .z-surv { display:flex; align-items:center; gap:10px; max-width:340px; margin:0 auto 12px; }
    .z-surv span { font-size:.85rem; color:var(--ink-soft); flex:none; }
    .z-surv b { font-size:1.05rem; flex:none; }
    .z-bar { flex:1; height:12px; border-radius:999px; background:rgba(0,0,0,.12); overflow:hidden; }
    .z-bar i { display:block; height:100%; border-radius:999px;
      background:linear-gradient(90deg,#35c98a,#3a8bff); }
    .z-traits { max-width:420px; margin:12px auto 4px; padding:0; list-style:none; text-align:left; }
    .z-traits li { position:relative; padding-left:24px; margin:7px 0; line-height:1.6; font-size:.95rem; }
    .z-traits li::before { content:"🧟"; position:absolute; left:0; font-size:.85rem; }
    .z-item { text-align:center; margin:10px 0 2px; font-size:.95rem; }
    .z-chemi { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:12px 0 4px; }
    .z-chemi span { background:rgba(53,201,138,.1); border:1px solid rgba(53,201,138,.35);
      border-radius:999px; padding:7px 14px; font-size:.88rem; }
  </style>
</head>
<body class="clay">
  <div id="site-header"></div>
  <main>
    <section class="panel"><div id="quiz"></div></section>
  </main>
  <div id="site-footer"></div>
  <script src="../js/common.js?v=24" data-root=".."></script>
  <script src="js/feed.js?v=10"></script>
  <script src="js/quiz.js?v=4"></script>
  <script src="js/sharecard.js"></script>
  <script>
    var TYPES = {
      leader:   { emoji:"🛡️", name:"인간 내비게이션 리더형", short:"리더", tag:"패닉? 그건 제 담당이 아닌데요", surv:87, item:"확성기 (없으면 목청)",
        desc:"세상이 뒤집힌 순간에도 혼자 침착하게 동선을 짜고 있는 타입. 다들 당신 뒤통수만 보고 따라 걷는데, 정작 본인 밥이랑 잠은 제일 뒤로 미루는 게 최대 리스크입니다.",
        traits:["단톡 공지 쓰는 속도가 재난문자보다 빠름","「일단 진정하고」가 시그니처 대사","본인 컨디션은 항상 담당자 부재중"],
        match:"supplier", clash:"traitor" },
      fighter:  { emoji:"🪓", name:"프라이팬 전투민족형", short:"전투", tag:"말보다 스윙이 빠름", surv:74, item:"이모님 프라이팬 (28cm 이상)",
        desc:"위협 감지 즉시 몸이 먼저 나가는 타입. 무리의 방패를 자처하는 든든함이 무기지만, 가끔은 프라이팬보다 머리를 먼저 쓰는 연습이 필요합니다. 좀비보다 문틀에 부딪혀 다칠 확률이 더 높음.",
        traits:["헬스장 3대 운동이 드디어 빛을 보는 순간","도망 루트보다 정면 루트를 먼저 검토","전투 후 「별거 아니네」 (손 떨면서)"],
        match:"leader", clash:"hermit" },
      supplier: { emoji:"🎒", name:"인간 편의점 살림꾼형", short:"살림꾼", tag:"말만 해, 가방에서 나오니까", surv:91, item:"27칸 수납 배낭",
        desc:"물·식량·보조배터리·상비약까지 야무지게 갖춘 진짜 생존 실세. 다들 당신 가방만 믿고 다니는데, 정작 본인 몫은 늘 제일 적게 챙기는 게 유일한 버그입니다. 아포칼립스 최고 연봉 직군.",
        traits:["재난 나기 전부터 이미 반쯤 준비돼 있었음","「그거 나한테 있어」 발동 확률 99%","물물교환 시세를 혼자 다 꿰고 있음"],
        match:"leader", clash:"traitor" },
      hermit:   { emoji:"🏚️", name:"자발적 무인도 은둔형", short:"은둔", tag:"인류보다 와이파이가 그리움", surv:83, item:"자물쇠 3종 세트",
        desc:"무리 생활보다 혼자가 백배 편한 타입. 아무도 못 찾는 안전가옥을 귀신같이 발굴하고 조용히 오래 살아남습니다. 다만 세상이 복구된 뒤에도 3주쯤 더 은둔하다가 뉴스 보고 나올 예정.",
        traits:["집순이/집돌이 경력이 곧 생존 스펙","기척 지우기 패시브 스킬 보유","가끔 사람 목소리가 그리워서 라디오 켬"],
        match:"supplier", clash:"fighter" },
      traitor:  { emoji:"🔪", name:"생존 지상주의 계산형", short:"계산", tag:"미안, 근데 나는 살아야겠어", surv:96, item:"혼자만 아는 지도",
        desc:"위기의 순간 손익 계산이 제일 빠른 타입. 생존율은 전 유형 1위지만, 사태가 끝난 뒤 동창회 참석률은 전 유형 꼴찌가 될 예정입니다. 당신과 같은 조가 된 사람들에게 미리 심심한 위로를 전합니다.",
        traits:["비상구 위치를 무의식적으로 먼저 확인","「우리」보다 「나」가 0.3초 빠름","살아남고 나서 사과문 초안 작성 중"],
        match:"firstday", clash:"supplier" },
      firstday: { emoji:"💀", name:"호기심 만렙 첫날사망형", short:"첫날사망", tag:"그래도 궁금한 건 궁금한 거잖아", surv:3, item:"유서 겸 브이로그 카메라",
        desc:"사이렌이 울리면 숨는 게 아니라 창문부터 여는 타입. 「진짜 좀비인지 눈으로 봐야 믿지」라는 실증주의 정신이 이번 생에서만큼은 수명을 크게 단축시킵니다. 대신 당신이 남긴 영상은 인류의 귀중한 자료가 될 것입니다.",
        traits:["재난 영상 항상 제일 앞에서 찍는 사람","「에이 설마」가 마지막 유언 유력 후보","전생에 고양이었다면 이미 9번 다 씀"],
        match:"traitor", clash:"leader" }
    };
    var ORDER = ["leader","fighter","supplier","hermit","traitor","firstday"];

    var QUESTIONS = [
      { q: "새벽 3시, 커뮤에 「우리 동네 좀비 실화냐」 글이 실검 1위. 창밖에서 진짜 「우어어…」 소리가 들린다.", choices: [
        { text: "창문 열고 직접 확인 + 세로 영상 촬영. 「와 미쳤다 이거 실화임?」", scores: { firstday: 2 } },
        { text: "가족톡·친구톡에 즉시 행동지침 전파. 「1. 문 잠가 2. 불 꺼 3. 톡 확인」", scores: { leader: 2 } },
        { text: "프라이팬 들고 현관 앞 1인 방어선 구축", scores: { fighter: 2 } },
        { text: "조용히 소등 + 커튼 클로즈. 오늘부로 이 집은 빈집이다", scores: { hermit: 2 } } ] },

      { q: "단톡 3개가 동시에 폭발 중 — 가족톡 47, 친구톡 213, 과톡/회사톡 89. 뭐부터 하지?", choices: [
        { text: "과톡에 집결지·시간 공지 박고 고정. 「이견 있으면 3분 안에」", scores: { leader: 2 } },
        { text: "각 톡방에 준비물 리스트 전송 — 물 2L, 보조배터리, 상비약…", scores: { supplier: 2 } },
        { text: "전부 읽씹하고 조용히 혼자 짐 싸는 중. 단체행동은 느리다", scores: { traitor: 2 } },
        { text: "친구톡에 「ㄹㅇ?ㅋㅋ」 보내고 구경하러 나갈 채비", scores: { firstday: 2 } } ] },

      { q: "대피소에서 마지막 남은 보조배터리 1개. 옆 생존자도 폰 배터리 3%다.", choices: [
        { text: "「팔씨름으로 정하죠」 (소매 걷으며 이미 이긴 표정)", scores: { fighter: 2 } },
        { text: "상대가 한눈판 사이에… 어? 내 주머니에 있네?", scores: { traitor: 2 } },
        { text: "양보한다. 그리고 가방에서 태양광 충전기를 꺼낸다", scores: { supplier: 2 } },
        { text: "「전 괜찮아요」 — 어차피 연락 올 사람 없음", scores: { hermit: 2 } } ] },

      { q: "무법지대 된 편의점, 사실상 합법 약탈 타임. 너의 장바구니는?", choices: [
        { text: "물·통조림·건전지 — 동선 최적화로 3분 컷 스윕", scores: { supplier: 2 } },
        { text: "과자 코너에서 신상 발견. 「어? 이거 나온 거 몰랐는데」 시식 중", scores: { firstday: 2 } },
        { text: "우산·야구방망이·프라이팬 — 무기 코너(원래는 생활용품 코너)만 털음", scores: { fighter: 2 } },
        { text: "직접 안 담음. 남들이 담은 카트에서 필요한 것만 회수 예정", scores: { traitor: 2 } } ] },

      { q: "일행 중 한 명의 팔에 수상한 자국. 본인은 「모기 물린 거야!」라고 주장 중.", choices: [
        { text: "「확인만 하자. 규칙대로.」 침착하게 검사 절차 진행", scores: { leader: 2 } },
        { text: "구급상자 들고 접근. 「일단 소독부터 하자, 응?」", scores: { supplier: 2 } },
        { text: "그 사람 뒤쪽 자리로 조용히 이동 + 프라이팬 스탠바이", scores: { fighter: 2 } },
        { text: "그날 밤 짐 싸서 조용히 단독 이탈. 쪽지도 안 남김", scores: { hermit: 2 } } ] },

      { q: "인플루언서가 옥상에서 「좀비 챌린지」를 찍고 있다. 좀비들이 계단으로 올라가는 중.", choices: [
        { text: "「저거 찍히면 대박이다」 나도 옆 건물 옥상으로 이동", scores: { firstday: 2 } },
        { text: "확성기 들고 「그 건물 즉시 대피하세요!」 방송", scores: { leader: 2 } },
        { text: "저 사람 장비… 삼각대랑 짐벌 좋은 거 쓰네. 이따 챙겨야지", scores: { traitor: 2 } },
        { text: "관심 없음. 그 시간에 은신처 2중 잠금장치 보강", scores: { hermit: 2 } } ] },

      { q: "생존자 캠프 도착. 돌아가며 자기소개 겸 역할 지원 시간이다.", choices: [
        { text: "「동선 짜고 인원 관리하겠습니다」 — 어느새 화이트보드 앞에 서 있음", scores: { leader: 2 } },
        { text: "「야간 경비 서겠습니다」 (프라이팬 들어 보이며)", scores: { fighter: 2 } },
        { text: "「물자 관리요. 참고로 지금 재고표 이미 만들었습니다」", scores: { supplier: 2 } },
        { text: "「정찰 담당 하겠습니다」 (사실 그냥 구경 다니고 싶음)", scores: { firstday: 2 } } ] },

      { q: "구조 헬기 등장! 남은 좌석은 1개, 우리 일행은 4명.", choices: [
        { text: "「미안!」 …소리가 들릴 땐 이미 탑승 완료", scores: { traitor: 2 } },
        { text: "제일 약한 사람 태워 보내고 손 흔들어줌", scores: { leader: 2 } },
        { text: "「헬기? 난 저거 안 믿어.」 걸어서 살아남는 길 선택", scores: { hermit: 2 } },
        { text: "타는 사람 주머니에 비상식량 쑤셔 넣어 보냄", scores: { supplier: 2 } } ] },

      { q: "폐허가 된 거리에서 좀비가 된 절친(혹은 전 애인)과 눈이 마주쳤다.", choices: [
        { text: "「야… 나 기억나?」 한 발짝 다가가며 말 걸어봄", scores: { firstday: 2 } },
        { text: "눈 질끈 감고 스윙. 「미안… 이게 내 방식의 작별인사야」", scores: { fighter: 2 } },
        { text: "눈 마주치기 전에 이미 옆 골목으로 증발한 상태", scores: { hermit: 2 } },
        { text: "천천히 뒷걸음질하며 다른 좀비들 쪽으로 유인… 미안", scores: { traitor: 2 } } ] },

      { q: "6개월 뒤, 생존자 다큐멘터리에 내가 나왔다. 화면 아래 소개 자막은?", choices: [
        { text: "「프라이팬의 전설 — 좀비 격퇴 137회」", scores: { fighter: 2 } },
        { text: "「목격담만 존재하는 유령 생존자」", scores: { hermit: 2 } },
        { text: "「1화에서 하차 (시청자 여러분이 많이 우셨습니다)」", scores: { firstday: 2 } },
        { text: "「전국 생존 캠프를 먹여 살린 물류왕」", scores: { supplier: 2 } } ] }
    ];

    function renderResult(totals, el, api) {
      var key = Quiz.top(totals, ORDER);
      var r = TYPES[key];
      var fr = TYPES[r.match], en = TYPES[r.clash];
      el.innerHTML =
        '<span class="result-emoji">' + r.emoji + "</span>" +
        '<p class="result-name">' + r.name + "</p>" +
        '<p class="z-tag">“' + r.tag + '”</p>' +
        '<div class="z-surv"><span>생존 확률</span>' +
          '<div class="z-bar"><i style="width:' + r.surv + '%"></i></div><b>' + r.surv + '%</b></div>' +
        '<p class="result-desc">' + r.desc + "</p>" +
        '<ul class="z-traits">' + r.traits.map(function (t) { return "<li>" + t + "</li>"; }).join("") + '</ul>' +
        '<p class="z-item">🎒 생존 필수템 — <b>' + r.item + '</b></p>' +
        '<div class="z-chemi">' +
          '<span>🤝 같은 조 하고 싶은 <b>' + fr.emoji + ' ' + fr.short + '형</b></span>' +
          '<span>💥 같은 조 되면 대환장 <b>' + en.emoji + ' ' + en.short + '형</b></span>' +
        '</div>' +
        '<div id="card-slot"></div>' +
        '<div class="result-actions">' +
        '<button class="btn-primary" id="qz-retry">다시하기</button>' +
        '<button class="btn-ghost" id="qz-share">링크 복사</button></div>';
      el.querySelector("#card-slot").appendChild(ShareCard.render({
        palette: "mint", emoji: r.emoji, badge: "좀비 생존 유형", title: r.name,
        lines: ["“" + r.tag + "”", "생존 확률 " + r.surv + "%", "필수템: " + r.item]
      }));
      el.querySelector("#qz-retry").onclick = api.restart;
      el.querySelector("#qz-share").onclick = function () { api.shareLink(el.querySelector("#qz-share")); };
      if (window.GoblubFeed && GoblubFeed.record) GoblubFeed.record("zombie", { emoji: r.emoji, title: (r.short || r.name), tags: r.traits });
    }

    Quiz.init(document.getElementById("quiz"), {
      emoji: "🧟", title: "좀비 아포칼립스 생존 유형",
      intro: "새벽 3시, 실검 1위 「좀비 실화냐」. 세상이 뒤집혔다. 이 아수라장에서 너는 며칠 버틸 인간일까?",
      feedSrc: "zombie", questions: QUESTIONS, renderResult: renderResult
    });
  </script>
</body>
</html>
