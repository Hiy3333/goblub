<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>단톡방 캐릭터 테스트 — goblub</title>
  <meta name="description" content="10가지 상황으로 보는 나의 단톡방 캐릭터 — 도배왕·잠수함·드립러·눈팅유령·공지봇·이모티콘 장인" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=cl7" />
  <style>
    .ct-tag { text-align:center; color:#3a8bff; font-size:1.02rem; margin:2px 0 10px; }
    .ct-share { display:flex; align-items:center; gap:10px; max-width:340px; margin:0 auto 12px; }
    .ct-share span { font-size:.85rem; color:var(--ink-soft); flex:none; }
    .ct-share b { font-size:1.05rem; flex:none; }
    .ct-bar { flex:1; height:12px; border-radius:999px; background:rgba(0,0,0,.12); overflow:hidden; }
    .ct-bar i { display:block; height:100%; border-radius:999px;
      background:linear-gradient(90deg,#3a8bff,#8f5bff); }
    .ct-traits { max-width:420px; margin:12px auto 4px; padding:0; list-style:none; text-align:left; }
    .ct-traits li { position:relative; padding-left:24px; margin:7px 0; line-height:1.6; font-size:.95rem; }
    .ct-traits li::before { content:"💬"; position:absolute; left:0; font-size:.85rem; }
    .ct-item { text-align:center; margin:10px 0 2px; font-size:.95rem; }
    .ct-chemi { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:12px 0 4px; }
    .ct-chemi span { background:rgba(58,139,255,.1); border:1px solid rgba(58,139,255,.35);
      border-radius:999px; padding:7px 14px; font-size:.88rem; }
  </style>
</head>
<body class="clay">
  <div id="site-header"></div>
  <main>
    <section class="panel"><div id="quiz"></div></section>
  </main>
  <div id="site-footer"></div>
  <script src="../js/common.js?v=30" data-root=".."></script>
  <script src="js/feed.js?v=14"></script>
  <script src="js/quiz.js?v=6"></script>
  <script src="js/sharecard.js?v=3"></script>
  <script src="js/i18n-chatroom.js?v=1"></script>
  <script>
    var TYPES = {
      dobae:  { emoji:"🌊", name:"새벽 감성 도배왕", short:"도배왕", tag:"답장 안 와도 나는 보낸다", share:68, reply:"3초 (자다가도 답장 옴)",
        desc:"밤 12시가 넘는 순간 시인·철학자·연애상담가로 각성하는 타입. 아침에 스크롤 올려보고 본인이 제일 놀라지만, 이 방이 아직 안 죽은 건 8할이 이 사람 덕분입니다.",
        traits:["혼자 5연속 톡 보내고 혼자 대답까지 함","새벽 2시 감성 최대 출력, 아침엔 이불킥","방이 3시간 조용하면 생존 확인 톡 발사"], match:"drip", clash:"jamsu", keys:["새벽감성폭발","5연속톡","알림지옥제조기"] },
      jamsu:  { emoji:"🤿", name:"읽씹 잠수함", short:"잠수함", tag:"읽긴 했어, 답장을 못 했을 뿐", share:4, reply:"3일 (컨디션 좋으면 이틀)",
        desc:"읽음 1은 사라졌는데 답장은 없는 미스터리의 주인공. 안 읽은 게 아니라 「뭐라고 보내지」 고민하다 타이밍을 놓쳤을 뿐입니다. 그리고 3일 뒤 「아까 그거 말인데」로 부활하는 능력자.",
        traits:["답장 쓰다 지우기를 7번 반복하다 포기","알림 999+가 기본 세팅","급한 일은 전화로 와야 움직임"], match:"ghost", clash:"dobae", keys:["읽고답장못함","3일뒤부활","알림999+"] },
      drip:   { emoji:"🎤", name:"드립 폭격기", short:"드립러", tag:"웃기면 이기는 거야", share:31, reply:"0.3초 (드립 각 한정)",
        desc:"무슨 말이 나와도 3초 안에 드립으로 받아치는 국가대표급 반사신경. 죽은 방도 살려내는 심폐소생 전문의지만, 진지한 얘기가 시작되면 갑자기 조용해지는 게 특징입니다.",
        traits:["드립 각 보이면 시험 기간에도 참전","반응 없으면 조용히 메시지 삭제 고민","진지 모드 진입 시 갑자기 프로필만 구경"], match:"dobae", clash:"notice", keys:["3초반사신경","드립각채굴","진지모드취약"] },
      ghost:  { emoji:"👻", name:"눈팅만 하는 유령", short:"눈팅유령", tag:"나 여기 있는 거 아무도 모르지?", share:0.5, reply:"답장 대신 읽음",
        desc:"존재감은 제로지만 사실 이 방의 모든 역사를 꿰고 있는 관찰자. 몇 주에 한 번 이모티콘으로 생존 신고하고, 결정적인 순간에만 나타나 핵심 한 줄을 남기고 사라집니다.",
        traits:["대화 내용은 누구보다 정확하게 알고 있음","나가기 버튼 앞에서 3년째 고민 중","실물로 만나면 제일 말 많은 반전 보유"], match:"jamsu", clash:"drip", keys:["존재감제로","다보고있음","나가기3년고민"] },
      notice: { emoji:"📢", name:"단톡방 총무 공지봇", short:"공지봇", tag:"공지 확인하면 1 눌러줘", share:22, reply:"정시 정각",
        desc:"약속 날짜·장소·회비·지도 링크까지 풀세팅하는 이 방의 실질적 CEO. 다들 「아무 때나 좋아」 할 때 혼자 투표 만들고 리마인드 돌리는 책임감 만렙이지만, 정작 본인 일정은 늘 과부하입니다.",
        traits:["약속 잡히면 3분 만에 투표 생성","N빵 계산 속도 전국 상위 1%","「다들 봤지?」가 입버릇"], match:"emoti", clash:"ghost", keys:["실질적방장","N빵장인","투표3분생성"] },
      emoti:  { emoji:"🐥", name:"이모티콘 장인", short:"이모티콘", tag:"말은 없어도 리액션은 있다", share:15, reply:"즉시 (단, 짤로)",
        desc:"텍스트 대신 짤과 이모티콘으로 모든 감정을 표현하는 리액션 아티스트. 축하·위로·분노·현타까지 전부 이모티콘으로 소화 가능. 이 사람 리액션이 없으면 다들 어딘가 허전해합니다.",
        traits:["상황별 짤 폴더 500장 보유","신규 이모티콘 출시일을 캘린더에 등록","말싸움 나면 귀여운 짤로 조용히 중재"], match:"notice", clash:"dobae", keys:["짤폴더500장","리액션종결자","이모티콘장인"] }
    };
    var ORDER = ["dobae","jamsu","drip","ghost","notice","emoti"];

    var QUESTIONS = [
      { q: "자고 일어나니 단톡방 알림 999+. 스크롤 올려보니 새벽에 누가 연애상담을 시작했던 모양이다.", choices: [
        { text: "지금이라도 참전한다. 내 연애사 3부작 대하드라마 연재 시작", scores: { dobae: 2 } },
        { text: "999개를 정독하고 아무 말도 남기지 않는다", scores: { ghost: 2 } },
        { text: "새벽 상담 내용을 3줄 요약본으로 정리해 올림", scores: { notice: 2 } },
        { text: "'결론: 헤어져.' + 완벽한 짤 한 장으로 상황 종료", scores: { drip: 2 } } ] },
      { q: "비상사태. 엄마한테 보낼 애교 메시지를 단톡방에 잘못 전송했다. '엄마 딸기 사줘잉🍓'", choices: [
        { text: "폰 전원을 끈다. 3일 뒤에 봅시다", scores: { jamsu: 2 } },
        { text: "'실수 아닌데? 너네한테 보낸 건데?' 뻔뻔 정면돌파", scores: { drip: 2 } },
        { text: "수습용 이모티콘 20연발로 화면 밀어내기", scores: { emoti: 2 } },
        { text: "더 큰 TMI 폭탄으로 화제 전환 — 내 흑역사 자진 연재", scores: { dobae: 2 } } ] },
      { q: "방장이 말없이 단톡방을 나갔다. 무정부 상태 돌입.", choices: [
        { text: "자연스럽게 왕좌에 앉는다. '단톡방 규칙 v2.0 공지합니다'", scores: { notice: 2 } },
        { text: "정권이 바뀌든 말든 눈팅 포지션 사수", scores: { ghost: 2 } },
        { text: "'이 구역의 새 왕은 나다' 드립으로 쿠데타 시도", scores: { drip: 2 } },
        { text: "어수선한 틈을 타 조용히 알림을 영구 음소거", scores: { jamsu: 2 } } ] },
      { q: "친구가 갑자기 나를 소환했다. '@나 이건 얘가 제일 잘 알걸?'", choices: [
        { text: "하필 그 순간부터 급격히 바빠짐 (3시간 뒤 답장 예정)", scores: { jamsu: 2 } },
        { text: "기다렸다는 듯 정리된 답변 + 참고 링크 3개 첨부", scores: { notice: 2 } },
        { text: "물음표 이모티콘으로 일단 시간 벌기", scores: { emoti: 2 } },
        { text: "태그 알림을 보고도 유령 모드 유지. 나는 없는 사람이다", scores: { ghost: 2 } } ] },
      { q: "단톡방 멤버들과 처음으로 오프라인에서 만나기로 했다.", choices: [
        { text: "만나기도 전에 설레서 D-3부터 카운트다운 중계 중", scores: { dobae: 2 } },
        { text: "실물 보고 '누구세요?' 소리 들을 예정 (채팅과 동일인 맞음)", scores: { ghost: 2 } },
        { text: "현장에서도 리액션은 최고, 말수는 최소", scores: { emoti: 2 } },
        { text: "시간·장소·메뉴 투표·지도 링크까지 이미 내가 다 셋팅함", scores: { notice: 2 } } ] },
      { q: "프사를 6년째 안 바꾸던 친구가 드디어 프로필 사진을 바꿨다.", choices: [
        { text: "「헐 뭐야 무슨 일이야 연애해??」 즉시 취조 시작", scores: { dobae: 2 } },
        { text: "예전 프사 캡처해 뒀다가 비교짤 제작·배포", scores: { drip: 2 } },
        { text: "아무 말 안 하지만 확대해서 확인은 이미 끝냄", scores: { ghost: 2 } },
        { text: "놀란 토끼 이모티콘 3연발로 심경 표현", scores: { emoti: 2 } } ] },
      { q: "단톡방에 모르는 사람이 초대됐다. 「○○님이 들어왔습니다」", choices: [
        { text: "「어서와, 이 방은 처음이지?」 드립 신고식 진행", scores: { drip: 2 } },
        { text: "새 사람 어색해서 당분간 잠수 타기로 결정", scores: { jamsu: 2 } },
        { text: "질문 폭탄으로 10분 만에 신상 파악 완료", scores: { dobae: 2 } },
        { text: "방 규칙·멤버 소개·주요 짤 아카이브 브리핑", scores: { notice: 2 } } ] },
      { q: "친구가 야심차게 던진 개그에 방 전체가 싸늘하게 식었다.", choices: [
        { text: "영혼 없는 'ㅋㅋ' 이모티콘으로 심폐소생 시도", scores: { emoti: 2 } },
        { text: "그 개그를 더 웃긴 드립으로 덮어서 친구를 구출", scores: { drip: 2 } },
        { text: "이 타이밍에 방을 나갔다 들어온다 (알림 리셋 겸)", scores: { jamsu: 2 } },
        { text: "침묵. 원래 침묵은 내 전문 분야다", scores: { ghost: 2 } } ] },
      { q: "내가 올린 중요 공지 옆 '1'이 3일째 안 사라진다. 딱 한 명이 안 읽었다.", choices: [
        { text: "범인 색출 완료. 개인톡으로 공지 재전송 + 확인 요청", scores: { notice: 2 } },
        { text: "'야 마지막 1 누구야, 나와' 공개 소환", scores: { dobae: 2 } },
        { text: "궁금해 죽겠지만 이모티콘 올리며 딴청", scores: { emoti: 2 } },
        { text: "아… 그 1, 사실 부계정으로 접속한 나였다", scores: { jamsu: 2 } } ] },
      { q: "연말 단톡방 시상식이 열렸다. 내가 받게 될 상은?", choices: [
        { text: "'올해의 도배 대상' — 수상 소감만 스무 줄", scores: { dobae: 2 } },
        { text: "'베스트 드립 신인상' — 수상 소감도 드립", scores: { drip: 2 } },
        { text: "'유령 공로상' — 시상식에도 불참", scores: { ghost: 2 } },
        { text: "'이모티콘 소비 촉진 경제 공헌상'", scores: { emoti: 2 } } ] }
    ];

    function renderResult(totals, el, api) {
      var key = Quiz.top(totals, ORDER);
      var r = TYPES[key];
      var fr = TYPES[r.match], en = TYPES[r.clash];
      var t = window.GoblubI18n ? GoblubI18n.t : function (s) { return s; };
      el.innerHTML =
        '<span class="result-emoji">' + r.emoji + "</span>" +
        '<p class="result-name">' + r.name + "</p>" +
        '<p class="ct-tag">“' + t(r.tag) + '”</p>' +
        '<div class="ct-share"><span>단톡방 지분율</span>' +
          '<div class="ct-bar"><i style="width:' + r.share + '%"></i></div><b>' + r.share + '%</b></div>' +
        '<p class="result-desc">' + r.desc + "</p>" +
        '<ul class="ct-traits">' + r.traits.map(function (t) { return "<li>" + t + "</li>"; }).join("") + '</ul>' +
        '<p class="ct-item">📱 평균 답장 속도 — <b>' + t(r.reply) + '</b></p>' +
        '<div class="ct-chemi">' +
          '<span>🤝 같은 방 최고 케미 <b>' + fr.emoji + ' ' + t(fr.short) + '</b></span>' +
          '<span>💥 만나면 대환장 <b>' + en.emoji + ' ' + t(en.short) + '</b></span>' +
        '</div>' +
        '<div id="card-slot"></div>' +
        '<div class="result-actions">' +
        '<button class="btn-primary" id="qz-retry">다시하기</button>' +
        '<button class="btn-ghost" id="qz-share">링크 복사</button></div>';
      el.querySelector("#card-slot").appendChild(ShareCard.render({
        palette: "sky", emoji: r.emoji, badge: t("단톡방 캐릭터"), title: t(r.name),
        lines: ["“" + t(r.tag) + "”", t("단톡방 지분율") + " " + r.share + "%", t("답장 속도:") + " " + t(r.reply)]
      }));
      el.querySelector("#qz-retry").onclick = api.restart;
      el.querySelector("#qz-share").onclick = function () { api.shareLink(el.querySelector("#qz-share")); };
      if (window.GoblubFeed && GoblubFeed.record) GoblubFeed.record("chatroom", { emoji: r.emoji, title: (r.short || r.name), tags: r.keys });
    }

    Quiz.init(document.getElementById("quiz"), {
      emoji: "💬", title: "단톡방 캐릭터 테스트",
      intro: "새 단톡방에 초대됐다. 입장하자마자 알림 폭탄 시작. 이 방에서 내 포지션과 지분율은 얼마나 될까?",
      feedSrc: "chatroom", questions: QUESTIONS, renderResult: renderResult
    });
  </script>
</body>
</html>
