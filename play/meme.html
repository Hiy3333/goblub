<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>밈 사전 — goblub</title>
<meta name="description" content="요즘 밈부터 고전 밈까지 — 뜻·유래·쓰는 법을 고브럽이 알려주는 밈 사전. 오늘의 밈과 밈 퀴즈까지!" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
<style>
:root{
  --sky:#12162e; --ink:#eef1ff; --ink-soft:#a6aed0; --gold:#ffe6a8;
  --line:rgba(170,185,235,.22); --card:rgba(28,34,64,.72);
  --pop:#c77dff; --new:#7fe3b0; --mz:#8fc4ff; --cls:#ffd98a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sky);color:var(--ink);
  font-family:'Jua','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(140,110,220,.18), transparent 60%),
    radial-gradient(90% 60% at 50% 112%, rgba(60,80,160,.25), transparent 60%)}
.app{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:0 16px 60px}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 6px}
.topbar a{color:var(--ink-soft);text-decoration:none;font-size:.92rem}
.topbar .t{font-size:1.05rem;letter-spacing:1px}
.topbar .sp{width:44px}

.lead{text-align:center;padding:12px 6px 2px}
.lead h1{margin:0 0 6px;font-size:1.66rem;letter-spacing:1px;
  text-shadow:0 0 18px rgba(190,150,255,.35)}
.lead p{margin:0;color:var(--ink-soft);font-size:.92rem;line-height:1.7}

/* 검색 */
.searchbar{position:sticky;top:10px;z-index:20;margin-top:14px;display:flex;gap:8px}
.searchbar input{flex:1;padding:13px 16px;border-radius:14px;border:1px solid var(--line);
  background:rgba(16,20,42,.92);color:var(--ink);font-family:inherit;font-size:1rem;
  box-shadow:0 10px 26px rgba(0,4,20,.5);backdrop-filter:blur(6px)}
.searchbar input:focus{outline:none;border-color:rgba(199,125,255,.6)}
.searchbar button{padding:0 16px;border-radius:14px;border:0;cursor:pointer;
  font-family:inherit;font-size:1rem;color:#241a38;
  background:linear-gradient(180deg,#e9c9ff,#c77dff)}

/* 오늘의 밈 */
.today{margin-top:16px;border-radius:18px;padding:16px 16px 14px;cursor:pointer;
  background:linear-gradient(160deg,rgba(120,80,200,.35),rgba(40,40,90,.5));
  border:1px solid rgba(199,125,255,.4);
  box-shadow:0 14px 34px rgba(10,5,40,.5), inset 0 1px 0 rgba(255,255,255,.08)}
.today .tag{font-size:.8rem;color:#e6ccff;letter-spacing:1px}
.today .term{font-size:1.5rem;margin:6px 0 4px;color:#fff}
.today .mean{font-size:.92rem;color:#e0dcf4;line-height:1.7}
.today .more{font-size:.8rem;color:#c9a8ff;margin-top:8px}

/* 탭 + 도구 */
.tabs{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.tabs button{flex:1 1 auto;padding:10px 8px;border-radius:12px;border:1px solid var(--line);
  background:rgba(24,28,54,.7);color:var(--ink-soft);cursor:pointer;
  font-family:inherit;font-size:.9rem;white-space:nowrap}
.tabs button.on{background:linear-gradient(180deg,#efe3ff,#d0a8ff);color:#2a1c44;border:0}
.tools{display:flex;gap:8px;margin-top:8px}
.tools button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);
  background:rgba(24,28,54,.7);color:var(--ink);cursor:pointer;font-family:inherit;font-size:.94rem}
.tools .quizbtn{border:0;color:#241a38;background:linear-gradient(180deg,#ffeec2,#ffd98a)}

/* 목록 */
.count{margin:14px 2px 6px;color:var(--ink-soft);font-size:.82rem}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item .head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.item .term{font-size:1.06rem}
.item .preview{flex:1;min-width:0;color:var(--ink-soft);font-size:.8rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{flex:0 0 auto;font-size:.7rem;padding:3px 9px;border-radius:999px}
.chip.n{background:rgba(127,227,176,.16);color:var(--new)}
.chip.m{background:rgba(143,196,255,.16);color:var(--mz)}
.chip.c{background:rgba(255,217,138,.16);color:var(--cls)}
.item .body{display:none;padding:2px 16px 14px;border-top:1px dashed var(--line)}
.item.open .body{display:block}
.item.open .head .preview{display:none}
.sec{margin-top:11px}
.sec b{display:block;font-size:.8rem;color:var(--pop);margin-bottom:4px;font-weight:400}
.sec.gold b{color:var(--gold)}
.sec.green b{color:var(--new)}
.sec p{margin:0;font-size:.92rem;line-height:1.8;color:#dfe3f8}
.cardbtn{margin-top:13px;width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);
  background:rgba(16,20,42,.8);color:var(--ink);cursor:pointer;font-family:inherit;font-size:.9rem}
.empty{padding:30px 10px;text-align:center;color:var(--ink-soft);font-size:.92rem;line-height:1.8}

/* 퀴즈 */
.quiz{position:fixed;inset:0;z-index:50;display:none;overflow-y:auto;
  background:rgba(10,12,28,.96);backdrop-filter:blur(6px)}
.quiz.on{display:block}
.quiz .inner{max-width:560px;margin:0 auto;padding:20px 16px 50px}
.quiz .qtop{display:flex;justify-content:space-between;align-items:center;color:var(--ink-soft);font-size:.9rem}
.quiz .qtop button{background:none;border:0;color:var(--ink-soft);font-family:inherit;font-size:.9rem;cursor:pointer}
.quiz .qbox{margin-top:18px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:20px 18px}
.quiz .qlabel{color:var(--pop);font-size:.84rem}
.quiz .qtext{font-size:1.08rem;line-height:1.8;margin:10px 0 16px}
.quiz .opt{display:block;width:100%;text-align:left;margin-top:8px;padding:13px 15px;
  border-radius:13px;border:1px solid var(--line);background:rgba(16,20,42,.8);
  color:var(--ink);cursor:pointer;font-family:inherit;font-size:1rem}
.quiz .opt.correct{border-color:var(--new);background:rgba(127,227,176,.15)}
.quiz .opt.wrong{border-color:#ff8f9e;background:rgba(255,110,130,.13)}
.quiz .qnote{margin-top:12px;font-size:.86rem;color:var(--ink-soft);line-height:1.7;display:none}
.quiz .qnext{margin-top:14px;width:100%;padding:13px;border-radius:13px;border:0;cursor:pointer;
  font-family:inherit;font-size:1rem;color:#241a38;display:none;
  background:linear-gradient(180deg,#e9c9ff,#c77dff)}
.quiz .result{text-align:center;padding:30px 0 10px;display:none}
.quiz .result .big{font-size:2.4rem}
.quiz .result .tier{font-size:1.35rem;color:var(--gold);margin:10px 0 6px}
.quiz .result p{color:var(--ink-soft);font-size:.94rem;line-height:1.8;margin:0}
.quiz .result .row{display:flex;gap:8px;margin-top:20px}
.quiz .result .row button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:rgba(24,28,54,.8);color:var(--ink);cursor:pointer;font-family:inherit;font-size:.95rem}
.hint{margin-top:26px;color:#6d7694;font-size:.76rem;text-align:center;line-height:1.8}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="mini.html">← 미니 놀이터</a>
    <span class="t">📖 밈 사전</span>
    <span class="sp"></span>
  </div>

  <div class="lead">
    <h1>밈 사전</h1>
    <p>이거 무슨 뜻이야? 하는 순간 여기로 와.<br />고브럽이 다 알려줄게 ㅋ</p>
  </div>

  <div class="searchbar">
    <input type="search" id="q" placeholder="밈 검색 (예: 럭키비키, 중꺾마…)" autocomplete="off" />
    <button id="q-clear" type="button">지움</button>
  </div>

  <div class="today" id="today"></div>

  <div class="tabs" id="tabs">
    <button data-g="all" class="on">전체</button>
    <button data-g="n">🆕 요즘</button>
    <button data-g="m">😎 MZ</button>
    <button data-g="c">📼 고전</button>
  </div>
  <div class="tools">
    <button id="btn-random" type="button">🎲 아무 밈이나</button>
    <button id="btn-quiz" class="quizbtn" type="button">✏️ 밈 퀴즈 풀기</button>
  </div>

  <p class="count" id="count"></p>
  <div class="list" id="list"></div>

  <p class="hint">밈은 계속 태어나… 여기 없는 밈은 다음 업데이트에서 만나.<br />🦉 자료 수집: 고브럽 밈 연구소</p>
</div>

<!-- 퀴즈 -->
<div class="quiz" id="quiz">
  <div class="inner">
    <div class="qtop"><span id="qz-prog"></span><button id="qz-close" type="button">닫기 ✕</button></div>
    <div class="qbox" id="qz-box">
      <div class="qlabel" id="qz-label"></div>
      <div class="qtext" id="qz-text"></div>
      <div id="qz-opts"></div>
      <p class="qnote" id="qz-note"></p>
      <button class="qnext" id="qz-next" type="button">다음 문제</button>
    </div>
    <div class="result" id="qz-result">
      <div class="big" id="qz-emoji"></div>
      <div class="tier" id="qz-tier"></div>
      <p id="qz-comment"></p>
      <div class="row">
        <button id="qz-retry" type="button">🔁 다시 도전</button>
        <button id="qz-exit" type="button">📖 사전으로</button>
      </div>
    </div>
  </div>
</div>

<script src="../js/common.js?v=7" data-root=".."></script>
<script src="js/memes-data.js?v=1"></script>
<script src="js/feed.js?v=5"></script>
<script>
var $=function(id){return document.getElementById(id);};
var M=window.MEMES||[];
var GEN={n:"요즘",m:"MZ",c:"고전"};
var curTab="all", query="";
var granted=false;
function grantOnce(){ if(granted) return; granted=true;
  try{ if(window.GoblubFeed) GoblubFeed.grant("meme"); }catch(e){} }

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ── 오늘의 밈 — 날짜 기반이라 모두가 같은 밈을 본다 ── */
var d0=new Date(), dayKey=d0.getFullYear()*372+(d0.getMonth()+1)*31+d0.getDate();
var todayMeme=M[dayKey%M.length];
$("today").innerHTML =
  '<div class="tag">📅 오늘의 밈 · '+GEN[todayMeme.g]+' 밈</div>'+
  '<div class="term">'+esc(todayMeme.t)+'</div>'+
  '<div class="mean">'+esc(todayMeme.m)+'</div>'+
  '<div class="more">눌러서 유래까지 보기 →</div>';
$("today").onclick=function(){
  query=""; $("q").value="";
  curTab="all"; setTab("all");
  render();
  openItem(todayMeme.t, true);
};

/* ── 목록 ── */
function filtered(){
  var q=query.trim().toLowerCase();
  return M.filter(function(x){
    if(curTab!=="all" && x.g!==curTab) return false;
    if(!q) return true;
    if(x.t.toLowerCase().indexOf(q)>=0) return true;
    if((x.a||[]).some(function(a){ return a.toLowerCase().indexOf(q)>=0; })) return true;
    return x.m.toLowerCase().indexOf(q)>=0;
  });
}
function itemHTML(x){
  return '<div class="item" data-t="'+esc(x.t)+'">'+
    '<div class="head"><span class="term">'+esc(x.t)+'</span>'+
    '<span class="preview">'+esc(x.m)+'</span>'+
    '<span class="chip '+x.g+'">'+GEN[x.g]+" · "+esc(x.e)+'</span></div>'+
    '<div class="body">'+
    '<div class="sec"><b>💬 무슨 뜻이냐면</b><p>'+esc(x.m)+'</p></div>'+
    '<div class="sec gold"><b>🌱 어디서 왔냐면</b><p>'+esc(x.o)+'</p></div>'+
    '<div class="sec green"><b>✏️ 이렇게 써</b><p>'+esc(x.u)+'</p></div>'+
    '<button class="cardbtn" type="button" data-card="'+esc(x.t)+'">🖼 밈 카드로 저장 (공유용)</button>'+
    '</div></div>';
}
function render(){
  var list=filtered();
  $("count").textContent="총 "+list.length+"개"+(query?" — \""+query+"\" 검색 결과":"");
  $("list").innerHTML=list.map(itemHTML).join("") ||
    '<div class="empty">이 밈은 아직 사전에 없어… 😢<br />새로 태어난 밈이라면 다음 업데이트에서 만나자!</div>';
}
function openItem(t, scroll){
  var el=document.querySelector('.item[data-t="'+CSS.escape(t)+'"]');
  if(!el) return;
  el.classList.add("open");
  if(scroll) el.scrollIntoView({behavior:"smooth",block:"center"});
  grantOnce();
}
$("list").addEventListener("click",function(e){
  var cardBtn=e.target.closest("[data-card]");
  if(cardBtn){ makeCard(cardBtn.getAttribute("data-card")); return; }
  var head=e.target.closest(".head");
  if(!head) return;
  var item=head.parentElement;
  var was=item.classList.contains("open");
  item.classList.toggle("open",!was);
  if(!was) grantOnce();
});

/* 탭·검색·랜덤 */
function setTab(g){
  document.querySelectorAll("#tabs button").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-g")===g);
  });
}
$("tabs").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  curTab=b.getAttribute("data-g"); setTab(curTab); render();
});
$("q").addEventListener("input",function(){ query=this.value; render(); });
$("q-clear").onclick=function(){ query=""; $("q").value=""; render(); };
$("btn-random").onclick=function(){
  var list=filtered(); if(!list.length) return;
  var pick=list[Math.floor(Math.random()*list.length)];
  document.querySelectorAll(".item.open").forEach(function(el){ el.classList.remove("open"); });
  openItem(pick.t, true);
};

/* ── 공유 카드 (PNG) ── */
function makeCard(t){
  var x=M.find(function(m){ return m.t===t; }); if(!x) return;
  var cv=document.createElement("canvas"); cv.width=720; cv.height=720;
  var c=cv.getContext("2d");
  var g=c.createLinearGradient(0,0,0,720);
  g.addColorStop(0,"#1b1440"); g.addColorStop(1,"#101228");
  c.fillStyle=g; c.fillRect(0,0,720,720);
  for(var i=0;i<70;i++){ // 잔별
    c.globalAlpha=.15+Math.random()*.5; c.fillStyle="#cfd6ff";
    c.beginPath(); c.arc(Math.random()*720,Math.random()*720,Math.random()*1.8+.4,0,6.283); c.fill();
  }
  c.globalAlpha=1;
  c.strokeStyle="rgba(199,125,255,.5)"; c.lineWidth=3;
  c.strokeRect(26,26,668,668);
  c.textAlign="center";
  c.fillStyle="#c9a8ff"; c.font="26px Jua,'Malgun Gothic',sans-serif";
  c.fillText("📖 오늘 배운 밈 · "+GEN[x.g]+" 밈 ("+x.e+")",360,96);
  c.fillStyle="#ffffff"; c.font="64px Jua,'Malgun Gothic',sans-serif";
  c.fillText(x.t,360,190);
  // 뜻 — 줄바꿈 처리
  c.fillStyle="#e6e9ff"; c.font="30px Jua,'Malgun Gothic',sans-serif";
  wrap(c,x.m,360,270,600,46);
  c.fillStyle="#ffe6a8"; c.font="24px Jua,'Malgun Gothic',sans-serif";
  wrap(c,"🌱 "+x.o,360,470,600,38);
  c.fillStyle="#8f97c0"; c.font="22px Jua,'Malgun Gothic',sans-serif";
  c.fillText("goblub · 밈 사전",360,668);
  function wrap(ctx,text,cx,y,maxW,lh){
    var words=text.split(" "), line="", lines=[];
    for(var i=0;i<words.length;i++){
      var test=line?line+" "+words[i]:words[i];
      if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=words[i]; }
      else line=test;
      if(lines.length>=4){ line+="…"; break; }
    }
    lines.push(line);
    lines.forEach(function(l,i2){ ctx.fillText(l,cx,y+i2*lh); });
  }
  var a=document.createElement("a");
  a.download="goblub-meme-"+x.t.replace(/[^\w가-힣]/g,"")+".png";
  a.href=cv.toDataURL("image/png"); a.click();
  grantOnce();
}

/* ── 밈 퀴즈 ── */
var QZ={ qs:[], idx:0, score:0 };
function startQuiz(){
  var pool=M.slice();
  // 섞고 10개 뽑기
  for(var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  QZ.qs=pool.slice(0,10).map(function(ans){
    // 같은 세대 위주로 오답 3개
    var wrongs=pool.filter(function(x){ return x.t!==ans.t; });
    var sameGen=wrongs.filter(function(x){ return x.g===ans.g; });
    var cand=(sameGen.length>=3?sameGen:wrongs).slice();
    for(var i2=cand.length-1;i2>0;i2--){ var j2=Math.floor(Math.random()*(i2+1)); var t2=cand[i2]; cand[i2]=cand[j2]; cand[j2]=t2; }
    var opts=cand.slice(0,3).concat([ans]);
    for(var i3=opts.length-1;i3>0;i3--){ var j3=Math.floor(Math.random()*(i3+1)); var t3=opts[i3]; opts[i3]=opts[j3]; opts[j3]=t3; }
    return { ans:ans, opts:opts };
  });
  QZ.idx=0; QZ.score=0;
  $("qz-result").style.display="none"; $("qz-box").style.display="block";
  $("quiz").classList.add("on");
  document.body.style.overflow="hidden";
  showQ();
}
function showQ(){
  var q=QZ.qs[QZ.idx];
  $("qz-prog").textContent="문제 "+(QZ.idx+1)+" / "+QZ.qs.length+" · 맞힌 것 "+QZ.score;
  $("qz-label").textContent="이 뜻을 가진 밈은? ("+GEN[q.ans.g]+" 밈)";
  $("qz-text").textContent="“"+q.ans.m+"”";
  $("qz-note").style.display="none"; $("qz-next").style.display="none";
  $("qz-opts").innerHTML=q.opts.map(function(o,i){
    return '<button class="opt" type="button" data-i="'+i+'">'+esc(o.t)+'</button>';
  }).join("");
}
$("qz-opts").addEventListener("click",function(e){
  var b=e.target.closest(".opt"); if(!b) return;
  var q=QZ.qs[QZ.idx];
  if($("qz-next").style.display==="block" || $("qz-note").style.display==="block") return; // 이미 답함
  var pick=q.opts[+b.getAttribute("data-i")];
  var right=pick.t===q.ans.t;
  if(right) QZ.score++;
  document.querySelectorAll("#qz-opts .opt").forEach(function(el,i){
    if(q.opts[i].t===q.ans.t) el.classList.add("correct");
    else if(el===b) el.classList.add("wrong");
    el.disabled=true;
  });
  $("qz-note").textContent=(right?"정답! ":"아쉽다! 정답은 「"+q.ans.t+"」 — ")+q.ans.o;
  $("qz-note").style.display="block";
  $("qz-next").textContent=(QZ.idx===QZ.qs.length-1)?"결과 보기":"다음 문제";
  $("qz-next").style.display="block";
});
$("qz-next").onclick=function(){
  if(QZ.idx===QZ.qs.length-1){ showResult(); return; }
  QZ.idx++; showQ();
};
function showResult(){
  grantOnce();
  var s=QZ.score;
  var tier = s>=9?["🏆","밈 마스터","이 구역 밈은 네가 다 접수했다. 고브럽도 한 수 배운다…"]
           : s>=7?["🔥","밈 고인물","웬만한 밈은 다 꿰고 있네? 인싸력 검증 완료 ㅋ"]
           : s>=5?["😎","밈 러버","기본기 탄탄! 요즘 밈 몇 개만 더 익히면 고인물 각."]
           : s>=3?["🌱","밈 새싹","이제 막 밈의 세계에 입문했구나. 사전 정독 추천!"]
                 :["🐣","밈 신생아","괜찮아, 오늘부터 배우면 돼. 오늘의 밈부터 시작하자!"];
  $("qz-emoji").textContent=tier[0];
  $("qz-tier").textContent=tier[1]+" ("+s+"/"+QZ.qs.length+")";
  $("qz-comment").textContent=tier[2];
  $("qz-box").style.display="none";
  $("qz-result").style.display="block";
}
function closeQuiz(){ $("quiz").classList.remove("on"); document.body.style.overflow=""; }
$("btn-quiz").onclick=startQuiz;
$("qz-close").onclick=closeQuiz;
$("qz-exit").onclick=closeQuiz;
$("qz-retry").onclick=startQuiz;

render();
</script>
