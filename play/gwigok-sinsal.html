    "천덕귀인":{hj:"德",als:"하늘이 덮어 주는 것",
      tx:"월지에서 나오는 최상급 길신이다. 하늘이 덮어 준다는 뜻이라, 흉한 일이 와도 한 겹이 먼저 막아 준다. 옛 책은 이 귀인이 있으면 '흉이 흉으로 끝나지 않는다'고 적었다.",
      cure:"덕은 쌓아야 유지된다. 남의 사정을 한 번 봐주는 일이 이 귀인을 붙잡아 둔다."},
    "월덕귀인":{hj:"月",als:"달이 비추는 자리",
      tx:"천덕과 짝을 이루는 길신이다. 사람됨이 원만하고 인덕이 따르며, 어려울 때 주변이 먼저 나서 준다. 요란한 복은 아니나 오래 가는 복이다.",
      cure:"받은 호의를 당연히 여기지 마라. 이 달빛은 고마움을 아는 자리에만 머문다."},
    "암록":{hj:"祿",als:"숨은 곳간",
      tx:"드러나지 않는 녹(祿)이다. 남들 눈에는 안 보이는 자리에서 도움이 오고, 막다른 길에서 뜻밖의 활로가 열린다. 큰 부자는 아니어도 굶지 않는 명이다.",
      cure:"숨은 복은 자랑하면 새어 나간다. 조용히 쓰면 오래 남는다."},
    "금여":{hj:"輿",als:"금수레",
      tx:"금으로 만든 수레를 타는 자리다. 몸이 편안하고 품위가 따르며 배우자 덕이 좋다고 옛 책은 적었다. 애써 구하지 않아도 탈것이 와 있는 명이다.",
      cure:"편안함에 익숙해지되 게을러지지는 마라. 수레도 끌어 줄 사람이 있어야 굴러간다."},
    /* ── 기질과 인연 ── */
    "홍염살":{hj:"艶",als:"붉은 고움",
      tx:"도화가 겉으로 피는 꽃이라면 이것은 안에서 배어 나오는 색이다. 요란하지 않은데 사람이 붙고 은근히 마음을 흔든다. 예술·접객·사람 다루는 일에 힘이 된다.",
      cure:"은근한 것일수록 오해를 부른다. 선은 네가 먼저 그어 두어라."},
    "귀문관살":{hj:"鬼",als:"귀신 드나드는 문",
      tx:"저승 문이 반쯤 열린 자리다. 남이 못 보는 것을 보고 못 느끼는 것을 느낀다. 촉이 비상해 예술·상담·역술에 재능을 보이나, 신경이 곤두서고 잠을 설치기 쉽다.",
      cure:"예민함을 병으로 만들지 마라. 잠자리와 술을 다스리면 이 문은 좋은 쪽으로만 열린다."},
    "원진살":{hj:"怨",als:"이유 없는 미움",
      tx:"까닭 없이 서로 미운 기운이다. 잘잘못을 따져도 답이 안 나오고, 미워하면서도 못 끊는 애증이 된다. 원국 안에 있으면 내 안에서 두 마음이 자주 싸운다.",
      cure:"이 기운이 도는 사이에서는 시비를 가리려 들지 마라. 거리를 두는 것이 유일한 약이다."},
    "현침살":{hj:"針",als:"매달린 바늘",
      tx:"글자 모양이 바늘처럼 뾰족하다 하여 붙은 이름이다. 말이 날카로워 상대를 찌르기 쉽고, 손끝은 정교해 의료·바느질·칼 쓰는 일에 재능이 있다. 찌르는 힘을 어디에 쓰느냐의 문제다.",
      cure:"바늘로 사람을 찌르지 말고 실을 꿰어라. 말하기 전에 한 번 삼키면 그게 실이 된다."},
    "고신살":{hj:"孤",als:"홀로 남는 자리",
      tx:"무리에서 떨어져 나오는 기운이다. 사람이 없는 게 아니라 있어도 마음이 겉도는 자리 — 옛 책은 남자 사주에서 특히 무겁게 보았다. 대신 혼자의 시간을 자산으로 바꾸는 자에겐 큰 힘이 된다.",
      cure:"먼저 연락하는 습관 하나면 이 살은 반으로 준다. 외로움은 참는 게 아니라 쓰는 것이다."},
    "과숙살":{hj:"寡",als:"빈 자리를 지키는 살",
      tx:"고신과 짝을 이루는 살로, 옛 책은 여자 사주에서 무겁게 보았다. 곁에 사람이 있어도 속을 다 못 주고 끝내 제 힘으로 서는 명이다. 옛말은 무거우나 요즘 세상에선 홀로 서는 힘으로 읽는다.",
      cure:"혼자 감당하는 버릇을 조금 내려놔라. 도움을 청하는 말 한마디가 이 살을 푼다."},
    "공망":{hj:"空",als:"비어 있는 자리",
      tx:"그 자리가 텅 비었다는 뜻이다. 채워도 새고 기대면 허전하다. 다만 흉한 것이 들어와도 함께 비어 버리니, 흉살이 앉은 자리라면 오히려 다행이다. 옛사람들은 이 자리를 종교·예술·학문처럼 손에 안 잡히는 것으로 채웠다.",
      cure:"그 자리에서 손에 잡히는 것만 바라지 마라. 비운 만큼 다른 것이 들어온다."},
    "천라(天羅)":{hj:"羅",als:"하늘의 그물",
      tx:"술(戌)과 해(亥)가 나란히 앉아 하늘에 그물이 걸린 자리다. 활동이 묶이고 답답한 일이 잦으나, 그물 안에서 도(道)를 닦는 자리이기도 하다. 의료·종교·역술처럼 사람의 어두운 곳을 다루면 오히려 풀린다.",
      cure:"묶였다고 몸부림치면 더 조인다. 갇힌 김에 안을 들여다보는 것이 이 자리의 정답이다."},
    "지망(地網)":{hj:"網",als:"땅의 그물",
      tx:"진(辰)과 사(巳)가 나란히 앉아 땅에 그물이 깔린 자리다. 발이 자꾸 걸리고 일이 지체되나, 한 번 자리를 잡으면 좀처럼 흔들리지 않는다. 천라와 마찬가지로 남의 어려움을 다루는 일에서 힘을 얻는다.",
      cure:"빨리 가려 하지 마라. 그물 위를 뛰면 걸리고, 걸으면 건넌다."}
  };
  // 분류 — 표시 순서
  var GROUPS=[
    { hj:"大", ko:"대살", ds:"기운이 가장 센 것들", keys:["백호대살","괴강살","양인살"] },
    { hj:"十二", ko:"십이신살", ds:"년지·일지에서 자리마다 하나씩 붙는다",
      note:"십이신살(十二神煞)은 네 <b>년지와 일지가 속한 삼합국(三合局)</b>을 기준으로, 열두 지지에 <b>겁살부터 화개살까지 열두 이름을 차례로 붙인 것</b>이다. "+
           "그러니 사주의 네 자리에는 반드시 하나씩 붙는다 — 없는 것이 이상한 것이지, 붙었다고 흉한 게 아니다. "+
           "이름이 사나운 겁살·재살이 있는가 하면, 권세를 뜻하는 장성살·반안살도 이 열둘에 함께 들어 있다. "+
           "귀곡은 <b>년지 기준과 일지 기준을 둘 다</b> 짚어 주니, 카드마다 어느 기준으로 나온 것인지 오른쪽에 적어 두었다.",
      keys:["겁살","재살","천살","지살","연살","월살","망신살","장성살","반안살","역마살","육해살","화개살"] },
    { hj:"貴", ko:"귀인", ds:"도와주는 것들",
      keys:["천을귀인","천덕귀인","월덕귀인","문창귀인","금여","암록"] },
    { hj:"氣", ko:"기질과 인연", ds:"성정·관계에 새겨진 것들",
      keys:["홍염살","귀문관살","원진살","현침살","고신살","과숙살","공망","천라(天羅)","지망(地網)"] }
  ];

  function fillSelects(){
    var y=$("g-year"),m=$("g-month"),d=$("g-day"),h=$("g-hour"),now=new Date().getFullYear();
    for(var i=now;i>=1930;i--) y.add(new Option(i+"년",i));
    for(var j=1;j<=12;j++) m.add(new Option(j+"월",j));
    for(var k=1;k<=31;k++) d.add(new Option(k+"일",k));
    for(var t=0;t<24;t++) h.add(new Option(("0"+t).slice(-2)+"시",t));
    y.value=1995;
  }

  var data=null;
  function esc(s){ return String(s).replace(/</g,"&lt;"); }

  function boot(birth){
    var r=Saju.compute(data,{y:birth.y,m:birth.m,d:birth.d,hour:birth.hour,min:birth.min||0},{trueSolar:true});
    var t=Saju.pillarText(r.pillars.day);
    var bs=birth.y+"."+birth.m+"."+birth.d+(birth.hour!=null?" "+("0"+birth.hour).slice(-2)+":"+("0"+(birth.min||0)).slice(-2):"")+"생";
    $("me-pill").textContent=bs+" · "+t.hanja+"("+t.hangul+") · "+r.zodiac+"띠";

    // 원국 표기 — 계산 근거를 눈으로 확인할 수 있게
    var wg=Sinsal.wongook(r), gm=Sinsal.gongmangJi(r);
    $("wongook").innerHTML='<div class="row">'+wg.map(function(p){
        return '<span class="p"><span class="lb">'+p.pos+'</span><span class="hj">'+p.hj+'</span>'+
               '<span class="ko">'+p.ko+'</span><span class="us">'+p.unseong+'</span></span>';
      }).join("")+'</div>'+
      '<p class="gm">이 명부의 공망은 <b>'+gm.hj+'('+gm.ko+')</b>다. 작은 글씨는 십이운성(十二運星).'+
      (r.pillars.hour ? "" : "<br>태어난 시를 모르니 시주는 비워 두었다 — 시지에 붙는 살은 빠진다.")+'</p>';

    var found={}; // 이름 → {hits, basis}
    Sinsal.list(r).forEach(function(s){ found[s.name]=s; });

    var cards=$("cards"); cards.innerHTML="";
    var total=0, names=[];
    GROUPS.forEach(function(g){
      var hit=g.keys.filter(function(k){ return found[k]; });
      if(!hit.length) return;
      var head=document.createElement("div");
      head.className="grp";
      head.innerHTML='<span class="hj">'+g.hj+'</span><span class="ko">'+g.ko+'</span><span class="ds">'+g.ds+'</span>';
      cards.appendChild(head);
      if(g.note){
        var nt=document.createElement("p");
        nt.className="gnote"; nt.innerHTML=g.note;
        cards.appendChild(nt);
      }
      hit.forEach(function(n){
        var b=BOOK[n], f=found[n];
        total++; names.push(n);
        var el=document.createElement("div");
        el.className="card"; el.setAttribute("data-hj",b.hj);
        el.innerHTML='<div class="in"><div class="top"><span class="nm">'+n+'</span>'+
          '<span class="als">'+b.als+'</span>'+
          '<span class="basis">'+esc(f.basis)+'</span></div>'+
          '<div class="top" style="margin-top:8px"><span class="pos">'+esc(f.hits.join(" · "))+'</span></div>'+
          '<p class="tx">'+b.tx+'</p>'+
          '<p class="cure"><b>다스리는 법</b> — '+b.cure+'</p></div>';
        cards.appendChild(el);
      });
    });

    if(!total){
      $("intro").innerHTML="네 명부를 샅샅이 뒤졌다.";
      cards.innerHTML='<div class="none">붙은 살이 없다 — 드물게 깨끗한 명부다.<br>'+
        "다만 명심해라. 살이 없다는 건 무기도 없다는 뜻이다.<br>네 길은 순전히 네 걸음으로 가야 한다.</div>";
    }else{
      $("intro").innerHTML="네 명부에서 <b>"+total+"가지</b>가 나왔다.<br>"+
        "십이신살은 흉한 것만이 아니라 자리마다 하나씩 붙는 것이니, 이름만 보고 겁먹지 마라.";
    }
    $("gate").style.display="none"; $("board").style.display="block";
    if(window.GwigokLog) GwigokLog.add("sinsal","신살 도감",
      total ? names.slice(0,6).join("·")+(names.length>6?" 외":"")+" — "+total+"가지가 붙어 있었다" : "붙은 살이 없는 깨끗한 명부였다");
  }

  fillSelects();
  $("g-go").onclick=function(){
    var y=+$("g-year").value,m=+$("g-month").value,d=+$("g-day").value,hv=$("g-hour").value;
    var dt=new Date(y,m-1,d);
    if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d){
      $("g-err").textContent="없는 날짜다. 다시 보아라."; $("g-err").style.display="block"; return;
    }
    var b={y:y,m:m,d:d}; if(hv!==""){ b.hour=+hv; b.min=Math.max(0,Math.min(59,+(document.getElementById("g-min").value)||0)); }
    try{ localStorage.setItem("goblub_birth",JSON.stringify(b)); }catch(e){}
    boot(b);
  };
  $("edit").onclick=function(ev){ ev.preventDefault(); $("board").style.display="none"; $("gate").style.display="block"; };

  fetch("data/saju-terms.json").then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){
      data=d;
      var b=null; try{ b=JSON.parse(localStorage.getItem("goblub_birth")); }catch(e){}
      if(b&&b.y) boot(b); else $("gate").style.display="block";
    })
    .catch(function(){ $("gate").style.display="block";
      $("g-err").textContent="장부를 못 펼쳤다. 새로고침 해보아라."; $("g-err").style.display="block"; });
})();
</script>
</body>
</html>
