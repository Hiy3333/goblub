<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>연애세포 테스트 — goblub</title>
  <meta name="description" content="12가지 상황으로 보는 나의 연애 세포 — 밀당·직진·집착·모솔·츤데레·헌신" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=cl7" />
  <style>
    .tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0 4px; }
    .tag { background: var(--cream); border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 0.9rem; color: var(--ink-soft); }
    .match-line { margin-top: 12px; color: var(--ink-soft); }
  </style>
</head>
<body class="clay">
  <div id="site-header"></div>
  <main>
    <section class="panel"><div id="quiz"></div></section>
  </main>
  <div id="site-footer"></div>
  <script src="../js/common.js?v=26" data-root=".."></script>
  <script src="js/feed.js?v=14"></script>
  <script src="js/quiz.js?v=6"></script>
  <script src="js/sharecard.js?v=3"></script>
  <script>
    var CELLS = {
      mildang:  { emoji:"🎭", name:"밀당세포 우세형", short:"밀당세포", tags:["밀당의고수","여유로운척","답장은계산","티안내기달인"], desc:"좋아하면서도 절대 티 안 내죠. 여유로운 미소 뒤에서 답장 타이밍을 계산하는 당신… 근데 상대도 밀당 중이면 둘 다 평생 썸만 탑니다.", match:"tsundere", clash:"jikjin" },
      jikjin:   { emoji:"🚀", name:"직진세포 우세형", short:"직진세포", tags:["좋으면돌격","고백선빵","화끈본능","재고안따짐"], desc:"좋으면 바로 고백, 재고 따지는 시간에 이미 손 잡고 있음. 화끈해서 좋지만 상대가 아직 준비 안 됐을 땐 혼자 앞서가다 넘어지기도 합니다.", match:"mosol",    clash:"mildang" },
      jipchak:  { emoji:"🔗", name:"집착세포 우세형", short:"집착세포", tags:["사랑하면올인","읽씹은고문","애정과다","24시간연결"], desc:"사랑하면 올인, 읽씹 3분만 넘어가도 심장이 쿵. 애정이 넘치는 건 매력이지만 가끔은 상대에게 숨 쉴 틈도 좀 줘야 오래갑니다.", match:"heonsin",  clash:"mosol" },
      mosol:    { emoji:"🌱", name:"모솔세포 우세형", short:"모솔세포", tags:["상상은결혼까지","실전은0","설렘만렙","표현법몰라"], desc:"머릿속 시뮬레이션은 이미 결혼까지 갔는데 현실은 대화 시작도 못 함. 상상력 하나는 국가대표급이니 이제 실전 배치만 하면 됩니다.", match:"jikjin",   clash:"jipchak" },
      tsundere: { emoji:"🐱", name:"츤데레세포 우세형", short:"츤데레세포", tags:["좋아할수록퉁명","속마음은반대","냉정한척","다들킴"], desc:"좋아할수록 말이 퉁명스러워지는 신기한 회로. 본인은 '냉정한 척'이라 믿지만 주변 사람들은 이미 다 눈치챘습니다.", match:"mildang", clash:"heonsin" },
      heonsin:  { emoji:"💝", name:"헌신세포 우세형", short:"헌신세포", tags:["다퍼주는사랑","상대가1순위","기념일수호신","나도좀챙겨"], desc:"사랑하면 다 퍼주는 타입, 상대 기념일이 내 기념일보다 중요. 마음은 참 예쁜데, 나 자신도 좀 챙기면서 사랑해도 됩니다.", match:"jipchak",  clash:"tsundere" }
    };
    var ORDER = ["mildang","jikjin","jipchak","mosol","tsundere","heonsin"];

    // 12문항 × 4보기 = 48칸. 세포마다 정확히 8번씩 등장하도록 배치(문항별로 2세포씩 제외).
    var QUESTIONS = [
      { q: "💬 카톡 답장이 왔다", choices: [
        { text: "읽자마자 바로 답장", scores: { jikjin: 2 } },
        { text: "5분 기다렸다 보낸다", scores: { mildang: 2 } },
        { text: "답장 오기 전에 이미 서른 번 확인함", scores: { jipchak: 2 } },
        { text: "초안을 세 번 고쳐 쓴다", scores: { mosol: 2 } } ] },
      { q: "📱 상대가 스토리를 올렸다", choices: [
        { text: "좋아요 눌렀다 취소했다 다시 누른다", scores: { mosol: 2 } },
        { text: "봤지만 좋아요는 안 누른다", scores: { mildang: 2 } },
        { text: "\"관심 없는데\" 하며 세 번 돌려본다", scores: { tsundere: 2 } },
        { text: "바로 DM을 보낸다", scores: { jikjin: 2 } } ] },
      { q: "🍽️ 첫 데이트 메뉴를 고른다", choices: [
        { text: "상대 취향으로 전부 맞춘다", scores: { heonsin: 2 } },
        { text: "\"난 아무거나\" (사실 싫어하는 게 많다)", scores: { tsundere: 2 } },
        { text: "인스타 뒤져서 취향 파악 완료", scores: { jipchak: 2 } },
        { text: "3일 전부터 후기를 정독한다", scores: { mosol: 2 } } ] },
      { q: "🎂 상대 생일이 다가온다", choices: [
        { text: "\"생일이었어?\" (선물은 이미 샀다)", scores: { tsundere: 2 } },
        { text: "한 달 전부터 준비한다", scores: { heonsin: 2 } },
        { text: "살짝 늦게 축하해서 존재감을 남긴다", scores: { mildang: 2 } },
        { text: "당일 아침에 꽃 들고 등장", scores: { jikjin: 2 } } ] },
      { q: "😴 새벽 2시, 상대가 \"자?\" 하고 보냈다", choices: [
        { text: "왜 하필 이 시간에 보냈는지 분석한다", scores: { jipchak: 2 } },
        { text: "\"무슨 일 있어? 지금 갈까?\"", scores: { heonsin: 2 } },
        { text: "\"왜\" (한 글자)", scores: { tsundere: 2 } },
        { text: "바로 전화를 건다", scores: { jikjin: 2 } } ] },
      { q: "🚶 길에서 상대를 우연히 마주쳤다", choices: [
        { text: "못 본 척 지나간다", scores: { mosol: 2 } },
        { text: "\"야!!\" 하고 뛰어간다", scores: { jikjin: 2 } },
        { text: "마침 들고 있던 음료를 건넨다", scores: { heonsin: 2 } },
        { text: "\"여긴 웬일이야\" (일부러 왔다)", scores: { tsundere: 2 } } ] },
      { q: "💔 상대가 다른 사람 얘기를 꺼냈다", choices: [
        { text: "\"잘 됐네\" (표정이 굳는다)", scores: { tsundere: 2 } },
        { text: "관심 없는 척 화제를 돌린다", scores: { mildang: 2 } },
        { text: "잘되라고 응원해준다 (속으로 운다)", scores: { heonsin: 2 } },
        { text: "이름 듣자마자 검색을 시작한다", scores: { jipchak: 2 } } ] },
      { q: "📸 둘이 찍은 사진이 생겼다", choices: [
        { text: "상대가 잘 나온 걸로만 고른다", scores: { heonsin: 2 } },
        { text: "배경화면 했다가 들킬까 봐 바꾼다", scores: { mosol: 2 } },
        { text: "바로 프로필 사진으로 건다", scores: { jikjin: 2 } },
        { text: "폴더를 만들어 정리한다", scores: { jipchak: 2 } } ] },
      { q: "🎧 상대가 좋아하는 노래를 알려줬다", choices: [
        { text: "다음에 아는 척 흘린다", scores: { mildang: 2 } },
        { text: "플레이리스트를 통째로 외운다", scores: { heonsin: 2 } },
        { text: "100번 듣는다", scores: { mosol: 2 } },
        { text: "\"내 취향은 아닌데\" (매일 듣는다)", scores: { tsundere: 2 } } ] },
      { q: "🌧️ 비가 오는데 상대가 우산이 없다", choices: [
        { text: "우산 있는데 없는 척한다", scores: { mildang: 2 } },
        { text: "말을 못 걸고 옆에서 같이 젖는다", scores: { mosol: 2 } },
        { text: "내 우산 주고 나는 뛴다", scores: { heonsin: 2 } },
        { text: "일부러 우산 하나만 챙겨 나왔다", scores: { jipchak: 2 } } ] },
      { q: "🔔 읽었는데 답장이 없다", choices: [
        { text: "프로필 사진이 바뀌었나 확인한다", scores: { jipchak: 2 } },
        { text: "내가 뭘 잘못 썼나 스크롤을 올린다", scores: { mosol: 2 } },
        { text: "나도 안 읽은 척한다", scores: { mildang: 2 } },
        { text: "\"바빠?\" 하고 하나 더 보낸다", scores: { jikjin: 2 } } ] },
      { q: "💍 상대가 \"우리 무슨 사이야?\"라고 물었다", choices: [
        { text: "\"사귀자\"", scores: { jikjin: 2 } },
        { text: "\"몰라\" (심장은 폭발 중)", scores: { tsundere: 2 } },
        { text: "\"너는 어떻게 생각하는데?\"", scores: { mildang: 2 } },
        { text: "드디어 확실히 정할 수 있겠다", scores: { jipchak: 2 } } ] }
    ];

    // 동점이면 Quiz.top 은 ORDER 앞쪽 키(밀당)를 무조건 고른다. 동점이 3번에 1번꼴로
    // 나오는 구조라 그대로 두면 밀당 24% / 헌신 11% 로 결과가 쏠린다.
    // → 고른 보기 조합으로 가른다. 같은 답이면 항상 같은 결과라 결과 링크도 그대로 동작.
    function topCell(totals, picks) {
      var mx = -Infinity;
      ORDER.forEach(function (k) { var v = totals[k] || 0; if (v > mx) mx = v; });
      var tied = ORDER.filter(function (k) { return (totals[k] || 0) === mx; });
      if (tied.length === 1) return tied[0];
      var h = 7;
      (picks || []).forEach(function (p, i) { h = (h * 131 + (p + 1) * (i + 5)) % 1000003; });
      return tied[h % tied.length];
    }

    function renderResult(totals, el, api) {
      showCell(topCell(totals, api.picks), el, api, true);
    }

    // setHash=true 는 방금 푼 사람, false 는 공유 링크로 결과만 보러 온 사람.
    function showCell(key, el, api, setHash) {
      var r = CELLS[key];
      var tagsHtml = '<div class="tags">' + r.tags.map(function (t) { return '<span class="tag">#' + t + '</span>'; }).join("") + '</div>';

      el.innerHTML =
        '<span class="result-emoji">' + r.emoji + "</span>" +
        '<p class="result-name">' + r.name + "</p>" +
        '<p class="result-desc">' + r.desc + "</p>" + tagsHtml +
        '<p class="match-line">💞 환상의 짝꿍세포: <b>' + CELLS[r.match].short + "</b> &nbsp;·&nbsp; ⚡ 상극세포: <b>" + CELLS[r.clash].short + "</b></p>" +
        '<div id="card-slot"></div>' +
        '<div class="result-actions">' +
        '<button class="btn-primary" id="qz-retry">다시하기</button>' +
        '<button class="btn-ghost" id="qz-share">링크 복사</button></div>';

      el.querySelector("#card-slot").appendChild(ShareCard.render({
        palette: "coral", emoji: r.emoji, badge: "연애세포 테스트 결과", title: r.name,
        lines: [r.desc, "#" + r.tags.slice(0, 3).join(" #")]
      }));
      if (setHash) history.replaceState(null, "", location.pathname + "#" + key);
      el.querySelector("#qz-retry").onclick = function () {
        history.replaceState(null, "", location.pathname);
        api.restart();
      };
      // 결과가 담긴 주소를 공유해야 받는 사람이 내 세포를 본다. api.shareLink 는
      // location.href 를 쓰므로 해시를 먼저 붙여두면 그대로 실려 나간다.
      el.querySelector("#qz-share").onclick = function () { api.shareLink(el.querySelector("#qz-share")); };
      // 남의 결과를 열어본 것뿐이니 내 프로필 카드에 기록하면 안 된다.
      if (setHash && window.GoblubFeed && GoblubFeed.record) {
        GoblubFeed.record("love", { emoji: r.emoji, title: (r.short || r.name), tags: r.tags });
      }
    }

    var quizEl = document.getElementById("quiz");
    var api = Quiz.init(quizEl, {
      emoji: "💘", title: "연애세포 테스트",
      intro: "당신의 연애를 좌우하는 6가지 세포. 12가지 상황 속 선택으로 내 안의 우세 세포를 찾아봐요!",
      feedSrc: "love", questions: QUESTIONS, renderResult: renderResult
    });

    // 공유 링크 진입 — 없는 키면 조용히 인트로 그대로 둔다.
    var hashKey = decodeURIComponent((location.hash || "").replace("#", ""));
    if (CELLS[hashKey]) showCell(hashKey, quizEl, api, false);
  </script>
</body>
</html>
