<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나는 무슨 음식형 인간? — goblub</title>
  <meta name="description" content="10가지 질문으로 알아보는 나의 음식형 — 마라탕·물냉면·국밥·민초·떡볶이·도시락" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=cl7" />
  <style>
    .fd-tag { text-align:center; color:#ff7a3d; font-size:1.02rem; margin:2px 0 10px; }
    .fd-rate { display:flex; align-items:center; gap:10px; max-width:340px; margin:0 auto 12px; }
    .fd-rate span { font-size:.85rem; color:var(--ink-soft); flex:none; }
    .fd-rate b { font-size:1.05rem; flex:none; }
    .fd-bar { flex:1; height:12px; border-radius:999px; background:rgba(0,0,0,.12); overflow:hidden; }
    .fd-bar i { display:block; height:100%; border-radius:999px;
      background:linear-gradient(90deg,#ff7a3d,#ff4d6d); }
    .fd-traits { max-width:420px; margin:12px auto 4px; padding:0; list-style:none; text-align:left; }
    .fd-traits li { position:relative; padding-left:24px; margin:7px 0; line-height:1.6; font-size:.95rem; }
    .fd-traits li::before { content:"🍴"; position:absolute; left:0; font-size:.85rem; }
    .fd-item { text-align:center; margin:10px 0 2px; font-size:.95rem; }
    .fd-chemi { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:12px 0 4px; }
    .fd-chemi span { background:rgba(255,122,61,.1); border:1px solid rgba(255,122,61,.35);
      border-radius:999px; padding:7px 14px; font-size:.88rem; }
  </style>
</head>
<body class="clay">
  <div id="site-header"></div>
  <main>
    <section class="panel"><div id="quiz"></div></section>
  </main>
  <div id="site-footer"></div>
  <script src="../js/common.js?v=26" data-root=".."></script>
  <script src="js/feed.js?v=14"></script>
  <script src="js/quiz.js?v=4"></script>
  <script src="js/sharecard.js?v=2"></script>
  <script>
    var TYPES = {
      mala:       { emoji:"🌶️", name:"화끈 중독성 마라탕형", short:"마라탕", tag:"인생은 맵기 3단계부터", rate:91, side:"후식 탕후루 (마라탕후루 풀코스)",
        desc:"한번 빠지면 못 헤어나오는 강렬한 중독성의 소유자. 평소엔 잔잔한데 꽂히는 순간 텐션이 화산처럼 폭발해 주변까지 얼얼하게 만듭니다. 호불호는 갈려도 한번 맛본 사람은 반드시 돌아옵니다.",
        traits:["꽂히면 3일 밤새는 과몰입 장인","심심한 것보단 차라리 매운 게 낫다 주의","텐션 터지면 아무도 못 말림"], match:"tteokbokki", clash:"naengmyeon", keys:["과몰입장인","맵기3단계","텐션화산"] },
      naengmyeon: { emoji:"🧊", name:"시원 쿨한 물냉면형", short:"물냉면", tag:"호들갑은 육수에 말아먹었어", rate:77, side:"식초 두 바퀴 + 겨자 정량",
        desc:"무슨 일이 터져도 살얼음 멘탈이 안 녹는 쿨함의 정석. 처음엔 밍밍해 보여도 알수록 깊은 육수 같은 반전 매력이 있어서, 곁에 둬본 사람만 그 진가를 압니다.",
        traits:["카톡은 용건만 간단히 파","리액션은 작아도 챙길 건 다 챙김","화내는 걸 본 사람이 없다는 전설 보유"], match:"gukbap", clash:"mala", keys:["살얼음멘탈","용건만간단히","화낸적없음"] },
      gukbap:     { emoji:"🍲", name:"든든 정 많은 국밥형", short:"국밥", tag:"밥은 먹고 다니냐가 안부 인사", rate:96, side:"깍두기 국물 (셀프바 3회전)",
        desc:"언제 만나도 편하고 든든한 국민 소울푸드 같은 사람. 화려한 이벤트는 없어도 힘들 때 제일 먼저 생각나는 존재라, 다들 새벽에도 이 사람부터 찾습니다.",
        traits:["고민 상담 들어주다 밥까지 사주는 타입","유행 안 타는 대신 실망도 안 시킴","「내가 살게」 발동 속도 전국 1위"], match:"naengmyeon", clash:"mintcho", keys:["새벽에도콜","내가살게","실패없는선택"] },
      mintcho:    { emoji:"🍫", name:"호불호 확실 민초형", short:"민초", tag:"치약이라니, 이건 청량함이야", rate:52, side:"논쟁 상대 (없으면 심심함)",
        desc:"누가 뭐래도 내 취향은 내가 정하는 소신 만렙 타입. 세상을 민초단과 반민초단으로 가르는 화제성의 주인공이라, 싫어하는 사람도 있지만 좋아하는 사람은 팬클럽급으로 좋아합니다.",
        traits:["최애 앞에선 논리학 박사로 변신","「그게 왜 좋아?」 소리 듣는 게 일상","트렌드보다 내 취향 아카이브가 우선"], match:"dosirak", clash:"gukbap", keys:["소신만렙","호불호극과극","취향아카이브"] },
      tteokbokki: { emoji:"❤️", name:"만인의 인싸 떡볶이형", short:"떡볶이", tag:"오늘도 모임의 중심은 나야", rate:94, side:"모둠 튀김 + 순대 (국물 찍먹 필수)",
        desc:"누구랑 있어도 3분 만에 친해지는 국민 인기 메뉴. 이 사람이 등장하면 조용하던 모임도 화기애애해지는 마법이 일어나서, 어느 약속이든 「걔도 불러」 1순위로 소환됩니다.",
        traits:["단톡방 3개 이상에서 동시 활동 중","처음 본 사람과 맞팔까지 10분 컷","분위기 죽으면 본인이 제일 못 견딤"], match:"mala", clash:"dosirak", keys:["10분맞팔","모임의중심","1순위소환"] },
      dosirak:    { emoji:"🍱", name:"가성비 효율 도시락형", short:"도시락", tag:"감성 좋지, 근데 그거 얼마인데?", rate:82, side:"전자레인지 2분 + 1+1 음료",
        desc:"군더더기 없이 실속만 챙기는 효율의 아이콘. 시간·돈·동선 낭비를 못 참는 계획형 인간이라, 같이 다니면 알아서 최적 루트가 나오는 인간 내비게이션입니다.",
        traits:["앱 3개 비교 후 최저가로만 결제","약속 전 이동 동선 시뮬레이션 완료","충동구매 대신 장바구니 2주 숙성"], match:"mintcho", clash:"tteokbokki", keys:["최저가스캔","동선시뮬완료","장바구니2주숙성"] }
    };
    var ORDER = ["mala","naengmyeon","gukbap","mintcho","tteokbokki","dosirak"];

    var QUESTIONS = [
      { q: "단톡방에 「점메추 좀」이 올라왔다. 나의 대응은?", choices: [
        { text: "「아무거나」 (진심으로 다 괜찮아서 하는 말)", scores: { naengmyeon: 2 } },
        { text: "「국밥 가자. 실패가 없다」 정석 추천", scores: { gukbap: 2 } },
        { text: "어제 뭐 먹었는지 취조 후 안 겹치는 최적 메뉴 산출", scores: { dosirak: 2 } },
        { text: "아무도 예상 못 한 메뉴를 던져 단톡방을 정적에 빠뜨림", scores: { mintcho: 2 } } ] },
      { q: "내 인생이 요리 서바이벌 프로그램이라면, 심사위원의 평가는?", choices: [
        { text: "'자극적인데… 자꾸 손이 갑니다. 이거 위험한데요'", scores: { mala: 2 } },
        { text: "'첫맛은 밍밍한데 끝에서 깊은 육수가 올라옵니다'", scores: { naengmyeon: 2 } },
        { text: "'전 국민 취향 저격. 이 맛은 미워할 수가 없어요'", scores: { tteokbokki: 2 } },
        { text: "'심사위원단 의견이 갈립니다. 지금 싸우고 있습니다'", scores: { mintcho: 2 } } ] },
      { q: "새벽 1시, 유튜브 알고리즘이 4시간짜리 먹방을 띄웠다.", choices: [
        { text: "「저걸 왜 밤에 보지」 하면서 끝까지 정주행 (동요 없음)", scores: { naengmyeon: 2 } },
        { text: "10분 만에 배달 앱 오픈. 새벽 배달비쯤은 감수한다", scores: { mala: 2 } },
        { text: "냉장고 털어 야식 끓이고 가족 몫까지 챙김", scores: { gukbap: 2 } },
        { text: "새벽 배달비는 비효율. 내일 점심 메뉴로 저장", scores: { dosirak: 2 } } ] },
      { q: "친구 넷이 배달 메뉴로 1시간째 전쟁 중이다. 나의 등판!", choices: [
        { text: "'떡볶이 세트 시켜서 다 같이 나눠 먹자!' 만장일치 유도", scores: { tteokbokki: 2 } },
        { text: "'난 이거 먹을래.' 혼자 다른 가게에서 단독 주문", scores: { mintcho: 2 } },
        { text: "각자 시키는 게 배달비 포함 총비용이 최소임을 3줄로 증명", scores: { dosirak: 2 } },
        { text: "'난 아무거나 다 좋아~' 하며 네 명 의견 다 받아줌", scores: { gukbap: 2 } } ] },
      { q: "로또 1등 당첨! 통장에 찍힌 숫자를 본 직후 나의 행동은?", choices: [
        { text: "심장 화끈. 그날 밤 일단 뭐라도 지르고 봄", scores: { mala: 2 } },
        { text: "예적금·투자 포트폴리오 엑셀부터 작성", scores: { dosirak: 2 } },
        { text: "친구들 전원 소집. '오늘 다 내가 쏜다!!'", scores: { tteokbokki: 2 } },
        { text: "아무한테도 말 안 하고 평소처럼 출근 (지만 속으로 민초 평생 구독권 결제함)", scores: { mintcho: 2 } } ] },
      { q: "외계인이 '지구 대표 음식 인간'으로 나를 납치했다. 자기소개를 해보자.", choices: [
        { text: "'지구인들이 힘들 때 가장 먼저 찾는 존재입니다'", scores: { gukbap: 2 } },
        { text: "'저 하나로 지구가 두 편으로 갈라져 싸웁니다'", scores: { mintcho: 2 } },
        { text: "'지구인 화합의 상징. 저를 싫어하는 사람을 못 봤습니다'", scores: { tteokbokki: 2 } },
        { text: "'중독성 지구 1위. 취급주의 라벨이 붙어 있습니다'", scores: { mala: 2 } } ] },
      { q: "첫 데이트. 상대가 '아무거나 괜찮아요'라고 말했다. 나의 진짜 대응은?", choices: [
        { text: "리뷰 4.8 이상 · 웨이팅 없음 · 역에서 3분 식당을 3초 만에 검색 완료", scores: { dosirak: 2 } },
        { text: "'그럼 맵기 테스트부터 갑시다.' 마라탕집으로 직행", scores: { mala: 2 } },
        { text: "실패 확률 0%의 따뜻한 국물집으로 안내", scores: { gukbap: 2 } },
        { text: "'그럼 정해지면 알려주세요.' 쿨하게 산책 시작", scores: { naengmyeon: 2 } } ] },
      { q: "단체 사진이 나왔다. 사진 속 나를 찾는 방법은?", choices: [
        { text: "가운데에서 브이. 어느 사진이든 무조건 가운데", scores: { tteokbokki: 2 } },
        { text: "맨 끝에서 시크하게 반쯤 잘려 있음", scores: { naengmyeon: 2 } },
        { text: "혼자 아무도 이해 못 할 컨셉 포즈 중", scores: { mintcho: 2 } },
        { text: "맨 뒷줄에서 다 받쳐주는 든든한 배경 담당", scores: { gukbap: 2 } } ] },
      { q: "졸업앨범 한 줄 소개에 뭐라고 적혀 있을까?", choices: [
        { text: "'건드리면 매운맛'", scores: { mala: 2 } },
        { text: "'전교생의 밥친구'", scores: { gukbap: 2 } },
        { text: "'준비물은 쟤한테 빌리면 됨'", scores: { dosirak: 2 } },
        { text: "'독보적 취향. 아무도 못 말림'", scores: { mintcho: 2 } } ] },
      { q: "성격 감정 결과지 마지막 줄, 나에게 붙은 경고 문구는?", choices: [
        { text: "'⚠️ 과다 섭취 시 얼얼함 주의'", scores: { mala: 2 } },
        { text: "'⚠️ 첫입은 밍밍해도 끊을 수 없음'", scores: { naengmyeon: 2 } },
        { text: "'⚠️ 주변인을 살찌움 (행복으로)'", scores: { tteokbokki: 2 } },
        { text: "'⚠️ 데우기 전엔 차가워 보일 수 있음'", scores: { dosirak: 2 } } ] }
    ];

    function renderResult(totals, el, api) {
      var key = Quiz.top(totals, ORDER);
      var r = TYPES[key];
      var fr = TYPES[r.match], en = TYPES[r.clash];
      el.innerHTML =
        '<span class="result-emoji">' + r.emoji + "</span>" +
        '<p class="result-name">' + r.name + "</p>" +
        '<p class="fd-tag">“' + r.tag + '”</p>' +
        '<div class="fd-rate"><span>재주문율</span>' +
          '<div class="fd-bar"><i style="width:' + r.rate + '%"></i></div><b>' + r.rate + '%</b></div>' +
        '<p class="result-desc">' + r.desc + "</p>" +
        '<ul class="fd-traits">' + r.traits.map(function (t) { return "<li>" + t + "</li>"; }).join("") + '</ul>' +
        '<p class="fd-item">🥢 소울 사이드 — <b>' + r.side + '</b></p>' +
        '<div class="fd-chemi">' +
          '<span>🤝 최고의 밥약 짝꿍 <b>' + fr.emoji + ' ' + fr.short + '</b></span>' +
          '<span>💥 같이 시키면 대참사 <b>' + en.emoji + ' ' + en.short + '</b></span>' +
        '</div>' +
        '<div id="card-slot"></div>' +
        '<div class="result-actions">' +
        '<button class="btn-primary" id="qz-retry">다시하기</button>' +
        '<button class="btn-ghost" id="qz-share">링크 복사</button></div>';
      el.querySelector("#card-slot").appendChild(ShareCard.render({
        palette: "orange", emoji: r.emoji, badge: "음식형 인간", title: r.name,
        lines: ["“" + r.tag + "”", "재주문율 " + r.rate + "%", "소울 사이드: " + r.side]
      }));
      el.querySelector("#qz-retry").onclick = api.restart;
      el.querySelector("#qz-share").onclick = function () { api.shareLink(el.querySelector("#qz-share")); };
      if (window.GoblubFeed && GoblubFeed.record) GoblubFeed.record("foodtype", { emoji: r.emoji, title: (r.short || r.name), tags: r.keys });
    }

    Quiz.init(document.getElementById("quiz"), {
      emoji: "🍜", title: "나는 무슨 음식형 인간?",
      intro: "내 성격을 음식으로 환산하면 무슨 맛일까? 10문항이면 재주문율과 소울 사이드까지 나온다.",
      feedSrc: "foodtype", questions: QUESTIONS, renderResult: renderResult
    });
  </script>
</body>
</html>
