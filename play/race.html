<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고브럽 생존 레이스 — goblub</title>
  <meta name="description" content="운석이 쏟아지는 우주 트랙 — 순위가 계속 뒤집히다 꼴찌 한 명이 걸린다" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=cl2" />
  <style>
    .item-row { display:flex; gap:8px; margin-bottom:8px; }
    .item-row .idx { width:26px; flex:none; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:.9rem; }
    .item-input { flex:1; min-width:0; font-family:inherit; font-size:.98rem; padding:10px 12px;
      border:2px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); }
    .item-input:focus { outline:none; border-color:var(--sky); box-shadow:0 0 10px color-mix(in srgb, var(--sky) 40%, transparent); }
    .item-del { width:42px; flex:none; background:var(--cream); border:1.5px solid var(--line); border-radius:10px;
      color:var(--ink-soft); font-size:1.3rem; line-height:1; cursor:pointer; }
    .item-del:hover:not(:disabled) { border-color:var(--coral); color:var(--coral); }
    .item-del:disabled { opacity:.35; cursor:default; }
    #btn-add { width:100%; margin:4px 0; }
    #btn-add:disabled { opacity:.45; cursor:default; }
    .err-msg { text-align:center; color:var(--coral); font-weight:bold; margin:8px 0; }
    .mode-row { display:flex; gap:8px; justify-content:center; margin-bottom:12px; }
    .mode-row button.on { background:var(--sky); color:#0d1730; border-color:var(--sky); }

    .track-wrap { position:relative; margin:14px auto 6px; width:100%; max-width:560px;
      border-radius:18px; overflow:hidden; background:#080d1c;
      box-shadow:0 18px 44px rgba(0,8,24,.55), inset 0 0 0 1px rgba(255,255,255,.06); }
    .track-wrap canvas { display:block; width:100%; height:auto; }
    .track-wrap.shake { animation:tshake .3s ease; }
    @keyframes tshake { 0%,100%{transform:translate(0,0)} 25%{transform:translate(-6px,3px)}
      55%{transform:translate(5px,-3px)} 80%{transform:translate(-3px,1px)} }
    .track-wrap.final::after { content:""; position:absolute; inset:0; pointer-events:none;
      box-shadow:inset 0 0 90px rgba(255,90,90,.5); animation:fpulse .6s ease-in-out infinite; }
    @keyframes fpulse { 0%,100%{opacity:.3} 50%{opacity:.9} }

    .hud { display:flex; justify-content:space-between; align-items:center; gap:10px;
      max-width:560px; margin:0 auto; padding:0 4px; color:var(--ink-soft); font-size:.9rem; }
    .hud .big { color:var(--ink); font-size:1.02rem; }

    .rank { max-width:560px; margin:12px auto 0; display:none; }
    .rank .r { display:flex; align-items:center; gap:10px; padding:8px 12px; margin-bottom:6px;
      background:var(--cream); border:1.5px solid var(--line); border-radius:12px; }
    .rank .r.loser { border-color:var(--coral); background:color-mix(in srgb, var(--coral) 18%, var(--cream)); }
    .rank .r .no { width:30px; flex:none; text-align:center; color:var(--ink-soft); }
    .rank .r .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .rank .r .tag { flex:none; font-size:.85rem; color:var(--ink-soft); }

    .winner { text-align:center; margin-top:14px; display:none; }
    .winner .tag { display:inline-block; font-size:.86rem; color:var(--ink-soft); margin-bottom:2px; }
    .winner .who { font-size:1.9rem; line-height:1.35; word-break:keep-all; }
    .winner.pop { animation:wpop .5s cubic-bezier(.2,1.5,.4,1); }
    @keyframes wpop { from{transform:scale(.5); opacity:0} to{transform:scale(1); opacity:1} }
  </style>
</head>
<body class="clay">
  <div id="site-header"></div>
  <main>
    <section class="hero">
      <h1><span class="e">🏁</span> 고브럽 생존 레이스</h1>
      <p>운석이 쏟아지는 우주 트랙 — 순위가 계속 뒤집힌다</p>
    </section>

    <section class="panel">
      <div id="setup">
        <h2 style="text-align:center">달릴 사람을 넣으세요</h2>
        <div class="mode-row">
          <button class="btn-ghost on" id="mode-last" type="button">🔥 꼴찌가 걸림</button>
          <button class="btn-ghost" id="mode-first" type="button">👑 1등만 뽑기</button>
        </div>
        <div id="item-list"></div>
        <button class="btn-ghost" id="btn-add" type="button">＋ 참가자 추가</button>
        <p class="fine-print" style="text-align:center; margin:2px 0 0">이름을 하나씩 (2~8명)</p>
        <p class="err-msg" id="err" style="display:none"></p>
      </div>

      <div class="hud" id="hud" style="display:none">
        <span id="hud-left">🏁 출발!</span>
        <span class="big" id="hud-right"></span>
      </div>
      <div class="track-wrap" id="track-wrap"><canvas id="cv" width="1120" height="900"></canvas></div>

      <div class="winner" id="winner">
        <span class="tag" id="winner-tag">🔥 걸렸습니다</span>
        <p class="who" id="winner-who"></p>
      </div>
      <div class="rank" id="rank"></div>

      <div class="result-actions">
        <button class="btn-primary" id="btn-go">🏁 출발!</button>
        <button class="btn-ghost" id="btn-again" style="display:none">↺ 한 번 더</button>
        <button class="btn-ghost" id="btn-edit" style="display:none">✎ 참가자 고치기</button>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="../js/common.js?v=11" data-root=".."></script>
  <script src="js/feed.js?v=7"></script>
  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var MIN = 2, MAX = 8;
    var SKIN = ["#ffd479", "#8fe0a6", "#8fc4ff", "#ff9aa8", "#d3a8ff", "#7fdede", "#ffb185", "#f5a9d0"];
    var mode = "last";                       // last = 꼴찌가 걸림, first = 1등 뽑기

    /* ── 참가자 입력 ─────────────────────────────── */
    var list = $("item-list");
    function rows() { return list.querySelectorAll(".item-row"); }
    function updateUI() {
      var n = rows().length;
      Array.prototype.forEach.call(rows(), function (r, i) {
        r.querySelector(".idx").textContent = i + 1;
        r.querySelector(".item-del").disabled = n <= MIN;
      });
      $("btn-add").disabled = n >= MAX;
    }
    function addRow(val) {
      if (rows().length >= MAX) return;
      var row = document.createElement("div");
      row.className = "item-row";
      row.innerHTML = '<span class="idx"></span>' +
        '<input class="item-input" type="text" maxlength="10" placeholder="이름" />' +
        '<button class="item-del" type="button" aria-label="삭제">×</button>';
      row.querySelector(".item-input").value = val || "";
      row.querySelector(".item-del").onclick = function () {
        if (rows().length <= MIN) return;
        row.remove(); updateUI();
      };
      list.appendChild(row);
      updateUI();
    }
    function readItems() {
      var out = [];
      Array.prototype.forEach.call(rows(), function (r) {
        var v = r.querySelector(".item-input").value.trim();
        if (v) out.push(v);
      });
      return out;
    }
    $("btn-add").onclick = function () { addRow(""); };
    ["", "", "", ""].forEach(function () { addRow(""); });
    function showErr(m) { var e = $("err"); e.textContent = m; e.style.display = "block"; }
    function hideErr() { $("err").style.display = "none"; }
    $("mode-last").onclick = function () { mode = "last"; this.classList.add("on"); $("mode-first").classList.remove("on"); };
    $("mode-first").onclick = function () { mode = "first"; this.classList.add("on"); $("mode-last").classList.remove("on"); };

    /* ── 트랙 ─────────────────────────────────────── */
    var cv = $("cv"), g = cv.getContext("2d");
    var W = cv.width, H = cv.height;
    var LEFT = 90, RIGHT = W - 120;          // 출발선 ~ 결승선
    var runners = [], stars = [], rocks = [];
    for (var i = 0; i < 90; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2 + .6, s: Math.random() * .5 + .2 });

    function laneY(i, n) { var top = 120, bot = H - 90; return top + (bot - top) * (n === 1 ? .5 : i / (n - 1)); }

    function drawGoblub(x, y, col, squash, dead) {
      g.save(); g.translate(x, y);
      var sx = 1 + squash * .25, sy = 1 - squash * .25;
      g.scale(sx, sy);
      if (dead) g.globalAlpha = .35;
      g.beginPath(); g.ellipse(0, 26, 26, 8, 0, 0, 6.284);      // 그림자
      g.fillStyle = "rgba(0,0,0,.35)"; g.fill();
      g.beginPath(); g.arc(0, 0, 24, 0, 6.284);                  // 몸
      var bg = g.createRadialGradient(-8, -9, 4, 0, 0, 26);
      bg.addColorStop(0, "#ffffff"); bg.addColorStop(.35, col); bg.addColorStop(1, col);
      g.fillStyle = bg; g.fill();
      g.fillStyle = "#1b2440";                                    // 눈
      if (dead) {
        g.lineWidth = 3; g.strokeStyle = "#1b2440";
        [-9, 9].forEach(function (ex) {
          g.beginPath(); g.moveTo(ex - 5, -8); g.lineTo(ex + 5, 2);
          g.moveTo(ex + 5, -8); g.lineTo(ex - 5, 2); g.stroke();
        });
      } else {
        g.beginPath(); g.arc(-9, -4, 4.5, 0, 6.284); g.fill();
        g.beginPath(); g.arc(9, -4, 4.5, 0, 6.284); g.fill();
      }
      g.restore(); g.globalAlpha = 1;
    }

    function draw(t, n, finalPhase) {
      g.clearRect(0, 0, W, H);
      var bg = g.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#0b1130"); bg.addColorStop(1, "#131a3c");
      g.fillStyle = bg; g.fillRect(0, 0, W, H);
      stars.forEach(function (s) {                                 // 흐르는 별 (속도감)
        s.x -= s.s * 3; if (s.x < 0) s.x = W;
        g.globalAlpha = .5; g.fillStyle = "#cfe0ff";
        g.fillRect(s.x, s.y, s.r, s.r);
      });
      g.globalAlpha = 1;

      // 레인
      for (var i = 0; i < n; i++) {
        var y = laneY(i, n);
        g.strokeStyle = "rgba(150,180,255,.14)"; g.lineWidth = 2;
        g.setLineDash([14, 12]); g.beginPath(); g.moveTo(LEFT, y + 34); g.lineTo(RIGHT + 60, y + 34); g.stroke();
        g.setLineDash([]);
      }
      // 결승선
      for (var b = 0; b < 22; b++) {
        g.fillStyle = b % 2 ? "#ffffff" : "#222a44";
        g.fillRect(RIGHT, 100 + b * ((H - 180) / 22), 16, (H - 180) / 22);
      }
      g.fillStyle = "#ffe6b8"; g.font = "600 30px 'Jua', sans-serif";
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText("FINISH", RIGHT + 58, 74);

      // 운석
      rocks.forEach(function (r) {
        g.save(); g.translate(r.x, r.y); g.rotate(r.rot);
        g.beginPath(); g.arc(0, 0, r.r, 0, 6.284);
        g.fillStyle = "#7a6350"; g.fill();
        g.fillStyle = "#5b4a3c"; g.beginPath(); g.arc(-r.r * .3, -r.r * .2, r.r * .3, 0, 6.284); g.fill();
        g.restore();
        g.beginPath(); g.moveTo(r.x, r.y - r.r); g.lineTo(r.x + 6, r.y - r.r - 34);
        g.strokeStyle = "rgba(255,170,90,.55)"; g.lineWidth = 5; g.stroke();
      });

      // 주자
      runners.forEach(function (rn, i) {
        var y = laneY(i, n);
        var x = LEFT + (RIGHT - LEFT) * rn.p;
        var bob = Math.sin(t / 90 + i) * 5;
        drawGoblub(x, y + bob, SKIN[i % SKIN.length], rn.squash, rn.done && mode === "last" && rn.rank === n);
        if (rn.squash > 0) rn.squash -= .08;
        g.fillStyle = "#e9f0ff"; g.font = "600 26px 'Jua', sans-serif";
        g.textAlign = "right"; g.textBaseline = "middle";
        g.fillText(rn.name.length > 5 ? rn.name.slice(0, 5) + "…" : rn.name, LEFT - 14, y);
        if (rn.rank) {                                             // 도착 순위 배지
          g.textAlign = "left";
          g.fillStyle = rn.rank === 1 ? "#ffd479" : "#9fb2d8";
          g.fillText(rn.rank + "위", RIGHT + 22, y);
        }
      });
    }

    /* ── 경주 ─────────────────────────────────────
       순위를 먼저 균등 무작위로 정하고, 그 결과에 맞게 속도를 흔든다.
       달리는 동안은 계속 뒤집히지만 결승 순서는 처음 뽑은 대로 간다.  */
    var busy = false, raf = 0;
    function start() {
      var names = readItems();
      if (names.length < MIN) return showErr("이름을 " + MIN + "개 이상 넣어주세요");
      hideErr();
      busy = true;
      $("btn-go").disabled = true;
      $("btn-again").style.display = "none"; $("btn-edit").style.display = "none";
      $("winner").style.display = "none"; $("winner").classList.remove("pop");
      $("rank").style.display = "none"; $("rank").innerHTML = "";
      $("setup").style.display = "none"; $("hud").style.display = "flex";
      var wrap = $("track-wrap");
      wrap.classList.remove("final");
      if (wrap.scrollIntoView) wrap.scrollIntoView({ behavior: "smooth", block: "center" });

      var n = names.length;
      var order = names.map(function (_, i) { return i; });        // 최종 순위(피셔-예이츠)
      for (var j = order.length - 1; j > 0; j--) {
        var k = Math.floor(Math.random() * (j + 1));
        var tmp = order[j]; order[j] = order[k]; order[k] = tmp;
      }
      var finishRank = [];
      order.forEach(function (idx, place) { finishRank[idx] = place + 1; });

      // 등수별 도착 시각을 못 박는다. 도중엔 크게 흔들리지만 그 흔들림이
      // 결승선 앞에서 0으로 잦아들어, 실제 도착 순서 = 미리 뽑은 순위가 된다.
      var FIRST_AT = 19000, STEP_T = 1100;
      runners = names.map(function (nm, i) {
        return { name: nm, p: 0, squash: 0, rank: 0, done: false, pen: 0,
                 finishAt: FIRST_AT + (finishRank[i] - 1) * STEP_T,
                 phase: Math.random() * 6.28, amp: .07 + Math.random() * .05 };
      });
      rocks = [];
      var t0 = performance.now(), last = t0, done = 0, finalOn = false;

      function tick(now) {
        var dt = Math.min(48, now - last); last = now;
        var el = now - t0;

        // 운석 — 맞으면 잠깐 주춤(연출)
        if (Math.random() < .05 && el < FIRST_AT - 2500) {
          rocks.push({ x: LEFT + Math.random() * (RIGHT - LEFT), y: -30,
            r: 12 + Math.random() * 14, rot: 0, vy: 5 + Math.random() * 4 });
        }
        rocks.forEach(function (r) { r.y += r.vy * (dt / 16.67); r.rot += .07; });
        rocks = rocks.filter(function (r) { return r.y < H + 40; });

        runners.forEach(function (rn, i) {
          if (rn.done) return;
          var y = laneY(i, n);
          var x = LEFT + (RIGHT - LEFT) * rn.p;
          rocks.forEach(function (r) {
            if (r.hit) return;
            if (Math.abs(r.x - x) < 26 + r.r && Math.abs(r.y - y) < 26 + r.r) {
              r.hit = 1; rn.squash = 1;
              rn.pen = Math.min(.07, rn.pen + .04);      // 잠깐 주춤
              wrap.classList.add("shake");
              setTimeout(function () { wrap.classList.remove("shake"); }, 300);
            }
          });
          rn.pen *= Math.pow(.986, dt / 16.67);
          var f = el / rn.finishAt;                       // 예정 진행도
          // 흔들림·주춤은 (1-f²)로 잦아든다 → 막판엔 예정 순서 그대로
          var fade = Math.max(0, 1 - f * f);
          var wave = Math.sin(el / 520 + rn.phase) * rn.amp * fade;
          rn.p = Math.max(0, Math.min(1, f + wave - rn.pen * fade));
          if (rn.p >= 1) { rn.p = 1; rn.done = true; done++; rn.rank = done; }
        });

        // 마지막 한 명 남으면 화면을 붉게
        if (!finalOn && done === n - 1) { finalOn = true; wrap.classList.add("final"); }

        // 실시간 순위 표시
        var live = runners.map(function (r, i) { return { i: i, p: r.p }; })
          .sort(function (a, b) { return b.p - a.p; });
        $("hud-left").textContent = "🥇 " + runners[live[0].i].name;
        $("hud-right").textContent = done + " / " + n + " 도착";

        draw(el, n, finalOn);

        if (done < n) { raf = requestAnimationFrame(tick); }
        else finish(finishRank, names, n);
      }
      raf = requestAnimationFrame(tick);
    }

    function finish(finishRank, names, n) {
      var wrap = $("track-wrap");
      wrap.classList.remove("final");
      wrap.classList.add("shake");
      setTimeout(function () { wrap.classList.remove("shake"); }, 320);

      var loserIdx = 0, firstIdx = 0;
      for (var i = 0; i < n; i++) { if (finishRank[i] === n) loserIdx = i; if (finishRank[i] === 1) firstIdx = i; }
      var pick = mode === "last" ? loserIdx : firstIdx;

      $("winner-tag").textContent = mode === "last" ? "🔥 꼴찌 — 걸렸습니다" : "👑 1등";
      $("winner-who").textContent = names[pick];
      $("winner").style.display = "block";
      void $("winner").offsetWidth; $("winner").classList.add("pop");

      var box = $("rank");
      var sorted = names.map(function (nm, i) { return { nm: nm, r: finishRank[i] }; })
        .sort(function (a, b) { return a.r - b.r; });
      box.innerHTML = sorted.map(function (s) {
        var isLoser = s.r === n;
        var medal = s.r === 1 ? "🥇" : s.r === 2 ? "🥈" : s.r === 3 ? "🥉" : s.r + "위";
        return '<div class="r' + (isLoser && mode === "last" ? " loser" : "") + '">' +
          '<span class="no">' + medal + "</span>" +
          '<span class="nm">' + s.nm.replace(/[<>&]/g, "") + "</span>" +
          '<span class="tag">' + (isLoser ? "꼴찌" : "") + "</span></div>";
      }).join("");
      box.style.display = "block";

      $("hud-left").textContent = "🏁 경주 종료";
      $("btn-go").style.display = "none";
      $("btn-again").style.display = ""; $("btn-edit").style.display = "";
      busy = false;
      if (window.GoblubFeed) GoblubFeed.grant("race");
      if (window.gbTrack) window.gbTrack("minigame_play", { game: "race", players: n, mode: mode, result: names[pick] });
    }

    $("btn-go").onclick = function () { if (!busy) start(); };
    $("btn-again").onclick = function () { $("btn-go").style.display = ""; $("btn-go").disabled = false; start(); };
    $("btn-edit").onclick = function () {
      if (raf) cancelAnimationFrame(raf);
      $("setup").style.display = ""; $("hud").style.display = "none";
      $("winner").style.display = "none"; $("rank").style.display = "none";
      $("btn-go").style.display = ""; $("btn-go").disabled = false;
      $("btn-again").style.display = "none"; $("btn-edit").style.display = "none";
      busy = false;
      runners = []; rocks = []; draw(0, Math.max(2, readItems().length), false);
    };

    draw(0, 4, false);
  })();
  </script>
</body>
</html>
