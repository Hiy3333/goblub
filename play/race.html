<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고브럽 생존 레이스 — goblub</title>
  <meta name="description" content="운석이 쏟아지는 우주 트랙 — 순위가 계속 뒤집히다 마지막 한 명이 걸린다" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=cl2" />
  <style>
    .item-row { display:flex; gap:8px; margin-bottom:8px; }
    .item-row .idx { width:26px; flex:none; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:.9rem; }
    .item-input { flex:1; min-width:0; font-family:inherit; font-size:.98rem; padding:10px 12px;
      border:2px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); }
    .item-input:focus { outline:none; border-color:var(--sky); box-shadow:0 0 10px color-mix(in srgb, var(--sky) 40%, transparent); }
    .item-del { width:42px; flex:none; background:var(--cream); border:1.5px solid var(--line); border-radius:10px;
      color:var(--ink-soft); font-size:1.3rem; line-height:1; cursor:pointer; }
    .item-del:hover:not(:disabled) { border-color:var(--coral); color:var(--coral); }
    .item-del:disabled { opacity:.35; cursor:default; }
    #btn-add { width:100%; margin:4px 0; }
    #btn-add:disabled { opacity:.45; cursor:default; }
    .err-msg { text-align:center; color:var(--coral); font-weight:bold; margin:8px 0; }
    .pick-row { display:flex; gap:8px; align-items:center; justify-content:center; margin:0 0 14px; }
    .pick-row select { font-family:inherit; font-size:1.02rem; padding:8px 12px;
      border:2px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); }
    .pick-row span { color:var(--ink-soft); }

    .track-wrap { position:relative; margin:14px auto 6px; width:100%; max-width:620px;
      border-radius:18px; overflow:hidden; background:#04060f;
      box-shadow:0 22px 54px rgba(0,6,20,.62), inset 0 0 0 1px rgba(255,255,255,.07); }
    .track-wrap canvas { display:block; width:100%; height:auto; }
    /* 극장 모드 — 레이스 동안 화면 전체를 쓴다 */
    body.theater { overflow:hidden; }
    body.theater .track-wrap { position:fixed; inset:0; max-width:none; margin:0;
      border-radius:0; z-index:998; box-shadow:none; }
    body.theater .track-wrap canvas { width:100%; height:100%; object-fit:contain; }
    body.theater .hud { position:fixed; top:10px; left:50%; transform:translateX(-50%);
      z-index:999; max-width:none; width:auto; gap:18px; padding:8px 18px;
      background:rgba(6,12,26,.62); border:1px solid rgba(255,255,255,.14);
      border-radius:999px; backdrop-filter:blur(6px); }
    body.theater .hud span { color:#e8eeff; }
    body.theater .live { left:14px; top:14px; }
    body.theater .live .lr { font-size:.94rem; }
    .track-wrap.shake { animation:tshake .28s ease; }
    @keyframes tshake { 0%,100%{transform:translate(0,0)} 25%{transform:translate(-7px,4px)}
      55%{transform:translate(6px,-4px)} 80%{transform:translate(-3px,1px)} }
    .track-wrap.final::after { content:""; position:absolute; inset:0; pointer-events:none;
      box-shadow:inset 0 0 110px rgba(255,72,72,.62); animation:fpulse .55s ease-in-out infinite; }
    @keyframes fpulse { 0%,100%{opacity:.28} 50%{opacity:1} }

    /* 실시간 순위 — 자리가 바뀔 때 스르륵 이동 */
    .live { position:absolute; left:10px; top:10px; z-index:3; pointer-events:none;
      display:flex; flex-direction:column; gap:4px; }
    .live .lr { display:flex; align-items:center; gap:6px; padding:3px 9px 3px 5px;
      background:rgba(6,12,26,.66); border:1px solid rgba(255,255,255,.14); border-radius:999px;
      backdrop-filter:blur(5px); font-size:.78rem; color:#e8eeff; transition:transform .32s cubic-bezier(.3,1.3,.4,1); }
    .live .lr .dot { width:9px; height:9px; border-radius:50%; flex:none; }
    .live .lr .pos { color:#9fb2d8; min-width:14px; }
    .live .lr.lead { background:rgba(255,203,92,.92); color:#221704; border-color:#ffd479; }
    .live .lr.lead .pos { color:#6b4c07; }

    .count { position:absolute; inset:0; z-index:4; display:none; align-items:center; justify-content:center;
      font-size:6rem; color:#fff; text-shadow:0 0 40px rgba(120,180,255,.9); }
    .count.on { display:flex; }
    .count span { animation:cpop .7s ease-out; }
    @keyframes cpop { from{transform:scale(2.4); opacity:0} 40%{transform:scale(1); opacity:1} to{transform:scale(.75); opacity:0} }

    .hud { display:flex; justify-content:space-between; align-items:center; gap:10px;
      max-width:620px; margin:0 auto; padding:0 4px; color:var(--ink-soft); font-size:.9rem; }
    .hud .big { color:var(--ink); font-size:1.02rem; }
    .hud .mutebtn { border:1.5px solid var(--line); background:transparent; border-radius:999px;
      padding:2px 10px; cursor:pointer; font-size:1rem; color:inherit; line-height:1.4; }

    .rank { max-width:620px; margin:12px auto 0; display:none; }
    .rank .r { display:flex; align-items:center; gap:10px; padding:8px 12px; margin-bottom:6px;
      background:var(--cream); border:1.5px solid var(--line); border-radius:12px; }
    .rank .r.loser { border-color:var(--coral); background:color-mix(in srgb, var(--coral) 18%, var(--cream)); }
    .rank .r .no { width:34px; flex:none; text-align:center; color:var(--ink-soft); }
    .rank .r .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .rank .r .tag { flex:none; font-size:.85rem; color:var(--ink-soft); }

    .winner { text-align:center; margin-top:14px; display:none; }
    .winner .tag { display:inline-block; font-size:.86rem; color:var(--ink-soft); margin-bottom:2px; }
    .winner .who { font-size:1.9rem; line-height:1.35; word-break:keep-all; }
    .winner.pop { animation:wpop .5s cubic-bezier(.2,1.5,.4,1); }
    @keyframes wpop { from{transform:scale(.5); opacity:0} to{transform:scale(1); opacity:1} }
  </style>
</head>
<body class="clay">
  <div id="site-header"></div>
  <main>
    <section class="hero">
      <h1><span class="e">🏁</span> 고브럽 생존 레이스</h1>
      <p>운석이 쏟아지는 우주 트랙 — 순위가 끝까지 뒤집힌다</p>
    </section>

    <section class="panel">
      <div id="setup">
        <h2 style="text-align:center">달릴 사람을 넣으세요</h2>
        <p class="pick-row">
          <select id="pick-rank" aria-label="걸릴 등수"></select>
          <span>가 걸립니다</span>
        </p>
        <div id="item-list"></div>
        <button class="btn-ghost" id="btn-add" type="button">＋ 참가자 추가</button>
        <p class="fine-print" style="text-align:center; margin:2px 0 0">이름을 하나씩 (2~8명)</p>
        <p class="err-msg" id="err" style="display:none"></p>
      </div>

      <div class="hud" id="hud" style="display:none">
        <span id="hud-left">🏁 출발 준비</span>
        <span class="big" id="hud-right"></span>
        <button class="mutebtn" id="btn-mute" type="button" aria-label="소리 켜기/끄기">🔊</button>
      </div>
      <div class="track-wrap" id="track-wrap">
        <canvas id="cv" width="1240" height="800"></canvas>
        <div class="live" id="live"></div>
        <div class="count" id="count"></div>
      </div>

      <div class="winner" id="winner">
        <span class="tag" id="winner-tag">🔥 걸렸습니다</span>
        <p class="who" id="winner-who"></p>
      </div>
      <div class="rank" id="rank"></div>

      <div class="result-actions">
        <button class="btn-primary" id="btn-go">🏁 출발!</button>
        <button class="btn-ghost" id="btn-again" style="display:none">↺ 한 번 더</button>
        <button class="btn-ghost" id="btn-edit" style="display:none">✎ 참가자 고치기</button>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="../js/common.js?v=11" data-root=".."></script>
  <script src="js/feed.js?v=7"></script>
  <script src="js/goblub-art.js"></script>
  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var MIN = 2, MAX = 8;
    var SKIN = ["#ffd479", "#8fe0a6", "#8fc4ff", "#ff9aa8", "#d3a8ff", "#7fdede", "#ffb185", "#f5a9d0"];

    /* ── 참가자 입력 ─────────────────────────────── */
    var list = $("item-list");
    function rows() { return list.querySelectorAll(".item-row"); }
    function updateUI() {
      var n = rows().length;
      Array.prototype.forEach.call(rows(), function (r, i) {
        r.querySelector(".idx").textContent = i + 1;
        r.querySelector(".item-del").disabled = n <= MIN;
      });
      $("btn-add").disabled = n >= MAX;
      if (window.__syncRanks) window.__syncRanks();   // 인원이 바뀌면 등수 목록도 따라간다
    }
    function addRow(val) {
      if (rows().length >= MAX) return;
      var row = document.createElement("div");
      row.className = "item-row";
      row.innerHTML = '<span class="idx"></span>' +
        '<input class="item-input" type="text" maxlength="10" placeholder="이름" />' +
        '<button class="item-del" type="button" aria-label="삭제">×</button>';
      row.querySelector(".item-input").value = val || "";
      row.querySelector(".item-del").onclick = function () {
        if (rows().length <= MIN) return;
        row.remove(); updateUI();
      };
      list.appendChild(row);
      updateUI();
    }
    function readItems() {
      var out = [];
      Array.prototype.forEach.call(rows(), function (r) {
        var v = r.querySelector(".item-input").value.trim();
        if (v) out.push(v);
      });
      return out;
    }
    $("btn-add").onclick = function () { addRow(""); };
    function showErr(m) { var e = $("err"); e.textContent = m; e.style.display = "block"; }
    function hideErr() { $("err").style.display = "none"; }

    // 걸릴 등수 — 참가자 수에 맞춰 자동으로 채운다(없는 등수를 못 고르게)
    var pick = $("pick-rank");
    function syncRanks() {
      var n = Math.max(MIN, rows().length);
      var keep = pick.value || String(n);
      pick.innerHTML = "";
      for (var r = 1; r <= n; r++) {
        var o = document.createElement("option");
        o.value = r;
        o.textContent = r === 1 ? "🥇 1등" : r === n ? "🔥 꼴찌(" + r + "등)" : r + "등";
        pick.appendChild(o);
      }
      var ro = document.createElement("option");            // 맨 아래 랜덤
      ro.value = "random"; ro.textContent = "🎲 랜덤 (몇 등일지 비밀)";
      pick.appendChild(ro);
      pick.value = keep === "random" ? "random" : String(Math.min(+keep || n, n));
    }
    window.__syncRanks = syncRanks;
    for (var q = 0; q < 4; q++) addRow("");
    syncRanks();

    /* ── 캐릭터 이미지 — 고브럽 SVG 를 색만 갈아 끼워 굽는다 ── */
    var sprites = {};
    function lighten(hex, amt) {
      var r = parseInt(hex.slice(1, 3), 16), gg = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
      function m(v) { return Math.round(v + (255 - v) * amt); }
      return "#" + [m(r), m(gg), m(b)].map(function (v) { return ("0" + v.toString(16)).slice(-2); }).join("");
    }
    function bake(color) {
      if (sprites[color]) return sprites[color];
      var s = window.GoblubArt ? GoblubArt.svg(240) : "";
      s = s.replace(/#9a8ac2/g, color)                 // 몸통
           .replace(/#ab9dd4/g, lighten(color, .22))   // 하이라이트
           .replace(/#8877ad/g, lighten(color, -.0));  // 팔다리(그대로 두면 대비가 산다)
      var img = new Image();
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
      sprites[color] = img;
      return img;
    }
    SKIN.forEach(bake);

    /* ── 효과음 — 파일 없이 Web Audio 로 합성. 🔊 버튼으로 끌 수 있다 ── */
    var AC = null, master = null, muted = false;
    function audioInit() {
      if (AC) return;
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        master = AC.createGain(); master.gain.value = .5; master.connect(AC.destination);
      } catch (e) { AC = null; }
    }
    function tone(freq, type, dur, vol, slideTo) {
      if (!AC || muted) return;
      var o = AC.createOscillator(), gn = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, AC.currentTime);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, AC.currentTime + dur);
      gn.gain.setValueAtTime(vol, AC.currentTime);
      gn.gain.exponentialRampToValueAtTime(.001, AC.currentTime + dur);
      o.connect(gn); gn.connect(master);
      o.start(); o.stop(AC.currentTime + dur);
    }
    function hiss(dur, vol, cut) {
      if (!AC || muted) return;
      var len = Math.max(1, Math.floor(AC.sampleRate * dur));
      var buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      var src = AC.createBufferSource(); src.buffer = buf;
      var f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cut || 1000;
      var gn = AC.createGain();
      gn.gain.setValueAtTime(vol, AC.currentTime);
      gn.gain.exponentialRampToValueAtTime(.001, AC.currentTime + dur);
      src.connect(f); f.connect(gn); gn.connect(master); src.start();
    }
    var sfx = {
      thump: function () { tone(62, "sine", .16, .5); setTimeout(function () { tone(48, "sine", .2, .38); }, 140); },
      hit: function () { hiss(.12, .5, 700); tone(95, "triangle", .16, .32, 55); },
      crackle: function () { hiss(.05, .3, 2600); },
      whoosh: function () { tone(560, "sine", .55, .3, 85); },
      pop: function () { tone(300, "triangle", .12, .32, 540); },
      boom: function () { hiss(.7, .85, 320); tone(72, "sine", .6, .55, 34); }
    };
    $("btn-mute").onclick = function () {
      muted = !muted; this.textContent = muted ? "🔇" : "🔊";
    };

    /* ── 월드 / 카메라 ───────────────────────────── */
    var cv = $("cv"), g = cv.getContext("2d");
    var VW = cv.width, VH = cv.height;
    var TRACK = 12000;                     // 월드 트랙 길이 — 길수록 배경이 빨리 흐른다
    var GROUND = VH - 150;
    // fx = 완충된 초점 x, tgt = 따라가는 주자, pend/pendT = 대상 전환 대기
    var cam = { x: 0, z: 1, v: 0, fx: null, tgt: -1, pend: -1, pendT: 0 };
    var runners = [], rocks = [], bits = [], orbs = [], farStars = [], midStars = [], fgDust = [];
    var SPAN = TRACK * 1.3;
    for (var i = 0; i < 190; i++) farStars.push({ x: Math.random() * SPAN, y: Math.random() * VH, r: Math.random() * 1.8 + .5 });
    for (var i2 = 0; i2 < 30; i2++) midStars.push({ x: Math.random() * SPAN, y: Math.random() * (VH * .7), r: Math.random() * 26 + 10, h: Math.random() });
    // 전경 먼지 — 카메라보다 빨리 흘러 화면 앞을 스쳐 지나간다. 속도감의 8할
    for (var i3 = 0; i3 < 34; i3++) fgDust.push({ x: Math.random() * SPAN, y: Math.random() * VH, r: Math.random() * 3.4 + 1.6 });

    // 레인은 화면 세로의 대부분을 쓴다. 예전엔 210~630(52%)만 써서 위아래가
    // 휑하게 비었다.
    function laneY(i, n) {
      var top = 150, bot = VH - 120;
      return n === 1 ? (top + bot) / 2 : top + (bot - top) * i / (n - 1);
    }

    /* ── 보스 · 소용돌이 · 우주선 ─────────────────── */
    var BOSS_P = .70;        // 보스 체력은 인원에 따라 정해진다(start 참조)
    // 블랙홀은 월드에 놓인 물체다. 반지름도 월드 단위여야 줌이 변해도
    // 주자와 비율이 유지된다.
    var VORTEX_R = 640;   // 월드 반지름 — 고정 배율 0.42 에서 화면 지름 약 538px
    var vortex = null, ship = null, holeDone = false;

    function drawVortex(camX, scale, t) {
      if (!vortex) return;
      // 블랙홀도 월드에 박혀 있다 — 화면에 고정하면 카메라가 움직일 때 혼자 따라온다
      var sx = (vortex.x - camX) * scale + VW / 2, cy = VH * .5;
      var close = vortex.fade ? Math.max(0, 1 - vortex.fade / 700) : 1;
      var R = VORTEX_R * scale * Math.min(1, vortex.t / 520) * close;
      if (R < 2) return;
      g.globalAlpha = close;
      g.save(); g.translate(sx, cy);
      // 바깥 자기장 헤일로
      var hg = g.createRadialGradient(0, 0, R * .2, 0, 0, R * 2.0);
      hg.addColorStop(0, "rgba(180,120,255,.85)"); hg.addColorStop(.45, "rgba(110,60,210,.45)");
      hg.addColorStop(1, "rgba(50,20,120,0)");
      g.fillStyle = hg; g.beginPath(); g.arc(0, 0, R * 2.0, 0, 6.284); g.fill();
      // 자기장 선 — 바깥에서 안으로 빨려드는 곡선
      g.save(); g.rotate(t / 900);
      for (var f2 = 0; f2 < 10; f2++) {
        g.beginPath();
        for (var q2 = 0; q2 <= 40; q2++) {
          var u = q2 / 40;
          var th2 = f2 * .628 + u * 2.2, rr2 = R * (1.95 - u * .95);
          g[q2 ? "lineTo" : "moveTo"](Math.cos(th2) * rr2, Math.sin(th2) * rr2 * .55);
        }
        g.strokeStyle = "rgba(196,158,255," + (.30 - f2 * .015) + ")";
        g.lineWidth = 3; g.stroke();
      }
      g.restore();
      // 강착원반 — 납작하게 회전
      g.save(); g.rotate(t / 520); g.scale(1, .42);
      for (var d4 = 0; d4 < 3; d4++) {
        g.beginPath(); g.arc(0, 0, R * (1.5 - d4 * .22), 0, 6.284);
        var dg = g.createLinearGradient(-R * 1.5, 0, R * 1.5, 0);
        dg.addColorStop(0, "rgba(255,190,120,0)"); dg.addColorStop(.35, "rgba(255,205,140,.55)");
        dg.addColorStop(.62, "rgba(210,140,255,.5)"); dg.addColorStop(1, "rgba(140,80,255,0)");
        g.strokeStyle = dg; g.lineWidth = R * .13; g.stroke();
      }
      g.restore();
      // 안쪽 소용돌이
      g.save(); g.rotate(-t / 300);
      g.beginPath();
      for (var s3 = 0; s3 <= 150; s3++) {
        var th3 = s3 / 150 * 15, rr3 = R * (1 - s3 / 150);
        g[s3 ? "lineTo" : "moveTo"](Math.cos(th3) * rr3, Math.sin(th3) * rr3);
      }
      g.strokeStyle = "rgba(214,186,255,.9)"; g.lineWidth = 6; g.lineCap = "round"; g.stroke();
      g.restore();
      // 사건의 지평선
      g.beginPath(); g.arc(0, 0, R * .30, 0, 6.284);
      g.fillStyle = "#05010e"; g.fill();
      g.strokeStyle = "rgba(255,214,150,.85)"; g.lineWidth = 4; g.stroke();
      g.restore();
      g.globalAlpha = 1;
    }

    // 세로형 로켓 — 한 줄에 창문 2개, 인원이 늘면 줄이 아래로 붙어 길어진다
    function shipMetrics(n) {
      var rows = Math.ceil(n / 2);
      var W = 320, noseH = 150, rowH = 130, padTop = 66, padBot = 60, finH = 120;
      var bodyH = padTop + rows * rowH + padBot;
      return { W: W, noseH: noseH, bodyH: bodyH, finH: finH, rows: rows, rowH: rowH,
               padTop: padTop, H: noseH + bodyH + finH };
    }
    // 좌석 k(0-base)의 로컬 좌표 — 위에서부터 왼쪽·오른쪽 순
    function seatPos(k, m) {
      var row = Math.floor(k / 2), col = k % 2;
      return { x: (col ? 1 : -1) * m.W * .19,
               y: -m.H / 2 + m.noseH + m.padTop + row * m.rowH + m.rowH / 2,
               r: m.W * .135 };
    }

    /* 레퍼런스 일러스트 느낌으로: 크림 노즈콘, 세이지그린 달걀형 동체,
       두툼한 크림 테 창문, 둥근 주황 꼬리날개, 세로쓰기 「고브럽1호」 */
    function drawShip(camX, scale, n, t) {
      if (!ship) return;
      var sx = (ship.x - camX) * scale + VW / 2;
      var m = ship.m, W = m.W, H = m.H, hw = W / 2;
      // 발사 — 점화 중엔 부르르 떨고, 뜨면 위로 가속하며 올라간다
      var L0 = ship.launch, lift = 0, shakeX = 0;
      if (L0) {
        if (L0.lifted > 0) { var lu = L0.lifted / 1000; lift = -(lu * lu) * 2600; }
        if (L0.thrust) shakeX = (Math.random() - .5) * 7 * L0.thrust;
      }
      g.save(); g.translate(sx + shakeX, VH * .5 + lift); g.scale(scale, scale);

      var noseTop = -H / 2, seamY = noseTop + m.noseH, bodyBot = seamY + m.bodyH;
      function bodyW(y) {
        var f = (y - seamY) / m.bodyH;
        return hw * (.86 + .30 * Math.sin(Math.PI * Math.min(1, .12 + f * .82)));
      }

      // 가운데 뒷날개(동체 뒤)
      g.beginPath();
      g.moveTo(-W * .10, bodyBot - 16); g.lineTo(W * .10, bodyBot - 16);
      g.lineTo(W * .066, bodyBot + m.finH * .46); g.lineTo(-W * .066, bodyBot + m.finH * .46);
      g.closePath();
      g.fillStyle = "#8c4526"; g.fill();
      g.strokeStyle = "#6f3016"; g.lineWidth = 4; g.stroke();

      // 동체 실루엣 (달걀형)
      var shoulderW = bodyW(seamY), bellyW = bodyW(seamY + m.bodyH * .55), hipW = bodyW(bodyBot);
      function hullPath() {
        g.beginPath();
        g.moveTo(-shoulderW, seamY);
        g.bezierCurveTo(-bellyW * 1.06, seamY + m.bodyH * .3,
                        -bellyW * 1.06, seamY + m.bodyH * .72, -hipW, bodyBot);
        g.quadraticCurveTo(0, bodyBot + 26, hipW, bodyBot);
        g.bezierCurveTo(bellyW * 1.06, seamY + m.bodyH * .72,
                        bellyW * 1.06, seamY + m.bodyH * .3, shoulderW, seamY);
        g.quadraticCurveTo(0, seamY - 26, -shoulderW, seamY);
        g.closePath();
      }
      hullPath();
      var bg2 = g.createLinearGradient(-bellyW, 0, bellyW, 0);
      bg2.addColorStop(0, "#5f8a84"); bg2.addColorStop(.22, "#84ada6");
      bg2.addColorStop(.46, "#9dbfb7"); bg2.addColorStop(.75, "#6f9a93");
      bg2.addColorStop(1, "#4e746f");
      g.fillStyle = bg2; g.fill();
      g.strokeStyle = "#3c5b57"; g.lineWidth = 5; g.stroke();
      // 은은한 하이라이트/음영 (페인팅 느낌)
      g.save(); hullPath(); g.clip();
      g.globalAlpha = .18; g.fillStyle = "#eafff8";
      g.beginPath(); g.ellipse(-bellyW * .42, seamY + m.bodyH * .42, bellyW * .2, m.bodyH * .5, 0, 0, 6.284); g.fill();
      g.globalAlpha = .12; g.fillStyle = "#0d2622";
      g.beginPath(); g.ellipse(bellyW * .74, seamY + m.bodyH * .5, bellyW * .26, m.bodyH * .62, 0, 0, 6.284); g.fill();
      g.globalAlpha = 1; g.restore();

      // 노즈콘 (크림 돔)
      g.beginPath();
      g.moveTo(-shoulderW, seamY);
      g.bezierCurveTo(-shoulderW * .96, noseTop + m.noseH * .28,
                      -W * .17, noseTop + 8, 0, noseTop);
      g.bezierCurveTo(W * .17, noseTop + 8,
                      shoulderW * .96, noseTop + m.noseH * .28, shoulderW, seamY);
      g.closePath();
      var ng = g.createLinearGradient(-shoulderW, 0, shoulderW, 0);
      ng.addColorStop(0, "#d9cbae"); ng.addColorStop(.3, "#f6efdd");
      ng.addColorStop(.62, "#efe6cf"); ng.addColorStop(1, "#c9b998");
      g.fillStyle = ng; g.fill();
      g.strokeStyle = "#a4936f"; g.lineWidth = 5; g.stroke();
      g.globalAlpha = .5; g.fillStyle = "#ffffff";
      g.beginPath(); g.ellipse(-W * .11, noseTop + m.noseH * .34, W * .055, m.noseH * .3, -.18, 0, 6.284); g.fill();
      g.globalAlpha = 1;
      g.beginPath(); g.moveTo(-shoulderW, seamY);
      g.quadraticCurveTo(0, seamY + 20, shoulderW, seamY);
      g.strokeStyle = "#8d7d5c"; g.lineWidth = 4; g.stroke();

      // 옆 꼬리날개(동체 앞) — 둥글게 흘러내리는 형태
      function fin(dir) {
        g.beginPath();
        g.moveTo(dir * hipW * .82, bodyBot - m.finH * .72);
        g.bezierCurveTo(dir * (hipW + W * .30), bodyBot - m.finH * .5,
                        dir * (hipW + W * .34), bodyBot + m.finH * .12,
                        dir * (hipW + W * .16), bodyBot + m.finH * .5);
        g.bezierCurveTo(dir * (hipW + W * .02), bodyBot + m.finH * .3,
                        dir * hipW * .8, bodyBot + m.finH * .06,
                        dir * hipW * .62, bodyBot - m.finH * .1);
        g.closePath();
        var fgr = g.createLinearGradient(dir * hipW * .6, 0, dir * (hipW + W * .34), 0);
        fgr.addColorStop(0, "#c96f3c"); fgr.addColorStop(.55, "#b25a2c"); fgr.addColorStop(1, "#8f421d");
        g.fillStyle = fgr; g.fill();
        g.strokeStyle = "#6f3016"; g.lineWidth = 4.5; g.stroke();
        g.globalAlpha = .35; g.fillStyle = "#ffd9ad";
        g.beginPath(); g.ellipse(dir * (hipW + W * .1), bodyBot - m.finH * .28,
          W * .045, m.finH * .22, dir * .5, 0, 6.284); g.fill();
        g.globalAlpha = 1;
      }
      fin(-1); fin(1);

      // 엔진 화염 — 발사할 때 아래로 길게 뿜는다 (노즐보다 먼저 그려 뒤에 깔린다)
      if (L0 && L0.thrust > 0) {
        var th0 = L0.thrust, fLen = (150 + Math.random() * 120) * th0 * (L0.lifted > 0 ? 1.9 : 1);
        var fW = hipW * (.62 + Math.random() * .12);
        var fy0 = bodyBot + 20;
        var flg = g.createLinearGradient(0, fy0, 0, fy0 + fLen);
        flg.addColorStop(0, "rgba(255,255,235,.98)"); flg.addColorStop(.22, "rgba(255,222,130,.95)");
        flg.addColorStop(.55, "rgba(255,150,50,.75)"); flg.addColorStop(1, "rgba(255,70,30,0)");
        g.beginPath();
        g.moveTo(-fW, fy0);
        g.quadraticCurveTo(-fW * .5, fy0 + fLen * .55, 0, fy0 + fLen);
        g.quadraticCurveTo(fW * .5, fy0 + fLen * .55, fW, fy0);
        g.closePath(); g.fillStyle = flg; g.fill();
        // 안쪽 흰 심지
        g.beginPath();
        g.moveTo(-fW * .42, fy0);
        g.quadraticCurveTo(-fW * .2, fy0 + fLen * .4, 0, fy0 + fLen * .62);
        g.quadraticCurveTo(fW * .2, fy0 + fLen * .4, fW * .42, fy0);
        g.closePath(); g.fillStyle = "rgba(255,252,240,.85)"; g.fill();
        // 연기 구름
        for (var sm = 0; sm < 4; sm++) {
          g.globalAlpha = .16 * th0;
          g.beginPath();
          g.arc((Math.random() - .5) * hw * 1.8, fy0 + 40 + Math.random() * fLen * .8,
                26 + Math.random() * 34, 0, 6.284);
          g.fillStyle = "#cfd6e6"; g.fill();
        }
        g.globalAlpha = 1;
      }

      // 엔진 노즐
      g.beginPath(); g.ellipse(0, bodyBot + 18, hipW * .5, 16, 0, 0, 6.284);
      g.fillStyle = "#57433a"; g.fill();
      g.strokeStyle = "#3c2c25"; g.lineWidth = 4; g.stroke();

      // 세로쓰기 선체명 (왼쪽 가장자리)
      g.fillStyle = "rgba(250,244,228,.94)";
      g.font = "600 27px 'Jua', sans-serif";
      g.textAlign = "center"; g.textBaseline = "middle";
      var label = "고브럽1호";
      for (var ci = 0; ci < label.length; ci++)
        g.fillText(label[ci], -W * .40, seamY + 44 + ci * 33);

      // 창문 — 두툼한 크림 테 + 유리 음영
      ship.seats.forEach(function (seat, k) {
        var sp2 = seatPos(k, m);
        var ringG = g.createRadialGradient(sp2.x - sp2.r * .3, sp2.y - sp2.r * .3, sp2.r * .3, sp2.x, sp2.y, sp2.r + 12);
        ringG.addColorStop(0, "#fbf5e4"); ringG.addColorStop(.8, "#e7dcc1"); ringG.addColorStop(1, "#bfae8c");
        g.beginPath(); g.arc(sp2.x, sp2.y, sp2.r + 12, 0, 6.284);
        g.fillStyle = ringG; g.fill();
        g.strokeStyle = "#96855f"; g.lineWidth = 3.5; g.stroke();
        g.beginPath(); g.arc(sp2.x, sp2.y, sp2.r, 0, 6.284);
        if (seat.blown) { g.fillStyle = "#160b10"; g.fill();
          g.strokeStyle = "#ff8a5c"; g.lineWidth = 4; g.stroke(); }
        else {
          var glassG = g.createRadialGradient(sp2.x - sp2.r * .35, sp2.y - sp2.r * .4, sp2.r * .2, sp2.x, sp2.y, sp2.r);
          glassG.addColorStop(0, "#a8b6bd"); glassG.addColorStop(1, "#6e7f88");
          g.fillStyle = glassG; g.fill();
          g.strokeStyle = "#55636b"; g.lineWidth = 2.5; g.stroke();
        }
        if (seat.idx >= 0 && !seat.blown) {          // 탑승 — 고브럽 얼굴(외눈 + 소용돌이 입)
          g.save(); g.beginPath(); g.arc(sp2.x, sp2.y, sp2.r - 2, 0, 6.284); g.clip();
          var bo = Math.sin(t / 150 + k) * sp2.r * .09;
          drawGoblubFace(sp2.x, sp2.y + bo, sp2.r * 1.05, SKIN[seat.idx % SKIN.length], t + k * 400);
          g.restore();
        }
        g.globalAlpha = .32;                          // 유리 반사
        g.beginPath(); g.arc(sp2.x - sp2.r * .34, sp2.y - sp2.r * .4, sp2.r * .27, 0, 6.284);
        g.fillStyle = "#ffffff"; g.fill(); g.globalAlpha = 1;
      });

      // 튕겨 나온 고브럽 — 창문에서 오른쪽으로 날아간다
      if (ship.eject) {
        var e = ship.eject, s2 = seatPos(e.k, m);
        g.save();
        // 로켓은 위로 떠나지만 튕겨 나온 고브럽은 남는다 — 상승분(lift)을 되돌린다
        g.translate(s2.x + e.dx, s2.y + e.dy - lift / scale);
        g.rotate(e.rot);
        var ES = 120;
        var eimg = sprites[SKIN[e.idx % SKIN.length]];
        if (eimg && eimg.complete && eimg.naturalWidth)
          g.drawImage(eimg, -ES / 2, -ES * .58, ES, ES * (196 / 240));
        g.restore();
      }
      g.restore();
    }

    /* 배경 — 레이어마다 다른 속도로 흘러야 속도감이 난다 */
    function drawBg(camX, speed) {
      var bg = g.createLinearGradient(0, 0, 0, VH);
      bg.addColorStop(0, "#05081a"); bg.addColorStop(.45, "#0a1030"); bg.addColorStop(1, "#151a44");
      g.fillStyle = bg; g.fillRect(0, 0, VW, VH);
      // 성운
      var neb = g.createRadialGradient(VW * .7, VH * .3, 30, VW * .7, VH * .3, VW * .8);
      neb.addColorStop(0, "rgba(120,90,220,.24)"); neb.addColorStop(1, "rgba(120,90,220,0)");
      g.fillStyle = neb; g.fillRect(0, 0, VW, VH);
      // sp = 0~1 로 정규화한 체감 속도. 모든 레이어가 이걸 따라 늘어난다
      var sp = Math.min(1, speed / 900);
      // 먼 별 0.18x — 빠를수록 점이 선으로 늘어난다
      var tail = 3 + sp * 26;
      farStars.forEach(function (s) {
        var x = ((s.x - camX * .18) % SPAN + SPAN) % SPAN;
        if (x > VW + tail) return;
        g.globalAlpha = .75; g.fillStyle = "#dbe7ff";
        g.fillRect(x, s.y, s.r + tail * .5, s.r);
      });
      // 중간 행성 0.45x
      midStars.forEach(function (s) {
        var x = ((s.x - camX * .45) % SPAN + SPAN) % SPAN;
        if (x > VW + 80 || x < -80) return;
        g.globalAlpha = .5;
        g.beginPath(); g.arc(x, s.y, s.r, 0, 6.284);
        g.fillStyle = s.h > .5 ? "#4b5aa8" : "#7a4f9c"; g.fill();
      });
      g.globalAlpha = 1;
      // 스피드 라인 1.7x
      for (var k = 0; k < 34; k++) {
        var ly = (k * 977) % VH;
        var lx = ((k * 421) - camX * 1.7) % (VW + 500);
        if (lx < -500) lx += VW + 500;
        g.globalAlpha = .08 + sp * .34;
        g.fillStyle = "#bcd4ff";
        g.fillRect(lx, ly, 60 + sp * 320, 2);
      }
      // 전경 먼지 2.4x — 화면 앞을 스쳐 지나간다
      fgDust.forEach(function (d) {
        var x = ((d.x - camX * 2.4) % SPAN + SPAN) % SPAN;
        if (x > VW + 90) return;
        g.globalAlpha = .16 + sp * .5;
        g.fillStyle = "#e6efff";
        g.fillRect(x, d.y, d.r + sp * 74, d.r);
      });
      g.globalAlpha = 1;
      g.globalAlpha = 1;
    }

    function drawFinish(sx, scale) {
      var w = 26 * scale, ft = 100, fb = VH - 70, fh = (fb - ft) / 26;
      for (var b = 0; b < 26; b++) {
        g.fillStyle = b % 2 ? "#ffffff" : "#1a2140";
        g.fillRect(sx, ft + b * fh, w, fh);
      }
      g.save();
      g.fillStyle = "#ffe6b8"; g.font = "700 " + Math.round(34 * scale) + "px 'Jua', sans-serif";
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText("FINISH", sx + w / 2, 118);
      g.restore();
    }

    function drawRunner(rn, i, n, sx, scale, t, camX) {
      var y = laneY(i, n);
      var sy = (y - VH / 2) * scale + VH / 2;
      // 크게 축소돼도 캐릭터·이름은 알아볼 수 있는 크기를 지킨다
      var size = Math.max(74, 142 * scale);
      var tscale = Math.max(.62, scale);
      var bob = Math.sin(t / 78 + i * 1.7) * 7 * scale;

      // 블랙홀 구간 — 자기 레인이 아니라 화면 정중앙으로 끌려간다
      var kk = 0, drawX = sx, drawY = sy + bob;
      if (rn.sucked || rn.escT > 0) {
        // 빨려드는 목적지는 블랙홀의 '월드' 위치다
        var cxm = vortex ? (vortex.x - camX) * scale + VW / 2 : VW / 2, cym = VH / 2;
        if (rn.sucked) {
          kk = Math.min(1, rn.suckT / 760);           // 0 제자리 → 1 완전히 중심
          var ease = kk * kk * (3 - 2 * kk);          // 가속하며 빨려든다
          drawX = sx + (cxm - sx) * ease;
          drawY = (sy + bob) + (cym - (sy + bob)) * ease;
          // 끌려가며 나선을 그린다
          var swirl = (1 - ease) * 46 * scale;
          drawX += Math.cos(rn.suckT / 90 + i) * swirl;
          drawY += Math.sin(rn.suckT / 90 + i) * swirl * .6;
        } else {
          // 탈출 — 자기장에 되당겨지며 낑낑, 조금씩 자기 레인으로 밀려 나온다
          var u = 1 - rn.escT / rn.escDur;                  // 0 중심 → 1 제자리
          // 앞으로 나아가려다 도로 끌려가는 저항. 끝으로 갈수록 저항이 약해진다
          var resist = Math.sin(u * Math.PI * 3.5) * .13 * (1 - u);
          var uo = Math.max(0, Math.min(1, u - resist));
          var pop = 1 - uo;                                 // 1 중심 → 0 제자리
          drawX = sx + (cxm - sx) * pop;
          drawY = (sy + bob) + (cym - (sy + bob)) * pop;
          kk = pop * .8;
        }
      }
      g.save();
      g.translate(drawX, drawY);
      if (rn.spin) g.rotate(rn.spin);
      if (rn.sad) g.globalAlpha = .85;

      // 빨려드는 중 — 회전하며 쪼그라든다
      if (rn.sucked) {
        g.rotate(kk * 9); g.scale(1 - kk * .88, 1 - kk * .88);
        g.globalAlpha = 1 - kk * .85;
      } else if (rn.escT > 0) {
        // 낑낑대며 빠져나오는 중 — 버둥거리며 조금씩 커진다
        var uu = 1 - rn.escT / rn.escDur;                   // 0 중심 → 1 제자리
        var st = .28 + .72 * uu;                            // 작았다가 원래 크기로
        var wob2 = 1 + Math.sin(rn.escT / 42) * .26 * (1 - uu);   // 몸부림(끝날수록 잦아듦)
        g.rotate(-(1 - uu) * 5 + Math.sin(rn.escT / 58) * .6 * (1 - uu));
        g.scale(st * wob2, st / wob2);
        g.globalAlpha = .45 + .55 * uu;
      }
      // 블랙홀에 갇힌 동안 — 쪼그라들며 빙글빙글, 빠져나올 때 되돌아온다
      if (rn.holeT > 0) {
        var hp = rn.holeT / 2000;                        // 1 → 0
        var shrink = .42 + Math.abs(hp - .5) * 1.16;     // 가운데서 가장 작아짐
        g.rotate((1 - hp) * 9);
        g.scale(shrink, shrink);
        g.globalAlpha = .55 + (1 - Math.abs(hp - .5) * 2) * -.25 + .25;
      }

      var dashing = rn.dashT > 0 && rn.holeT <= 0;
      if (dashing) {
        // 질주 잔상 — 뒤로 세 겹
        for (var a = 1; a <= 3; a++) {
          g.globalAlpha = .26 / a;
          var im0 = sprites[SKIN[i % SKIN.length]];
          if (im0 && im0.complete && im0.naturalWidth)
            g.drawImage(im0, -size / 2 - a * size * .34, -size * .58, size, size * (196 / 240));
        }
        g.globalAlpha = 1;
        // 방사형 속도선
        g.strokeStyle = "rgba(255,236,150,.85)"; g.lineWidth = 3.5;
        for (var v = 0; v < 7; v++) {
          var yy = -size * .34 + v * (size * .11);
          var len = size * (.55 + Math.random() * .7);
          g.beginPath(); g.moveTo(-size * .5, yy); g.lineTo(-size * .5 - len, yy); g.stroke();
        }
      }

      // 제트 분사 — 뒤쪽으로 (부스트 중엔 길고 뜨겁게, 블랙홀 안에선 꺼진다)
      if (!(rn.holeT > 0)) {
        var fl = (0.6 + Math.random() * .55) * size * (dashing ? 1.5 : .5);
        var fg = g.createLinearGradient(-size * .42, 0, -size * .42 - fl, 0);
        fg.addColorStop(0, "rgba(255,214,120,.95)"); fg.addColorStop(.5, "rgba(255,130,60,.6)");
        fg.addColorStop(1, "rgba(255,80,40,0)");
        g.fillStyle = fg;
        g.beginPath(); g.moveTo(-size * .4, -size * .13);
        g.lineTo(-size * .4 - fl, 0); g.lineTo(-size * .4, size * .13); g.closePath(); g.fill();
      }

      var img = sprites[SKIN[i % SKIN.length]];
      if (img && img.complete && img.naturalWidth) {
        g.drawImage(img, -size / 2, -size * .58, size, size * (196 / 240));
      } else {                                  // 아직 안 구워졌으면 동그라미로
        g.beginPath(); g.arc(0, 0, size * .34, 0, 6.284);
        g.fillStyle = SKIN[i % SKIN.length]; g.fill();
      }
      // 아파하는 >< 눈 — 외눈 위치(원본 SVG 기준 120,44)를 덮어 그린다
      if (rn.hurtT > 0 || rn.sad) {
        var ex = 0, ey = -size * .397, er = size * .104;
        g.beginPath(); g.arc(ex, ey, er, 0, 6.284);
        g.fillStyle = "#f4f0e6"; g.fill();
        g.strokeStyle = "#17141f"; g.lineWidth = Math.max(2, er * .26); g.lineCap = "round";
        if (rn.sad) {                            // 슬픈 눈 — 아래로 처진 반원 + 눈물
          g.beginPath(); g.arc(ex, ey + er * .3, er * .58, 3.34, 6.08); g.stroke();
          g.beginPath(); g.moveTo(ex + er * .5, ey + er * .5);
          g.quadraticCurveTo(ex + er * .8, ey + er * 1.3, ex + er * .45, ey + er * 1.6);
          g.fillStyle = "#7fd4ff"; g.fill();
        } else {                                 // >< 찡긋
          g.beginPath();
          g.moveTo(ex - er * .72, ey - er * .5); g.lineTo(ex - er * .12, ey);
          g.lineTo(ex - er * .72, ey + er * .5);
          g.moveTo(ex + er * .72, ey - er * .5); g.lineTo(ex + er * .12, ey);
          g.lineTo(ex + er * .72, ey + er * .5);
          g.stroke();
        }
      }
      g.restore();
      g.globalAlpha = 1;

      // 이름표
      g.font = "600 " + Math.round(24 * tscale) + "px 'Jua', sans-serif";
      g.textAlign = "center"; g.textBaseline = "middle";
      var label = rn.name.length > 5 ? rn.name.slice(0, 5) + "…" : rn.name;
      var tw = g.measureText(label).width;
      g.fillStyle = "rgba(6,12,26,.72)";
      g.fillRect(sx - tw / 2 - 9 * tscale, sy - size * .74 - 15 * tscale, tw + 18 * tscale, 27 * tscale);
      g.fillStyle = SKIN[i % SKIN.length];
      g.fillText(label, sx, sy - size * .74 - 2 * tscale);
    }

    function draw(t, n, camX, scale, speed) {
      g.clearRect(0, 0, VW, VH);
      drawBg(camX, speed);

      // 레인 가이드
      for (var i = 0; i < n; i++) {
        var y = laneY(i, n), sy = (y - VH / 2) * scale + VH / 2;
        g.strokeStyle = "rgba(150,180,255,.10)"; g.lineWidth = 2 * scale;
        g.setLineDash([18 * scale, 14 * scale]);
        g.beginPath(); g.moveTo(0, sy + 42 * scale); g.lineTo(VW, sy + 42 * scale); g.stroke();
        g.setLineDash([]);
      }
      // 결승선
      var fx = (TRACK - camX) * scale + VW / 2;
      if (fx > -60 && fx < VW + 60) drawFinish(fx, scale);
      drawShip(camX, scale, n, t);
      drawVortex(camX, scale, t);

      // 운석
      rocks.forEach(function (r) {
        var sx = (r.x - camX) * scale + VW / 2;
        if (sx < -80 || sx > VW + 80) return;
        var sy = (r.y - VH / 2) * scale + VH / 2;
        g.save(); g.translate(sx, sy); g.rotate(r.rot); g.scale(scale, scale);
        g.beginPath(); g.arc(0, 0, r.r, 0, 6.284);
        var rg = g.createRadialGradient(-r.r * .3, -r.r * .3, r.r * .2, 0, 0, r.r);
        rg.addColorStop(0, "#9c8069"); rg.addColorStop(1, "#4d3c30");
        g.fillStyle = rg; g.fill();
        g.fillStyle = "rgba(0,0,0,.3)";
        g.beginPath(); g.arc(r.r * .3, r.r * .2, r.r * .26, 0, 6.284); g.fill();
        g.restore();
        // 꼬리 불꽃
        var tg = g.createLinearGradient(sx, sy - r.r * scale, sx + 10, sy - (r.r + 60) * scale);
        tg.addColorStop(0, "rgba(255,180,90,.8)"); tg.addColorStop(1, "rgba(255,90,40,0)");
        g.strokeStyle = tg; g.lineWidth = 7 * scale; g.lineCap = "round";
        g.beginPath(); g.moveTo(sx, sy - r.r * scale); g.lineTo(sx + 9, sy - (r.r + 58) * scale); g.stroke();
      });

      // 🕳 블랙홀 — 먹히면 2초 정지
      orbs.forEach(function (o) {
        if (o.got || !o.hole) return;
        var sx = (o.x - camX) * scale + VW / 2;
        if (sx < -80 || sx > VW + 80) return;
        var y = laneY(o.lane, n), sy = (y - VH / 2) * scale + VH / 2;
        o.t += .05;
        var R = 40 * scale;
        g.save(); g.translate(sx, sy);
        var ag = g.createRadialGradient(0, 0, R * .3, 0, 0, R * 1.9);
        ag.addColorStop(0, "rgba(150,90,255,.75)"); ag.addColorStop(.55, "rgba(90,50,180,.35)");
        ag.addColorStop(1, "rgba(60,30,140,0)");
        g.fillStyle = ag; g.beginPath(); g.arc(0, 0, R * 1.9, 0, 6.284); g.fill();
        g.rotate(o.t);                                  // 빨려드는 소용돌이
        for (var a2 = 0; a2 < 3; a2++) {
          g.beginPath();
          for (var s2 = 0; s2 <= 30; s2++) {
            var th = s2 / 30 * 4.2 + a2 * 2.09, rr = R * 1.55 * (1 - s2 / 30);
            g[s2 ? "lineTo" : "moveTo"](Math.cos(th) * rr, Math.sin(th) * rr * .62);
          }
          g.strokeStyle = "rgba(198,166,255," + (.55 - a2 * .12) + ")";
          g.lineWidth = 3.2 * scale; g.stroke();
        }
        g.beginPath(); g.ellipse(0, 0, R * .52, R * .34, 0, 0, 6.284);
        g.fillStyle = "#05020f"; g.fill();
        g.strokeStyle = "rgba(214,186,255,.9)"; g.lineWidth = 2.4 * scale; g.stroke();
        g.restore();
      });

      // ⭐ 부스트 별
      orbs.forEach(function (o) {
        if (o.got || o.hole) return;
        var sx = (o.x - camX) * scale + VW / 2;
        if (sx < -60 || sx > VW + 60) return;
        var y = laneY(o.lane, n), sy = (y - VH / 2) * scale + VH / 2;
        o.t += .07;
        var pulse = 1 + Math.sin(o.t) * .16, R = 27 * scale * pulse;
        g.save(); g.translate(sx, sy + Math.sin(o.t * .7) * 6 * scale);
        var hg = g.createRadialGradient(0, 0, 2, 0, 0, R * 2.1);
        hg.addColorStop(0, "rgba(255,236,150,.85)"); hg.addColorStop(1, "rgba(255,200,60,0)");
        g.fillStyle = hg; g.beginPath(); g.arc(0, 0, R * 2.1, 0, 6.284); g.fill();
        g.rotate(o.t * .5);
        g.beginPath();
        for (var k = 0; k < 10; k++) {                 // 5각 별
          var ang = Math.PI / 5 * k - Math.PI / 2, rr = k % 2 ? R * .44 : R;
          g[k ? "lineTo" : "moveTo"](Math.cos(ang) * rr, Math.sin(ang) * rr);
        }
        g.closePath();
        g.fillStyle = "#ffe066"; g.shadowColor = "#ffd479"; g.shadowBlur = 26 * scale; g.fill();
        g.shadowBlur = 0; g.restore();
      });

      // 파편
      bits.forEach(function (b) {
        var sx = (b.x - camX) * scale + VW / 2;
        var sy = (b.y - VH / 2) * scale + VH / 2;
        g.globalAlpha = Math.max(0, b.life);
        g.fillStyle = b.c;
        g.fillRect(sx, sy, 5 * scale, 5 * scale);
      });
      g.globalAlpha = 1;

      // 주자 — 뒤에 있는 사람부터 그려 앞선 사람이 위로
      // 지금 벌칙 등수 자리에 있는 주자 — 카메라로 쫓으면 화면이 흔들리니
      // 표식으로 알린다(달리는 동안엔 자리 주인이 수시로 바뀐다)
      var doomIdx = -1;
      if (loseRankNow >= 1) {
        var ordD = runners.map(function (r, i2) {
          return { i: i2, key: r.done ? r.rank : n + (1 - r.p) };
        }).sort(function (a, b) { return a.key - b.key; });
        var dPick = ordD[Math.min(loseRankNow, ordD.length) - 1];
        if (dPick) doomIdx = dPick.i;
      }
      runners.map(function (rn, i) { return { rn: rn, i: i }; })
        .sort(function (a, b) { return a.rn.p - b.rn.p; })
        .forEach(function (o) {
          if (o.rn.boarded) return;              // 우주선 창문에 있으니 트랙엔 안 그린다
          var wx = o.rn.p * TRACK;
          var sx = (wx - camX) * scale + VW / 2;
          if (sx < -140 || sx > VW + 140) return;
          drawRunner(o.rn, o.i, n, sx, scale, t, camX);
          if (o.i === doomIdx && !o.rn.done) {
            var my = (laneY(o.i, n) - VH / 2) * scale + VH / 2;
            var ms = Math.max(74, 142 * scale);
            var pu = 1 + Math.sin(t / 170) * .12;
            g.save(); g.translate(sx, my);
            g.strokeStyle = "rgba(255,90,90,.9)"; g.lineWidth = 4 * Math.max(.6, scale);
            g.beginPath(); g.ellipse(0, ms * .1, ms * .46 * pu, ms * .30 * pu, 0, 0, 6.284); g.stroke();
            g.fillStyle = "rgba(255,90,90,.95)";                 // 머리 위 ▼
            var ay = -ms * .92 - Math.sin(t / 170) * 5;
            g.beginPath(); g.moveTo(-13, ay); g.lineTo(13, ay); g.lineTo(0, ay + 17);
            g.closePath(); g.fill();
            g.restore();
          }
        });
    }

    /* ── 실시간 순위 배지 ───────────────────────── */
    function buildLive(names) {
      var box = $("live"); box.innerHTML = "";
      names.forEach(function (nm, i) {
        var d = document.createElement("div");
        d.className = "lr"; d.dataset.i = i;
        d.innerHTML = '<span class="pos"></span><span class="dot" style="background:' + SKIN[i % SKIN.length] + '"></span>' +
          "<span>" + nm.replace(/[<>&]/g, "") + "</span>";
        box.appendChild(d);
      });
    }
    function updateLive() {
      var box = $("live");
      // 도착한 사람은 확정 등수로, 아직 달리는 사람은 진행도로 줄 세운다.
      // (다 도착하면 p 가 전부 1 이라 진행도만으로는 순서가 흔들린다)
      var ord = runners.map(function (r, i) {
        return { i: i, key: r.done ? r.rank : runners.length + (1 - r.p) };
      }).sort(function (a, b) { return a.key - b.key; });
      // 한 칸 높이를 실측한다 — 고정값을 쓰면 글꼴·배율에 따라 사이가 벌어진다
      var first = box.children[0];
      var step = first ? first.offsetHeight + 4 : 26;   // +4 = .live 의 gap
      ord.forEach(function (o, place) {
        var el = box.children[o.i];
        el.style.transform = "translateY(" + (place - o.i) * step + "px)";
        el.querySelector(".pos").textContent = place + 1;
        el.classList.toggle("lead", place === 0);
      });
    }

    /* ── 경주 ─────────────────────────────────────
       공정성: 물리는 순위를 모른 채 정직하게 굴리고 이름만 레인에 무작위로
       꽂는다. 어떤 레인이 유리하든 각 이름이 그 레인에 갈 확률이 1/n 이라
       몇 등이 걸리든 확률은 균등하다.                                  */
    var busy = false, raf = 0, loseRankNow = 1, randomPick = false, pendingRank = "";
    var BASE_V = 1 / 15000;              // 방해가 없을 때의 기준 속도
    var CATCHUP = 7.0;                   // 뒤처질수록 빨라지는 정도(마리오카트식 추격)

    function start() {
      var names = readItems();
      if (names.length < MIN) return showErr("이름을 " + MIN + "개 이상 넣어주세요");
      hideErr();
      busy = true;
      $("btn-go").disabled = true;
      $("btn-again").style.display = "none"; $("btn-edit").style.display = "none";
      $("winner").style.display = "none"; $("winner").classList.remove("pop");
      $("rank").style.display = "none"; $("rank").innerHTML = "";
      $("setup").style.display = "none"; $("hud").style.display = "flex";
      var wrap = $("track-wrap");
      wrap.classList.remove("final");
      document.body.classList.add("theater");   // 레이스 동안 전체 화면
      audioInit();
      if (AC && AC.resume) AC.resume();

      var n = names.length;
      // 걸릴 등수는 출발할 때 한 번만 정한다. 랜덤이면 여기서 뽑고,
      // 결과 화면까지 같은 값을 쓴다(다시 읽으면 재추첨돼 버린다).
      var sel = $("pick-rank").value;
      loseRankNow = sel === "random"
        ? 1 + Math.floor(Math.random() * n)
        : Math.min(+sel || n, n);
      randomPick = sel === "random";
      var loseRankSel = loseRankNow;
      // 공정성: 물리는 순위를 모른 채 정직하게 굴리고, 이름만 레인에 무작위로 꽂는다.
      // 레인마다 유불리가 있어도 각 이름이 그 레인에 갈 확률이 1/n 이라 결과는 균등하다.
      var lane = names.slice();
      for (var j = lane.length - 1; j > 0; j--) {
        var k = Math.floor(Math.random() * (j + 1));
        var tmp = lane[j]; lane[j] = lane[k]; lane[k] = tmp;
      }

      runners = lane.map(function (nm) {
        return { name: nm, p: 0, prevX: 0, rank: 0, done: false, spin: 0,
                 slowT: 0, dashT: 0, holeT: 0,        // 운석 감속 / 별 질주 / 블랙홀 정지
                 hurtT: 0, bumpCD: 0, sucked: false, suckT: 0, escT: 0, escDur: 1, sad: false, boarded: false,
                 innate: .99 + Math.random() * .02,   // 타고난 속도차(아주 작게)
                 phase: Math.random() * 6.28, freq: .0009 + Math.random() * .0020 };
      });
      rocks = []; bits = [];
      // 🕳 블랙홀은 70% 지점. 첫 주자가 닿으면 열려서 전원을 삼킨다.
      vortex = null; holeDone = false;
      // 🚀 결승선 로켓 — 한 줄에 창문 2개, 인원이 늘면 줄이 아래로 붙는다
      ship = { x: TRACK + 560, m: shipMetrics(n), seats: [], eject: null, launch: null };
      for (var sI = 0; sI < n; sI++) ship.seats.push({ idx: -1, blown: false });
      // ⭐ 부스트 별만 배치한다. 블랙홀은 보스를 잡아야 열리는 단 하나뿐 —
      // 트랙에도 작은 블랙홀을 뿌리면 보스 블랙홀의 무게가 사라진다.
      orbs = [];
      for (var op = .10; op < BOSS_P - .05; op += .045 + Math.random() * .035) {
        orbs.push({ x: op * TRACK, lane: Math.floor(Math.random() * n),
                    t: Math.random() * 6.28, got: false, hole: false });
      }
      // 배지는 반드시 레인 순서(runners 와 같은 인덱스)로 만들어야 한다.
      // 입력 순서(names)로 만들면 이름·색·등수가 서로 어긋난다.
      buildLive(lane); updateLive();
      cam.x = 0; cam.z = .42; cam.fx = null; cam.tgt = -1; cam.pend = -1; cam.pendT = 0;

      // 3 · 2 · 1 · GO
      var cbox = $("count"), steps = ["3", "2", "1", "GO!"], ci = 0;
      cbox.classList.add("on");
      draw(0, n, 0, 1, 0);
      (function cd() {
        cbox.innerHTML = "<span>" + steps[ci] + "</span>";
        $("hud-left").textContent = ci < 3 ? "🏁 출발 준비" : "🏁 출발!";
        ci++;
        if (ci < steps.length) return setTimeout(cd, 800);
        setTimeout(function () { cbox.classList.remove("on"); run(n, loseRankSel); }, 700);
      })();
    }

    function run(n, loseRank) {
      var wrap = $("track-wrap");
      var t0 = performance.now(), last = t0, done = 0, finalOn = false, prevLead = -1;
      var arrived = [];                     // 도착 순서대로 쌓인다 — 이게 곧 최종 순위
      var flash = "", flashT = 0;           // 부스트·블랙홀 알림이 잠깐 머물게
      var camPrev = 0;
      var simEl = 0, timeScale = 1, slowNote = false, nextBeat = 700, slowUsed = 0;

      function tick(now) {
        var rawDt = Math.min(48, now - last); last = now;
        var dt = rawDt * timeScale;              // 슬로모션은 시뮬레이션 시간만 늦춘다
        simEl += dt;
        var el = simEl, realEl = now - t0;

        var leadPre = 0;
        runners.forEach(function (r) { if (r.p > leadPre) leadPre = r.p; });
        // 블랙홀 근처와 블랙홀이 열린 동안엔 운석을 멈춘다 — 화면에 사건은 하나면 충분하다
        var nearHole = vortex || leadPre >= BOSS_P - .10;
        // 결승선 근처(우주선 자리)엔 운석을 만들지 않는다 — 로켓을 가린다
        if (Math.random() < .07 && el < 30000 && !nearHole && leadPre < .88) {
          var rx = leadPre * TRACK + 300 + Math.random() * 900;
          if (rx < TRACK * .93) {
            rocks.push({ x: rx, y: -60, r: 16 + Math.random() * 20, rot: 0, vy: 6 + Math.random() * 5 });
          }
        }
        rocks.forEach(function (r) { r.y += r.vy * (dt / 16.67); r.rot += .06; });
        rocks = rocks.filter(function (r) { return r.y < VH + 60; });
        bits.forEach(function (b) { b.x += b.vx; b.y += b.vy; b.vy += .35; b.life -= .022; });
        bits = bits.filter(function (b) { return b.life > 0; });


        var leadP = 0;
        runners.forEach(function (r) { if (r.p > leadP) leadP = r.p; });

        runners.forEach(function (rn, i) {
          if (rn.done) return;
          if (rn.sucked) return;               // 소용돌이 안 — 아래 소용돌이 로직이 맡는다
          if (rn.spin) rn.spin = Math.abs(rn.spin) < .05 ? 0 : rn.spin * .9;
          if (rn.escT > 0) rn.escT -= dt;
          if (rn.bumpCD > 0) rn.bumpCD -= dt;        // 낑낑대며 빠져나오는 잔여 시간
          var wx = rn.p * TRACK, wy = laneY(i, n);
          rocks.forEach(function (r) {
            if (r.hit) return;
            if (Math.abs(r.x - wx) < 46 + r.r && Math.abs(r.y - wy) < 46 + r.r) {
              r.hit = 1;
              rn.slowT = Math.max(rn.slowT, 650);    // 뒤로 밀리진 않고 잠깐 느려진다
              rn.spin = (Math.random() < .5 ? -1 : 1) * 1.6;
              for (var b = 0; b < 12; b++) bits.push({ x: r.x, y: r.y, vx: (Math.random() - .5) * 9,
                vy: -Math.random() * 6, life: 1, c: b % 2 ? "#ffb15e" : "#8c7059" });
              wrap.classList.add("shake");
              setTimeout(function () { wrap.classList.remove("shake"); }, 280);
            }
          });
          // ⭐ 별 / 🕳 블랙홀 — 같은 레인에서 '지나쳤는지'로 판정한다.
          // 고정 반경으로 보면 3배속 질주 중엔 한 프레임에 건너뛰어 그냥 통과해 버린다.
          orbs.forEach(function (o) {
            if (o.got || o.lane !== i) return;
            if (!(rn.prevX <= o.x && wx >= o.x)) return;
            o.got = true;
            // 트랙 아이템은 부스트 별뿐이다 (블랙홀은 보스 자리 하나)
            rn.dashT = 1300;                       // 1.3초간 3배속 질주
            flash = "⭐ " + rn.name + " 부스트!"; flashT = 1200;
            for (var b = 0; b < 16; b++) bits.push({ x: o.x, y: wy, vx: (Math.random() - .5) * 11,
              vy: -Math.random() * 7, life: 1, c: b % 2 ? "#fff3b0" : "#ffd479" });
          });

          // 속도만 오르내린다 — 위치는 절대 뒤로 가지 않는다
          if (rn.holeT > 0) rn.holeT -= dt;
          if (rn.dashT > 0) rn.dashT -= dt;
          if (rn.slowT > 0) rn.slowT -= dt;

          var mul;
          if (rn.escT > 0) {
            // 블랙홀 자기장을 이겨내는 중 — 거의 못 나아가다 점점 풀려난다
            var ue = 1 - rn.escT / rn.escDur;
            mul = .06 + .94 * ue * ue;
          }
          else if (rn.holeT > 0) mul = 0;                       // 블랙홀 = 완전 정지
          else if (rn.dashT > 0) mul = 3;                       // 별 = 3배속
          else if (rn.slowT > 0) mul = .4;                      // 운석 = 잠깐 둔해짐
          else mul = 1;
          if (rn.hurtT > 0) rn.hurtT -= dt;
          // 물결은 속도에만 얹는다(항상 양수) → 위치는 절대 뒤로 가지 않는다
          var wob = 1 + Math.sin(el * rn.freq + rn.phase) * .60;
          var rubber = 1 + CATCHUP * Math.max(0, leadP - rn.p);   // 뒤처질수록 빨라짐
          rn.p = Math.min(1, rn.p + BASE_V * rn.innate * wob * mul * rubber * dt);

          // 🕳 블랙홀 — 트랙 70% 지점. 첫 주자가 닿는 순간 열리고 전원을 삼킨다.
          if (!vortex && !holeDone && rn.p >= BOSS_P) {
            holeDone = true;
            vortex = { x: BOSS_P * TRACK, t: 0, swallowed: false, releaseAt: 0, queue: [] };
            orbs.forEach(function (o) { o.got = true; });   // 남은 별은 소진 — 소급 판정 방지
            sfx.whoosh();
            flash = "🕳 블랙홀이 열렸다!"; flashT = 1600;
            for (var d3 = 0; d3 < 46; d3++) bits.push({ x: BOSS_P * TRACK, y: VH * .5,
              vx: (Math.random() - .5) * 22, vy: (Math.random() - .5) * 20, life: 1,
              c: d3 % 3 === 0 ? "#cdb0ff" : d3 % 3 === 1 ? "#8a5cff" : "#ffffff" });
            wrap.classList.add("shake");
            setTimeout(function () { wrap.classList.remove("shake"); }, 300);
          }
          rn.prevX = wx;                       // 다음 프레임의 통과 판정 기준
          if (rn.p >= 1) {
            rn.p = 1; rn.done = true; done++; rn.rank = done; rn.finT = el; arrived.push(i);
            ship.seats[rn.rank - 1].idx = i;   // 도착 순서대로 창문에 앉는다
            rn.boarded = true;
            flash = "🚀 " + rn.name + " 탑승 (" + rn.rank + "등)"; flashT = 1000;
          }
        });

        if (vortex) {
          vortex.t += dt;
          if (!vortex.swallowed) {
            var allIn = true;
            runners.forEach(function (rn) {
              if (rn.done) return;
              if (!rn.sucked) { rn.sucked = true; rn.suckT = 0; }
              rn.suckT += dt;
              rn.p = BOSS_P;                      // 블랙홀 입구에 모인다
              if (rn.suckT < 760) allIn = false;
            });
            if (allIn) {
              vortex.swallowed = true;
              // 탈출 순서는 무작위 — 여기서 판이 한 번 완전히 섞인다
              vortex.queue = runners.map(function (_, i2) { return i2; })
                .filter(function (i2) { return !runners[i2].done; });
              for (var qq = vortex.queue.length - 1; qq > 0; qq--) {
                var rk = Math.floor(Math.random() * (qq + 1));
                var rt = vortex.queue[qq]; vortex.queue[qq] = vortex.queue[rk]; vortex.queue[rk] = rt;
              }
              vortex.releaseAt = vortex.t + 500;
            }
          } else if (!vortex.queue.length) {
            // 전원이 '완전히' 빠져나온 뒤에 닫는다. 안 닫으면 결승·우주선까지 따라온다
            var stillOut = runners.some(function (r) { return !r.done && r.escT > 0; });
            if (!stillOut) {
              vortex.fade = (vortex.fade || 0) + dt;
              if (vortex.fade > 700) vortex = null;
            }
          } else {
            if (vortex.t >= vortex.releaseAt) {
              var out = vortex.queue.shift();
              var ro = runners[out];
              ro.sucked = false; ro.suckT = 0;
              ro.escDur = 1200 + Math.random() * 1400;   // 빠져나오는 데 걸리는 시간은 제각각
              ro.escT = ro.escDur;
              ro.p = BOSS_P + .004;
              ro.prevX = ro.p * TRACK;                   // 뒤에 남은 아이템을 소급 판정하지 않게
              flash = "🌀 " + ro.name + " 빠져나오는 중…"; flashT = 900;
              sfx.pop();
              for (var e2 = 0; e2 < 18; e2++) bits.push({ x: BOSS_P * TRACK, y: laneY(out, n),
                vx: 2 + Math.random() * 10, vy: (Math.random() - .5) * 10, life: 1,
                c: e2 % 2 ? "#cdb0ff" : "#ffffff" });
              vortex.releaseAt = vortex.t + 420 + Math.random() * 520;   // 나오는 속도는 랜덤
            }
          }
        }

        // ── 포토피니시 슬로모션: 걸릴 등수의 경계 다툼이 결승 직전 박빙이면 시간이 늘어진다
        var slow = false, fA = null, fB = null;
        if (done < loseRank && leadPre > .955 && slowUsed < 2200) {
          var ord2 = runners.map(function (r, i2) { return { i: i2, done: r.done, rank: r.rank, p: r.p }; })
            .sort(function (a, b) {
              var ka = a.done ? a.rank : 1000 + (1 - a.p);
              var kb = b.done ? b.rank : 1000 + (1 - b.p);
              return ka - kb;
            });
          var occ = ord2[loseRank - 1];
          var cand = [];
          if (loseRank - 2 >= 0) cand.push(ord2[loseRank - 2]);
          if (loseRank < ord2.length) cand.push(ord2[loseRank]);
          cand = cand.filter(function (c) { return c && !c.done; });
          if (occ && !occ.done && cand.length) {
            cand.sort(function (a, b) { return Math.abs(a.p - occ.p) - Math.abs(b.p - occ.p); });
            if (Math.abs(occ.p - cand[0].p) < .022) { slow = true; fA = occ; fB = cand[0]; }
          }
        }
        if (slow) slowUsed += rawDt;                 // 총 2.2초까지만 — 매판 늘어지면 특별함이 사라진다
        timeScale += ((slow ? .35 : 1) - timeScale) * Math.min(1, rawDt / 140);
        if (slow && !slowNote) { slowNote = true; flash = "📸 포토피니시 각!"; flashT = 1400; }
        if (!slow) slowNote = false;

        /* ── 카메라 ───────────────────────────────────────────────
           벌칙 등수 자리에 있는 주자에게 완전히 고정한다.
           배율도 끝까지 고정 — 구간마다 배율을 바꾸면 그 전환이 곧 '이상함'이었다.
           (측정: 배율을 고정하니 프레임당 흔들림 p95 148px → 5px)
           대상이 바뀔 땐 400ms 버틴 뒤에 옮긴다. 자리 주인은 초당 몇 번씩
           바뀌는데 그때마다 따라가면 화면이 튄다(전환 43.5회 → 7.6회).
           대가: 다른 주자 15%쯤은 화면 밖에 있다 — 위치는 좌측 순위표로 본다. */
        var LOCK_Z = .42;
        var ordC = runners.map(function (r, i2) {
          return { i: i2, key: r.done ? r.rank : n + (1 - r.p) };
        }).sort(function (a, b) { return a.key - b.key; });
        var wantT = ordC[Math.min(loseRankNow, ordC.length) - 1].i;
        if (cam.tgt < 0) { cam.tgt = wantT; }
        else if (wantT !== cam.tgt) {
          if (wantT !== cam.pend) { cam.pend = wantT; cam.pendT = 0; }
          cam.pendT += rawDt;
          if (cam.pendT >= 400) { cam.tgt = wantT; cam.pend = -1; cam.pendT = 0; }
        } else { cam.pend = -1; cam.pendT = 0; }

        var focus = runners[cam.tgt].p * TRACK;
        var wantZ = LOCK_Z;
        if (slow && fA && fB) {                     // 포토피니시만 예외
          focus = ((fA.p + fB.p) / 2) * TRACK;
          wantZ = 1.35;
        }
        if (cam.fx === null) { cam.fx = focus; cam.z = wantZ; }
        cam.fx += (focus - cam.fx) * Math.min(1, rawDt / 220);
        cam.z += (wantZ - cam.z) * Math.min(1, rawDt / 300);
        cam.x += (cam.fx - cam.x) * Math.min(1, rawDt / 150);

        // 체감 속도 = 카메라가 실제로 지나간 월드 거리 (급변하지 않게 평활화)
        var inst = dt > 0 ? Math.abs(cam.x - camPrev) / (dt / 1000) : 0;
        camPrev = cam.x;
        cam.v += (inst - cam.v) * .12;
        var speed = cam.v;
        if (!finalOn && done === n - 1) { finalOn = true; wrap.classList.add("final"); }

        var liveOrd = runners.map(function (r, i) { return { i: i, p: r.p }; })
          .sort(function (a, b) { return b.p - a.p; });
        if (liveOrd[0].i !== prevLead) { prevLead = liveOrd[0].i; }
        // 심장박동 — 결승이 가까울수록 빨라진다 (실제 시간 기준)
        if (realEl >= nextBeat && done < n && leadPre > .5) {
          sfx.thump();
          nextBeat = realEl + (980 - 620 * Math.min(1, leadPre));
        }
        if (flashT > 0) flashT -= dt;
        $("hud-left").textContent = flashT > 0 ? flash : "🥇 " + runners[liveOrd[0].i].name;
        $("hud-right").textContent = done + " / " + n + " 도착";
        updateLive();

        draw(el, n, cam.x, cam.z, speed);

        if (done < n) raf = requestAnimationFrame(tick);
        else finish(arrived, n);
      }
      raf = requestAnimationFrame(tick);
    }

    // 순위는 실제 도착 순서 그대로. 이름이 레인에 무작위로 꽂혀 있으므로 확률은 균등하다.
    function finish(arrived, n) {
      var wrap = $("track-wrap");
      wrap.classList.remove("final");
      wrap.classList.add("shake");
      setTimeout(function () { wrap.classList.remove("shake"); }, 320);

      var loseRank = loseRankNow;
      var pickIdx = arrived[loseRank - 1];
      var loser = runners[pickIdx];

      // 순위표는 도화선이 터진 뒤에 공개한다. 먼저 띄우면 걸린 사람이
      // 표에 미리 표시돼 도화선의 긴장이 통째로 사라진다(랜덤 모드면 특히).
      pendingRank = arrived.map(function (idx, place) {
        var r = place + 1, isPick = r === loseRank;
        var medal = r === 1 ? "🥇" : r === 2 ? "🥈" : r === 3 ? "🥉" : r + "위";
        return '<div class="r' + (isPick ? " loser" : "") + '">' +
          '<span class="no">' + medal + "</span>" +
          '<span class="nm">' + runners[idx].name.replace(/[<>&]/g, "") + "</span>" +
          '<span class="tag">' + (isPick ? "걸림" : "") + "</span></div>";
      }).join("");
      $("hud-left").textContent = "🚀 전원 탑승 — 출발 준비";

      // 카메라를 우주선으로 옮기며 잠깐 다 같이 신나 하다가, 걸린 창문이 펑 터진다
      var bt0 = performance.now(), blown = false, bPrev = bt0;
      (function boarding(now) {
        var dt2 = Math.min(48, now - bPrev); bPrev = now;
        var k = Math.min(1, (now - bt0) / 2000);   // 다 같이 신나 하는 2초
        // 우주선 전체가 화면에 담기게 배율을 맞춘다
        var wantZ = Math.min(1.0, VH * .86 / ship.m.H);
        cam.z += (wantZ - cam.z) * .06;
        cam.x += (ship.x - cam.x) * .06;
        bits.forEach(function (b) { b.x += b.vx; b.y += b.vy; b.vy += .35; b.life -= .022; });
        bits = bits.filter(function (b) { return b.life > 0; });
        if (ship.eject) {                       // 오른쪽으로 튕겨 날아간다
          var e = ship.eject;
          e.dx += e.vx; e.dy += e.vy; e.vy += .5; e.rot += .16;
        }
        draw(now, n, cam.x, cam.z, 0);
        // 2초가 지나면 카운트다운 후 로켓이 불을 뿜으며 발사된다
        if (k >= 1 && !ship.launch && !blown) {
          ship.launch = { t: 0, lifted: 0 };
          $("hud-left").textContent = "🚀 3… 2… 1…";
        }
        var ready = false;
        if (ship.launch && !blown) {
          var L = ship.launch;
          L.t += dt2;
          if (L.t < 1800) {                              // 점화 — 불꽃이 부풀며 기체가 떤다
            L.thrust = Math.min(1, L.t / 1800);
            if (Math.random() < .5) sfx.crackle();
            var cd2 = 3 - Math.floor(L.t / 600);
            $("hud-left").textContent = "🚀 " + (cd2 > 0 ? cd2 + "…" : "발사!");
          } else {
            L.thrust = 1;
            // 불이 붙으면 먼저 한 명이 튕겨 나가고, 그다음에 우주선이 떠오른다
            if (!blown) ready = true;
            else { L.after = (L.after || 0) + dt2;
                   if (L.after > 420) L.lifted += dt2; }
          }
        }
        if (ready && !blown) {
          blown = true; bt0 = now; sfx.boom();
          var seat = ship.seats[loseRank - 1];
          seat.blown = true; loser.sad = true; loser.boarded = false;
          // 걸린 칸에서 오른쪽으로 튕겨 나온다
          ship.eject = { k: loseRank - 1, idx: runners.indexOf(loser),
                         dx: 0, dy: 0, vx: 9 + Math.random() * 4, vy: -7, rot: 0 };
          var wrap2 = $("track-wrap");
          wrap2.classList.add("shake");
          setTimeout(function () { wrap2.classList.remove("shake"); }, 320);
          var sp2 = seatPos(loseRank - 1, ship.m);
          for (var b2 = 0; b2 < 46; b2++) bits.push({ x: ship.x + sp2.x, y: VH * .5 + sp2.y,
            vx: 1 + Math.random() * 15, vy: (Math.random() - .5) * 16, life: 1,
            c: b2 % 3 === 0 ? "#ffd479" : b2 % 3 === 1 ? "#ff8a5c" : "#e8eefc" });
          $("hud-left").textContent = "💥 " + loser.name + " 좌석 이탈!";
        }
        // 폭발 뒤 0.9초 동안 파편이 날리는 걸 보여주고 클로즈업으로 넘어간다
        if (blown && now - bt0 > 900) return showLoser(loser, loseRank, n);
        requestAnimationFrame(boarding);
      })(bt0);

      $("btn-go").style.display = "none";
      if (window.GoblubFeed) GoblubFeed.grant("race");
      if (window.gbTrack) window.gbTrack("minigame_play", { game: "race", players: n, rank: loseRank, result: loser.name });
    }

    // 패자 클로즈업 — 우주선은 떠나고 혼자 남는다
    function showLoser(loser, loseRank, n) {
      var t0 = performance.now();
      (function zoom(now) {
        var k = Math.min(1, (now - t0) / 900);
        // 클로즈업 동안에도 로켓은 계속 위로 멀어진다
        if (ship && ship.launch) ship.launch.lifted += 16;
        if (ship && ship.eject) {
          var e3 = ship.eject;
          e3.dx += e3.vx; e3.dy += e3.vy; e3.vy += .5; e3.rot += .16;
        }
        draw(now, n, cam.x + (ship ? 260 : 0) * k, cam.z, cam.v * (1 - k));
        g.fillStyle = "rgba(4,6,15," + (k * .72) + ")";
        g.fillRect(0, 0, VW, VH);
        // 크게 띄운 슬픈 고브럽
        var S = 150 + k * 210;
        g.save(); g.translate(VW / 2, VH * .46 + Math.sin(now / 260) * 8);
        var img = sprites[SKIN[runners.indexOf(loser) % SKIN.length]];
        if (img && img.complete && img.naturalWidth)
          g.drawImage(img, -S / 2, -S * .58, S, S * (196 / 240));
        var ex = 0, ey = -S * .397, er = S * .104;
        g.beginPath(); g.arc(ex, ey, er, 0, 6.284); g.fillStyle = "#f4f0e6"; g.fill();
        g.strokeStyle = "#17141f"; g.lineWidth = er * .26; g.lineCap = "round";
        g.beginPath(); g.arc(ex, ey + er * .34, er * .6, 3.34, 6.08); g.stroke();
        g.beginPath(); g.moveTo(ex + er * .55, ey + er * .5);          // 눈물
        g.quadraticCurveTo(ex + er * .95, ey + er * 1.5, ex + er * .5, ey + er * 1.9);
        g.quadraticCurveTo(ex + er * .18, ey + er * 1.4, ex + er * .55, ey + er * .5);
        g.fillStyle = "#7fd4ff"; g.fill();
        g.restore();
        g.globalAlpha = k;
        g.fillStyle = "#ffd479"; g.font = "700 46px 'Jua', sans-serif";
        g.textAlign = "center"; g.textBaseline = "middle";
        g.fillText(loseRank + "등 — " + loser.name, VW / 2, VH * .84);
        g.fillStyle = "#e8eeff"; g.font = "600 26px 'Jua', sans-serif";
        g.fillText("우주선은 떠났습니다…", VW / 2, VH * .91);
        g.globalAlpha = 1;
        if (k < 1) return requestAnimationFrame(zoom);
        $("rank").innerHTML = pendingRank;
        $("rank").style.display = "block";
        $("winner-tag").textContent = (randomPick ? "🎲 랜덤 → " : "🔥 ") + loseRank + "등 — 걸렸습니다";
        $("winner-who").textContent = loser.name;
        $("winner").style.display = "block";
        void $("winner").offsetWidth; $("winner").classList.add("pop");
        $("hud-left").textContent = "🏁 경주 종료";
        $("btn-again").style.display = ""; $("btn-edit").style.display = "";
        busy = false;
        // 클로즈업을 2초 보여준 뒤 전체 화면을 접고 결과로
        setTimeout(function () {
          document.body.classList.remove("theater");
          var w2 = $("winner");
          if (w2.scrollIntoView) w2.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 2000);
      })(t0);
    }

    $("btn-go").onclick = function () { if (!busy) start(); };
    $("btn-again").onclick = function () { $("btn-go").style.display = ""; $("btn-go").disabled = false; start(); };
    $("btn-edit").onclick = function () {
      if (raf) cancelAnimationFrame(raf);
      document.body.classList.remove("theater");
      $("setup").style.display = ""; $("hud").style.display = "none";
      $("winner").style.display = "none"; $("rank").style.display = "none";
      $("rank").innerHTML = ""; pendingRank = "";
      $("live").innerHTML = ""; $("count").classList.remove("on");
      $("btn-go").style.display = ""; $("btn-go").disabled = false;
      $("btn-again").style.display = "none"; $("btn-edit").style.display = "none";
      busy = false; runners = []; rocks = []; bits = []; orbs = [];
      vortex = null; ship = null; holeDone = false;
      draw(0, Math.max(2, readItems().length || 4), 0, 1, 0);
    };

    // 첫 화면 — 출발선에 세워둔 미리보기
    (function preview() {
      var names = ["", "", "", ""];
      runners = names.map(function (_, i) { return { name: "", p: .02 + i * .004, rank: 0, done: false, spin: 0, hurtT: 0 }; });
      draw(0, 4, 0, 1, 0);
      setTimeout(preview2, 350);              // 스프라이트가 구워진 뒤 한 번 더
    })();
    function preview2() { draw(0, 4, 0, 1, 0); }
  })();
  </script>
</body>
</html>
