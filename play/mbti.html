    /* 차원문: 회전하는 빛 테두리 + 어두운 공동 + 그 안에 떠 있는 식빵 */
    .portal { position: relative; width: 158px; height: 158px; margin: 4px auto 20px; }
    .portal::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg, #b79bff, #ff9ecb, #ffd88a, #8be0d0, #8fb8ff, #b79bff);
      filter: blur(2.5px); animation: spin 9s linear infinite;
      box-shadow: 0 16px 32px rgba(140, 115, 210, 0.34); }
    .portal::after { content: ""; position: absolute; inset: 13px; border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, #3d2777 0%, #211355 52%, #130a33 100%);
      box-shadow: inset 0 0 32px rgba(172, 132, 255, 0.7), inset 0 8px 20px rgba(0, 0, 0, 0.55); }
    .portal .core { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center;
      font-size: 3.2rem; animation: portal-bob 3.2s ease-in-out infinite;
      filter: drop-shadow(0 7px 13px rgba(0, 0, 0, 0.5)); }
    .portal:hover::before { animation-duration: 1.6s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes portal-bob { 50% { transform: translateY(-9px) rotate(-7deg); } }
    @media (prefers-reduced-motion: reduce) {
      .portal::before, .portal .core { animation: none; }
    }
    .visual-card { font-size: 3.4rem; text-align: center; padding: 26px 10px; border-radius: 18px; margin-bottom: 16px; letter-spacing: 6px; }
    .choice-btn:hover { animation: wiggle 0.3s ease; border-color: var(--sky); }
    @keyframes wiggle { 25% { transform: rotate(-1.2deg); } 75% { transform: rotate(1.2deg); } }
    .copy-q { background: none; border: none; color: var(--ink-soft); font-family: inherit; font-size: 0.85rem; cursor: pointer; margin-top: 4px; }
    .meme-title { text-align: center; font-size: 1.15rem; color: var(--ink-soft); margin-bottom: 6px; }
    .stat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .stat-row .name { width: 7.2em; font-size: 0.92rem; }
    .stat-row .track { flex: 1; background: var(--line); border-radius: 999px; height: 12px; overflow: hidden; }
    .stat-row .fill { height: 12px; border-radius: 999px; background: linear-gradient(90deg, var(--mint), var(--sky)); }
    .stat-row .val { width: 2.4em; text-align: right; color: var(--ink-soft); font-size: 0.88rem; }
    .bubble { background: var(--cream); border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.95rem; }
  </style>

          roast: "인맥 관리가 곧 취미이자 특기. 남들이 날 어떻게 볼지 계산하느라 정작 내가 뭘 원하는지는 늘 뒷전.",
          stats: [70, 80, 92, 58], chat: ["생일 다 외우고 있는 애", "소식통(전국구)", "어머 자기 그거 들었어?"] },

          roast: "생각은 도착한 다음에 한다. 수습은 미래의 내가 할 일이라 지금은 아주 홀가분함.",
          stats: [88, 95, 12, 62], chat: ["일단 저지르고 생각은 나중에", "같이 있으면 심심할 틈이 없음", "제발 보험 하나만 들어놔라"] },
        ESTJ: { emoji: "🖍️📋", title: "빨간 펜 총감독", memeTitle: "내 일 끝내고 남의 일까지 검사하는 빨간 펜 총감독",
          roast: "내 말이 맞는데 왜 다들 서운해하는지 아직도 모른다. 일은 확실하게 끝내는데 사람은 가끔 놓침.",
          stats: [92, 60, 15, 92], chat: ["맞춤법 지적 1등", "일 맡기면 무조건 끝냄", "잔소리 스킵 기능 어디 없나"] }
      };

      var idx = 0;
      var scores = {};

      function show(state) {
        $("st-intro").style.display = state === "intro" ? "block" : "none";
        $("st-quiz").style.display = state === "quiz" ? "block" : "none";
        $("st-result").style.display = state === "result" ? "block" : "none";
      }

      function calculateMBTI(s) {
        var m = "";
        m += (s.E || 0) >= (s.I || 0) ? "E" : "I";
        m += (s.S || 0) >= (s.N || 0) ? "S" : "N";
        m += (s.T || 0) >= (s.F || 0) ? "T" : "F";
        m += (s.J || 0) >= (s.P || 0) ? "J" : "P";
        return m;
      }

      function copyText(text, btn, okLabel) {
        var prev = btn.textContent;
        (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
          .then(function () { btn.textContent = okLabel; setTimeout(function () { btn.textContent = prev; }, 1500); })
          .catch(function () { prompt("복사해 주세요:", text); });
      }

      // 어느 문항에서 이탈하는지 보려면 문항마다 도달을 남겨야 한다.
      function track(name, props) {
        if (!window.gbTrack) return;
        props = props || {};
        props.test = "mbti";
        window.gbTrack(name, props);
      }

      function renderQ() {
        var q = QUESTIONS[idx];
        if (idx === 0) track("test_start", { total: QUESTIONS.length });
        track("question_view", { index: idx + 1, total: QUESTIONS.length, qid: q.id });
        $("q-fill").style.width = Math.round(idx / QUESTIONS.length * 100) + "%";
        var v = $("q-visual");
        v.textContent = q.visual;
        v.className = "visual-card card " + q.tint;
        v.style.boxShadow = "none";
        $("q-text").textContent = "Q" + (idx + 1) + ". " + q.q;
        $("q-a").textContent = "A. " + q.a.text;
        $("q-b").textContent = "B. " + q.b.text;
      }

      function pick(choice) {
        var sc = QUESTIONS[idx][choice].score;
        for (var k in sc) scores[k] = (scores[k] || 0) + sc[k];
        idx++;
        if (idx < QUESTIONS.length) renderQ();
        else renderResult(calculateMBTI(scores), true);
      }

      function renderResult(type, setHash) {
        var r = RESULTS[type];
        $("r-emoji").textContent = r.emoji;
        $("r-meme").textContent = "「" + r.memeTitle + "」";
        $("r-name").textContent = type + " · " + r.title;
        $("r-roast").textContent = "💥 성격 팩폭: " + r.roast;
        var STAT_NAMES = ["🔥 추진력", "⚡ 텐션", "👀 눈치", "🧠 현실감각"];
        var sh = '<p class="result-desc" style="margin-bottom:6px">📊 대환장 스탯</p>';
        r.stats.forEach(function (v, i) {
          sh += '<div class="stat-row"><span class="name">' + STAT_NAMES[i] + '</span><div class="track"><div class="fill" style="width:' + v + '%"></div></div><span class="val">' + v + "</span></div>";
        });
        $("r-stats").innerHTML = sh;
        var ch = '<p class="result-desc" style="margin:12px 0 6px">💬 단톡방 반응</p>';
        r.chat.forEach(function (t) { ch += '<div class="bubble">' + t + "</div>"; });
        $("r-chat").innerHTML = ch;
        if (setHash) history.replaceState(null, "", "#" + type);
        show("result");
        window.__resultType = type;
        if (setHash && window.GoblubFeed) GoblubFeed.grant("mbti");
        // 남의 결과를 열어본 것뿐이니 내 프로필 카드에 기록하면 안 된다.
        if (setHash && window.GoblubFeed && GoblubFeed.record) {
          GoblubFeed.record("mbti", { emoji: r.emoji, title: type + " · " + r.title, tags: [] });
        }
        // setHash=false 는 링크로 들어온 결과 열람이라 '완주'로 세면 안 된다.
        if (setHash) track("test_complete", { result: type });
      }

      $("btn-start").onclick = function () { idx = 0; scores = {}; renderQ(); show("quiz"); };
      $("q-a").onclick = function () { pick("a"); };
      $("q-b").onclick = function () { pick("b"); };

      $("q-copy").onclick = function () {
        var q = QUESTIONS[idx];
        var url = location.origin + location.pathname;
        copyText("Q. " + q.q + "\nA. " + q.a.text + "\nB. " + q.b.text + "\n👉 나도 하기: " + url, $("q-copy"), "복사됨! 단톡방에 투척하세요 🍞");
      };

      $("r-link").onclick = function () {
        var url = location.origin + location.pathname + "#" + window.__resultType;
        track("result_action", { action: navigator.share ? "share" : "copy_link", result: window.__resultType });
        if (navigator.share) {
          navigator.share({ title: "대환장 상황극 MBTI — 나는 " + window.__resultType, url: url })
            .catch(function () {});
          return;
        }
        copyText(url, $("r-link"), "복사됨!");
      };

      $("r-retry").onclick = function () {
        history.replaceState(null, "", location.pathname);
        show("intro");
      };

      $("r-save").onclick = function () {
        var type = window.__resultType;
        track("result_action", { action: "save_image", result: type });
        var r = RESULTS[type];
        var c = document.createElement("canvas");
        c.width = 720; c.height = 1280;
        var g = c.getContext("2d");
        var W = 720, H = 1280, neon = "#9d6bff";
        function rr(x, y, w, h, rad) {
          g.beginPath(); g.moveTo(x + rad, y);
          g.arcTo(x + w, y, x + w, y + h, rad); g.arcTo(x + w, y + h, x, y + h, rad);
          g.arcTo(x, y + h, x, y, rad); g.arcTo(x, y, x + w, y, rad); g.closePath();
        }
        // 야경 그라데이션 배경
        var grd = g.createLinearGradient(0, 0, 0, H);
        grd.addColorStop(0, "#0d0a2b"); grd.addColorStop(0.45, "#1c1250"); grd.addColorStop(1, "#45227a");
        g.fillStyle = grd; g.fillRect(0, 0, W, H);
        // 레트로 선(줄무늬 태양) — 이모지 뒤 장식
        g.save();
        g.beginPath(); g.arc(W / 2, 400, 170, 0, Math.PI * 2); g.clip();
        var sun = g.createLinearGradient(0, 230, 0, 570);
        sun.addColorStop(0, "#ffd93d"); sun.addColorStop(0.4, "#ff9a5a"); sun.addColorStop(0.75, "#ff6ec7"); sun.addColorStop(1, "#c85cff");
        g.globalAlpha = 0.55; g.fillStyle = sun; g.fillRect(W / 2 - 170, 230, 340, 340);
        g.globalAlpha = 1; g.fillStyle = "#151040";
        for (var si = 0; si < 5; si++) g.fillRect(W / 2 - 170, 380 + si * 34, 340, 10 + si * 2);
        g.restore();
        // 시티 스카이라인
        g.fillStyle = "#0a0620";
        [[0, 1150, 90, 130], [110, 1120, 70, 160], [200, 1160, 80, 120], [300, 1100, 65, 180], [385, 1140, 95, 140],
         [500, 1110, 70, 170], [590, 1155, 80, 125], [685, 1125, 60, 155]].forEach(function (b) { g.fillRect(b[0], b[1], b[2], b[3]); });
        var win = ["#ffd93d", "#ff6ec7", "#4deeea"];
        [[30, 1175], [135, 1150], [230, 1185], [325, 1130], [420, 1165], [525, 1140], [615, 1180], [705, 1155]].forEach(function (p, wi) {
          g.fillStyle = win[wi % 3]; g.globalAlpha = 0.85; g.fillRect(p[0], p[1], 7, 7); g.globalAlpha = 1;
        });
        // 네온 프레임
        g.save(); g.shadowColor = neon; g.shadowBlur = 24; g.strokeStyle = neon; g.lineWidth = 5;
        rr(28, 28, W - 56, H - 56, 32); g.stroke(); g.restore();
        g.strokeStyle = "rgba(255,255,255,0.55)"; g.lineWidth = 1.5;
        rr(28, 28, W - 56, H - 56, 32); g.stroke();
        // 반짝이 장식
        g.textAlign = "center"; g.fillStyle = "#ffd93d"; g.font = "30px sans-serif";
        g.save(); g.shadowColor = "#ffd93d"; g.shadowBlur = 14;
        g.fillText("✦", 96, 200); g.fillText("✦", W - 90, 660); g.fillText("✧", W - 120, 160); g.fillText("✧", 110, 700);
        g.restore();
        // 상단 네온 pill 배지
        var badge = "대환장 상황극 MBTI";
        g.font = "30px 'Jua', 'Malgun Gothic', sans-serif";
        var bw = g.measureText(badge).width + 56;
        g.save(); g.shadowColor = neon; g.shadowBlur = 16; g.strokeStyle = neon; g.lineWidth = 3;
        rr((W - bw) / 2, 96, bw, 62, 31); g.stroke(); g.restore();
        g.fillStyle = "#fff";
        g.save(); g.shadowColor = neon; g.shadowBlur = 10; g.fillText(badge, W / 2, 138); g.restore();
        // 이모지 (레트로 선 위)
        g.font = "150px 'Segoe UI Emoji', sans-serif";
        g.save(); g.shadowColor = neon; g.shadowBlur = 30; g.fillText(r.emoji, W / 2, 455); g.restore();
        // MBTI 4글자 — 초대형 시안 네온
        g.font = "96px 'Jua', 'Malgun Gothic', sans-serif"; g.fillStyle = "#ffffff";
        g.save(); g.shadowColor = "#4deeea"; g.shadowBlur = 30;
        g.fillText(type, W / 2, 632); g.fillText(type, W / 2, 632);
        g.restore();
        // 타이틀 — 핑크 글로우
        g.font = "42px 'Jua', 'Malgun Gothic', sans-serif"; g.fillStyle = "#ffffff";
        g.save(); g.shadowColor = "#ff6ec7"; g.shadowBlur = 22;
        g.fillText(r.title, W / 2, 712);
        g.restore();
        // 밈 타이틀 줄바꿈 — 연보라
        g.font = "30px 'Jua', 'Malgun Gothic', sans-serif"; g.fillStyle = "#cdbdf6";
        var words = r.memeTitle.split(" ");
        var lines = [], line = "";
        words.forEach(function (w) {
          var t = line ? line + " " + w : w;
          if (g.measureText("「" + t + "」").width > 580) { lines.push(line); line = w; }
          else line = t;
        });
        if (line) lines.push(line);
        lines.forEach(function (l, i2) {
          var txt = (i2 === 0 ? "「" : "") + l + (i2 === lines.length - 1 ? "」" : "");
          g.fillText(txt, W / 2, 800 + i2 * 48);
        });
        // 하단 CTA
        g.font = "26px 'Jua', 'Malgun Gothic', sans-serif"; g.fillStyle = "#b9a8e8";
        g.fillText("🌃 goblub · 대환장 놀이터", W / 2, H - 116);
        g.font = "28px 'Jua', 'Malgun Gothic', sans-serif"; g.fillStyle = "#4deeea";
        g.save(); g.shadowColor = "#4deeea"; g.shadowBlur = 12;
        g.fillText("나도 해보기 ▶ goblub-2.vercel.app", W / 2, H - 72);
        g.restore();
        c.toBlob(function (blob) {
          if (!blob) { window.open(c.toDataURL("image/png")); return; }
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "goblub-mbti-" + type + ".png";
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
        }, "image/png");
      };

      // 해시 진입
      var h = (location.hash || "").replace("#", "").toUpperCase();
      if (/^[EI][SN][TF][JP]$/.test(h) && RESULTS[h]) renderResult(h, false);
      else show("intro");
    })();
