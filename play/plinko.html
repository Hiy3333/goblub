<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>운명의 낙하 — goblub</title>
  <meta name="description" content="구슬 하나가 못을 튕기며 10초를 떨어진다 — 마지막 한 줄에서 갈리는 복불복" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=cl2" />
  <style>
    .item-row { display:flex; gap:8px; margin-bottom:8px; }
    .item-row .idx { width:26px; flex:none; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:.9rem; }
    .item-input { flex:1; min-width:0; font-family:inherit; font-size:.98rem; padding:10px 12px;
      border:2px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); }
    .item-input:focus { outline:none; border-color:var(--sky); box-shadow:0 0 10px color-mix(in srgb, var(--sky) 40%, transparent); }
    .item-del { width:42px; flex:none; background:var(--cream); border:1.5px solid var(--line); border-radius:10px;
      color:var(--ink-soft); font-size:1.3rem; line-height:1; cursor:pointer; }
    .item-del:hover:not(:disabled) { border-color:var(--coral); color:var(--coral); }
    .item-del:disabled { opacity:.35; cursor:default; }
    #btn-add { width:100%; margin:4px 0; }
    #btn-add:disabled { opacity:.45; cursor:default; }
    .preset-row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:12px; }
    .err-msg { text-align:center; color:var(--coral); font-weight:bold; margin:8px 0; }

    /* 낙하판 — 화면을 꽉 채워야 긴박하다 */
    .board-wrap { position:relative; margin:16px auto 6px; width:100%; max-width:520px;
      border-radius:18px; overflow:hidden; background:#0a1020;
      box-shadow:0 18px 44px rgba(0,8,24,.55), inset 0 0 0 1px rgba(255,255,255,.06); }
    .board-wrap canvas { display:block; width:100%; height:auto; }
    .board-wrap.shake { animation:bshake .32s ease; }
    @keyframes bshake { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-7px,3px)}
      45%{transform:translate(6px,-4px)} 70%{transform:translate(-4px,2px)} }
    /* 마지막 구간 슬로우모션에 맞춰 화면이 조여드는 느낌 */
    .board-wrap.tense::after { content:""; position:absolute; inset:0; pointer-events:none;
      box-shadow:inset 0 0 90px rgba(255,90,90,.5); animation:tensePulse .7s ease-in-out infinite; }
    @keyframes tensePulse { 0%,100%{opacity:.35} 50%{opacity:.9} }

    .hud { display:flex; justify-content:space-between; align-items:center; gap:10px;
      max-width:520px; margin:0 auto; padding:0 4px; color:var(--ink-soft); font-size:.9rem; }
    .hud .big { color:var(--ink); font-size:1.02rem; }

    .winner { text-align:center; margin-top:14px; display:none; }
    .winner .tag { display:inline-block; font-size:.86rem; color:var(--ink-soft); margin-bottom:2px; }
    .winner .who { font-size:1.9rem; line-height:1.35; word-break:keep-all; }
    .winner.pop { animation:wpop .5s cubic-bezier(.2,1.5,.4,1); }
    @keyframes wpop { from{transform:scale(.5); opacity:0} to{transform:scale(1); opacity:1} }
  </style>
</head>
<body class="clay">
  <div id="site-header"></div>
  <main>
    <section class="hero">
      <h1><span class="e">🎢</span> 운명의 낙하</h1>
      <p>구슬 하나가 못을 튕기며 떨어진다 — 마지막 한 줄에서 갈린다</p>
    </section>

    <section class="panel">
      <div id="setup">
        <h2 style="text-align:center">항목을 넣고 떨어뜨리세요</h2>
        <div class="preset-row">
          <button class="btn-ghost" id="preset-1">🍗 벌칙</button>
          <button class="btn-ghost" id="preset-2">🍽 점심 메뉴</button>
          <button class="btn-ghost" id="preset-3">🧹 청소 당번</button>
        </div>
        <div id="item-list"></div>
        <button class="btn-ghost" id="btn-add" type="button">＋ 항목 추가</button>
        <p class="fine-print" style="text-align:center; margin:2px 0 0">칸에 하나씩 입력해요 (2~8개)</p>
        <p class="err-msg" id="err" style="display:none"></p>
      </div>

      <div class="hud" id="hud" style="display:none">
        <span id="hud-left">🎢 낙하 중…</span>
        <span class="big" id="hud-right"></span>
      </div>
      <div class="board-wrap" id="board-wrap"><canvas id="cv" width="1040" height="1180"></canvas></div>

      <div class="winner" id="winner">
        <span class="tag">🎯 걸렸습니다</span>
        <p class="who" id="winner-who"></p>
      </div>

      <div class="result-actions">
        <button class="btn-primary" id="btn-drop">🎢 떨어뜨리기!</button>
        <button class="btn-ghost" id="btn-again" style="display:none">↺ 한 번 더</button>
        <button class="btn-ghost" id="btn-edit" style="display:none">✎ 항목 고치기</button>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="../js/common.js?v=11" data-root=".."></script>
  <script src="js/feed.js?v=7"></script>
  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var PRESETS = {
      1: ["꿀밤 한 대", "애교 부리기", "다음 판 사기", "아무 노래 부르기", "물 원샷", "면제!"],
      2: ["김밥", "라면", "국밥", "돈까스", "마라탕", "햄버거"],
      3: ["설거지", "분리수거", "화장실", "바닥 쓸기", "오늘은 쉼"]
    };
    var MIN = 2, MAX = 8;
    var COLS = ["#ff9aa8", "#ffd479", "#8fe0a6", "#8fc4ff", "#d3a8ff", "#ffb185", "#7fdede", "#f5a9d0"];

    /* ── 항목 입력 ───────────────────────────────── */
    var list = $("item-list");
    function rows() { return list.querySelectorAll(".item-row"); }
    function updateUI() {
      var n = rows().length;
      Array.prototype.forEach.call(rows(), function (r, i) {
        r.querySelector(".idx").textContent = i + 1;
        r.querySelector(".item-del").disabled = n <= MIN;
      });
      $("btn-add").disabled = n >= MAX;
    }
    function addRow(val) {
      if (rows().length >= MAX) return;
      var row = document.createElement("div");
      row.className = "item-row";
      row.innerHTML = '<span class="idx"></span>' +
        '<input class="item-input" type="text" maxlength="14" placeholder="예) 설거지" />' +
        '<button class="item-del" type="button" aria-label="삭제">×</button>';
      row.querySelector(".item-input").value = val || "";
      row.querySelector(".item-del").onclick = function () {
        if (rows().length <= MIN) return;
        row.remove(); updateUI();
      };
      list.appendChild(row);
      updateUI();
    }
    function setItems(arr) {
      list.innerHTML = "";
      arr.slice(0, MAX).forEach(function (v) { addRow(v); });
      while (rows().length < MIN) addRow("");
      updateUI();
    }
    function readItems() {
      var out = [];
      Array.prototype.forEach.call(rows(), function (r) {
        var v = r.querySelector(".item-input").value.trim();
        if (v) out.push(v);
      });
      return out;
    }
    $("btn-add").onclick = function () { addRow(""); };
    [1, 2, 3].forEach(function (k) { $("preset-" + k).onclick = function () { setItems(PRESETS[k]); hideErr(); }; });
    function showErr(m) { var e = $("err"); e.textContent = m; e.style.display = "block"; }
    function hideErr() { $("err").style.display = "none"; }
    setItems(PRESETS[1]);

    /* ── 판 그리기 ───────────────────────────────── */
    var cv = $("cv"), g = cv.getContext("2d");
    var W = cv.width, H = cv.height;
    var ROWS = 12;                       // 못 줄 수 — 많을수록 경로가 예측 불가
    var TOP = 118, BOT = H - 200;        // 못이 놓이는 세로 범위
    var GAP = (BOT - TOP) / (ROWS - 1);  // 줄 간격
    var SLOT_Y = H - 150;                // 슬롯 상단
    var items = [], pegs = [], slotW = 0;

    function buildBoard(n) {
      pegs = [];
      // 벽돌 격자 — 줄마다 반 칸씩 어긋나게. 이래야 어느 못에 맞아도 좌우로 갈라진다
      var PC = 11, span = W * 0.9, x0 = (W - span) / 2, dx = span / (PC - 1);
      for (var r = 0; r < ROWS; r++) {
        var odd = r % 2, cnt = odd ? PC - 1 : PC, off = odd ? dx / 2 : 0, y = TOP + r * GAP;
        for (var c = 0; c < cnt; c++) pegs.push({ x: x0 + off + c * dx, y: y, hit: 0 });
      }
      slotW = W / n;
    }

    function drawBoard(ballX, ballY, trail, highlight) {
      g.clearRect(0, 0, W, H);
      // 배경 — 우주 톤
      var bg = g.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#0d1430"); bg.addColorStop(.55, "#0a1024"); bg.addColorStop(1, "#141a38");
      g.fillStyle = bg; g.fillRect(0, 0, W, H);
      for (var i = 0; i < 70; i++) {           // 잔별
        var sx = (i * 977) % W, sy = (i * 613) % H;
        g.globalAlpha = .1 + ((i * 37) % 40) / 100;
        g.fillStyle = "#cfe0ff"; g.fillRect(sx, sy, 2, 2);
      }
      g.globalAlpha = 1;

      // 슬롯
      for (var s = 0; s < items.length; s++) {
        var x = s * slotW, on = highlight === s;
        g.fillStyle = on ? COLS[s % COLS.length] : "rgba(255,255,255,.07)";
        g.globalAlpha = on ? .9 : 1;
        g.fillRect(x + 4, SLOT_Y, slotW - 8, H - SLOT_Y - 12);
        g.globalAlpha = 1;
        g.strokeStyle = COLS[s % COLS.length]; g.lineWidth = on ? 6 : 2.5;
        g.strokeRect(x + 4, SLOT_Y, slotW - 8, H - SLOT_Y - 12);
        // 칸 이름 — 길면 줄여서
        g.fillStyle = on ? "#101828" : "#e8eeff";
        g.font = "600 " + Math.min(34, Math.max(19, slotW / 4.6)) + "px 'Jua', sans-serif";
        g.textAlign = "center"; g.textBaseline = "middle";
        var label = items[s].length > 6 ? items[s].slice(0, 5) + "…" : items[s];
        g.fillText(label, x + slotW / 2, SLOT_Y + (H - SLOT_Y - 12) / 2);
      }
      // 슬롯 칸막이
      g.strokeStyle = "rgba(180,205,255,.35)"; g.lineWidth = 3;
      for (var k = 1; k < items.length; k++) {
        g.beginPath(); g.moveTo(k * slotW, SLOT_Y - 34); g.lineTo(k * slotW, SLOT_Y); g.stroke();
      }

      // 못
      pegs.forEach(function (p) {
        var glow = p.hit > 0;
        g.beginPath(); g.arc(p.x, p.y, glow ? 11 : 7, 0, 6.284);
        g.fillStyle = glow ? "#fff2c2" : "#8fa4d8";
        if (glow) { g.shadowColor = "#ffd479"; g.shadowBlur = 22; }
        g.fill(); g.shadowBlur = 0;
        if (p.hit > 0) p.hit -= 1;
      });

      // 꼬리
      if (trail && trail.length > 1) {
        for (var t = 1; t < trail.length; t++) {
          g.beginPath(); g.moveTo(trail[t - 1].x, trail[t - 1].y); g.lineTo(trail[t].x, trail[t].y);
          g.strokeStyle = "rgba(255,220,150," + (t / trail.length) * .55 + ")";
          g.lineWidth = 3 + (t / trail.length) * 9; g.lineCap = "round"; g.stroke();
        }
      }
      // 구슬
      if (ballY != null) {
        g.beginPath(); g.arc(ballX, ballY, 21, 0, 6.284);
        var bg2 = g.createRadialGradient(ballX - 7, ballY - 8, 3, ballX, ballY, 22);
        bg2.addColorStop(0, "#fff9e6"); bg2.addColorStop(1, "#ffb43f");
        g.fillStyle = bg2; g.shadowColor = "#ffc857"; g.shadowBlur = 34; g.fill(); g.shadowBlur = 0;
      }
    }

    /* ── 낙하 경로 ───────────────────────────────────
       못을 자유롭게 튕기게 두면 결과가 가운데로 몰린다(이항분포).
       그래서 당첨 칸을 먼저 균등 확률로 뽑고, 그 칸에 닿는
       좌/우 시퀀스를 무작위로 섞어 만든다 — 확률은 완전히 공평하고
       경로는 매번 다르게 흔들린다. */
    function makePath(nSlots) {
      var target = Math.floor(Math.random() * nSlots);
      var targetX = target * slotW + slotW / 2;
      var startX = W / 2 + (Math.random() * 60 - 30);
      // 줄마다 x 를 미리 정해 둔다. 목표로 서서히 수렴하되 남은 거리에 비례해
      // 크게 흔들리므로, 초반엔 좌우로 시원하게 튀고 끝에서만 좁혀진다.
      var xs = [startX];
      for (var r = 1; r <= ROWS; r++) {
        var frac = r / ROWS;
        var base = startX + (targetX - startX) * frac;
        var wobble = (1 - frac) * Math.max(slotW, W / 5) * 1.05;
        var x = base + (Math.random() * 2 - 1) * wobble;
        xs.push(Math.max(46, Math.min(W - 46, x)));
      }
      xs[ROWS] = targetX;                    // 마지막은 반드시 목표 칸
      return { target: target, xs: xs };
    }

    /* ── 애니메이션 ───────────────────────────────── */
    var busy = false;
    function drop() {
      items = readItems();
      if (items.length < MIN) return showErr("항목을 " + MIN + "개 이상 넣어주세요");
      hideErr();
      busy = true;
      $("btn-drop").disabled = true;
      $("btn-again").style.display = "none"; $("btn-edit").style.display = "none";
      $("winner").style.display = "none"; $("winner").classList.remove("pop");
      $("setup").style.display = "none";
      $("hud").style.display = "flex";
      var wrap = $("board-wrap");
      wrap.classList.remove("tense");
      // 슬롯이 화면 밖이면 긴장이 안 산다 — 판을 화면 가운데로 맞추고 시작
      if (wrap.scrollIntoView) wrap.scrollIntoView({ behavior: "smooth", block: "center" });

      buildBoard(items.length);
      var plan = makePath(items.length);
      var xs = plan.xs, target = plan.target;

      var row = 0;                 // 지금 향하는 줄
      var prog = 0;                // 줄 사이 진행도 0~1
      var trail = [], last = performance.now();
      var x = xs[0], y = 40;

      function frame(now) {
        var dtms = Math.min(48, now - last); last = now;
        // 마지막 3줄은 절반 속도 — 승부처에서 시간을 늘린다
        var slow = row >= ROWS - 3 ? .42 : 1;
        prog += (dtms / 1000) * 3.1 * slow;

        if (row < ROWS) {
          if (prog >= 1) {                         // 못 도착 → 튕기고 다음 줄로
            prog = 0;
            var rowY = TOP + row * GAP;
            var best = null, bd = 1e9;             // 맞은 못을 빛낸다
            pegs.forEach(function (p) {
              if (Math.abs(p.y - rowY) > 1) return;
              var d = Math.abs(p.x - xs[row + 1]); if (d < bd) { bd = d; best = p; }
            });
            if (best) best.hit = 9;
            row++;
            if (row === ROWS - 3) wrap.classList.add("tense");
            $("hud-left").textContent = "🎢 " + Math.min(row, ROWS) + " / " + ROWS + " 줄 통과";
          }
          var y0 = row === 0 ? 40 : TOP + (row - 1) * GAP;
          var y1 = TOP + row * GAP;
          var e = prog * prog;                     // 아래로 갈수록 가속
          y = y0 + (y1 - y0) * e;
          var xa = xs[row], xb = xs[Math.min(row + 1, ROWS)];
          x = xa + (xb - xa) * prog;
          y -= Math.sin(prog * 3.14159) * 13;      // 통통 튀는 아치
        } else {
          y += (dtms / 16.67) * 15 * slow;         // 슬롯으로 낙하
          x += (xs[ROWS] - x) * 0.22;
          if (y >= SLOT_Y + 46) return land(target);
        }
        x = Math.max(26, Math.min(W - 26, x));
        trail.push({ x: x, y: y }); if (trail.length > 16) trail.shift();
        drawBoard(x, y, trail, null);
        requestAnimationFrame(frame);
      }

      function land(idx) {
        wrap.classList.remove("tense");
        wrap.classList.add("shake");
        setTimeout(function () { wrap.classList.remove("shake"); }, 340);
        var flash = 0;
        (function blink() {                       // 당첨 칸 점멸
          drawBoard(null, null, null, flash % 2 ? idx : null);
          flash++;
          if (flash < 9) return setTimeout(blink, 90);
          drawBoard(null, null, null, idx);
          $("hud-left").textContent = "🎯 낙하 완료";
          $("hud-right").textContent = "";
          $("winner-who").textContent = items[idx];
          $("winner").style.display = "block";
          void $("winner").offsetWidth; $("winner").classList.add("pop");
          $("btn-drop").style.display = "none";
          $("btn-again").style.display = ""; $("btn-edit").style.display = "";
          busy = false;
          if (window.GoblubFeed) GoblubFeed.grant("plinko");
          if (window.gbTrack) window.gbTrack("minigame_play", { game: "plinko", items: items.length, result: items[idx] });
        })();
      }

      $("hud-right").textContent = items.length + "칸";
      requestAnimationFrame(frame);
    }

    $("btn-drop").onclick = function () { if (!busy) drop(); };
    $("btn-again").onclick = function () {
      $("btn-drop").style.display = ""; $("btn-drop").disabled = false;
      drop();
    };
    $("btn-edit").onclick = function () {
      $("setup").style.display = ""; $("hud").style.display = "none";
      $("winner").style.display = "none";
      $("btn-drop").style.display = ""; $("btn-drop").disabled = false;
      $("btn-again").style.display = "none"; $("btn-edit").style.display = "none";
      items = readItems(); if (items.length >= MIN) { buildBoard(items.length); drawBoard(null, null, null, null); }
    };

    // 첫 화면 — 빈 판을 미리 보여준다
    items = readItems(); buildBoard(items.length); drawBoard(null, null, null, null);
  })();
  </script>
</body>
</html>
