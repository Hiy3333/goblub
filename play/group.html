<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>단톡방 사주 감정서 — goblub</title>
<meta name="description" content="단톡방 멤버들 생일로 방 전체의 기운을 감정 — 방의 정체, 수호 고브럽, 멤버 역할 배정까지" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
<style>
:root{ --ink:#e8f0fb; --soft:#9fb2c9; --line:rgba(160,190,225,.22); --pop1:#ff8ac2; --pop2:#b39dff; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b1626;color:var(--ink);font-family:'Jua','Malgun Gothic',sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 70% at 50% -10%, rgba(90,140,200,.2), transparent 60%),
             radial-gradient(90% 60% at 50% 110%, rgba(140,80,200,.22), transparent 60%)}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 16px 44px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 6px}
.topbar a{color:var(--soft);text-decoration:none;font-size:.92rem}
.topbar .t{font-size:1.05rem}
.topbar .sp{width:44px}
.lead{text-align:center;padding:16px 6px 4px}
.lead h1{margin:0 0 8px;font-size:1.6rem;text-shadow:0 0 18px rgba(180,150,255,.35)}
.lead p{margin:0;color:var(--soft);font-size:.93rem;line-height:1.75}
.box{margin-top:16px;background:rgba(18,30,52,.72);border:1px solid var(--line);border-radius:18px;padding:16px 15px 18px}
.box h2{margin:0 0 10px;font-size:1.05rem}
.roomrow{margin-bottom:12px}
.roomrow input{width:100%;padding:11px;border-radius:11px;background:#0e1c2c;color:var(--ink);
  border:1px solid var(--line);font-family:inherit;font-size:.95rem}
.mem{display:flex;gap:6px;margin-bottom:7px;align-items:center}
.mem input[type=text]{flex:0 0 86px;min-width:0;padding:9px 8px;border-radius:10px;background:#0e1c2c;
  color:var(--ink);border:1px solid var(--line);font-family:inherit;font-size:.88rem}
.mem select{flex:1 1 auto;min-width:0;padding:9px 6px;border-radius:10px;background:#0e1c2c;
  color:var(--ink);border:1px solid var(--line);font-family:inherit;font-size:.88rem}
.mem .rm{flex:0 0 34px;padding:8px 0;border-radius:10px;border:1px solid rgba(255,140,150,.35);
  background:rgba(60,20,30,.5);color:#ff9d8a;cursor:pointer;font-family:inherit}
.addrow{width:100%;margin-top:4px;padding:10px;border-radius:11px;cursor:pointer;font-family:inherit;
  font-size:.92rem;color:#cfd9f2;background:rgba(255,255,255,.06);border:1px dashed var(--line)}
.gobtn{width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;cursor:pointer;
  font-family:inherit;font-size:1.05rem;color:#fff;
  background:linear-gradient(135deg,var(--pop1),var(--pop2));
  box-shadow:0 10px 26px rgba(190,110,255,.38)}
.errmsg{display:none;margin:10px 0 0;color:#ff9d8a;font-size:.86rem;text-align:center}
.fine{margin:12px 0 0;color:#6f8299;font-size:.76rem;text-align:center;line-height:1.7}

/* ── 결과 ── */
#result{display:none}
.rhead{text-align:center;margin:20px 0 4px}
.rhead .nm{font-size:1.7rem;display:inline-block;line-height:1.3;
  background:linear-gradient(100deg,#ffd98a,#ff9ecb 45%,#b39dff 85%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.rhead .sb{margin-top:5px;color:#c9b8ff;font-size:.92rem}
.ohbox{margin-top:16px;background:rgba(20,26,52,.72);border:1px solid rgba(150,130,255,.22);
  border-radius:18px;padding:15px 16px 9px}
.ohbox h4{margin:0 0 12px;font-size:.95rem;color:#ffd9ef;font-weight:400}
.ohrow{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.ohrow .k{flex:0 0 76px;font-size:.88rem;color:#dfe6f8}
.ohrow .bar{flex:1;height:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.ohrow .bar i{display:block;height:100%;width:0;border-radius:999px;transition:width 1s cubic-bezier(.25,1,.4,1)}
.ohrow .v{flex:0 0 42px;text-align:right;font-size:.88rem;color:#ffb8dd}
.verdict{margin-top:12px;border-radius:18px;padding:14px 16px;border:1px solid rgba(190,150,255,.3);
  background:rgba(30,26,60,.7);font-size:.94rem;line-height:1.8;color:#e6ecf9}
.verdict b{color:#ffd9a0;font-weight:400}
.guard{display:flex;gap:12px;align-items:center;margin-top:12px;border-radius:18px;padding:13px 16px;
  border:1px solid rgba(150,130,255,.22);background:rgba(20,26,52,.72)}
.guard .e{font-size:2.3rem}
.guard b{display:block;color:#ffd9ef;font-weight:400;margin-bottom:3px}
.guard p{margin:0;font-size:.87rem;color:#cfd9f2;line-height:1.65}
.names{margin-top:12px;border-radius:18px;padding:13px 16px;border:1px solid rgba(150,130,255,.22);
  background:rgba(20,26,52,.72)}
.names b{display:block;color:#ffd9ef;font-weight:400;margin-bottom:8px;font-size:.95rem}
.names .chip{display:inline-block;margin:0 6px 6px 0;padding:7px 13px;border-radius:999px;
  font-size:.88rem;color:#e3d5ff;background:rgba(150,110,255,.14);border:1px solid rgba(190,150,255,.35)}
.roles{margin-top:12px}
.role{display:flex;gap:11px;align-items:flex-start;margin-bottom:9px;border-radius:16px;
  padding:12px 14px;border:1px solid rgba(150,130,255,.22);background:rgba(20,26,52,.72)}
.role .e{font-size:1.9rem;line-height:1.2}
.role b{color:#fff;font-weight:400}
.role .rn{color:#ffb8dd;font-size:.95rem}
.role p{margin:3px 0 0;font-size:.85rem;color:#aabde0;line-height:1.6}
.role .tag{display:inline-block;margin-left:6px;padding:1px 9px;border-radius:999px;font-size:.72rem;
  color:#ffd9a0;border:1px solid rgba(255,214,150,.4)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btnrow button,.btnrow a{flex:1 1 46%;padding:12px;border:1px solid var(--line);border-radius:13px;
  background:rgba(18,34,52,.7);color:var(--ink);cursor:pointer;font-family:inherit;font-size:.93rem;
  text-align:center;text-decoration:none}
.btnrow .main{flex:1 1 100%;border:0;color:#fff;background:linear-gradient(135deg,var(--pop1),var(--pop2))}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="fortune-hub.html">← 운세</a>
    <span class="t">💬 단톡방 사주 감정서</span>
    <span class="sp"></span>
  </div>

  <div id="intro">
    <div class="lead">
      <h1>우리 방, 정체가 뭘까</h1>
      <p>멤버들 생일을 넣으면 방 전체의 기운을 감정해 드려요.<br>방의 정체 · 수호 고브럽 · 멤버 역할까지.</p>
    </div>
    <div class="box">
      <h2>💬 방 정보</h2>
      <div class="roomrow"><input type="text" id="room" maxlength="16" placeholder="방 이름 (예: 밥먹자5인방 — 비워도 돼요)" /></div>
      <h2>👥 멤버 (2~8명)</h2>
      <div id="members"></div>
      <button class="addrow" id="add">＋ 멤버 추가</button>
      <button class="gobtn" id="go">🔮 우리 방 감정하기</button>

      <p class="fine">생일 정보는 이 브라우저 안에서만 계산되고 저장되지 않아요.</p>
    </div>
  </div>

  <div id="result">
    <div class="rhead">
      <div class="nm" id="r-name"></div>
      <div class="sb">의 감정서</div>
    </div>
    <div class="ohbox"><h4>🔥 방의 기운 분포</h4><div id="r-oheng"></div></div>
    <div class="verdict" id="r-verdict"></div>
    <div class="guard" id="r-guard"></div>
    <div class="names" id="r-names"></div>
    <div class="roles" id="r-roles"></div>
    <div class="btnrow">
      <button class="main" id="save">📸 감정서 이미지 저장</button>
      <button id="retry">↺ 다시 감정하기</button>
      <a href="fortune-hub.html">✧ 다른 운세 보기</a>
    </div>
  </div>
</div>

<script src="../js/common.js?v=24" data-root=".."></script>
<script src="js/saju.js"></script>
<script src="js/lunar.js?v=1"></script>
<script>
var $=function(id){return document.getElementById(id);};
var data=null;
fetch("data/saju-terms.json").then(function(r){return r.json();}).then(function(d){data=d;});

/* ── 멤버 입력 ── */
var seq=0;
function addMember(){
  if($("members").children.length>=8) return;
  var id="m"+(seq++);
  var row=document.createElement("div"); row.className="mem"; row.id=id;
  row.innerHTML='<input type="text" maxlength="8" placeholder="이름" />'+
    '<select class="y"></select><select class="mo"></select><select class="d"></select>'+
    '<select class="c"><option value="">양력</option><option value="L">음력</option><option value="LL">윤달</option></select>'+
    '<button type="button" class="rm">✕</button>';
  var y=row.querySelector(".y"), mo=row.querySelector(".mo"), d=row.querySelector(".d");
  var now=new Date().getFullYear();
  for(var i=now;i>=1940;i--) y.add(new Option(i,i));
  for(var j=1;j<=12;j++) mo.add(new Option(j+"월",j));
  for(var k=1;k<=31;k++) d.add(new Option(k+"일",k));
  y.value=2005;
  row.querySelector(".rm").onclick=function(){
    if($("members").children.length>2) row.remove();
  };
  $("members").appendChild(row);
}
addMember(); addMember(); addMember();
$("add").onclick=addMember;

function readMembers(){
  var out=[];
  var rows=$("members").children;
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    var name=(r.querySelector("input").value||"").trim() || ("멤버"+(i+1));
    var y=+r.querySelector(".y").value, m=+r.querySelector(".mo").value, d=+r.querySelector(".d").value;
    var cal=r.querySelector(".c").value;
    if(cal){
      if(!window.GoblubLunar) return null;
      var sol=GoblubLunar.lunarToSolar(y,m,d,cal==="LL");
      if(!sol) return null;
      y=sol.y; m=sol.m; d=sol.d;
    }else{
      var dt=new Date(y,m-1,d);
      if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d) return null;
    }
    out.push({name:name, y:y, m:m, d:d});
  }
  return out;
}

/* ── 감정 로직 ── */
var OH_UI={ "목":["🌳","나무",  "#7fd0a8"], "화":["🔥","불", "#ff8a6a"], "토":["🪨","흙", "#e0c07a"],
            "금":["🔪","쇠", "#bcd2ff"], "수":["🌊","물", "#6ab8ff"] };
var VERDICT={
  "화":"이 방은 <b>불의 방</b>이다. 말 꺼내기 무섭게 「ㄱㄱ」가 달리고, 계획보다 추진력이 먼저 나간다. 단점: 아무도 예약을 안 해놨다.",
  "수":"이 방은 <b>물의 방</b>이다. 겉은 잔잔한데 새벽 감성 토크가 시작되면 아무도 못 빠져나간다. 단점: 「뭐 먹지」 회의가 3시간 걸린다.",
  "목":"이 방은 <b>나무의 방</b>이다. 늘 뭔가 새로 시작한다 — 새 취미, 새 계획, 새 다짐. 단점: 끝을 본 적은 잘 없다.",
  "금":"이 방은 <b>쇠의 방</b>이다. 팩트와 결론이 빠르고, 정산이 칼같다. 단점: 위로를 바랐는데 해결책이 온다.",
  "토":"이 방은 <b>흙의 방</b>이다. 유행을 타지 않고 갈 사람만 간다. 십 년 뒤에도 남아 있을 방. 단점: 새 이야기가 3주째 없다.",
  "균형":"이 방은 <b>오행이 고루 섞인 균형의 방</b>이다. 누가 폭주하면 누가 말리고, 누가 가라앉으면 누가 끌어올린다. 흔치 않은 조합이다."
};
var GUARD={
  "화":["🔥","화르륵","불의 수호 고브럽. 방이 조용해지면 3분 안에 아무 말이나 던져 불씨를 살린다."],
  "수":["🌊","출렁이","물의 수호 고브럽. 새벽 2시 감성 토크가 시작되면 어디선가 나타나 경청한다."],
  "목":["🌳","쑥쑥이","나무의 수호 고브럽. 「우리 이거 해볼까?」가 나올 때마다 몰래 물을 준다."],
  "금":["🔪","싹둑이","쇠의 수호 고브럽. 이야기가 산으로 가면 결론을 싹둑 잘라 정리해 준다."],
  "토":["🪨","묵묵이","흙의 수호 고브럽. 아무도 말 안 해도 방을 지킨다. 나가는 사람 없게 문을 깔고 앉아 있다."],
  "균형":["✨","고루미","균형의 수호 고브럽. 다섯 기운 사이를 오가며 방의 온도를 맞춘다."]
};
var NAME_BANK={
  "화":["불조심","동네방화범들","텐션수습불가"], "수":["새벽수족관","눈물바다어장","잔잔파도"],
  "목":["새싹보호구역","무한도전준비위","자라나라"], "금":["칼정산위원회","팩트폭격대","결론부터"],
  "토":["천년가는방","묵묵장수마을","안나가요"], "균형":["오행종합선물","밸런스맛집","기운총집합"]
};
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h>>>0;}

/* 역할 후보 — (키, 가중치, 이모지, 이름, 설명) */
var ROLE_DEF={
  dohwa:  ["🦋","분위기 담당","어딜 가나 시선이 먼저 닿는다. 이 사람이 조용하면 방 전체가 「무슨 일 있어?」 모드가 된다."],
  yeokma: ["✈️","총알 참석러","약속 장소가 어디든 일단 온다. 「나 근처야」의 근처가 옆 도시일 때도 있다."],
  hwagae: ["🫥","잠수함","읽씹 3일은 기본. 하지만 진짜 중요한 순간엔 제일 먼저 떠오른다."],
  fire:   ["🔥","불씨 담당","죽어가는 방을 살리는 심폐소생 전문. 「야」 한 글자로 대화를 연다."],
  water:  ["🧊","브레이크 담당","과열된 계획에 「그거 돈 얼마 드는데?」를 시전한다. 방의 안전벨트."],
  wood:   ["🌱","새 판 벌이기","「우리 이거 해볼까」 지분 90%. 이 사람 없으면 방에 새 이야기가 없다."],
  metal:  ["🔪","팩폭 담당","돌려 말하기를 모른다. 상처는 주는데 이상하게 고맙다."],
  earth:  ["🪨","중심 잡기","싸움이 나면 양쪽 다 이 사람한테 하소연한다. 방의 무게추."],
  chongmu:["💰","총무상","정산이 소수점까지 맞는다. 이 사람 없으면 회비는 증발한다."],
  drip:   ["🎭","드립 담당","진지한 얘기에 낄낄 포인트를 심는다. 수위 조절 실패가 가끔 있다."],
  notice: ["📢","공지봇","날짜·장소·시간을 세 번 말해 준다. 이 사람이 없으면 모임이 성립하지 않는다."],
  snack:  ["🍜","맛집 담당","「거기 갈 거면 이거 먹어」가 자동 발사된다. 저장된 맛집 리스트가 자산이다."],
  info:   ["📚","정보 담당","뭘 물어봐도 링크가 온다. 이 방의 검색엔진."],
  fight:  ["🥊","맞짱 담당","불의를 보면 못 참는다. 환불 전화는 이 사람이 한다."]
};
var SS_ROLE={0:"fight",1:"fight",2:"snack",3:"drip",4:"chongmu",5:"chongmu",7:"notice",8:"info",9:"info"};
var OH_ROLE={"화":"fire","수":"water","목":"wood","금":"metal","토":"earth"};

function analyze(members){
  var rs=members.map(function(mb){
    return { name:mb.name, r:Saju.compute(data,{y:mb.y,m:mb.m,d:mb.d,hour:12,min:0},{}) };
  });
  // 방 오행 합산
  var tot={목:0,화:0,토:0,금:0,수:0}, sum=0;
  rs.forEach(function(x){ for(var k in tot){ tot[k]+=x.r.oheng[k]||0; } });
  for(var k in tot) sum+=tot[k];
  var pct={}, top=null, sorted=[];
  for(var k in tot){ pct[k]=Math.round(tot[k]/sum*100); sorted.push([k,tot[k]]); }
  sorted.sort(function(a,b){return b[1]-a[1];});
  top=sorted[0][0];
  var balanced = (sorted[0][1]-sorted[4][1])/sum < 0.14;
  var domKey = balanced ? "균형" : top;

  // 멤버별 역할 후보
  var cand=rs.map(function(x,i){
    var out=[], ji=x.r.pillars.day[1];
    if([0,6,3,9].indexOf(ji)>=0) out.push(["dohwa",5]);
    if([2,8,5,11].indexOf(ji)>=0) out.push(["yeokma",4]);
    if([4,10,1,7].indexOf(ji)>=0) out.push(["hwagae",4]);
    // 본인 오행 최다
    var mo=null;
    for(var k in x.r.oheng) if(mo==null||x.r.oheng[k]>x.r.oheng[mo]) mo=k;
    out.push([OH_ROLE[mo],3]);
    if(x.r.topSipseong!=null && SS_ROLE[x.r.topSipseong]) out.push([SS_ROLE[x.r.topSipseong],2]);
    // 결정적 타이브레이커
    out.forEach(function(c,ci){ c[1]+= (hash(x.name+"|"+i+"|"+c[0])%100)/1000; });
    return out.sort(function(a,b){return b[1]-a[1];});
  });
  // 전역 유일 배정 — 가중치 큰 순
  var flat=[];
  cand.forEach(function(cs,i){ cs.forEach(function(c){ flat.push([i,c[0],c[1]]); }); });
  flat.sort(function(a,b){return b[2]-a[2];});
  var got={}, used={};
  flat.forEach(function(f){
    if(got[f[0]]!=null || used[f[1]]) return;
    got[f[0]]=f[1]; used[f[1]]=1;
  });
  // 못 받은 사람(역할 소진)엔 남은 풀에서
  var pool=Object.keys(ROLE_DEF).filter(function(k){return !used[k];});
  rs.forEach(function(x,i){ if(got[i]==null){ got[i]=pool.shift()||"earth"; } });

  return { rs:rs, pct:pct, domKey:domKey, top:top, roles:got };
}

/* ── 렌더 ── */
var last=null;
$("go").onclick=function(){
  $("err").style.display="none";
  if(!data){ $("err").textContent="감정 도구를 아직 펴는 중이에요. 잠시 후 다시!"; $("err").style.display="block"; return; }
  var members=readMembers();
  if(!members){ $("err").textContent="없는 날짜가 있어요. 확인해 주세요!"; $("err").style.display="block"; return; }
  if(members.length<2){ $("err").textContent="멤버는 2명부터!"; $("err").style.display="block"; return; }
  last=analyze(members);
  last.room=($("room").value||"").trim() || "이름 없는 방";
  render();
};
function render(){
  var a=last;
  $("intro").style.display="none"; $("result").style.display="block";
  window.scrollTo(0,0);
  $("r-name").textContent=a.room;
  var order=["화","수","목","금","토"];
  $("r-oheng").innerHTML=order.map(function(k){
    var u=OH_UI[k];
    return '<div class="ohrow"><span class="k">'+u[0]+' '+u[1]+'('+k+')</span>'+
      '<span class="bar"><i data-w="'+a.pct[k]+'" style="background:'+u[2]+'"></i></span>'+
      '<span class="v">'+a.pct[k]+'%</span></div>';
  }).join("");
  setTimeout(function(){
    document.querySelectorAll("#r-oheng .bar i").forEach(function(b){ b.style.width=b.dataset.w+"%"; });
  },60);
  $("r-verdict").innerHTML=VERDICT[a.domKey];
  var g=GUARD[a.domKey];
  $("r-guard").innerHTML='<span class="e">'+g[0]+'</span><span><b>수호 고브럽 · '+g[1]+'</b><p>'+g[2]+'</p></span>';
  var seedStr=a.rs.map(function(x){return x.name;}).join(",");
  var bank=NAME_BANK[a.domKey], h0=hash(seedStr);
  var picks=[bank[h0%3], bank[(h0>>>2)%3], bank[(h0>>>4)%3]]
    .filter(function(v,i,arr){return v && arr.indexOf(v)===i;});
  $("r-names").innerHTML="<b>📛 감정관이 추천하는 방 이름</b>"+
    picks.map(function(n){return '<span class="chip">'+n+" ("+a.rs.length+"인)</span>";}).join("");
  $("r-roles").innerHTML=a.rs.map(function(x,i){
    var rd=ROLE_DEF[a.roles[i]], ji=x.r.pillars.day[1];
    var tag = [0,6,3,9].indexOf(ji)>=0&&a.roles[i]!=="dohwa" ? "도화"
            : [2,8,5,11].indexOf(ji)>=0&&a.roles[i]!=="yeokma" ? "역마"
            : [4,10,1,7].indexOf(ji)>=0&&a.roles[i]!=="hwagae" ? "화개" : "";
    return '<div class="role"><span class="e">'+rd[0]+'</span><span><b>'+esc(x.name)+'</b> · '+
      '<span class="rn">'+rd[1]+'</span>'+(tag?'<span class="tag">'+tag+'</span>':"")+
      '<p>'+rd[2]+' <span style="color:#8ba0c4">('+x.r.zodiac+'띠)</span></p></span></div>';
  }).join("");
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
$("retry").onclick=function(){ $("result").style.display="none"; $("intro").style.display="block"; window.scrollTo(0,0); };

/* ── 이미지 저장 ── */
$("save").onclick=function(){
  var a=last; if(!a) return;
  var W=1080, PAD=70, y=0;
  var order=["화","수","목","금","토"];
  var H=250+order.length*64+150+a.rs.length*108+230;
  var c=document.createElement("canvas"); c.width=W; c.height=H;
  var g=c.getContext("2d");
  var bg=g.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#101a30"); bg.addColorStop(1,"#0a101c");
  g.fillStyle=bg; g.fillRect(0,0,W,H);
  function glow(x,yy,r,col){var rg=g.createRadialGradient(x,yy,0,x,yy,r);
    rg.addColorStop(0,col);rg.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=rg;g.fillRect(0,0,W,H);}
  glow(540,60,520,"rgba(140,90,220,.28)"); glow(540,H-60,520,"rgba(255,140,190,.14)");
  g.textAlign="center";
  g.fillStyle="#c9b8ff"; g.font="30px Jua, sans-serif"; g.fillText("단톡방 사주 감정서",W/2,86);
  g.fillStyle="#ffe6b8"; g.font="58px Jua, sans-serif"; g.fillText(a.room,W/2,160);
  y=230;
  g.textAlign="left";
  order.forEach(function(k){
    var u=OH_UI[k], p=a.pct[k];
    g.fillStyle="#dfe6f8"; g.font="30px Jua, sans-serif"; g.fillText(u[0]+" "+u[1],PAD,y+30);
    g.fillStyle="rgba(255,255,255,.1)"; rr(g,PAD+150,y+6,W-PAD*2-220,26,13); g.fill();
    g.fillStyle=u[2]; rr(g,PAD+150,y+6,(W-PAD*2-220)*p/100,26,13); g.fill();
    g.fillStyle="#ffb8dd"; g.font="26px Jua, sans-serif"; g.fillText(p+"%",W-PAD-60,y+30);
    y+=64;
  });
  y+=26;
  var gd=GUARD[a.domKey];
  g.fillStyle="#ffd9ef"; g.font="34px Jua, sans-serif"; g.fillText(gd[0]+" 수호 고브럽 · "+gd[1],PAD,y+34);
  y+=90;
  a.rs.forEach(function(x,i){
    var rd=ROLE_DEF[a.roles[i]];
    g.fillStyle="rgba(28,36,66,.85)"; rr(g,PAD-16,y,W-PAD*2+32,88,18); g.fill();
    g.fillStyle="#fff"; g.font="34px Jua, sans-serif"; g.fillText(rd[0]+" "+x.name,PAD+8,y+38);
    g.fillStyle="#ffb8dd"; g.font="30px Jua, sans-serif"; g.fillText(rd[1],PAD+8,y+74);
    y+=108;
  });
  g.textAlign="center";
  g.fillStyle="#aab6cc"; g.font="26px Jua, sans-serif"; g.fillText("💬 goblub · 단톡방 사주 감정서",W/2,H-90);
  g.fillStyle="#ffce7a"; g.font="24px Jua, sans-serif"; g.fillText("goblub-2.vercel.app",W/2,H-50);
  var aEl=document.createElement("a");
  aEl.download="goblub-단톡방감정서.png"; aEl.href=c.toDataURL("image/png"); aEl.click();
};
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
</script>
