*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0709;color:#d9cdbb;font-family:'Gowun Batang',serif;min-height:100dvh;

a{color:inherit;text-decoration:none}
.wrap{width:min(94vw,680px)}
.head{position:relative;width:100%;padding:34px 0 16px;text-align:center}

.head h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:1.7rem;color:#f0e4d2}
.head h1 em{font-style:normal;color:#ff5a2a;text-shadow:0 0 24px rgba(255,70,30,.5)}
.head p{color:#a89887;font-size:.86rem;margin-top:10px;line-height:1.7}

.gate .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.gate select,.gate input{background:#1c1216;color:#d9cdbb;border:1px solid rgba(150,70,55,.4);

.gate button{padding:12px 30px;background:rgba(150,40,20,.16);border:1px solid rgba(220,90,50,.55);

.gate button:hover{background:rgba(190,55,25,.36)}
.gate .err{display:none;color:#ff7a6a;font-size:.85rem;margin-top:10px}

.who{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 18px;flex-wrap:wrap}

.who a:hover{color:#ff6a3a}

.legend .g i{background:#c99a5b}

.day.today::after{content:"";position:absolute;inset:2px;border:1px dashed rgba(255,120,80,.8);pointer-events:none}

.cnt{margin-top:12px;text-align:center;color:#a89887;font-size:.84rem;line-height:1.8}
.cnt b{color:#ff8a5a}
.sign{text-align:right;color:#8a7080;font-size:.84rem;font-family:'Nanum Myeongjo',serif;margin-top:14px}
.foot{margin-top:40px;color:#5d5148;font-size:.78rem;letter-spacing:.2em;font-family:'Nanum Myeongjo',serif;text-align:center}

<body>
<div class="wrap">
  <div class="head">
    <a class="back" href="fortune.html">← 명부관</a>
    <p class="kicker">冥 簿 館 · 曆</p>
    <h1>붉은 날 <em>달력</em></h1>
    <p>귀곡이 이 달 일진을 네 명부와 대조했다.<br>붉게 물든 날은 삼가고, 금빛 나는 날에 움직여라.</p>
  </div>

  <div class="gate" id="gate" style="display:none">
    <p>네 명부가 아직 여기 없구나.<br>태어난 날을 적어라 — 이 달의 길흉을 짚어 주마.</p>
    <div class="row">
      <select id="g-year"></select><select id="g-month"></select><select id="g-day"></select>
      <select id="g-hour"><option value="">시 모름</option></select>
      <input type="number" id="g-min" min="0" max="59" value="0" aria-label="분" title="분(0~59)" style="width:62px" />
    </div>
    <button id="g-go">명부에 새긴다</button>
    <p class="err" id="g-err"></p>
  </div>

  <div id="board">
    <div class="who">
      <span class="me" id="me-pill"></span>
      <a href="#" id="edit">다른 명부로 본다</a>
    </div>
    <div class="mon">
      <button id="prev">◀ 지난달</button>
      <b id="mon-t"></b>
      <button id="next">다음달 ▶</button>
    </div>
    <div class="legend">
      <span class="r"><i></i>붉은 날 — 흉한 기운이 겹쳐 기운다</span>
      <span class="g"><i></i>금빛 날 — 길한 기운이 겹쳐 차오른다</span>
      <span class="n"><i></i>여느 날</span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="read" id="read">날짜를 짚으면, 그날의 일진을 읽어 주마.</div>
    <p class="cnt" id="cnt"></p>
    <p class="sign">— 달이 바뀌면 다시 오너라. · 귀곡(鬼哭)</p>
  </div>

  <p class="foot">goblub · 冥 簿 館</p>
</div>

    "0-6":["자(子)-오(午) 충. 물과 불이 정면으로 부딪히니, 머리는 차가운데 가슴이 끓는다. 감정이 시키는 결정만은 이 날 하지 마라.",

    "1-7":["축(丑)-미(未) 충. 묵은 땅이 갈리는 충이라, 덮어둔 일·오래된 문서·집안일이 들춰진다. 들춰지거든 피하지 말고 이참에 정리해라.",

           "인신충의 날 — 일정이 어그러지기 쉽다. 갈아타는 계획·급한 출발을 삼가고, 떠나야 하거든 평소보다 일찍 나서라."],
    "3-9":["묘(卯)-유(酉) 충. 꽃과 칼이 부딪히는 충이라 관계와 약속이 베이기 쉽다. 말 한마디가 오래 남는 날이니, 농담도 골라서 해라.",

    "쥐(子)의 시각이 도는 날 — 민첩한 쪽이 이긴다. 미루던 잔일을 아침에 해치워라.",
    "소(丑)의 걸음이 도는 날 — 느려도 확실한 진행이 답이다. 서두르는 자가 먼저 넘어진다.",
    "호랑이(寅)의 기세가 도는 날 — 과감한 한 걸음에 힘이 붙는다. 다만 어흥은 한 번이면 족하다.",
    "토끼(卯)의 감각이 도는 날 — 눈썰미가 산다. 다듬고 꾸미는 일을 이 날 해라.",
    "용(辰)의 구름이 도는 날 — 스케일 큰 그림을 그리기 좋다. 계획은 크게, 지출은 작게.",
    "뱀(巳)의 직감이 도는 날 — 촉이 예리해진다. 어딘가 께름칙하면 그 느낌이 맞다.",
    "말(馬·午)의 발굽이 도는 날 — 활동량을 늘려라. 몸을 움직인 만큼 운이 돈다.",
    "양(未)의 온기가 도는 날 — 화해와 나눔이 순하다. 밥 한 끼 사는 것이 부적이 된다.",
    "원숭이(申)의 재주가 도는 날 — 손 쓰는 일이 술술 풀린다. 고장 난 것을 이 날 고쳐라.",
    "닭(酉)의 부리가 도는 날 — 꼼꼼함이 무기다. 마무리와 점검, 오탈자 잡기에 좋다.",
    "개(戌)의 의리가 도는 날 — 사람에게 들인 공이 돌아온다. 신세 진 이에게 안부를 넣어라.",
    "돼지(亥)의 너그러움이 도는 날 — 베푼 만큼 돌아온다. 작게 양보하고 크게 얻어라."
  ];

  // 십성 10종 — 그날 천간이 내 일간에게 갖는 정확한 관계 (각 2벌)
  var SS_TXT=[
    ["일진 천간은 네 비견(比肩) — 나와 어깨를 나란히 하는 기운이다. 혼자 끌던 일을 이 날 밀면 두 배로 나간다. 다만 고집도 두 배니, 맞는 말도 한 박자 늦게 해라.",
     "비견의 날 — 동지가 붙는다. 협업·모임·같이 하는 운동에 좋고, 더치페이 셈만 분명히 하면 탈이 없다."],
    ["일진 천간은 네 겁재(劫財) — 내 몫을 나누자는 기운이다. 이 날의 동업 제안·돈 빌려달란 말은 웃으며 미뤄라.",
     "겁재의 날 — 경쟁자가 힘을 얻는다. 승부는 피하지 말되, 판돈은 작게 걸어라."],
    ["일진 천간은 네 식신(食神) — 먹고 만들고 즐기는 기운이다. 요리·창작·취미에 손맛이 붙고, 몸 컨디션도 순하다.",
     "식신의 날 — 결과물이 남는 일을 해라. 이 날 만든 것은 오래 간다. 맛있는 것을 먹는 것도 운을 먹는 일이다."],
    ["일진 천간은 네 상관(傷官) — 재주가 번뜩이되 입이 앞서는 기운이다. 아이디어는 쏟아내되, 윗사람 앞에선 세 마디 중 한 마디만 해라.",
     "상관의 날 — 표현이 빛난다. 글·발표·기획에 쓰면 약이 되고, 뒷말에 쓰면 독이 된다."],
    ["일진 천간은 네 편재(偏財) — 굴러다니는 기회의 돈 기운이다. 눈은 크게 뜨되 전 재산을 싣지는 마라. 소액이면 약, 큰돈이면 독이다.",
     "편재의 날 — 뜻밖의 정보·세일·기회가 스친다. 잡되, 오늘 번 것을 오늘 쓰지는 마라."],
    ["일진 천간은 네 정재(正財) — 성실하게 쌓는 돈의 기운이다. 가계부·적금·정산, 차곡차곡 하는 일에 복이 붙는다.",
     "정재의 날 — 꾸준함이 보상받는다. 미뤄둔 돈 정리를 이 날 해라, 새는 구멍이 눈에 보인다."],
    ["일진 천간은 네 편관(偏官) — 나를 시험하는 압박의 기운이다. 버겁게 느껴져도 이 날 버틴 것은 근육이 된다. 무리한 일정 하나만 빼라.",
     "편관의 날 — 압박이 세다. 정면돌파보다 절차와 원칙 뒤에 서라, 그게 제일 단단한 방패다."],
    ["일진 천간은 네 정관(正官) — 격을 세워 주는 기운이다. 면접·발표·공식 자리에 이 날을 써라, 반듯한 모습이 그대로 점수가 된다.",
     "정관의 날 — 규칙이 편이 되어 준다. 서류·신고·허가, 관(官)이 붙는 일은 이 날 순하게 풀린다."],
    ["일진 천간은 네 편인(偏印) — 생각이 깊어지는 기운이다. 직감이 예리하니 연구·기획에 좋고, 다만 걱정도 늘어나니 밤샘은 마라.",
     "편인의 날 — 혼자만의 시간이 약이 된다. 어려운 공부·까다로운 문제를 이 날 파라, 평소 안 보이던 길이 보인다."],
    ["일진 천간은 네 정인(正印) — 나를 살찌우는 배움과 귀인의 기운이다. 어른의 조언, 오는 연락을 미루지 마라.",
     "정인의 날 — 문서와 도장에 운이 붙는다. 계약서 검토·신청·등록은 이 날 해라. 이 날 배운 것은 오래 남는다."]
  ];

  var data=null, myJi=null, myIlgan=null, myGongmang=[], cur=new Date(), me=null;

  function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h>>>0;}
  function pick(pool,seed){ return pool[seed%pool.length]; }

  function fillSelects(){
    var y=$("g-year"),m=$("g-month"),d=$("g-day"),h=$("g-hour"),now=new Date().getFullYear();
    for(var i=now;i>=1930;i--) y.add(new Option(tr("{N}년").replace("{N}",i),i));
    for(var j=1;j<=12;j++) m.add(new Option(tr("{N}월").replace("{N}",j),j));
    for(var k=1;k<=31;k++) d.add(new Option(tr("{N}일").replace("{N}",k),k));
    for(var t=0;t<24;t++) h.add(new Option(tr("{N}시").replace("{N}",("0"+t).slice(-2)),t));
    y.value=1995;
  }

  /* 그날 일진 × 내 명부 — 여러 요인을 겹쳐 점수로 가린다.
     충 하나만으로 붉어지던 옛 방식(12일 주기 반복)을 버리고,
     충·합·삼합·형·원진 + 공망 + 천간합·천간충 + 십성을 전부 셈해
     흉이 겹치면 붉고(-3 이하), 길이 겹치면 금빛(+3 이상)이다.
     충이 와도 천간합이 받치면 여느 날로 버티고, 합이 와도 공망이면 빛이 죽는다. */
  function dayInfo(y,m,d){
    var r=Saju.compute(data,{y:y,m:m,d:d,hour:12,min:0},{});
    var g=r.pillars.day[0], j=r.pillars.day[1];
    var seed=hash(y+"-"+m+"-"+d+"|"+myJi+"|"+myIlgan);
    var key=pkey(j,myJi), score=0, parts=[];
    if(CHUNG[myJi]===j){ score-=3; if(CHUNG_TXT[key]) parts.push(pick(CHUNG_TXT[key],seed)); }
    else if(YUKHAP[myJi]===j){ score+=3; if(HAP_TXT[key]) parts.push(pick(HAP_TXT[key],seed)); }
    else{
      var grp=null;
      if(j!==myJi) for(var s2=0;s2<SAMHAP_GROUPS.length;s2++){
        var st=SAMHAP_GROUPS[s2].set;
        if(st.indexOf(j)>=0 && st.indexOf(myJi)>=0){ grp=SAMHAP_GROUPS[s2]; break; }
      }
      if(grp){ score+=2; parts.push(grp.tx); }
      else if(HYUNG_PAIRS[key]){ score-=1; parts.push(HYUNG_TXT); }     // 형·원진은 잔마찰 — 충보다 가볍다
      else if(WONJIN_PAIRS[key]){ score-=1; parts.push(WONJIN_TXT); }
      else parts.push(JI_FLAVOR[j]);          // 관계가 없으면 그날 지지의 결을 읽는다
    }
    if(myGongmang.indexOf(j)>=0){ score-=2; parts.push(GONGMANG_TXT); }
    var ss=Saju.sipseong(myIlgan,g);
    score += SS_W[ss]||0;
    parts.push(pick(SS_TXT[ss],(seed>>>3)));
    if(GANHAP[String(myIlgan)]===g){ score+=2; parts.push(GANHAP_TXT); }
    else if(GCHUNG[myIlgan]===g){ score-=2; parts.push(GCHUNG_TXT); }
    var kind = score<=-3 ? "red" : score>=3 ? "gold" : "plain";
    return { g:g, j:j, gz:(isKo?GAN[g]+JI[j]:GAN_RO[g]+"-"+JI_RO[j]), hj:GAN_HJ[g]+JI_HJ[j], kind:kind, parts:parts };
  }

  function renderMonth(){
    var y=cur.getFullYear(), m=cur.getMonth()+1;
    $("mon-t").textContent=tr("{Y}년 {M}월").replace("{Y}",y).replace("{M}",m);
    var grid=$("grid"); grid.innerHTML="";
    (function(){var w0=tr("달력요일");return w0==="달력요일"?["일","월","화","수","목","금","토"]:w0.split("|");})().forEach(function(w){
      var e=document.createElement("div"); e.className="dow"; e.textContent=w; grid.appendChild(e);
    });
    var first=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate();
    var now=new Date(), reds=0, golds=0;
    for(var b=0;b<first;b++){ var o=document.createElement("div"); o.className="day off"; grid.appendChild(o); }
    for(var d=1;d<=days;d++){
      (function(d){
        var inf=dayInfo(y,m,d);
        if(inf.kind==="red") reds++; if(inf.kind==="gold") golds++;
        var e=document.createElement("div");
        e.className="day "+(inf.kind==="plain"?"":inf.kind);
        if(y===now.getFullYear()&&m===now.getMonth()+1&&d===now.getDate()) e.className+=" today";
        e.innerHTML='<span class="n">'+d+'</span>'+
          (inf.kind==="red"?'<span class="mk">⚠</span>':inf.kind==="gold"?'<span class="mk">✦</span>':"")+
          '<span class="gz">'+inf.gz+"</span>";
        e.onclick=function(){
          // dayInfo가 이미 요인별 풀이를 전부 모아 두었다 — 판정 한 줄을 머리에 얹는다
          var verdict = inf.kind==="red" ? tr("⚠ 흉한 기운이 겹쳐 붉게 물든 날이다. 몸을 낮춰라.")
            : inf.kind==="gold" ? tr("✦ 길한 기운이 겹쳐 금빛으로 차오른 날이다. 움직여라.") : "";
          $("read").innerHTML="<b>"+tr("{M}월 {D}일 · {GZ}({HJ})일").replace("{M}",m).replace("{D}",d).replace("{GZ}",inf.gz).replace("{HJ}",inf.hj)+"</b>"+
            (verdict?"<br>"+verdict:"")+"<br>"+inf.parts.map(tr).join("<br>");
        };
        grid.appendChild(e);
      })(d);
    }
    $("cnt").innerHTML=tr("{M}월엔 붉은 날이 <b>{R}일</b>, 금빛 날이 <b>{G}일</b> 적혀 있다.").replace("{M}",m).replace("{R}",reds).replace("{G}",golds);
    $("read").textContent=tr("날짜를 짚으면, 그날의 일진을 읽어 주마.");
  }

  function boot(birth){
    me=Saju.compute(data,{y:birth.y,m:birth.m,d:birth.d,hour:birth.hour,min:birth.min||0},{trueSolar:true});
    myJi=me.pillars.day[1]; myIlgan=me.ilgan;
    // 공망 — 내 일주(60갑자 중 하나)가 속한 순(旬)에서 비는 두 지지
    var dg=me.pillars.day[0], p60=0;
    for(var i=0;i<60;i++) if(i%10===dg && i%12===myJi){ p60=i; break; }
    var dec=Math.floor(p60/10);
    myGongmang=[((10-2*dec)%12+12)%12, ((11-2*dec)%12+12)%12];
    var t=Saju.pillarText(me.pillars.day);
    var bs=birth.y+"."+birth.m+"."+birth.d+(birth.hour!=null?" "+("0"+birth.hour).slice(-2)+":"+("0"+(birth.min||0)).slice(-2):"")+(!window.GoblubI18n||GoblubI18n.lang==="ko"?"생":"");
    $("me-pill").textContent=bs+(isKo?"":"")+" · "+t.hanja+(isKo?"("+t.hangul+")":"")+" · "+tr("{Z}띠").replace("{Z}",tr(me.zodiac));
    $("gate").style.display="none"; $("board").style.display="block";
    cur=new Date();
    renderMonth();
    if(window.GwigokLog) GwigokLog.add("cal","붉은 날 달력",(cur.getMonth()+1)+"월의 길흉을 짚었다");
  }

  $("prev").onclick=function(){ cur=new Date(cur.getFullYear(),cur.getMonth()-1,1); renderMonth(); };
  $("next").onclick=function(){ cur=new Date(cur.getFullYear(),cur.getMonth()+1,1); renderMonth(); };
  $("edit").onclick=function(ev){ ev.preventDefault(); $("board").style.display="none"; $("gate").style.display="block"; };

  fillSelects();
  $("g-go").onclick=function(){
    var y=+$("g-year").value,m=+$("g-month").value,d=+$("g-day").value,hv=$("g-hour").value;
    var dt=new Date(y,m-1,d);
    if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d){
      $("g-err").textContent=tr("없는 날짜다. 다시 보아라."); $("g-err").style.display="block"; return;
    }
    var b={y:y,m:m,d:d}; if(hv!==""){ b.hour=+hv; b.min=Math.max(0,Math.min(59,+(document.getElementById("g-min").value)||0)); }
    try{ localStorage.setItem("goblub_birth",JSON.stringify(b)); }catch(e){}
    boot(b);
  };

  fetch("data/saju-terms.json").then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){
      data=d;
      var b=null; try{ b=JSON.parse(localStorage.getItem("goblub_birth")); }catch(e){}
      if(b&&b.y) boot(b); else $("gate").style.display="block";
    })
    .catch(function(){ $("gate").style.display="block";
      $("g-err").textContent=tr("장부를 못 펼쳤다. 새로고침 해보아라."); $("g-err").style.display="block"; });
})();
</script>
</body>
</html>
