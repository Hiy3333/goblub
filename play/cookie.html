<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>오늘의 포춘쿠키 — goblub</title>
<meta name="description" content="부둣가 해달 가게에서 하루 한 번 — 끌리는 쿠키를 고르면 해달이 배 위에 올려 조개로 깨서 오늘의 한 줄을 꺼내준다" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet" />
<style>
:root{ --ink:#eef2f8; --ink-soft:#aab6cc; --amber:#ffce7a; --line:rgba(255,206,122,.28); }
*{box-sizing:border-box;margin:0;padding:0}
html{background:#0b1220}
body{background:
  radial-gradient(700px 460px at 50% -8%, rgba(70,110,190,.25), transparent 62%),
  radial-gradient(760px 560px at 50% 110%, rgba(255,150,60,.13), transparent 64%),
  linear-gradient(180deg,#101a30 0%,#0b1220 60%,#0a101c 100%) fixed;
  color:var(--ink);font-family:'Gowun Batang','Jua',serif;
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:14px 14px 20px}
body.top{justify-content:flex-start}
.app{width:min(94vw,400px);display:flex;flex-direction:column;align-items:center}
@media (min-width:900px){ .app{width:min(60vw,min(620px,calc(100dvh - 180px)))} }
.topbar{width:100%;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.topbar a{color:var(--ink-soft);font-size:.88rem;text-decoration:none}
.topbar a:hover{color:var(--amber)}
.topbar .t{font-family:'Nanum Myeongjo',serif;font-weight:800;color:var(--amber);font-size:1.12rem;
  margin:0 auto;text-shadow:0 0 16px rgba(255,190,100,.35)}
.topbar .sp{width:44px}

.screen{position:relative;width:100%;border-radius:20px;overflow:hidden;display:none;
  border:1px solid rgba(120,150,210,.25);
  box-shadow:0 24px 66px rgba(0,0,0,.6),0 0 40px rgba(80,120,220,.14)}
.screen.on{display:block}

/* ── 인트로: 해달 + 쿠키 고르기 ── */
#scIntro{background:#0b1220}
#scIntro .bg{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
#scIntro .veil{position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(8,13,24,.55) 68%,rgba(8,13,24,.95) 100%)}
#scIntro .box{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 16px;z-index:2}
#scIntro .greet{font-family:'Nanum Myeongjo',serif;color:#fef3df;font-size:1.02rem;line-height:1.65;
  text-shadow:0 2px 12px rgba(0,0,0,.85);margin-bottom:12px}
#scIntro .greet .nm{display:block;color:var(--amber);font-size:.8rem;margin-bottom:3px;letter-spacing:.04em}
.pickrow{display:flex;justify-content:center;gap:14px}
.pickrow button{flex:1;max-width:110px;padding:12px 0 10px;border-radius:16px;cursor:pointer;
  background:rgba(20,30,52,.85);border:1.5px solid var(--line);color:var(--ink);
  font-family:'Gowun Batang',serif;font-size:.82rem;line-height:1.4;
  transition:transform .12s, box-shadow .12s, border-color .12s;backdrop-filter:blur(3px)}
.pickrow button b{display:block;font-size:1.9rem;line-height:1.2;margin-bottom:2px}
.pickrow button:hover{transform:translateY(-4px);border-color:var(--amber);
  box-shadow:0 10px 24px rgba(255,190,100,.22)}

/* ── 영상 무대 ── */
#scPlay{aspect-ratio:1/1;background:#000}
#scPlay video,#scPlay .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#scPlay .still{background-size:cover;background-position:center;opacity:0;transition:opacity .3s}
#scPlay .still.on{opacity:1}
video::-webkit-media-controls,video::-webkit-media-controls-start-playback-button,
video::-webkit-media-controls-overlay-play-button{display:none!important;-webkit-appearance:none!important}
#scPlay .cap{position:absolute;left:0;right:0;bottom:14px;text-align:center;z-index:3;
  font-family:'Nanum Myeongjo',serif;color:#fef3df;font-size:.96rem;text-shadow:0 2px 14px rgba(0,0,0,.9)}

/* ── 결과 ── */
#scResult{background:#0b1220}
#scResult .endimg{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;
  background-size:cover;background-position:center}
.slip{margin:14px 2px 4px;background:linear-gradient(180deg,#fdf7ea,#f5ecd8);color:#4a3b26;
  border-radius:16px;padding:20px 18px;position:relative;
  box-shadow:0 14px 34px rgba(0,0,0,.45), inset 0 1.5px 0 #fff}
.slip::before{content:"";position:absolute;left:14px;right:14px;top:8px;border-top:2px dashed rgba(150,120,70,.35)}
.slip .f{font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:1.05rem;line-height:1.8;color:#3c2f1c}
.slip .lucky{margin-top:12px;color:#6d5a3c;font-size:.88rem;line-height:1.85;border-top:1px dashed rgba(150,120,70,.35);padding-top:11px}
.slip .lucky b{color:#4a3b26}
.oncebar{text-align:center;color:#c9b48c;font-size:.85rem;font-family:'Nanum Myeongjo',serif;
  margin-top:14px;line-height:1.7}
.oncebar .again{margin-top:12px;background:linear-gradient(180deg,#2c3d63,#1c2946);color:#e8eefb;
  border:1px solid rgba(150,180,240,.4);border-radius:12px;padding:11px 24px;font-family:inherit;
  font-size:.94rem;cursor:pointer;box-shadow:0 0 18px rgba(80,120,220,.3)}
.linksrow{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.linksrow a{color:var(--ink-soft);font-size:.85rem;text-decoration:none;border:1px solid rgba(120,150,210,.3);
  border-radius:999px;padding:8px 16px}
.linksrow a:hover{color:var(--amber);border-color:var(--line)}
#card-slot{margin-top:12px}
.hintbar{margin-top:16px;color:var(--ink-soft);font-size:.83rem;text-align:center;line-height:1.7;max-width:340px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="fortune-hub.html">← 운세</a>
    <span class="t">🦦 오늘의 포춘쿠키</span>
    <span class="sp"></span>
  </div>

  <!-- ① 해달 인사 + 쿠키 고르기 -->
  <div class="screen on" id="scIntro">
    <img class="bg" src="img/otter/otter-intro.webp" alt="포춘쿠키 해달" />
    <div class="veil"></div>
    <div class="box">
      <p class="greet"><span class="nm">부둣가 포춘쿠키 가게 · 해달</span>어서 와달! 오늘의 포춘쿠키, 딱 하나만 깨 줄 수 있달.<br>끌리는 쿠키를 골라봐달 🥠</p>
      <div class="pickrow">
        <button onclick="choose(0)"><b>🥠</b>첫째 쿠키</button>
        <button onclick="choose(1)"><b>🥠</b>둘째 쿠키</button>
        <button onclick="choose(2)"><b>🥠</b>셋째 쿠키</button>
      </div>
    </div>
  </div>

  <!-- ② 영상(집기→깨기) -->
  <div class="screen" id="scPlay">
    <video id="vid" muted playsinline webkit-playsinline preload="auto"></video>
    <div class="still" id="still"></div>
    <p class="cap" id="cap"></p>
  </div>

  <!-- ③ 결과 -->
  <div class="screen" id="scResult">
    <div class="endimg" id="endimg"></div>
  </div>
  <div id="resultBody" style="display:none;width:100%">
    <div class="slip">
      <p class="f" id="fortune"></p>
      <p class="lucky" id="lucky"></p>
    </div>
    <div id="card-slot"></div>
    <div class="oncebar">🌊 쿠키는 하루에 딱 하나 — 내일 또 와달!<br>
      <button class="again" onclick="replay()">🦦 쿠키 깨기 다시 보기</button>
    </div>
    <div class="linksrow">
      <a href="fortune-hub.html">🔮 운세 더 보기</a>
      <a href="../index.html">🎡 다른 즐길거리</a>
    </div>
  </div>

  <p class="hintbar" id="hintbar">끌리는 쿠키를 고르면, 해달이 배 위에 올려 조개로 깨 준다달.</p>
</div>

<script src="../js/common.js?v=5" data-root=".."></script>
<script src="js/feed.js?v=4"></script>
<script src="js/sharecard.js"></script>
<script>
var IMG="img/otter/", V_TAKE=IMG+"otter-take.mp4", V_CRACK=IMG+"otter-crack.mp4",
    INTRO=IMG+"otter-intro.webp", ENDIMG=IMG+"otter-end.webp";
var $=function(id){return document.getElementById(id);};
var scIntro=$("scIntro"), scPlay=$("scPlay"), scResult=$("scResult"),
    vid=$("vid"), still=$("still"), cap=$("cap"), hintbar=$("hintbar");

/* ── 기존 운세 데이터 (날짜 시드 그대로) ── */
var FORTUNES=["오늘 당신에게 좋은 일이 슬금슬금 다가오고 있어요. 뒤돌아보지 말고 그냥 받으세요.","참았던 한숨은 나한테 주고, 대신 이 말 가져가요 — 당신 생각보다 훨씬 잘하고 있어.","오늘의 실수는 내일의 안주거리. 크게 웃고 넘겨버려요.","미뤄둔 그거, 딱 5분만 손대보세요. 시작이 반이고 나머지 반은 고브럽이 응원할게요.","지나가던 행운이 당신 어깨를 톡 쳤어요. 오늘은 용기 내도 되는 날.","별거 아닌 하루 같아도, 당신이 버텨줘서 세상이 굴러가요. 진짜로.","오늘 만나는 사람 중 한 명이 당신을 웃게 할 거예요. 안테나 세워두기!","냠— 방금 당신의 걱정 한 입 먹었어요. 조금 가벼워졌죠?","하고 싶은 말이 있다면 오늘 하세요. 타이밍의 신이 당신 편이에요.","커피 한 잔의 여유가 오늘의 슈퍼파워. 꼭 챙겨 마셔요.","완벽하지 않아도 괜찮아요. 90%면 세상은 이미 잘 돌아가요.","오늘 당신의 미소가 누군가의 하루를 구합니다. 아끼지 말고 팍팍 쓰세요.","작은 결정 하나가 큰 흐름을 바꿔요. 오늘은 마음 가는 대로 골라봐요.","지금 힘든 건 당신이 약해서가 아니라 큰 걸 들고 있어서예요. 잠깐 내려놔도 돼요.","오늘 예상치 못한 곳에서 반가운 소식이 올 수도. 알림 잘 확인해봐요.","하늘 한 번 올려다보세요. 그거 하나로 기분 3도 상승 보장.","준비한 만큼 딱 그만큼 티가 나는 하루. 자신감 장착!","오늘의 귀찮음을 내일의 나에게 미루지 마세요. 미래의 당신이 고마워할 거예요.","좋아하는 노래 한 곡이 오늘의 부적. 이어폰 챙기기.","누군가 당신을 몰래 응원하고 있어요. (사실 그거 나 고브럽임)","안 될 것 같던 일이 슬쩍 풀리는 날. 한 번 더 시도해봐요.","배고프면 판단력 떨어져요. 일단 뭐라도 드세요. 그게 오늘의 운세.","당신의 다정함은 낭비가 아니에요. 언젠가 다 돌아옵니다.","오늘 딱 하나만 정리해보세요. 책상이든 마음이든. 개운함이 따라와요.","지금 이 순간을 견디는 당신, 이미 절반은 이긴 거예요.","웃긴 짤 하나 저장하면 하루가 든든해집니다. 밈은 힘이에요.","망설이던 그 연락, 상대도 기다리고 있을지 몰라요. 톡 하나 보내볼까요?","오늘의 나는 어제의 나보다 확실히 성장했어요. 눈에 안 보여도 진짜예요.","계획대로 안 돼도 괜찮아요. 즉흥이 더 좋은 이야기를 만들기도 하니까.","물 한 잔 마시고 심호흡 세 번. 그게 오늘 당신을 지키는 마법 주문.","필요한 건 더 많은 노력이 아니라 조금의 쉼일지도 몰라요.","지나간 일에 미련 두지 마요. 냠— 그 후회도 내가 먹어줄게요.","오늘 만나는 초록불처럼, 당신 앞길에도 신호가 잘 맞을 거예요.","자책은 그만. 당신은 최선을 다했고, 그거면 충분해요.","오늘 건넨 따뜻한 말 한마디가 부메랑처럼 돌아옵니다.","큰 그림은 나중에. 오늘은 눈앞의 작은 일부터 하나씩.","당신의 취향은 이상한 게 아니라 특별한 거예요. 당당하게!","오늘 살짝 게을러도 돼요. 배터리 충전도 실력이에요.","예상 밖의 칭찬을 듣게 될지도. 겸손 떨지 말고 감사히 받아요.","오늘 하루도 무사히. 그거면 이미 대성공이에요. 수고했어요, 진짜로."];
var ITEMS=["따뜻한 아메리카노","이어폰","작은 초콜릿","포스트잇","좋아하는 짤","텀블러","반짝이 스티커","10분 산책","달콤한 젤리","귀여운 볼펜"];
var CHARMS=["엘리베이터 거울 보고 씩 웃기 — 오늘의 액운 방지 완료","나가는 길에 하늘 3초 올려다보기 — 운수 수신 안테나 가동","오늘 첫 음료 마시기 전에 '수고해라 내 몸' 한마디","가방 구석의 영수증 한 장 버리기 — 액운도 같이 배출","휴대폰 화면 먼지 닦기 — 운빨 화질 개선","양말은 왼쪽부터 신기 — 오늘의 밸런스 부적","지나가는 강아지·고양이 보면 속으로 '복덩이' 3번 외치기","책상 위 물건 하나 제자리 찾아주기 — 질서의 가호 획득","물 마실 때 잔 바닥까지 원샷 — 행운 침전물까지 흡수","안 쓰는 알람 하나 삭제하기 — 미래의 나에게 평화를","카톡 안 읽은 '1' 하나 없애기 — 마음의 부채 청산","신호 기다릴 때 발뒤꿈치 들기 3회 — 운기 순환 스트레칭","꼬인 이어폰 줄·케이블 풀기 — 꼬인 운도 같이 풀림","냉장고 속 제일 오래된 음식과 눈 마주치고 결단 내리기","셀카 한 장 찍고 저장만 하기 — 오늘의 나 봉인 완료","폰 홈 화면 앱 하나 정리 — 운도 같이 정리됨","점심은 오늘 세 번째로 떠오른 메뉴로 — 세 번째가 부적","주머니에서 동전 발견 시 소원 1회 무료 충전","웃긴 짤 하나 저장해두기 — 비상용 행복 배터리","횡단보도 흰 선만 밟고 건너기 (무리는 금지)","아무 책이나 펴서 첫 단어 읽기 — 그게 오늘의 키워드","화분이나 길가 식물에게 '잘 자라라' 눈인사","자기 전에 오늘 잘한 일 1개 소리 내어 말하기","창문 5분만 열기 — 묵은 기운 대환기","제일 아끼는 물건 한 번 쓰다듬기 — 아이템 충성도 +1","계단 마지막 칸은 살짝 점프 — 오늘의 운수 점프","겉옷 주머니 전부 뒤집어 탈탈 — 액운 탈곡식","오늘 처음 만나는 사람에게 마음속으로 '복 받아라' 발사","메모장에 아무 목표나 한 줄 적기 — 적으면 이루어질 확률 +7%","거울 앞에서 어깨 펴고 3초 — 오늘의 주인공 자세 등록"];

function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h>>>0;}
var d=new Date();
var dstr=""+d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2);
var dk="goblub_cookie_"+dstr;
var seed=hash(dstr);
var fortune=FORTUNES[seed%FORTUNES.length];
var charm=CHARMS[Math.floor(seed/7)%CHARMS.length];
var soul=SOULFOODS[Math.floor(seed/13)%SOULFOODS.length];
var item=ITEMS[Math.floor(seed/29)%ITEMS.length];

var phase="intro";
function show(sc){ [scIntro,scPlay,scResult].forEach(function(s){s.classList.remove("on");}); sc.classList.add("on");
  document.body.classList.toggle("top", sc===scResult); if(sc===scResult) window.scrollTo(0,0); }

function playSeq(src, capText, onEnd){
  cap.textContent=capText;
  vid.onended=null; vid.onplaying=null; vid.loop=false; vid.src=src;
  vid.onplaying=function(){ still.classList.remove("on"); };
  vid.onended=function(){ if(onEnd) onEnd(); };
  var p=vid.play(); if(p&&p.catch) p.catch(function(){ if(onEnd) onEnd(); });
  setTimeout(function(){ if(vid.src.indexOf(src)>=0 && vid.paused && !vid.ended){ if(onEnd) onEnd(); } }, 7000);
}

function choose(i){
  if(phase!=="intro") return;
  phase="play";
  try{ localStorage.setItem(dk,"1"); }catch(e){}
  if(window.GoblubFeed) GoblubFeed.grant("cookie");
  show(scPlay); still.classList.remove("on");
  hintbar.textContent="해달이 쿠키를 집었다달…";
  playSeq(V_TAKE, "…이걸로 골랐구나달.", function(){
    hintbar.textContent="배 위에 올리고… 조개로 콩콩!";
    playSeq(V_CRACK, "콩… 콩… 쫙!", function(){ finish(false); });
  });
}

function finish(fromLock){
  phase="result";
  // 정지 video 흔적 제거(재생버튼 방지) — 끝 프레임은 정지 이미지로
  var endBg=ENDIMG;
  try{
    if(!fromLock && vid.videoWidth){
      var c=document.createElement("canvas");
      c.width=vid.videoWidth; c.height=vid.videoHeight;
      c.getContext("2d").drawImage(vid,0,0,c.width,c.height);
      endBg=c.toDataURL("image/jpeg",.9);
    }
  }catch(e){}
  try{ vid.pause(); vid.removeAttribute("src"); vid.load(); }catch(e){}
  $("endimg").style.backgroundImage="url('"+endBg+"')";
  show(scResult);
  $("fortune").textContent="🥠 "+fortune;
  $("lucky").innerHTML=
    "🛡️ <b>오늘의 부적 행동</b> — "+charm+"<br>"+
    "🍜 <b>소울푸드 처방</b> — "+soul+"<br>"+
    "🍀 <b>럭키템</b> — "+item;
  $("resultBody").style.display="block";
  hintbar.textContent="";
  if(!$("card-slot").childNodes.length && window.ShareCard){
    $("card-slot").appendChild(ShareCard.render({
      palette:"yellow", emoji:"🦦", badge:"오늘의 포춘쿠키",
      title:"오늘의 한 줄", lines:[fortune, "🛡️ "+charm, "🍜 "+soul]
    }));
  }
}

// 쿠키 깨기 다시 보기 — 오늘의 운세는 그대로, 과정만 재체험
function replay(){
  phase="intro";
  $("resultBody").style.display="none";
  show(scIntro);
  hintbar.textContent="오늘의 운세는 그대로다달 — 깨는 것만 다시 보여줄게달.";
}

// 오늘 이미 깼으면 결과로 직행 (영상 없이)
(function init(){
  var opened=false;
  try{ opened=!!localStorage.getItem(dk); }catch(e){}
  if(opened) finish(true);
})();
</script>
