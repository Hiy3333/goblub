<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>해달의 포춘쿠키 — goblub</title>
<meta name="description" content="부둣가 해달 가게에서 하루 한 번 — 끌리는 쿠키를 고르면 해달이 배 위에 올려 조개로 깨서 오늘의 한 줄을 꺼내준다" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet" />
<style>
:root{ --ink:#eef2f8; --ink-soft:#aab6cc; --amber:#ffce7a; --line:rgba(255,206,122,.28); }
*{box-sizing:border-box;margin:0;padding:0}
html{background:#0b1220}
body{background:
  radial-gradient(700px 460px at 50% -8%, rgba(70,110,190,.25), transparent 62%),
  radial-gradient(760px 560px at 50% 110%, rgba(255,150,60,.13), transparent 64%),
  linear-gradient(180deg,#101a30 0%,#0b1220 60%,#0a101c 100%) fixed;
  color:var(--ink);font-family:'Gowun Batang','Jua',serif;
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:14px 14px 20px}
body.top{justify-content:flex-start}
.app{width:min(94vw,400px);display:flex;flex-direction:column;align-items:center}
@media (min-width:900px){ .app{width:min(60vw,min(620px,calc(100dvh - 180px)))} }
.topbar{width:100%;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.topbar a{color:var(--ink-soft);font-size:.88rem;text-decoration:none}
.topbar a:hover{color:var(--amber)}
.topbar .t{font-family:'Nanum Myeongjo',serif;font-weight:800;color:var(--amber);font-size:1.12rem;
  margin:0 auto;text-shadow:0 0 16px rgba(255,190,100,.35)}
.topbar .sp{width:44px}

.screen{position:relative;width:100%;border-radius:20px;overflow:hidden;display:none;
  border:1px solid rgba(120,150,210,.25);
  box-shadow:0 24px 66px rgba(0,0,0,.6),0 0 40px rgba(80,120,220,.14)}
.screen.on{display:block}

/* ── 인트로: 해달 + 쿠키 고르기 ── */
#scIntro{background:#0b1220}
#scIntro .bg{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
#scIntro .veil{position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(8,13,24,.55) 68%,rgba(8,13,24,.95) 100%)}
#scIntro .box{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 16px;z-index:2}
#scIntro .greet{font-family:'Nanum Myeongjo',serif;color:#fef3df;font-size:1.02rem;line-height:1.65;
  text-shadow:0 2px 12px rgba(0,0,0,.85);margin-bottom:12px}
#scIntro .greet .nm{display:block;color:var(--amber);font-size:.8rem;margin-bottom:3px;letter-spacing:.04em}
.pickrow{display:flex;justify-content:center;gap:14px}
.pickrow button{flex:1;max-width:110px;padding:12px 0 10px;border-radius:16px;cursor:pointer;
  background:rgba(20,30,52,.85);border:1.5px solid var(--line);color:var(--ink);
  font-family:'Gowun Batang',serif;font-size:.82rem;line-height:1.4;
  transition:transform .12s, box-shadow .12s, border-color .12s;backdrop-filter:blur(3px)}
.pickrow button b{display:block;font-size:1.9rem;line-height:1.2;margin-bottom:2px}
.pickrow button:hover{transform:translateY(-4px);border-color:var(--amber);
  box-shadow:0 10px 24px rgba(255,190,100,.22)}

/* ── 영상 무대 ── */
#scPlay{aspect-ratio:1/1;background:#000}
#scPlay video,#scPlay .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#scPlay .still{background-size:cover;background-position:center;opacity:0;transition:opacity .3s}
#scPlay .still.on{opacity:1}
video::-webkit-media-controls,video::-webkit-media-controls-start-playback-button,
video::-webkit-media-controls-overlay-play-button{display:none!important;-webkit-appearance:none!important}
#scPlay .cap{position:absolute;left:0;right:0;bottom:14px;text-align:center;z-index:3;
  font-family:'Nanum Myeongjo',serif;color:#fef3df;font-size:.96rem;text-shadow:0 2px 14px rgba(0,0,0,.9)}
/* 연출 넘어가기 — 영상 오른쪽 위 */
.skipbtn{position:absolute;right:10px;top:10px;z-index:5;
  padding:7px 14px;border:1px solid rgba(255,255,255,.28);border-radius:999px;cursor:pointer;
  font-family:'Gowun Batang',serif;font-size:.84rem;color:#eaf2ff;
  background:rgba(8,16,30,.55);backdrop-filter:blur(6px);
  transition:background .15s,border-color .15s}
.skipbtn:hover{background:rgba(20,34,58,.8);border-color:rgba(255,255,255,.5)}

/* ── 결과 ── */
#scResult{background:#0b1220}
#scResult .endimg{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;
  background-size:cover;background-position:center 44%}
#scResult .fade{position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(11,18,32,.72) 72%,rgba(11,18,32,.96))}
#scResult .tag{position:absolute;left:16px;bottom:46px;z-index:2;color:var(--amber);
  font-family:'Nanum Myeongjo',serif;font-size:.82rem;letter-spacing:.04em;
  text-shadow:0 2px 10px rgba(0,0,0,.9)}
.slip{margin:-34px 12px 4px;background:linear-gradient(180deg,#fdf8ec,#f2e7cf);color:#4a3b26;
  border-radius:18px;padding:26px 22px 20px;position:relative;z-index:3;
  box-shadow:0 20px 44px rgba(0,0,0,.55), inset 0 1.5px 0 #fff}
.slip::before{content:"";position:absolute;left:13px;right:13px;top:13px;bottom:13px;
  border:1.5px dashed rgba(150,120,70,.32);border-radius:11px;pointer-events:none}
.slip .lbl{font-family:'Nanum Myeongjo',serif;font-size:.76rem;letter-spacing:.14em;
  color:#a58a55;text-align:center;margin-bottom:12px}
.slip .f{font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:1.12rem;line-height:1.95;
  color:#3c2f1c;text-align:center}
.slip .dt{margin-top:14px;text-align:center;font-family:'Nanum Myeongjo',serif;
  font-size:.74rem;color:#b09a6c}
.oncebar{text-align:center;color:#c9b48c;font-size:.85rem;font-family:'Nanum Myeongjo',serif;
  margin-top:16px;line-height:1.7}
.btnrow{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.btnrow button{background:linear-gradient(180deg,#2c3d63,#1c2946);color:#e8eefb;
  border:1px solid rgba(150,180,240,.4);border-radius:12px;padding:11px 20px;font-family:inherit;
  font-size:.92rem;cursor:pointer;box-shadow:0 0 18px rgba(80,120,220,.3);transition:transform .1s}
.btnrow button:hover{transform:translateY(-2px)}
.btnrow button.save{background:linear-gradient(180deg,#f2d488,#d8b055);color:#241a08;
  border-color:rgba(255,235,180,.6);box-shadow:0 8px 22px rgba(180,140,50,.3)}
.linksrow{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.linksrow a{color:var(--ink-soft);font-size:.85rem;text-decoration:none;border:1px solid rgba(120,150,210,.3);
  border-radius:999px;padding:8px 16px}
.linksrow a:hover{color:var(--amber);border-color:var(--line)}
.hintbar{margin-top:16px;color:var(--ink-soft);font-size:.83rem;text-align:center;line-height:1.7;max-width:340px}
.revealbar{display:none;width:100%;text-align:center;margin-top:14px}
.revealbar button{background:linear-gradient(180deg,#f2d488,#d8b055);color:#241a08;border:1px solid rgba(255,235,180,.6);
  border-radius:14px;padding:14px 30px;font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:1.05rem;cursor:pointer;
  box-shadow:0 10px 26px rgba(180,140,50,.34),inset 0 2px 3px rgba(255,245,210,.6);transition:transform .1s}
.revealbar button:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="fortune-hub.html">← 운세</a>
    <span class="t">🦦 해달의 포춘쿠키</span>
    <span class="sp"></span>
  </div>

  <!-- ① 해달 인사 + 쿠키 고르기 -->
  <div class="screen on" id="scIntro">
    <img class="bg" src="img/otter/otter-intro.webp" alt="포춘쿠키 해달" />
    <div class="veil"></div>
    <div class="box">
      <p class="greet"><span class="nm">부둣가 포춘쿠키 가게 · 해달</span>어서 와달! 해달의 포춘쿠키, 딱 하나만 깨 줄 수 있달 🥠</p>
      <div class="pickrow">
        <button onclick="choose(0)"><b>🥠</b>오늘의 쿠키 깨기</button>
      </div>
    </div>
  </div>

  <!-- ② 영상(집기→깨기) -->
  <div class="screen" id="scPlay">
    <video id="vid" muted playsinline webkit-playsinline preload="auto"></video>
    <div class="still" id="still"></div>
    <button class="skipbtn" id="skip-play" type="button">건너뛰기 ›</button>
    <p class="cap" id="cap"></p>
  </div>

  <!-- ③ 결과 -->
  <div class="screen" id="scResult">
    <div class="endimg" id="endimg"></div>
    <div class="fade"></div>
    <span class="tag">🦦 부둣가 해달이 건넨 쪽지</span>
  </div>
  <div class="revealbar" id="revealbar"><button onclick="showSlip()">🥠 포춘쿠키를 본다</button></div>
  <div id="resultBody" style="display:none;width:100%">
    <div class="slip">
      <p class="lbl">오 늘 의 한 줄</p>
      <p class="f" id="fortune"></p>
      <p class="dt" id="slipdate"></p>
    </div>
    <div class="oncebar">🌊 쿠키는 하루에 딱 하나 — 내일 또 와달!
      <div class="btnrow">
        <button onclick="replay()">🦦 다시 보기</button>
        <button class="save" id="btn-save" onclick="saveCard()">📥 이미지로 저장</button>
      </div>
    </div>
    <div class="linksrow">
      <a href="fortune-hub.html">🔮 운세 더 보기</a>
      <a href="../index.html">🎡 다른 즐길거리</a>
    </div>
  </div>

  <p class="hintbar" id="hintbar">쿠키를 건네면, 해달이 배 위에 올려 조개로 깨 준다달.</p>
</div>

<script src="../js/common.js?v=15" data-root=".."></script>
<script src="js/feed.js?v=10"></script>
<script>
var IMG="img/otter/",
    V_ALL=IMG+"otter-all.mp4",          // 집기+깨기+건네기를 한 파일로 이어붙인 본편(전환 없음)
    V_TAKE=IMG+"otter-take.mp4", V_CRACK=IMG+"otter-crack.mp4", V_GIVE=IMG+"otter-give.mp4",
    INTRO=IMG+"otter-intro.webp", ENDIMG=IMG+"otter-end.webp",
    MID1=IMG+"otter-mid1.webp", MID2=IMG+"otter-mid2.webp";
// 각 장면이 시작되는 시각(초) — 5.041667초짜리 세 편을 이어붙인 기준
var SEG=[
  { t:0,      cap:"…이걸로 골랐구나달.", hint:"해달이 쿠키를 집었다달…" },
  { t:5.0417, cap:"콩… 콩… 쫙!",        hint:"배 위에 올리고… 조개로 콩콩!" },
  { t:10.083, cap:"자, 네 몫이달.",      hint:"쪽지를 꺼냈다달…" }
];
[ENDIMG, INTRO, MID1, MID2].forEach(function(u){ var im=new Image(); im.src=u; });
try{ fetch(V_ALL).catch(function(){}); }catch(e){}
var $=function(id){return document.getElementById(id);};
var scIntro=$("scIntro"), scPlay=$("scPlay"), scResult=$("scResult"),
    vid=$("vid"), still=$("still"), cap=$("cap"), hintbar=$("hintbar");

/* ── 기존 운세 데이터 (날짜 시드 그대로) ── */
var FORTUNES=["뜻밖의 행운이 이미 당신의 이름을 외우고 있습니다.","기다리던 소식이 생각보다 가까운 곳까지 와 있습니다.","오늘 내린 작은 결정이 오래 웃을 일을 만들어 줍니다.","곧 당신의 노력을 알아보는 사람이 나타납니다.","막혀 있던 일이 뜻밖의 손을 타고 풀리기 시작합니다.","오늘 마주치는 우연 하나가 좋은 인연의 시작입니다.","당신이 심어둔 것이 조용히 싹을 틔우고 있습니다.","잃었다고 생각한 것이 다른 모습으로 돌아옵니다.","지금 걷는 길이 맞는 길이라는 신호가 곧 도착합니다.","오늘의 친절이 내일의 귀인을 데려옵니다.","작은 용기가 큰 문을 여는 날입니다.","미뤄둔 일에 손대는 순간, 운이 함께 움직입니다.","당신의 웃음이 오늘의 가장 강한 부적입니다.","곧 낯선 곳에서 반가운 제안이 날아듭니다.","오래 품어온 소망 하나가 방향을 틀어 다가옵니다.","오늘은 지는 것이 이기는 것보다 큰 복이 됩니다.","마음에 걸리던 매듭 하나가 스르르 풀립니다.","당신이 놓친 줄 알았던 기회가 두 번째 얼굴로 찾아옵니다.","지금의 답답함은 더 큰 도약 전의 웅크림입니다.","오늘 들은 한마디가 오래 갈 지혜가 됩니다.","생각지 못한 곳에서 작은 이익이 굴러 들어옵니다.","당신의 진심이 곧 오해를 이깁니다.","먼저 건넨 인사가 행운의 문고리를 돌립니다.","오늘 흘린 땀은 이자까지 붙어 돌아옵니다.","곧 웃으며 이야기하게 될 고비 하나를 지나는 중입니다.","당신을 흉내낼 수는 있어도 대신할 수는 없습니다.","기회는 소리 없이 오니, 오늘은 귀를 열어두세요.","오랜 궁금증의 답이 뜻밖의 입에서 나옵니다.","지금 아끼는 그 사람과의 연이 더 단단해집니다.","내일의 당신이 오늘의 당신에게 고마워할 것입니다.","별렀던 도전에 초록불이 켜지고 있습니다.","당신의 안목이 곧 증명되는 일이 생깁니다.","돌아가는 길이 사실은 가장 빠른 길이었음을 알게 됩니다.","오늘 접은 마음 하나가 더 좋은 것으로 채워집니다.","머지않아 '그때 하길 잘했다'고 말하게 됩니다.","당신의 이야기에 귀 기울이는 사람이 늘어납니다.","작은 습관 하나가 큰 복의 씨앗이 되는 날입니다.","걱정하던 일의 팔 할은 일어나지 않습니다.","곧 당신 손으로 누군가의 하루를 구하게 됩니다.","오늘 밤 좋은 꿈이 내일의 예고편이 됩니다."];

function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h>>>0;}
var d=new Date();
var dstr=""+d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2);
var dk="goblub_cookie_"+dstr;
// 예전엔 날짜 해시로 고정이라 다시 깨도 같은 운세가 나왔다.
// 이제 깰 때마다 새로 뽑고, 뽑은 결과를 저장해 재방문 시에는 그대로 보여준다.
var fortune=FORTUNES[hash(dstr)%FORTUNES.length];
function drawFortune(){
  var prev=fortune, f=prev;
  for(var i=0;i<12 && f===prev;i++) f=FORTUNES[Math.floor(Math.random()*FORTUNES.length)];
  fortune=f;
  try{ localStorage.setItem(dk, fortune); }catch(e){}
  return f;
}

var phase="intro";
function show(sc){ [scIntro,scPlay,scResult].forEach(function(s){s.classList.remove("on");}); sc.classList.add("on");
  document.body.classList.toggle("top", sc===scResult); if(sc===scResult) window.scrollTo(0,0); }

function playSeq(src, capText, bridge, onEnd){
  cap.textContent=capText;
  // src 교체 순간 video가 검게 비는 것을 다음 영상 첫 장면 스틸로 가린다
  // 나타날 때는 즉시(페이드 없이), 걷을 때만 0.3s 페이드 — 페이드인 중 검은 video가 비치는 것 방지
  if(bridge){
    still.style.transition="none";
    still.style.backgroundImage="url('"+bridge+"')";
    still.classList.add("on");
    void still.offsetWidth;
    still.style.transition="";
  }
  vid.onended=null; vid.onplaying=null; vid.loop=false; vid.src=src;
  vid.onplaying=function(){ still.classList.remove("on"); };
  vid.onended=function(){ if(onEnd) onEnd(); };
  var p=vid.play(); if(p&&p.catch) p.catch(function(){ if(onEnd) onEnd(); });
  setTimeout(function(){ if(vid.src.indexOf(src)>=0 && vid.paused && !vid.ended){ if(onEnd) onEnd(); } }, 7000);
}

function choose(i){
  if(phase!=="intro") return;
  phase="play";
  drawFortune();          // 깰 때마다 새 운세 — 다시 보기로 또 깨면 또 바뀐다
  if(window.GoblubFeed) GoblubFeed.grant("cookie");
  show(scPlay);
  playAll();
}

// 본편 한 파일을 끊김 없이 재생 — 자막·안내만 장면 시각에 맞춰 바뀐다
function playAll(){
  var seg=-1, started=false;
  cap.textContent=SEG[0].cap; hintbar.textContent=SEG[0].hint;
  // 첫 프레임이 디코딩되기 전 검은 화면을 인트로 스틸로 가린다
  still.style.transition="none"; still.style.backgroundImage="url('"+INTRO+"')";
  still.classList.add("on"); void still.offsetWidth; still.style.transition="";

  vid.loop=false;
  vid.onplaying=function(){ started=true; still.classList.remove("on"); };
  vid.ontimeupdate=function(){
    var i=0;
    for(var k=0;k<SEG.length;k++) if(vid.currentTime>=SEG[k].t) i=k;
    if(i!==seg){ seg=i; cap.textContent=SEG[i].cap; hintbar.textContent=SEG[i].hint; }
  };
  vid.onended=function(){ vid.ontimeupdate=null; finish(false); };
  vid.onerror=function(){ chainFallback(); };   // 본편을 못 받으면 예전처럼 세 편을 이어 재생
  vid.src=V_ALL;

  var p=vid.play();
  if(p&&p.catch) p.catch(function(){ finish(false); });  // 자동재생 차단 시 결과로
  setTimeout(function(){ if(!started && vid.paused && !vid.ended) finish(false); }, 8000);
}

function chainFallback(){
  vid.onerror=null; vid.ontimeupdate=null;
  hintbar.textContent=SEG[0].hint;
  playSeq(V_TAKE, SEG[0].cap, INTRO, function(){
    hintbar.textContent=SEG[1].hint;
    playSeq(V_CRACK, SEG[1].cap, MID1, function(){
      hintbar.textContent=SEG[2].hint;
      playSeq(V_GIVE, SEG[2].cap, MID2, function(){ finish(false); });
    });
  });
}

// 건너뛰기 — 집기→깨기→건네기 연출을 통째로 넘기고 바로 쪽지로
$("skip-play").onclick=function(){ if(phase==="play") finish(false); };

function finish(fromLock){
  if(phase==="result") return;          // 종료 이벤트와 감시 타이머가 겹쳐도 한 번만
  phase="result";
  vid.onended=null; vid.ontimeupdate=null; vid.onerror=null; vid.onplaying=null;
  // 끝 프레임(give 마지막 프레임 추출 이미지)을 먼저 띄운 뒤 video를 비운다 — 검은 화면 방지
  $("endimg").style.backgroundImage="url('"+ENDIMG+"')";
  show(scResult);
  setTimeout(function(){ try{ vid.pause(); vid.removeAttribute("src"); vid.load(); }catch(e){} }, 80);
  $("fortune").textContent=fortune;
  $("slipdate").textContent=d.getFullYear()+". "+(d.getMonth()+1)+". "+d.getDate()+" · 하루 한 장";
  hintbar.textContent="";
  if(fromLock){ showSlip(); }
  else { $("revealbar").style.display="block"; }
}

// 쪽지 펼치기
function showSlip(){
  $("revealbar").style.display="none";
  $("resultBody").style.display="block";
}

// 쿠키 깨기 다시 보기 — 오늘의 운세는 그대로, 과정만 재체험
function replay(){
  phase="intro";
  $("resultBody").style.display="none";
  $("revealbar").style.display="none";
  show(scIntro);
  hintbar.textContent="한 번 더 깨면 새 운세가 나온달 — 마음에 들 때까지 깨 보달.";
}

/* ── 이미지로 저장: 해달 사진 + 아래 오늘의 한 줄 ── */
function rr(g,x,y,w,h,r){ g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

// 어절(띄어쓰기) 단위 줄바꿈 — 단어가 잘리지 않게
function wrap(g,text,maxW){
  var out=[], line="";
  text.split(" ").forEach(function(w){
    var t=line?line+" "+w:w;
    if(g.measureText(t).width<=maxW || !line){ line=t; return; }
    out.push(line); line=w;
  });
  if(line) out.push(line);
  return out;
}

function ensureFonts(){
  if(!document.fonts||!document.fonts.load) return Promise.resolve();
  return Promise.all([
    document.fonts.load("700 46px 'Nanum Myeongjo'"),
    document.fonts.load("400 26px 'Nanum Myeongjo'"),
    document.fonts.load("400 30px 'Jua'")
  ]).catch(function(){});
}

function saveCard(){
  var btn=$("btn-save"), old=btn.textContent;
  btn.disabled=true; btn.textContent="쪽지 만드는 중…";
  function done(){ btn.disabled=false; btn.textContent=old; }

  var im=new Image();
  im.onerror=function(){ done(); alert("이미지를 불러오지 못했다달… 잠시 후 다시 시도해달."); };
  im.onload=function(){ ensureFonts().then(function(){ draw(im); done(); }); };
  im.src=ENDIMG;

  function draw(img){
    var W=1080, PAD=60, CW=W-PAD*2;           // 카드 폭
    var PH=720, PY=64;                        // 사진 영역
    var SY=PY+PH-32;                          // 쪽지(사진과 살짝 겹침)
    var MJ="'Nanum Myeongjo','Gowun Batang',serif";

    // 줄 수 먼저 계산 → 최종 높이 결정
    var m=document.createElement("canvas").getContext("2d");
    m.font="700 46px "+MJ;
    var lines=wrap(m,fortune,CW-120), LH=78;
    var SH=44+30+26+lines.length*LH+28+26+40;
    var H=SY+SH+150;

    var c=document.createElement("canvas"); c.width=W; c.height=H;
    var g=c.getContext("2d");

    // 배경 — 밤바다
    var bg=g.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,"#101a30"); bg.addColorStop(.6,"#0b1220"); bg.addColorStop(1,"#0a101c");
    g.fillStyle=bg; g.fillRect(0,0,W,H);
    function glow(x,y,r,col){ var rg=g.createRadialGradient(x,y,0,x,y,r);
      rg.addColorStop(0,col); rg.addColorStop(1,"rgba(0,0,0,0)"); g.fillStyle=rg; g.fillRect(0,0,W,H); }
    glow(540,40,520,"rgba(70,110,190,.30)");
    glow(540,H-40,560,"rgba(255,150,60,.16)");

    // 사진 (가운데 위쪽 기준 커버 크롭)
    var sh=img.width*(PH/CW), sy=Math.max(0,Math.min(img.height-sh,img.height*0.44-sh/2));
    g.save(); g.shadowColor="rgba(0,0,0,.55)"; g.shadowBlur=40; g.shadowOffsetY=14;
    rr(g,PAD,PY,CW,PH,26); g.fillStyle="#000"; g.fill(); g.restore();
    g.save(); rr(g,PAD,PY,CW,PH,26); g.clip();
    g.drawImage(img,0,sy,img.width,sh,PAD,PY,CW,PH);
    var fd=g.createLinearGradient(0,PY+PH*0.55,0,PY+PH);
    fd.addColorStop(0,"rgba(11,18,32,0)"); fd.addColorStop(1,"rgba(11,18,32,.92)");
    g.fillStyle=fd; g.fillRect(PAD,PY+PH*0.55,CW,PH*0.45);
    g.textAlign="left"; g.fillStyle="#ffce7a"; g.font="30px "+MJ;
    g.fillText("🦦 부둣가 해달이 건넨 쪽지", PAD+34, PY+PH-72);
    g.restore();
    g.strokeStyle="rgba(255,206,122,.28)"; g.lineWidth=2; rr(g,PAD,PY,CW,PH,26); g.stroke();

    // 쪽지
    g.save(); g.shadowColor="rgba(0,0,0,.6)"; g.shadowBlur=46; g.shadowOffsetY=18;
    rr(g,PAD,SY,CW,SH,24);
    var pg=g.createLinearGradient(0,SY,0,SY+SH);
    pg.addColorStop(0,"#fdf8ec"); pg.addColorStop(1,"#f2e7cf");
    g.fillStyle=pg; g.fill(); g.restore();
    g.save(); g.setLineDash([9,8]); g.strokeStyle="rgba(150,120,70,.34)"; g.lineWidth=2;
    rr(g,PAD+16,SY+16,CW-32,SH-32,16); g.stroke(); g.restore();

    g.textAlign="center";
    g.fillStyle="#a58a55"; g.font="26px "+MJ;
    g.fillText("오 늘 의 한 줄", W/2, SY+72);
    g.fillStyle="#3c2f1c"; g.font="700 46px "+MJ;
    var y=SY+72+26+56;
    lines.forEach(function(ln){ g.fillText(ln,W/2,y); y+=LH; });
    g.fillStyle="#b09a6c"; g.font="24px "+MJ;
    g.fillText(d.getFullYear()+". "+(d.getMonth()+1)+". "+d.getDate()+" · 하루 한 장", W/2, y+6);

    // 발문
    g.fillStyle="#aab6cc"; g.font="28px "+MJ;
    g.fillText("🥠 goblub · 해달의 포춘쿠키", W/2, H-84);
    g.fillStyle="#ffce7a"; g.font="26px "+MJ;
    g.fillText("goblub-2.vercel.app", W/2, H-44);

    var name="goblub-fortune-"+dstr+".png";
    if(!c.toBlob){ window.open(c.toDataURL("image/png")); return; }
    c.toBlob(function(b){
      if(!b){ window.open(c.toDataURL("image/png")); return; }
      var a=document.createElement("a");
      a.href=URL.createObjectURL(b); a.download=name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); },5000);
    },"image/png");
  }
}

// 재방문해도 결과로 직행하지 않는다 — 언제나 해달 인사부터 새로 진입, 깰 때마다 새 운세.
</script>
