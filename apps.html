<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>앱 다운로드 — goblub</title>
  <meta name="description" content="goblub이 만든 모바일 앱 모음과 다운로드 링크" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=cl1" />
  <style>
    /* 물의 행성+분홍 사막 배경 — 뷰포트 고정 레이어라 문서 길이와 무관하게 화면 기준 cover */
    body.clay { background: #101a3c !important; }
    body.clay::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: linear-gradient(rgba(10, 14, 36, .18), rgba(10, 14, 36, .18)),
        url("design/img/home-bg-2.webp") center bottom / cover no-repeat;
    }
    body.clay .hero h1 {
      background: none; -webkit-background-clip: initial; background-clip: initial; color: #fdf3cf;
      filter: none; text-shadow: 0 3px 0 rgba(14, 18, 46, .6), 0 10px 24px rgba(0, 0, 0, .55);
    }
    body.clay .hero p { color: #efe8f0; text-shadow: 0 2px 8px rgba(8, 12, 36, .75); }
    /* 카테고리 카드 뽕뽕 등장 */
    .card-grid .card { opacity: 0; }
    .card-grid .card.pop { animation: gbPop .5s cubic-bezier(.3, 1.6, .55, 1) forwards; }
    .card-grid .card.shown { opacity: 1; }
    @keyframes gbPop {
      0% { opacity: 0; transform: scale(.35); }
      65% { opacity: 1; transform: scale(1.08); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="clay">
  <div id="site-header"></div>

  <main>
    <section class="hero">
      <h1>📱 앱 다운로드</h1>
      <p>직접 만든 앱들이에요. 다운로드 버튼은 곧 열립니다!</p>
    </section>

    <section class="card-grid">
      <article class="card tint-coral">
        <span class="icon">💰</span>
        <h2>가계부 앱</h2>
        <p>간단하게 쓰는 안드로이드 가계부</p>
        <button class="btn-download" disabled>준비 중</button>
      </article>

      <article class="card tint-mint">
        <span class="icon">✈️</span>
        <h2>Moment Trip</h2>
        <p>여행의 순간을 기록하는 앱</p>
        <button class="btn-download" disabled>준비 중</button>
      </article>

      <article class="card tint-sky">
        <span class="icon">🌡️</span>
        <h2>마음온도</h2>
        <p>오늘 내 마음의 온도를 재보는 자가성찰 웹앱</p>
        <button class="btn-download" disabled>준비 중</button>
      </article>

      <article class="card tint-purple">
        <span class="icon" data-goblub="52"></span>
        <h2>Goblub</h2>
        <p>나쁜 감정을 먹어주는 친구</p>
        <button class="btn-download" disabled>준비 중</button>
      </article>

      <article class="card tint-yellow">
        <span class="icon">⚡</span>
        <h2>Line now</h2>
        <p>지금 즉시 만남 앱</p>
        <button class="btn-download" disabled>준비 중</button>
      </article>

      <article class="card tint-coral">
        <span class="icon">🎁</span>
        <h2>Poresent</h2>
        <p>원하는 사진을 주고 받는 앱</p>
        <button class="btn-download" disabled>준비 중</button>
      </article>

      <article class="card tint-mint">
        <span class="icon">⛑️</span>
        <h2>Golden time</h2>
        <p>신체적, 정신적으로 힘들 때 즉시 도움 받는 앱</p>
        <button class="btn-download" disabled>준비 중</button>
      </article>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="play/js/goblub-art.js"></script>
  <script src="js/common.js?v=5" data-root="."></script>
  <script>
    // 카테고리 카드 뽕뽕 순차 등장
    Array.prototype.forEach.call(document.querySelectorAll(".card-grid .card"), function (c, i) {
      setTimeout(function () {
        c.classList.add("pop");
        c.addEventListener("animationend", function () { c.classList.remove("pop"); c.classList.add("shown"); }, { once: true });
      }, 130 * i + 150);
    });
  </script>
</body>
</html>
