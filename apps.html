<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>앱 다운로드 — goblub</title>
  <meta name="description" content="goblub이 만든 모바일 앱 모음과 다운로드 링크" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=cl1" />
  <style>
    /* 차콜 인디고+물의 행성+로즈핑크 땅 배경 — 뷰포트 고정 레이어 */
    body.clay { background: #1c2026 !important; }
    body.clay::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: url("design/img/home-bg-28.webp") center bottom / cover no-repeat;
    }
    /* 카드는 땅 색(#dea3a0)과 동일한 한 색으로 통일 + 글자는 홈 카드 기준 */
    body.clay .card[class*="tint-"] { background: linear-gradient(180deg, #f8e7e5, #e2aeab) !important; }
    body.clay .card h2 { color: #235a6b; }
    body.clay .card p { color: #58818c; }
    body.clay .hero h1 {
      background: none; -webkit-background-clip: initial; background-clip: initial; color: #fdf3cf;
      filter: none; text-shadow: 0 3px 0 rgba(14, 18, 46, .6), 0 10px 24px rgba(0, 0, 0, .55);
    }
    body.clay .hero p { color: #efe8f0; text-shadow: 0 2px 8px rgba(8, 12, 36, .75); }
    /* 홈과 동일한 크롬: 히어로·푸터 제거, 데스크톱은 로고만 중앙, 행성 클릭 메뉴 */
    main .hero { display: none; }
    body.clay .site-footer { display: none !important; }
    @media (min-width: 701px) {
      body.clay .site-nav { display: none; }
      /* 홈 헤더와 완전 동일: 다크 틸 반투명 알약, 상단 16px 고정, 로고 1.7rem */
      body.clay .site-header {
        position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
        z-index: 30; width: auto; max-width: none; margin: 0; padding: 10px 26px;
        background: rgba(10, 16, 22, .38); border-radius: 999px; /* 홈과 동일한 중립 반투명 */
        box-shadow: 0 10px 26px rgba(0, 20, 30, .35), inset 0 1px 0 rgba(255, 255, 255, .14);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      }
      body.clay .logo { font-size: 1.7rem; letter-spacing: 2px; display: flex; }
      body.clay .logo span { text-shadow: 0 1px 2px rgba(90, 100, 170, .25); }
      main { padding-top: 90px; }
    }
    .pl-hot { position: fixed; z-index: 40; border-radius: 50%; cursor: pointer; transition: box-shadow .18s; }
    .pl-hot:hover { box-shadow: 0 0 0 3px rgba(255, 240, 190, .75), 0 0 20px rgba(255, 220, 150, .55); }
    .pl-menu { position: fixed; z-index: 41; display: none; flex-direction: column; gap: 10px; align-items: flex-end; }
    .pl-menu.on { display: flex; }
    .pl-menu a { display: flex; align-items: center; gap: 10px; background: linear-gradient(180deg, #f9f0d4, #efe3bd);
      color: #235a6b !important; padding: 11px 20px; border-radius: 14px; border: 3px solid rgba(29, 90, 107, .25);
      box-shadow: 0 10px 22px rgba(0, 22, 32, .45); font-size: 1.05rem; white-space: nowrap;
      opacity: 0; transform: translateX(60px) rotate(6deg); }
    .pl-menu.on a { animation: plDeal .4s cubic-bezier(.3, 1.35, .6, 1) forwards; }
    .pl-menu.on a:nth-child(2) { animation-delay: .1s; }
    .pl-menu.on a:nth-child(3) { animation-delay: .2s; }
    @keyframes plDeal { to { opacity: 1; transform: none; } }
    /* 데스크톱: 카드가 홈과 동일한 부채꼴로 촤라락 */
    @media (min-width: 701px) {
      body.fanmode main { max-width: none; padding: 0; }
      body.fanmode .card-grid { display: block; margin: 0; max-width: none; }
      body.fanmode .card-grid .card {
        position: fixed; left: 0; top: 0; margin: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
        text-align: center; border-radius: 18px; padding: 12px; box-sizing: border-box;
        will-change: transform; transform-origin: center;
      }
      body.fanmode .card .icon { font-size: 2.05rem; }
      body.fanmode .card h2 { font-size: 1.42rem; line-height: 1.15; margin: 0; }
      body.fanmode .card p { font-size: .88rem; line-height: 1.35; padding: 0 6px; word-break: keep-all; margin: 0; }
      body.fanmode .card .btn-download { font-size: .82rem; padding: 6px 14px; }
    }
    /* 카테고리 카드 뽕뽕 등장 */
    .card-grid .card { opacity: 0; }
    .card-grid .card.pop { animation: gbPop .5s cubic-bezier(.3, 1.6, .55, 1) forwards; }
    .card-grid .card.shown { opacity: 1; }
    @keyframes gbPop {
      0% { opacity: 0; transform: scale(.35); }
      65% { opacity: 1; transform: scale(1.08); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="clay">
  <div id="site-header"></div>

  <main>
    <section class="hero">
      <h1>📱 앱 다운로드</h1>
      <p>직접 만든 앱들이에요. 다운로드 버튼은 곧 열립니다!</p>
    </section>

    <section class="card-grid">
      <article class="card tint-coral">
        <span class="icon">💰</span>
        <h2>가계부 앱</h2>
        <p>간단하게 쓰는 안드로이드 가계부</p>
        <button class="btn-download" disabled>준비 중</button>
      </article>

      <article class="card tint-mint">
        <span class="icon">✈️</span>
        <h2>Moment Trip</h2>
        <p>여행의 순간을 기록하는 앱</p>
        <button class="btn-download" disabled>준비 중</button>
      </article>

      <article class="card tint-sky">
        <span class="icon">🌡️</span>
        <h2>마음온도</h2>
        <p>오늘 내 마음의 온도를 재보는 자가성찰 웹앱</p>
        <button class="btn-download" disabled>준비 중</button>
      </article>

      <article class="card tint-purple">
        <span class="icon" data-goblub="52"></span>
        <h2>Goblub</h2>
        <p>나쁜 감정을 먹어주는 친구</p>
        <button class="btn-download" disabled>준비 중</button>
      </article>

      <article class="card tint-yellow">
        <span class="icon">⚡</span>
        <h2>Line now</h2>
        <p>지금 즉시 만남 앱</p>
        <button class="btn-download" disabled>준비 중</button>
      </article>

      <article class="card tint-coral">
        <span class="icon">🎁</span>
        <h2>Poresent</h2>
        <p>원하는 사진을 주고 받는 앱</p>
        <button class="btn-download" disabled>준비 중</button>
      </article>

      <article class="card tint-mint">
        <span class="icon">⛑️</span>
        <h2>Golden time</h2>
        <p>신체적, 정신적으로 힘들 때 즉시 도움 받는 앱</p>
        <button class="btn-download" disabled>준비 중</button>
      </article>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="play/js/goblub-art.js"></script>
  <script src="js/common.js?v=5" data-root="."></script>
  <script src="play/js/hub-fan.js?v=2" data-root="."></script>
  <script>
    // 행성 클릭 메뉴(홈과 동일) — 데스크톱 전용. 앱 페이지에서는 홈/로그인으로
    (function () {
      if (window.innerWidth < 701) return;
      var hot = document.createElement("div"); hot.className = "pl-hot";
      var menu = document.createElement("div"); menu.className = "pl-menu";
      var loggedIn = false;
      try { var u = JSON.parse(localStorage.getItem("goblub_user")); loggedIn = !!(u && u.sub); } catch (e) {}
      menu.innerHTML = '<a href="index.html"><span>🌙</span>홈으로</a>' +
        '<a href="mypage.html"><span>' + (loggedIn ? "👤" : "🔑") + '</span>' + (loggedIn ? "마이페이지" : "로그인") + '</a>';
      document.body.appendChild(hot); document.body.appendChild(menu);
      var SAT = { w: 1376, h: 768, x: 1151, y: 150, r: 78 };
      function place() {
        var W = window.innerWidth, H = window.innerHeight;
        var s = Math.max(W / SAT.w, H / SAT.h);
        var x = (W - SAT.w * s) / 2 + SAT.x * s, y = H - SAT.h * s + SAT.y * s;
        var d = SAT.r * s * 2.3;
        hot.style.width = d + "px"; hot.style.height = d + "px";
        hot.style.left = (x - d / 2) + "px"; hot.style.top = (y - d / 2) + "px";
        menu.style.left = Math.min(x + SAT.r * s * 0.4, W - 190) + "px";
        menu.style.top = (y + d / 2 + 14) + "px";
      }
      place(); window.addEventListener("resize", place);
      hot.addEventListener("click", function () {
        if (menu.classList.contains("on")) menu.classList.remove("on");
        else { menu.classList.remove("on"); void menu.offsetWidth; menu.classList.add("on"); }
      });
      document.addEventListener("click", function (ev) {
        if (!menu.classList.contains("on")) return;
        if (hot.contains(ev.target) || menu.contains(ev.target)) return;
        menu.classList.remove("on");
      });
    })();
  </script>
</body>
</html>
